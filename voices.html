<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>A question from Liam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C1B1A; --paper:#FAF9F7; --card:#FFFFFF;
    --rule:#DFDBD4; --rule-soft:#EDEAE5; --wash:#F6F4F1;
    --grey:#4D4D4D; --slate:#6E7477;
    --orange:#F68922; --orange-tint:#FEF3E7;
    --green:#3F7D5C; --green-tint:#EAF3EE; --red:#C8402C; --red-tint:#F8ECE9;
    --display:"Barlow Condensed",system-ui,sans-serif;
    --body:"IBM Plex Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--body);
       font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
       padding-bottom:env(safe-area-inset-bottom)}

  .top{background:var(--card);border-bottom:1px solid var(--rule);padding:16px 20px}
  .wordmark{font-family:var(--display);font-weight:700;font-size:21px;
            letter-spacing:.14em;text-transform:uppercase}
  .wordmark span{color:var(--orange)}
  .sub{font-family:var(--display);text-transform:uppercase;letter-spacing:.09em;
       font-weight:600;font-size:13px;color:var(--slate);display:block;margin-top:2px}

  .wrap{max-width:620px;margin:0 auto;padding:22px 18px 60px}
  .hi{color:var(--grey);font-size:16px;margin:0 0 10px}
  .eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;
           font-weight:600;font-size:13px;color:var(--orange);margin:0 0 6px}
  h1{font-family:var(--display);font-size:31px;line-height:1.12;margin:0 0 10px;font-weight:700}
  .help{color:var(--grey);font-size:15px;margin:0 0 14px}
  .angle{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--orange);
         padding:12px 14px;margin:0 0 20px;font-size:15px;color:var(--grey);white-space:pre-wrap}

  /* The recorder. One big button: easy to hit with a glove on. */
  .rec{background:var(--card);border:1px solid var(--rule);padding:24px 18px 20px;text-align:center;margin-bottom:14px}
  .mic{width:132px;height:132px;border-radius:50%;border:0;cursor:pointer;
       background:var(--orange);color:#fff;display:inline-flex;flex-direction:column;
       align-items:center;justify-content:center;gap:6px;
       font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-weight:700;font-size:17px;
       box-shadow:0 6px 18px rgba(246,137,34,.35);-webkit-tap-highlight-color:transparent}
  .mic svg{width:40px;height:40px}
  .mic:active{transform:scale(.97)}
  .mic.stop{background:var(--ink);box-shadow:0 6px 18px rgba(0,0,0,.25)}
  .mic.stop svg{width:30px;height:30px}
  .live{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px 0 8px;
        font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-weight:700;font-size:20px;color:var(--red)}
  .dot{width:14px;height:14px;border-radius:50%;background:var(--red);animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
  .clock{font-variant-numeric:tabular-nums;color:var(--ink)}
  .clock small{color:var(--slate);font-size:15px}
  .level{height:10px;background:var(--rule-soft);margin:6px auto 0;max-width:280px;overflow:hidden}
  .level i{display:block;height:100%;width:0;background:var(--red);transition:width .08s linear}
  .tip{font-size:14px;color:var(--slate);margin:14px 0 0}
  .take{margin-top:4px}
  .take audio{width:100%;margin:6px 0 4px}
  .take .meta{font-size:14px;color:var(--slate);margin:0}

  .linkbtn{background:none;border:0;color:var(--slate);font-size:15px;cursor:pointer;
           text-decoration:underline;padding:8px 0;font-family:var(--body)}
  .alt{text-align:center;margin:0 0 14px}

  label.lb{display:block;font-family:var(--display);text-transform:uppercase;
           letter-spacing:.08em;font-size:13px;color:var(--slate);font-weight:600;margin-bottom:6px}
  /* 16px minimum, or iOS zooms the whole page on focus. */
  textarea{width:100%;font-family:var(--body);font-size:16px;line-height:1.5;
    color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:0;
    padding:11px 12px;-webkit-appearance:none;appearance:none;min-height:180px;resize:vertical}
  textarea:focus{outline:2px solid var(--orange);outline-offset:-1px}
  .box{background:var(--card);border:1px solid var(--rule);padding:16px;margin-bottom:14px}
  .photo{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .photo img{width:64px;height:64px;object-fit:cover;border:1px solid var(--rule)}
  .ghost{font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-weight:600;font-size:15px;
         background:var(--card);border:1px solid var(--rule);color:var(--grey);padding:11px 14px;cursor:pointer}
  .btn{font-family:var(--display);text-transform:uppercase;letter-spacing:.09em;
       font-weight:600;font-size:18px;background:var(--ink);color:#fff;border:0;
       padding:17px 20px;cursor:pointer;width:100%}
  .btn:active{background:#000}
  .btn[disabled]{opacity:.45}
  .btn.ok{background:var(--green)}
  .hint{font-size:14px;color:var(--slate);margin:10px 0 0}
  .hint.err{color:var(--red)}
  .done{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--green);
        padding:20px 18px;margin-bottom:20px}
  .done h2{font-family:var(--display);font-size:27px;margin:0 0 6px;font-weight:700}
  .done p{margin:0;color:var(--grey);font-size:15px}
  .empty{padding:40px 0}
  .empty h2{font-family:var(--display);font-size:26px;margin:0 0 8px}
  .empty p{color:var(--grey)}

  /* Sign-off view: the finished piece, read like an article. */
  .piece{background:var(--card);border:1px solid var(--rule);padding:22px 20px;margin-bottom:16px}
  .piece h2{font-family:var(--display);font-size:28px;line-height:1.15;margin:0 0 14px}
  .piece h3{font-family:var(--display);font-size:21px;margin:20px 0 8px}
  .piece p{margin:0 0 12px}
  .piece blockquote{margin:14px 0;padding:4px 0 4px 14px;border-left:3px solid var(--orange);color:var(--grey)}
  .pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .opt{font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-weight:600;font-size:17px;
       background:var(--card);border:1px solid var(--rule);color:var(--grey);padding:15px 10px;cursor:pointer}
  .opt.on.yes{background:var(--green);border-color:var(--green);color:#fff}
  .opt.on.no{background:var(--red);border-color:var(--red);color:#fff}
</style>
</head>
<body>
<header class="top">
  <span class="wordmark" id="mark">HAGGERT<span>Y</span></span>
  <span class="sub" id="sub">A question from Liam</span>
</header>
<div class="wrap" id="app"><div class="empty"><h2>Loading</h2></div></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

/* Executive Voices. Liam texts Ryan, Hugo, a super or anyone on the list a
   link to this page. It shows his question; they tap the big button and
   talk, or type, and send. Nobody signs in: the t= in the link is the only
   key, and the database functions it calls (sql/executive_voices.sql) see
   only that one person's question. The recording goes into the private
   'voices' bucket under the token's folder, which is all this page may
   write to; n8n then transcribes it for the Voices tab.

   ?ok=<token> instead shows a finished blog post to the person whose OK
   it needs (Ryan), with Looks good and Needs changes. */
const SUPABASE_URL = 'https://ekatzukprjpisdiwubjq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_bdyRB7Mx0BKzNj1EcYlRCg_8JLDXEIL';
/* Tells the workflow an answer is in, so the transcript is ready in a
   minute rather than at the next hourly sweep. */
const NEW_ANSWER_URL = 'https://haggertybuilds.app.n8n.cloud/webhook/haggerty-voices-new';
const MAX_S = 180;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY, { auth:{ persistSession:false } });
const app = document.getElementById('app');
const Q = new URLSearchParams(location.search);
const TOKEN = Q.get('t') || '';
const OK_TOKEN = Q.get('ok') || '';

const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const clock = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');

function brand(b){
  document.getElementById('mark').innerHTML = b === 'rhino' ? 'RHINO <span>RESTORES</span>' : 'HAGGERT<span>Y</span>';
}

/* ================= answering ================= */
const A = {
  data:null, mode:'voice',         // 'voice' | 'text'
  rec:null, chunks:[], stream:null, started:0, secs:0, tick:null, raf:null, ctx:null,
  blob:null, url:'', type:'', dur:0, // the finished take
  text:'', photo:null, photoUrl:'',
  busy:false, err:'', sent:false
};

/* Chrome and Android record webm, iPhones mp4, Firefox ogg. Whisper takes
   all three. The bucket wants the bare type, without ;codecs=. */
function pickType(){
  if(!window.MediaRecorder) return '';
  for(const t of ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus', 'audio/ogg']){
    try{ if(MediaRecorder.isTypeSupported(t)) return t; }catch(e){}
  }
  return '';
}
const bare = t => String(t || '').split(';')[0].trim() || 'audio/webm';
const ext = t => ({ 'audio/mp4':'m4a', 'audio/ogg':'ogg', 'audio/mpeg':'mp3', 'audio/wav':'wav' })[bare(t)] || 'webm';

function renderAnswer(){
  const d = A.data;
  if(!d){
    app.innerHTML = `<div class="empty"><h2>This link does not work</h2>
      <p>It may have been copied only partly. Text Liam and he will send a fresh one.</p></div>`;
    return;
  }
  const before = (d.answers || []).length;
  if(!d.open){
    app.innerHTML = `<div class="empty"><h2>This question is closed</h2>
      <p>${before ? 'Thanks for your answer, it is in.' : 'Liam has wrapped this one up. Thanks anyway!'}</p></div>`;
    return;
  }
  if(A.sent){
    app.innerHTML = `<div class="done"><h2>Thanks${d.first_name ? ', ' + esc(d.first_name) : ''}</h2>
        <p>Your answer is in. Liam will turn it into a blog post and check with you if anything needs it.</p></div>
      <p class="hint">Thought of something else? <button class="linkbtn" id="again">Add another answer</button></p>`;
    document.getElementById('again').addEventListener('click', () => { A.sent = false; resetTake(); renderAnswer(); });
    return;
  }
  const recording = A.rec && A.rec.state === 'recording';
  const canSend = A.mode === 'voice' ? !!A.blob && !recording : A.text.trim().length > 1;
  app.innerHTML = `
    ${d.first_name ? `<p class="hi">Hi ${esc(d.first_name)}, thanks for doing this. Two minutes is plenty.</p>` : ''}
    <p class="eyebrow">The question</p>
    <h1>${esc(d.question)}</h1>
    ${d.help ? `<p class="help">${esc(d.help)}</p>` : `<p class="help">Think of one real job or moment. What happened, what did you do, and what did you learn?</p>`}
    ${d.angle ? `<div class="angle">${esc(d.angle)}</div>` : ''}
    ${before ? `<p class="hint" style="margin:-6px 0 16px">You already sent ${before === 1 ? 'an answer' : before + ' answers'}. Anything you add here goes with it.</p>` : ''}
    ${A.mode === 'voice' ? recorder(recording) : typer()}
    ${A.mode === 'voice'
      ? `<p class="alt">${recording ? '' : `<button class="linkbtn" id="toText">Rather type it?</button>`}</p>`
      : `<p class="alt"><button class="linkbtn" id="toVoice">Rather say it?</button></p>`}
    <div class="box">
      <label class="lb">A photo from that job <span style="text-transform:none;letter-spacing:0;font-family:var(--body)">(optional)</span></label>
      <div class="photo">
        ${A.photoUrl ? `<img src="${esc(A.photoUrl)}" alt="" />` : ''}
        <input type="file" id="photo" accept="image/*" style="display:none" />
        <button type="button" class="ghost" id="pickPhoto" ${recording ? 'disabled' : ''}>${A.photo ? 'Change photo' : 'Add a photo'}</button>
        ${A.photo ? `<button type="button" class="linkbtn" id="noPhoto">Remove</button>` : ''}
      </div>
    </div>
    <button class="btn" id="send" ${canSend && !A.busy ? '' : 'disabled'}>${A.busy ? 'Sending&hellip;' : 'Send my answer'}</button>
    ${A.err ? `<p class="hint err">${esc(A.err)}</p>` : `<p class="hint">${
      A.mode === 'voice' && !A.blob ? 'Record your answer first. You can listen back before you send it.' : ''}</p>`}`;
  wireAnswer();
}

function recorder(recording){
  if(recording) return `<div class="rec">
      <button class="mic stop" id="mic" aria-label="Stop recording">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>Stop</button>
      <div class="live" role="status" aria-live="polite"><span class="dot"></span>Recording
        <span class="clock" id="clock">${clock(A.secs)} <small>/ ${clock(MAX_S)}</small></span></div>
      <div class="level" aria-hidden="true"><i id="lvl"></i></div>
      <p class="tip">Talk like you would on the jobsite. It stops on its own at 3 minutes.</p>
    </div>`;
  if(A.blob) return `<div class="rec">
      <div class="take"><p class="eyebrow" style="color:var(--green)">Your recording &middot; ${clock(A.dur)}</p>
        <audio controls src="${esc(A.url)}"></audio>
        <p class="meta">Have a listen. Happy with it? Send it below.</p></div>
      <p style="margin:10px 0 0"><button class="linkbtn" id="redo">Record again</button></p>
    </div>`;
  return `<div class="rec">
      <button class="mic" id="mic" aria-label="Start recording">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Tap to talk</button>
      <p class="tip">Your phone will ask to use the microphone. Tap Allow.</p>
    </div>`;
}

function typer(){
  return `<div class="box">
      <label class="lb" for="txt">Your answer</label>
      <textarea id="txt" maxlength="20000" placeholder="A few sentences is fine.">${esc(A.text)}</textarea>
    </div>`;
}

function wireAnswer(){
  const on = (id, fn, ev = 'click') => { const el = document.getElementById(id); if(el) el.addEventListener(ev, fn); };
  on('mic', () => (A.rec && A.rec.state === 'recording') ? stop() : start());
  on('redo', () => { resetTake(); renderAnswer(); start(); });
  on('toText', () => { A.mode = 'text'; A.err = ''; renderAnswer(); const t = document.getElementById('txt'); if(t) t.focus(); });
  on('toVoice', () => { A.mode = 'voice'; A.err = ''; renderAnswer(); });
  on('txt', e => {
    A.text = e.target.value;
    const b = document.getElementById('send');
    if(b) b.disabled = A.text.trim().length < 2 || A.busy;
    try{ localStorage.setItem('exv-draft-' + TOKEN, A.text); }catch(err){}
  }, 'input');
  const fi = document.getElementById('photo');
  on('pickPhoto', () => fi && fi.click());
  if(fi) fi.addEventListener('change', () => {
    const f = fi.files && fi.files[0];
    if(!f) return;
    if(f.size > 20 * 1048576){ A.err = 'That photo is over 20 MB. Try a smaller one.'; return renderAnswer(); }
    if(A.photoUrl) URL.revokeObjectURL(A.photoUrl);
    A.photo = f; A.photoUrl = URL.createObjectURL(f); A.err = '';
    renderAnswer();
  });
  on('noPhoto', () => { if(A.photoUrl) URL.revokeObjectURL(A.photoUrl); A.photo = null; A.photoUrl = ''; renderAnswer(); });
  on('send', send);
}

function resetTake(){
  if(A.url) URL.revokeObjectURL(A.url);
  A.blob = null; A.url = ''; A.dur = 0; A.secs = 0; A.err = '';
}

async function start(){
  A.err = '';
  const type = pickType();
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){
    A.mode = 'text';
    A.err = 'This browser cannot record. You can type your answer instead, or open the link in Safari or Chrome.';
    return renderAnswer();
  }
  try{
    A.stream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true } });
  }catch(e){
    A.err = 'The microphone is blocked. Allow it for this page in your phone settings, or type your answer instead.';
    return renderAnswer();
  }
  A.chunks = [];
  A.rec = new MediaRecorder(A.stream, type ? { mimeType:type, audioBitsPerSecond:64000 } : undefined);
  A.type = A.rec.mimeType || type || 'audio/webm';
  A.rec.ondataavailable = e => { if(e.data && e.data.size) A.chunks.push(e.data); };
  A.rec.onstop = () => {
    A.blob = new Blob(A.chunks, { type:bare(A.type) });
    A.url = URL.createObjectURL(A.blob);
    A.dur = Math.max(1, Math.round(A.secs));
    cleanup();
    if(A.blob.size < 2000){ resetTake(); A.err = 'Nothing was picked up. Check the microphone and try again.'; }
    renderAnswer();
  };
  A.rec.start(1000);
  A.started = Date.now(); A.secs = 0;
  renderAnswer();
  A.tick = setInterval(() => {
    A.secs = (Date.now() - A.started) / 1000;
    const c = document.getElementById('clock');
    if(c) c.innerHTML = `${clock(A.secs)} <small>/ ${clock(MAX_S)}</small>`;
    if(A.secs >= MAX_S) stop();
  }, 250);
  meter();
}

/* The moving bar is what tells someone the phone is actually hearing
   them, which a timer alone does not. */
function meter(){
  try{
    const C = window.AudioContext || window.webkitAudioContext;
    A.ctx = new C();
    const an = A.ctx.createAnalyser(); an.fftSize = 512;
    A.ctx.createMediaStreamSource(A.stream).connect(an);
    const buf = new Uint8Array(an.fftSize);
    const draw = () => {
      an.getByteTimeDomainData(buf);
      let peak = 0;
      for(const v of buf) peak = Math.max(peak, Math.abs(v - 128));
      const el = document.getElementById('lvl');
      if(el) el.style.width = Math.min(100, Math.round(peak / 128 * 260)) + '%';
      A.raf = requestAnimationFrame(draw);
    };
    draw();
  }catch(e){}
}

function stop(){
  if(A.rec && A.rec.state === 'recording') A.rec.stop();
  clearInterval(A.tick);
}
function cleanup(){
  clearInterval(A.tick); cancelAnimationFrame(A.raf);
  if(A.stream) A.stream.getTracks().forEach(t => t.stop());
  if(A.ctx) try{ A.ctx.close(); }catch(e){}
  A.stream = null; A.ctx = null;
}

async function upload(file, name, type){
  const path = `${TOKEN}/${Date.now()}-${name}`;
  const { error } = await sb.storage.from('voices').upload(path, file, { contentType:type, upsert:false });
  if(error) throw new Error(error.message || String(error));
  return path;
}

async function send(){
  if(A.busy) return;
  A.busy = true; A.err = ''; renderAnswer();
  try{
    let audio = null, photo = null;
    if(A.mode === 'voice') audio = await upload(A.blob, 'answer.' + ext(A.type), bare(A.type));
    if(A.photo){
      const pt = A.photo.type || 'image/jpeg';
      const pe = (A.photo.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 5) || 'jpg';
      photo = await upload(A.photo, 'photo.' + pe, pt);
    }
    const { error } = await sb.rpc('exv_submit', {
      p_token:TOKEN, p_kind:A.mode, p_audio_path:audio, p_audio_type:A.mode === 'voice' ? bare(A.type) : null,
      p_duration:A.mode === 'voice' ? A.dur : null, p_text:A.mode === 'text' ? A.text : null, p_photo_path:photo });
    if(error) throw new Error(error.message || String(error));
    fetch(NEW_ANSWER_URL, { method:'POST', headers:{ 'content-type':'text/plain' },
      body:JSON.stringify({ token:TOKEN }), keepalive:true }).catch(() => {});
    A.data.answers = (A.data.answers || []).concat([{ kind:A.mode }]);
    try{ localStorage.removeItem('exv-draft-' + TOKEN); }catch(e){}
    A.sent = true; A.text = '';
    resetTake();
    if(A.photoUrl) URL.revokeObjectURL(A.photoUrl);
    A.photo = null; A.photoUrl = '';
  }catch(e){
    A.err = 'That did not send: ' + e.message + ' Check the signal and tap Send again.';
  }
  A.busy = false;
  renderAnswer(); window.scrollTo(0, 0);
}

/* ================= sign-off ================= */
const O = { data:null, pick:'', note:'', busy:false, err:'', done:false };

/* The piece is stored as plain text with ## headings and > quotes (the
   dashboard turns the same text into WordPress blocks). Shown here
   escaped, so nothing in it can run. */
function prose(t){
  return String(t || '').replace(/\r/g, '').split(/\n\s*\n/).map(p => p.trim()).filter(Boolean).map(p => {
    if(p.startsWith('### ') || p.startsWith('## ')) return `<h3>${esc(p.replace(/^#+\s*/, ''))}</h3>`;
    if(p.startsWith('# ')) return `<h3>${esc(p.slice(2))}</h3>`;
    if(p.startsWith('>')) return `<blockquote>${esc(p.replace(/^>\s?/gm, '')).replace(/\n/g, '<br>')}</blockquote>`;
    return `<p>${esc(p).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>')}</p>`;
  }).join('');
}

function renderOk(){
  const d = O.data;
  document.getElementById('sub').textContent = 'For your OK';
  if(!d){
    app.innerHTML = `<div class="empty"><h2>This link does not work</h2>
      <p>The post may already be published or replaced. Text Liam for a fresh link.</p></div>`;
    return;
  }
  const decided = O.done || d.status !== 'needs_ok';
  app.innerHTML = `
    ${decided ? `<div class="done"><h2>${d.status === 'approved' ? 'Approved' : 'Changes sent'}${d.first_name ? ', thanks ' + esc(d.first_name) : ''}</h2>
      <p>${d.status === 'approved' ? 'Liam can post it now.' : 'Liam will make the changes and send it back.'}
      ${d.note ? '<br>Your note: ' + esc(d.note) : ''}</p></div>` :
      `<p class="hi">${d.first_name ? 'Hi ' + esc(d.first_name) + '. ' : ''}Here is the ${d.kind === 'linkedin' ? 'LinkedIn post' : 'blog post'} built from the answers. Give it a read and let Liam know if it is good to go.</p>`}
    <article class="piece">${d.title ? `<h2>${esc(d.title)}</h2>` : ''}${prose(d.body)}</article>
    ${decided ? `<p class="hint">Changed your mind? <button class="linkbtn" id="reopen">Answer again</button></p>` : `
    <div class="pick">
      <button class="opt yes ${O.pick === 'approved' ? 'on' : ''}" data-pick="approved">Looks good</button>
      <button class="opt no ${O.pick === 'changes' ? 'on' : ''}" data-pick="changes">Needs changes</button>
    </div>
    ${O.pick === 'changes' ? `<div class="box"><label class="lb" for="note">What should change</label>
      <textarea id="note" style="min-height:110px" placeholder="For example: take out the part about the budget, or the job was in Lodi, not Stockton">${esc(O.note)}</textarea></div>` : ''}
    <button class="btn ${O.pick === 'approved' ? 'ok' : ''}" id="okSend" ${O.pick && !O.busy ? '' : 'disabled'}>${O.busy ? 'Sending&hellip;' : 'Send to Liam'}</button>
    ${O.err ? `<p class="hint err">${esc(O.err)}</p>` : ''}`}`;
  document.querySelectorAll('[data-pick]').forEach(b => b.addEventListener('click', () => { O.pick = b.dataset.pick; O.err = ''; renderOk(); }));
  const n = document.getElementById('note');
  if(n) n.addEventListener('input', () => { O.note = n.value; });
  const s = document.getElementById('okSend');
  if(s) s.addEventListener('click', decide);
  const r = document.getElementById('reopen');
  if(r) r.addEventListener('click', () => { O.done = false; O.data.status = 'needs_ok'; O.pick = ''; renderOk(); });
}

async function decide(){
  if(O.busy) return;
  if(O.pick === 'changes' && !O.note.trim()){ O.err = 'Say what should change.'; return renderOk(); }
  O.busy = true; O.err = ''; renderOk();
  const { error } = await sb.rpc('exv_piece_decide', { p_token:OK_TOKEN, p_decision:O.pick, p_note:O.note });
  O.busy = false;
  if(error){ O.err = 'That did not send: ' + (error.message || error); return renderOk(); }
  O.data.status = O.pick; O.data.note = O.note.trim() || null; O.done = true;
  renderOk(); window.scrollTo(0, 0);
}

async function boot(){
  if(OK_TOKEN){
    const { data, error } = await sb.rpc('exv_piece_get', { p_token:OK_TOKEN });
    if(error){ app.innerHTML = `<div class="empty"><h2>Could not load</h2><p>${esc(error.message || error)}</p><p>Check the signal and reload.</p></div>`; return; }
    O.data = data;
    if(data){ brand(data.brand); document.title = data.title || 'For your OK'; }
    return renderOk();
  }
  if(TOKEN){
    const { data, error } = await sb.rpc('exv_get', { p_token:TOKEN });
    if(error){ app.innerHTML = `<div class="empty"><h2>Could not load the question</h2><p>${esc(error.message || error)}</p><p>Check the signal and reload.</p></div>`; return; }
    A.data = data;
    if(data){ brand(data.brand); }
    try{ const t = localStorage.getItem('exv-draft-' + TOKEN); if(t){ A.text = t; A.mode = 'text'; } }catch(e){}
  }
  renderAnswer();
}
boot();
</script>
</body>
</html>
