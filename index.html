let ecPrevTimer = null;
function ecPreview(){
  const f = document.getElementById('ecFrame');
  const E = ecState();
  if(f && E.cur) f.srcdoc = ecHtml(E.cur, true);
}

function wireCampaigns(){
  if(S.page !== 'campaigns') return;
  const E = ecState();
  document.querySelectorAll('[data-ec-new]').forEach(b => b.addEventListener('click', () => ecNew(b.dataset.ecNew, b.dataset.layout)));
  document.querySelectorAll('[data-ec-open]').forEach(b => b.addEventListener('click', () => ecOpen(b.dataset.ecOpen)));
  if(!E.cur) return;
  const c = E.cur;
  ecPreview(); ecStatusLine();
  document.querySelectorAll('[data-ec-back]').forEach(b => b.addEventListener('click', ecClose));
  document.querySelectorAll('[data-ec-copy]').forEach(b => b.addEventListener('click', ecCopy));
  document.querySelectorAll('[data-ec-remove]').forEach(b => b.addEventListener('click', ecRemove));
  document.querySelectorAll('[data-ec-push]').forEach(b => b.addEventListener('click', () => ecPush('push')));
  document.querySelectorAll('[data-ec-test]').forEach(b => b.addEventListener('click', () => ecPush('test')));
  document.querySelectorAll('[data-ec-act]').forEach(b => b.addEventListener('click', () => {
    if(b.dataset.ecAct === 'unschedule' && !confirm('Unschedule this email? It stays in Mailchimp as a draft.')) return;
    if(b.dataset.ecAct === 'approve'){ const p = ecReadyProblem(c); if(p){ E.err = p; render(); return; } }
    ecPush(b.dataset.ecAct);
  }));
  document.querySelectorAll('[data-ec-sendreview]').forEach(b => b.addEventListener('click', ecSendReview));
  document.querySelectorAll('[data-ec-takeback]').forEach(b => b.addEventListener('click', () =>
    ecSetReview({ review_status:null }, 'Taken back. You can edit it and send it again.')));
  document.querySelectorAll('[data-ec-verdict]').forEach(b => b.addEventListener('click', () => ecVerdict(b.dataset.ecVerdict)));
  const rn = document.getElementById('ecRevNote');
  if(rn) rn.addEventListener('input', () => { E.revNote = rn.value; });
  const tests = document.getElementById('ecTests');
  if(tests) tests.addEventListener('input', () => { E.tests = tests.value; });
  document.querySelectorAll('[data-ec-view]').forEach(b => b.addEventListener('click', () => { E.view = b.dataset.ecView; render(); }));
  // Typing only refreshes the preview; re-rendering the page would drop the cursor.
  document.querySelectorAll('[data-ec-set]').forEach(el => {
    const k = el.dataset.ecSet;
    const ev = el.tagName === 'SELECT' ? 'change' : 'input';
    el.addEventListener(ev, () => {
      if(k === 'send_at') c.send_at = el.value ? new Date(el.value).toISOString() : null;
      else if(k === 'tag_id'){
        c.tag_id = el.value ? Number(el.value) : null;
        c.tag_name = el.value ? el.options[el.selectedIndex].text.replace(/ \([\d,]+\)$/, '') : null;
      } else c[k] = el.value;
      if(k === 'list_id'){ c.tag_id = null; c.tag_name = null; }
      ecTouch();
      if(k === 'list_id') render();
      else { clearTimeout(ecPrevTimer); ecPrevTimer = setTimeout(ecPreview, 200); }
    });
  });
  const tagFind = document.getElementById('ecTagFind');
  if(tagFind) tagFind.addEventListener('input', () => {
    const q = tagFind.value.trim().toLowerCase(), sel = document.getElementById('ec-tag');
    [...sel.options].forEach(o => { o.hidden = !(!o.value || o.selected || o.text.toLowerCase().includes(q)); });
    // While filtering, open it as a short list so the matches show without a click.
    sel.size = q ? Math.max(2, Math.min(8, [...sel.options].filter(o => !o.hidden).length)) : 0;
  });
  document.querySelectorAll('[data-ec-b]').forEach(el => {
    const ev = el.tagName === 'SELECT' ? 'change' : 'input';
    el.addEventListener(ev, () => {
      const b = c.blocks[Number(el.dataset.ecB)];
      if(!b) return;
      const wasFull = !!ecFullPaste(c);
      b[el.dataset.ecK] = el.value;
      ecTouch();
      if(el.dataset.ecK === 'code' && wasFull !== !!ecFullPaste(c)){ clearTimeout(ecPrevTimer); ecPrevTimer = setTimeout(render, 400); }
      else if(['src','src2','logo','badge'].includes(el.dataset.ecK)){ clearTimeout(ecPrevTimer); ecPrevTimer = setTimeout(render, 600); }
      else { clearTimeout(ecPrevTimer); ecPrevTimer = setTimeout(ecPreview, 200); }
    });
  });
  document.querySelectorAll('[data-ec-up]').forEach(el =>
    el.addEventListener('change', () => ecUpload(Number(el.dataset.ecUp), el.files && el.files[0], el.dataset.ecUk)));
  document.querySelectorAll('[data-ec-move]').forEach(b => b.addEventListener('click', () => {
    const i = Number(b.dataset.ecMove), j = i + Number(b.dataset.dir);
    if(j < 0 || j >= c.blocks.length) return;
    [c.blocks[i], c.blocks[j]] = [c.blocks[j], c.blocks[i]];
    ecTouch(); render();
  }));
  document.querySelectorAll('[data-ec-del]').forEach(b => b.addEventListener('click', () => {
    const i = Number(b.dataset.ecDel);
    if(c.blocks[i] && EC_FOOTERS.includes(c.blocks[i].type) && !confirm('Mailchimp will not send an email without the footer and its unsubscribe link. Remove it anyway?')) return;
    c.blocks.splice(i, 1);
    ecTouch(); render();
  }));
  document.querySelectorAll('[data-ec-add]').forEach(b => b.addEventListener('click', () => {
    const at = c.blocks.findIndex(x => EC_FOOTERS.includes(x.type));
    const nb = ecBlock(b.dataset.ecAdd, c.brand);
    if(at < 0) c.blocks.push(nb); else c.blocks.splice(at, 0, nb);
    ecTouch(); render();
  }));
}

function pageBudget(){
  const B = S.bud;
  if(!S.loaded.budget) return loading();
  if(B.loadErr) return `<main class="page"><div class="empty"><h2>Budget is not set up yet</h2>
    <p>${esc(B.loadErr)}</p></div></main>`;

  const y = B.year;
  const items = budItems(y);
  const { rows, t } = budSummary(y, items);
  const used = t.paid + t.committed;
  const left = t.planned - used;
  const pace = budPace(y);
  const usedPct = t.planned ? used / t.planned : 0;
  const thisYear = new Date().getFullYear();

  let paceLine = '';
  if(!t.planned) paceLine = `No budget is set for ${y} yet. Use Edit budget to add one.`;
  else if(y === thisYear){
    paceLine = `${Math.round(pace * 100)}% of ${y} has gone by, and ${Math.round(usedPct * 100)}% of the budget is spent or committed.`;
    if(usedPct > pace + .05) paceLine += ' That is ahead of pace.';
  }
  else paceLine = `${Math.round(usedPct * 100)}% of the ${y} budget is spent or committed.`;

  const stats = `<div class="stat-grid" style="margin-bottom:10px">
    <div class="stat"><div class="k">${y} budget</div><div class="v">${money(t.planned)}</div></div>
    <div class="stat"><div class="k">Spent</div><div class="v">${money(t.paid)}</div></div>
    <div class="stat"><div class="k">Committed</div><div class="v">${money(t.committed)}</div></div>
    <div class="stat accent"><div class="k">Left</div><div class="v" ${left < 0 ? 'style="color:var(--red)"' : ''}>${
      left < 0 ? '&minus;' + money(-left) : money(left)}</div></div>
  </div>
  <p class="hint" style="margin:0 0 24px">${esc(paceLine)}</p>`;

  const catTable = B.edit ? `
    <div class="bud-scroll"><table><thead><tr><th>Category</th><th class="num" style="width:170px">${y} budget</th>
      <th style="width:190px">Sage Intacct GL account</th></tr></thead><tbody>
      ${B.cats.filter(c => c.active !== false).map(c => `<tr><td>${esc(c.label)}</td>
        <td class="num"><input type="text" inputmode="decimal" data-bud-plan="${esc(c.key)}"
          value="${esc(B.plan[c.key] ?? '')}" placeholder="0" autocomplete="off" style="text-align:right" /></td>
        <td><input type="text" data-bud-gl="${esc(c.key)}" value="${esc(B.gl[c.key] ?? '')}"
          placeholder="Optional" autocomplete="off" /></td></tr>`).join('')}
    </tbody></table></div>
    <div class="actions">
      <button class="btn small" id="budPlanSave" ${B.saving ? 'disabled' : ''}>${B.saving ? 'Saving&hellip;' : 'Save budget'}</button>
      <button class="linkbtn" id="budPlanCancel">Cancel</button>
      <span class="hint">The GL account goes into the export, so accounting can file each line.</span>
    </div>`
  : `<div class="bud-scroll"><table><thead><tr><th>Category</th><th class="num">Budget</th><th class="num">Spent</th>
      <th class="num">Committed</th><th class="num">Left</th><th style="width:28%"></th></tr></thead><tbody>
      ${rows.map(r => {
        const l = r.planned - r.paid - r.committed;
        return `<tr><td>${esc(r.label)}</td>
          <td class="num">${r.planned ? money(r.planned) : '&ndash;'}</td>
          <td class="num">${money(r.paid)}</td><td class="num">${money(r.committed)}</td>
          <td class="num" ${l < 0 ? 'style="color:var(--red)"' : ''}>${r.planned || l ? (l < 0 ? '&minus;' + money(-l) : money(l)) : '&ndash;'}</td>
          <td>${budBar(r)}</td></tr>`;
      }).join('')}
    </tbody></table></div>`;

  const needCat = items.filter(it => !it.category);
  const shown = items.filter(it =>
      B.filter === 'all' ? true
    : B.filter === 'nocat' ? !it.category
    : it.status === B.filter)
    .filter(it => !B.cat || it.category === B.cat);
  const shownTotal = shown.reduce((s, it) => s + it.amount, 0);

  const chips = [
    ['all', 'Everything', items.length],
    ['committed', 'Committed', items.filter(it => it.status !== 'paid').length],
    ['paid', 'Paid', items.filter(it => it.status === 'paid').length]
  ].concat(needCat.length ? [['nocat', 'Needs a category', needCat.length]] : [])
   .map(([k, label, n]) =>
    `<button class="fchip ${B.filter === k ? 'on' : ''}" data-bud-filt="${k}">${label} <b>${n}</b></button>`).join('');

  return `<main class="page" style="max-width:1060px">
    <div class="bud-head">
      <div class="bud-year">
        <button class="linkbtn" data-bud-year="-1" aria-label="Previous year">&lsaquo;</button>
        <h2>${y}</h2>
        <button class="linkbtn" data-bud-year="1" aria-label="Next year">&rsaquo;</button>
      </div>
      <span class="spacer"></span>
      <button class="btn small ghost" id="budExport">Export for Sage Intacct</button>
      <button class="btn small ghost" id="budEdit">${B.edit ? 'Stop editing' : 'Edit budget'}</button>
      <button class="btn small" id="budAdd">Add an expense</button>
    </div>

    ${B.note ? `<div class="done-banner" style="margin-bottom:14px"><p style="margin:0">${esc(B.note)}</p></div>` : ''}
    ${B.err && !B.form ? `<p class="hint err" style="margin-bottom:14px">${esc(B.err)}</p>` : ''}

    ${stats}

    <div class="block"><h2 class="sec">By category</h2>${catTable}</div>

    <div class="block" style="margin-top:30px"><h2 class="sec">Spending</h2>
      ${needCat.length ? `<div class="warn soft" style="margin-bottom:12px"><b>${
        needCat.length} item${needCat.length === 1 ? '' : 's'}</b>
        still need${needCat.length === 1 ? 's' : ''} a category. Pick one in the list below.</div>` : ''}
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
        <div class="fchips" style="margin:0;flex:1">${chips}</div>
        <select id="budCatFilt" style="width:auto;min-width:200px">${budCatOptions(B.cat, 'All categories')}</select>
      </div>
      ${shown.length ? `<div class="bud-scroll"><table class="bud-log"><thead><tr><th style="width:110px">Date</th><th>What</th>
        <th style="width:210px">Category</th><th class="num" style="width:120px">Amount</th>
        <th style="width:110px">Status</th><th style="width:150px"></th></tr></thead><tbody>
        ${shown.map(budRow).join('')}
        <tr class="bud-tot"><td colspan="3">Total shown</td><td class="num">${esc(apvMoney(shownTotal))}</td><td colspan="2"></td></tr>
      </tbody></table></div>`
      : `<div class="empty" style="padding:30px 0"><h2>Nothing here</h2><p>Nothing in this list for ${y} yet.</p></div>`}
    </div>
  </main>${budForm()}`;
}

function budRow(it){
  const B = S.bud;
  const busy = B.busy === it.id;
  const what = [it.vendor ? `<b>${esc(it.vendor)}</b>` : '', it.description ? esc(it.description) : '']
    .filter(Boolean).join(' &middot; ') || '<span class="muted">No details</span>';
  const tags = [];
  if(BUD_SRC[it.source]) tags.push(`<span class="bud-tag">${BUD_SRC[it.source]}</span>`);
  if(it.payment_method && BUD_PAY[it.payment_method]) tags.push(`<span class="bud-tag">${esc(BUD_PAY[it.payment_method])}</span>`);
  if(it.reference) tags.push(`<span class="bud-tag">#${esc(it.reference)}</span>`);
  const rurl = it.receipt_path ? signedUrl('receipts', it.receipt_path) : null;
  const rc = rurl ? `<a class="bud-tag" href="${esc(rurl)}" target="_blank" rel="noopener">Receipt</a>`
    : it.receipt_path ? `<span class="bud-tag muted">Receipt&hellip;</span>` : '';
  const cat = it.category ? esc(budCatLabel(it.category))
    : `<select data-bud-setcat="${esc(it.id)}" ${busy ? 'disabled' : ''}>${budCatOptions('', 'Pick a category')}</select>`;
  const status = it.status === 'paid'
    ? `<span class="bud-st paid">Paid</span>${it.paid_on ? `<div class="hint">${esc(shortDate(it.paid_on + 'T12:00:00'))}</div>` : ''}`
    : `<span class="bud-st">Committed</span>`;
  const acts = [];
  if(it.status !== 'paid') acts.push(`<button class="linkbtn" data-bud-paid="${esc(it.id)}" ${busy ? 'disabled' : ''}>Mark paid</button>`);
  acts.push(`<button class="linkbtn" data-bud-open="${esc(it.id)}">Edit</button>`);
  return `<tr class="${busy ? 'busy' : ''}">
    <td class="mono">${esc(shortDate(it.spent_on + 'T12:00:00'))}</td>
    <td>${what}${tags.length || rc ? `<div class="bud-tags">${tags.join('')}${rc}</div>` : ''}</td>
    <td>${cat}</td>
    <td class="num">${esc(apvMoney(it.amount))}</td>
    <td>${status}</td>
    <td style="text-align:right;white-space:nowrap">${acts.join('')}</td>
  </tr>`;
}

function budForm(){
  const B = S.bud, f = B.form;
  if(!f) return '';
  const auto = f.source === 'approval' || f.source === 'event';
  return `<div class="sheet" role="dialog" aria-modal="true" aria-label="Expense">
    <div class="sheet-in">
      <div class="sheet-head">
        <h2>${f.id ? 'Edit expense' : 'Add an expense'}</h2>
        <button class="linkbtn" id="budClose">Close</button>
      </div>
      ${auto ? `<p class="hint" style="margin-top:10px">${f.source === 'event' ? 'This came in from an event on the calendar.' : 'This came in from an approval.'}
        While it is committed, the amount follows the ${f.source === 'event' ? 'event' : 'approval'}. Once it is marked paid, it stays as entered here.</p>` : ''}

      <div class="apv-pair">
        <div class="field"><label for="budDate">Date</label>
          <input type="date" id="budDate" value="${esc(f.spent_on)}" /></div>
        <div class="field"><label for="budAmt">Amount</label>
          <input type="text" inputmode="decimal" id="budAmt" value="${esc(f.amount)}" placeholder="0.00" autocomplete="off" /></div>
      </div>
      <div class="field"><label for="budVendor">Vendor</label>
        <input type="text" id="budVendor" value="${esc(f.vendor)}" placeholder="Who was paid" autocomplete="off" /></div>
      <div class="field"><label for="budDesc">What for</label>
        <input type="text" id="budDesc" value="${esc(f.description)}" placeholder="Booth banner for the ABC expo" autocomplete="off" /></div>
      <div class="field"><label for="budCat">Category</label>
        <select id="budCat">${budCatOptions(f.category, 'Pick a category')}</select></div>

      <div class="apv-pair">
        <div class="field"><label for="budStatus">Status</label>
          <select id="budStatus">
            <option value="paid" ${f.status === 'paid' ? 'selected' : ''}>Paid</option>
            <option value="committed" ${f.status !== 'paid' ? 'selected' : ''}>Committed, not paid yet</option>
          </select></div>
        ${f.status === 'paid' ? `<div class="field"><label for="budPaidOn">Paid on</label>
          <input type="date" id="budPaidOn" value="${esc(f.paid_on || '')}" /></div>` : '<div class="field"></div>'}
      </div>
      <div class="apv-pair">
        <div class="field"><label for="budPay">Paid with</label>
          <select id="budPay">${Object.entries(BUD_PAY).map(([k, l]) =>
            `<option value="${k}" ${f.payment_method === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
        <div class="field"><label for="budRef">Invoice or PO number</label>
          <input type="text" id="budRef" value="${esc(f.reference)}" placeholder="Optional" autocomplete="off" /></div>
      </div>

      <div class="field"><label for="budFile">Receipt</label>
        <input type="file" id="budFile" accept="image/*,application/pdf"
               style="width:100%;font-size:13px;padding:8px 0;border:0;background:none" /></div>
      ${B.file ? `<p class="hint"><b>${esc(B.file.name)}</b> &middot; ${Math.round(B.file.size / 1024).toLocaleString()} KB</p>`
        : f.receipt_name ? `<p class="hint">On file: <b>${esc(f.receipt_name)}</b>. Choosing a new one replaces it.</p>` : ''}

      <div class="field"><label for="budNotes">Notes</label>
        <textarea id="budNotes" style="min-height:70px" placeholder="Optional">${esc(f.notes)}</textarea></div>

      ${B.err ? `<p class="hint err">${esc(B.err)}</p>` : ''}

      <div class="sheet-foot">
        <button class="btn" id="budSave" ${B.saving ? 'disabled' : ''}>${B.saving ? 'Saving&hellip;' : 'Save'}</button>
        ${f.id && !auto ? `<p style="margin:12px 0 0;text-align:center"><button class="linkbtn" id="budDel" style="color:var(--red)">Delete this expense</button></p>` : ''}
      </div>
    </div>
  </div>`;
}

function budOpenFor(id){
  const B = S.bud;
  B.err = ''; B.note = ''; B.file = null;
  if(!id){ B.form = budBlankForm(); return render(); }
  const x = B.exps.find(x => x.id === id);
  if(!x) return;
  B.form = budBlankForm({ id:x.id, source:x.source, spent_on:x.spent_on,
    vendor:x.vendor || '', description:x.description || '', category:x.category || '',
    amount:Number(x.amount).toFixed(2), status:x.status, paid_on:x.paid_on || today(),
    payment_method:x.payment_method || 'card', reference:x.reference || '',
    notes:x.notes || '', receipt_name:x.receipt_name });
  render();
}

async function budReload(){ S.loaded.budget = false; await loadBudget(); }

async function saveBudExpense(){
  const B = S.bud, f = B.form;
  if(!f || B.saving) return;
  const amt = apvNum(f.amount);
  if(amt === null || Number.isNaN(amt)){ B.err = 'Amount needs to be a number, like 125 or 125.50.'; return render(); }
  if(!f.spent_on){ B.err = 'Pick a date.'; return render(); }
  if(!String(f.description).trim()){ B.err = 'Say what it was for.'; return render(); }
  B.saving = true; B.err = ''; render();

  let who = '';
  try{ const { data } = await sb.auth.getUser(); who = (data && data.user && data.user.email) || ''; }catch(e){}

  try{
    const row = {
      spent_on:f.spent_on, vendor:String(f.vendor).trim() || null,
      description:String(f.description).trim(), category_id:f.category ? Number(f.category) : null,
      amount:Math.round(amt * 100) / 100, status:f.status,
      paid_on:f.status === 'paid' ? (f.paid_on || f.spent_on) : null,
      payment_method:f.payment_method || null, invoice_ref:String(f.reference).trim() || null,
      notes:String(f.notes).trim() || null, updated_at:new Date().toISOString()
    };
    let oldPath = null;
    if(B.file){
      const safe = B.file.name.replace(/[^A-Za-z0-9._-]/g, '_');
      const path = `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}/${safe}`;
      const { error:upErr } = await sb.storage.from('receipts').upload(path, B.file, { upsert:false });
      if(upErr) throw upErr;
      row.receipt_path = path; row.receipt_name = B.file.name;
      if(f.id) oldPath = (B.exps.find(x => x.id === f.id) || {}).receipt_path || null;
    }
    const { error } = f.id
      ? await sb.from('expenses').update(row).eq('id', f.id)
      : await sb.from('expenses').insert(Object.assign(row, { source:'manual', created_by:who }));
    if(error) throw error;
    if(oldPath){ try{ await sb.storage.from('receipts').remove([oldPath]); }catch(e){} }
    B.form = null; B.file = null;
    B.note = 'Saved.';
    await budReload();
  }catch(err){ B.err = err.message || String(err); }
  B.saving = false; render();
}

async function deleteBudExpense(){
  const B = S.bud, f = B.form;
  if(!f || !f.id) return;
  if(!confirm('Delete this expense? This cannot be undone.')) return;
  const x = B.exps.find(x => x.id === f.id);
  B.saving = true; render();
  try{
    const { error } = await sb.from('expenses').delete().eq('id', f.id);
    if(error) throw error;
    if(x && x.receipt_path){ try{ await sb.storage.from('receipts').remove([x.receipt_path]); }catch(e){} }
    B.form = null; B.note = 'Deleted.';
    await budReload();
  }catch(err){ B.err = err.message || String(err); }
  B.saving = false; render();
}

/* A category picked from the list, or Mark paid on a committed row. */
async function budQuick(id, patch){
  const B = S.bud;
  B.busy = id; B.err = ''; B.note = ''; render();
  try{
    const { error } = await sb.from('expenses')
      .update(Object.assign({ updated_at:new Date().toISOString() }, patch)).eq('id', id);
    if(error) throw error;
    await budReload();
  }catch(err){ B.err = err.message || String(err); }
  B.busy = ''; render();
}

async function saveBudPlan(){
  const B = S.bud, y = B.year;
  const cats = B.cats.filter(c => c.active !== false);
  const lines = [];
  for(const c of cats){
    const n = apvNum(B.plan[c.key]);
    if(Number.isNaN(n)){ B.err = `The budget for ${c.label} needs to be a number.`; return render(); }
    lines.push({ year:y, category_id:c.id, amount:n === null ? 0 : Math.round(n * 100) / 100 });
  }
  B.saving = true; B.err = ''; render();
  let who = '';
  try{ const { data } = await sb.auth.getUser(); who = (data && data.user && data.user.email) || ''; }catch(e){}
  try{
    const now = new Date().toISOString();
    const { error } = await sb.from('budget_plan')
      .upsert(lines.map(l => Object.assign(l, { updated_by:who, updated_at:now })), { onConflict:'year,category_id' });
    if(error) throw error;
    for(const c of cats){
      const gl = String(B.gl[c.key] ?? '').trim() || null;
      if(gl !== (c.gl_account || null)){
        const { error:e2 } = await sb.from('budget_categories').update({ gl_account:gl }).eq('id', c.id);
        if(e2) throw e2;
      }
    }
    B.edit = false; B.note = `The ${y} budget is saved.`;
    await budReload();
  }catch(err){ B.err = err.message || String(err); }
  B.saving = false; render();
}

function budStartEdit(){
  const B = S.bud;
  B.plan = {}; B.gl = {};
  for(const c of B.cats){
    const l = B.lines.find(l => l.year === B.year && l.category === c.key);
    B.plan[c.key] = l && Number(l.planned) ? String(Number(l.planned)) : '';
    B.gl[c.key] = c.gl_account || '';
  }
  B.edit = true; B.err = ''; B.note = '';
}

/* One row per item, with the GL account from the category, so it can be
   brought into Sage Intacct or checked against it. Cells that start with
   = + - @ are prefixed so a spreadsheet never treats them as formulas. */
function exportBudget(){
  const B = S.bud, y = B.year;
  const items = budItems(y).slice().reverse();
  const cell = c => {
    let s = String(c ?? '');
    if(/^[=+\-@]/.test(s)) s = "'" + s;
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const glOf = k => (B.cats.find(c => c.key === k) || {}).gl_account || '';
  const rows = [['Date','Vendor','Description','Category','GL account','Amount','Status',
                 'Paid on','Paid with','Invoice or PO','Notes','Source']];
  for(const it of items){
    rows.push([it.spent_on, it.vendor, it.description, budCatLabel(it.category), glOf(it.category),
      it.amount.toFixed(2), it.status === 'paid' ? 'Paid' : 'Committed', it.paid_on || '',
      BUD_PAY[it.payment_method] || '', it.reference || '', it.notes || '',
      { approval:'Approvals', event:'Events' }[it.source] || 'Budget tab']);
  }
  const blob = new Blob([rows.map(r => r.map(cell).join(',')).join('\n')], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `haggerty-marketing-spend-${y}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function wireBudget(){
  if(S.page !== 'budget') return;
  const B = S.bud;
  document.querySelectorAll('[data-bud-year]').forEach(el =>
    el.addEventListener('click', () => {
      B.year += Number(el.dataset.budYear); B.note = ''; B.err = '';
      if(B.edit) budStartEdit();
      render();
    }));
  document.querySelectorAll('[data-bud-filt]').forEach(el =>
    el.addEventListener('click', () => { B.filter = el.dataset.budFilt; render(); }));
  const cf = document.getElementById('budCatFilt');
  if(cf) cf.addEventListener('change', () => { B.cat = cf.value; render(); });

  const ed = document.getElementById('budEdit');
  if(ed) ed.addEventListener('click', () => { if(B.edit){ B.edit = false; B.err = ''; } else budStartEdit(); render(); });
  const pc = document.getElementById('budPlanCancel');
  if(pc) pc.addEventListener('click', () => { B.edit = false; B.err = ''; render(); });
  const ps = document.getElementById('budPlanSave');
  if(ps) ps.addEventListener('click', saveBudPlan);
  document.querySelectorAll('[data-bud-plan]').forEach(el =>
    el.addEventListener('input', () => { B.plan[el.dataset.budPlan] = el.value; }));
  document.querySelectorAll('[data-bud-gl]').forEach(el =>
    el.addEventListener('input', () => { B.gl[el.dataset.budGl] = el.value; }));

  const ex = document.getElementById('budExport');
  if(ex) ex.addEventListener('click', exportBudget);
  const ad = document.getElementById('budAdd');
  if(ad) ad.addEventListener('click', () => budOpenFor(null));
  document.querySelectorAll('[data-bud-open]').forEach(el =>
    el.addEventListener('click', () => budOpenFor(el.dataset.budOpen)));
  document.querySelectorAll('[data-bud-setcat]').forEach(el =>
    el.addEventListener('change', () => { if(el.value) budQuick(el.dataset.budSetcat, { category_id:Number(el.value) }); }));
  document.querySelectorAll('[data-bud-paid]').forEach(el =>
    el.addEventListener('click', () => budQuick(el.dataset.budPaid, { status:'paid', paid_on:today() })));

  if(!B.form) return;
  const f = B.form;
  [['budDate','spent_on'],['budAmt','amount'],['budVendor','vendor'],['budDesc','description'],
   ['budPaidOn','paid_on'],['budRef','reference'],['budNotes','notes']].forEach(([id, key]) => {
    const el = document.getElementById(id);
    if(el) el.addEventListener('input', () => { f[key] = el.value; });
  });
  [['budCat','category'],['budPay','payment_method']].forEach(([id, key]) => {
    const el = document.getElementById(id);
    if(el) el.addEventListener('change', () => { f[key] = el.value; });
  });
  const st = document.getElementById('budStatus');
  if(st) st.addEventListener('change', () => {
    f.status = st.value;
    if(f.status === 'paid' && !f.paid_on) f.paid_on = today();
    render();
  });
  const fl = document.getElementById('budFile');
  if(fl) fl.addEventListener('change', () => { B.file = (fl.files && fl.files[0]) || null; B.err = ''; render(); });
  const cl = document.getElementById('budClose');
  if(cl) cl.addEventListener('click', () => { B.form = null; B.file = null; B.err = ''; render(); });
  const sv = document.getElementById('budSave');
  if(sv) sv.addEventListener('click', saveBudExpense);
  const dl = document.getElementById('budDel');
  if(dl) dl.addEventListener('click', deleteBudExpense);
}

/* ================= mileage ================= */
/* Everyone except social reviewers logs their own drives here and prints
   them onto the company Mileage Reimbursement Form
   (forms/mileage-reimbursement-2026.pdf). Rows belong to the email that
   wrote them and nobody sees anyone else's (sql/mileage.sql).

   The PDF has its own form fields: 20 trip rows, a name, and total
   mileage and total reimbursement. More than 20 trips print as more
   pages, each with its own totals. */
/* The rate for new trips comes from kpi_config (key mileage_rate) when
   the tab loads; each trip keeps the rate it was saved with (t.rate).
   A trip on a printed or reimbursed form is locked by the database
   (sql/mileage.sql), so it shows Printed or Paid instead of Edit. */
let MIL_RATE = 0.70;
const MIL_ROWS = 20;
const MIL_FORM = 'forms/mileage-reimbursement-2026.pdf';
const PDFLIB_SRC = 'https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js';

S.mil = { month:today().slice(0, 7), trips:[], name:'', form:null, print:null,
          saving:false, err:'', note:'', loadErr:'' };

const milNum = v => { if(v === null || v === undefined || String(v).trim() === '') return null;
  const n = parseFloat(String(v).replace(/[,$\s]/g, '')); return isFinite(n) ? n : null; };
const milMi = n => (Math.round(Number(n || 0) * 10) / 10).toLocaleString('en-US');
const milOdo = n => n === null || n === undefined ? '' : Number(n).toLocaleString('en-US', { maximumFractionDigits:1 });
const milRate = t => Number(t && t.rate != null ? t.rate : MIL_RATE);
const milCost = t => Math.round(Number(t.miles || 0) * milRate(t) * 100) / 100;
/* Each trip keeps the rate it was logged at, and that is what its cost
   uses, so the text says the same rather than always today's rate. */
function milRateLine(trips){
  const rates = [...new Set((trips || []).map(milRate))].sort((a, b) => a - b);
  if(!rates.length) return `${apvMoney(MIL_RATE)} a mile for new trips.`;
  if(rates.length === 1) return `${apvMoney(rates[0])} a mile.`;
  return `Rates this month: ${rates.map(r => apvMoney(r)).join(', ')} a mile, each trip at the rate it was logged at.`;
}
const milMDY = ymd => { const [y, m, d] = ymd.split('-').map(Number); return `${m}/${d}/${y}`; };
const milMonthName = ym => new Date(ym + '-15T12:00:00').toLocaleDateString('en-US', { month:'long', year:'numeric' });
const milMonthEnd = ym => { const [y, m] = ym.split('-').map(Number);
  return ym + '-' + String(new Date(y, m, 0).getDate()).padStart(2, '0'); };
const milShift = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };

async function loadMileage(){
  const M = S.mil;
  let who = '';
  try{ const { data } = await sb.auth.getUser(); who = (data && data.user && data.user.email) || ''; }catch(e){}
  const [t, d, r] = await Promise.all([
    sb.from('mileage_trips').select('*').order('trip_date').order('created_at'),
    who ? sb.from('staff_directory').select('name').ilike('email', who).limit(1) : Promise.resolve({ data:[] }),
    sb.from('kpi_config').select('value').eq('key', 'mileage_rate').maybeSingle()
  ]);
  const rate = parseFloat(r && r.data && r.data.value);
  if(isFinite(rate) && rate > 0) MIL_RATE = rate;
  if(t.error){
    const m = t.error.message || String(t.error);
    M.loadErr = /does not exist|schema cache|PGRST205|42P01/i.test(m + ' ' + (t.error.code || ''))
      ? 'The mileage table has not been created yet. Run sql/mileage.sql in the Supabase SQL editor, then reload.'
      : 'Could not load your trips. ' + m;
    S.loaded.mileage = true;
    return;
  }
  M.loadErr = '';
  M.trips = t.data || [];
  M.name = (d.data && d.data[0] && d.data[0].name) || who;
  S.loaded.mileage = true;
}

  const last = S.mil.trips.slice().sort((a, b) => String(a.created_at).localeCompare(String(b.created_at))).pop();

  return Object.assign({ id:null, trip_date:day, start_loc:last ? last.destination : '', destination:'',
    purpose:'', odo_start:last && last.odo_end != null ? String(last.odo_end) : '', odo_end:'', miles:'' }, over || {});
}

        <div class="field"><label for="milOs">Odometer start</label>
          <input type="text" inputmode="decimal" id="milOs" value="${esc(f.odo_start)}" placeholder="Optional" autocomplete="off" /></div>
        <div class="field"><label for="milOe">Odometer end</label>
          <input type="text" inputmode="decimal" id="milOe" value="${esc(f.odo_end)}" placeholder="Optional" autocomplete="off" /></div>
      </div>
      <div class="field"><label for="milMiles">Miles</label>
        <input type="text" inputmode="decimal" id="milMiles" value="${esc(f.miles)}" placeholder="0.0" autocomplete="off" ${auto ? 'readonly' : ''} /></div>
      <p class="hint" id="milSum">${esc(milSumLine(f))}</p>
      ${M.err ? `<p class="hint err">${esc(M.err)}</p>` : ''}

        <button class="btn" id="milSave" ${M.saving ? 'disabled' : ''}>${M.saving ? 'Saving&hellip;' : 'Save'}</button>

          <button class="linkbtn" id="milReturn" ${M.saving ? 'disabled' : ''}>Save and add the drive back</button>

      </div>
    </div>

}

function milSumLine(f){
  const n = milNum(f.miles);
  /* An existing trip keeps its own rate; a new one takes today's. */
  const rate = milRate(f.id ? S.mil.trips.find(t => t.id === f.id) : null);
  return n ? `${milMi(n)} miles × ${apvMoney(rate)} = ${apvMoney(Math.round(n * rate * 100) / 100)}`
           : 'Enter both odometer readings, or just the miles.';
}

function milPrintSheet(){
  const M = S.mil, p = M.print;

      <p class="hint">${ts.length ? `${ts.length} trip${ts.length === 1 ? '' : 's'}, ${esc(milMi(ts.reduce((s, t) => s + Number(t.miles || 0), 0)))} miles, ${
        esc(apvMoney(ts.reduce((s, t) => s + milCost(t), 0)))} on ${pages} page${pages === 1 ? '' : 's'}.` : 'No trips in these dates.'}</p>

            ${ts.some(t => !t.reimbursed_at) ? ` &middot; <button class="linkbtn" id="milPaid">Mark these reimbursed</button>` : ''}</p>

function milPicked(){
  const p = S.mil.print;
  return S.mil.trips.filter(t => t.trip_date >= p.from && t.trip_date <= p.to)
    .sort((a, b) => String(a.trip_date).localeCompare(String(b.trip_date)) || String(a.created_at).localeCompare(String(b.created_at)));
}

let pdfLibP = null;
function loadPdfLib(){
  if(window.PDFLib) return Promise.resolve(window.PDFLib);
  return pdfLibP = pdfLibP || new Promise((ok, no) => {
    const s = document.createElement('script');
    s.src = PDFLIB_SRC;
    s.onload = () => ok(window.PDFLib);
    s.onerror = () => { pdfLibP = null; no(new Error('Could not load the PDF tools. Check the connection and try again.')); };
    document.head.appendChild(s);
  });
}

/* Fills the form's own fields, then flattens each page so it prints the
   same in every viewer. Every row is set, blanks too, so each field gets
   a clean appearance when it is flattened. */
async function milPdf(trips, name){
  const PL = await loadPdfLib();
  const r = await fetch(MIL_FORM);
  if(!r.ok) throw new Error('Could not load the mileage form.');
  const tpl = await r.arrayBuffer();
  const out = await PL.PDFDocument.create();
  const cols = ['DateRow','Starting LocationRow','Destination AddressRow','DescriptionNotesRow',
                'Odometer StartRow','Odometer EndRow','MileageRow','ExpenseRow'];
  for(let i = 0; i < trips.length; i += MIL_ROWS){
    const doc = await PL.PDFDocument.load(tpl), form = doc.getForm(), part = trips.slice(i, i + MIL_ROWS);
    const set = (n, v) => { try{ form.getTextField(n).setText(v == null ? '' : String(v)); }catch(e){} };
    set('Employee Name', name);
    for(let n = 1; n <= MIL_ROWS; n++) cols.forEach(c => set(c + n, ''));
    part.forEach((t, k) => {
      const n = k + 1;
      set('DateRow' + n, milMDY(t.trip_date));
      set('Starting LocationRow' + n, t.start_loc);
      set('Destination AddressRow' + n, t.destination);
      set('DescriptionNotesRow' + n, t.purpose);
      set('Odometer StartRow' + n, milOdo(t.odo_start));
      set('Odometer EndRow' + n, milOdo(t.odo_end));
      set('MileageRow' + n, milMi(t.miles));
      set('ExpenseRow' + n, apvMoney(milCost(t)));
    });
    /* 0575Row1 and 0575Row2 are Total Mileage and Total Reimbursement. */
    set('0575Row1', milMi(part.reduce((s, t) => s + Number(t.miles || 0), 0)));
    set('0575Row2', apvMoney(part.reduce((s, t) => s + milCost(t), 0)));
    form.updateFieldAppearances(await doc.embedFont(PL.StandardFonts.Helvetica));
    form.flatten();
    (await out.copyPages(doc, doc.getPageIndices())).forEach(pg => out.addPage(pg));
  }
  out.setTitle('Mileage Reimbursement - ' + name);
  return out.save();
}

async function milMakePdf(){
  const M = S.mil, p = M.print, ts = milPicked();
  if(!ts.length) return;
  M.saving = true; M.err = ''; render();
  try{
    const bytes = await milPdf(ts, p.name.trim());
    if(p.url) URL.revokeObjectURL(p.url);
    p.url = URL.createObjectURL(new Blob([bytes], { type:'application/pdf' }));
    p.file = `Mileage ${p.from} to ${p.to} - ${p.name.trim()}.pdf`;
  }catch(err){ M.err = err.message || String(err); }
  M.saving = false; render();
}

/* Printing locks the trips on the form; marking them reimbursed records
   the payment. Both are one-way (the database refuses to undo them). */
async function milStamp(field){
  const M = S.mil, ids = milPicked().filter(t => !t[field]).map(t => t.id);
  if(!ids.length) return;
  const { data, error } = await sb.from('mileage_trips').update({ [field]:new Date().toISOString() })
    .in('id', ids).is(field, null).select();
  /* Before sql/safety_2026_10_23.sql has run the columns are missing;
     printing still works, it just does not lock anything yet. */
  if(error && /printed_at|reimbursed_at|schema cache/i.test(error.message || '') && field === 'printed_at') return;
  if(error){ M.err = 'Could not mark the trips. ' + (error.message || ''); return render(); }
  (data || []).forEach(row => { const i = M.trips.findIndex(t => t.id === row.id); if(i >= 0) M.trips[i] = row; });
  if(field === 'reimbursed_at'){ M.note = `${(data || []).length} trip${(data || []).length === 1 ? '' : 's'} marked reimbursed.`; M.print = null; }
  render();
}

async function milSave(andReturn){
  const M = S.mil, f = M.form;
  const a = milNum(f.odo_start), b = milNum(f.odo_end);
  const miles = a !== null && b !== null ? Math.round((b - a) * 10) / 10 : milNum(f.miles);
  M.err = '';
  if(!f.trip_date) M.err = 'Pick the date of the trip.';
  else if(a !== null && b !== null && b < a) M.err = 'The odometer end is lower than the start.';
  else if(!miles || miles <= 0) M.err = 'Enter the miles, or both odometer readings.';
  if(M.err) return render();
  const row = { trip_date:f.trip_date, start_loc:f.start_loc.trim(), destination:f.destination.trim(),
    purpose:f.purpose.trim(), odo_start:a, odo_end:b, miles, updated_at:new Date().toISOString() };
  M.saving = true; render();
  const res = f.id ? await sb.from('mileage_trips').update(row).eq('id', f.id).select().single()
                   : await sb.from('mileage_trips').insert(row).select().single();
  M.saving = false;
  if(res.error){ M.err = 'Could not save the trip. ' + (res.error.message || ''); return render(); }
  const i = M.trips.findIndex(t => t.id === res.data.id);
  if(i >= 0) M.trips[i] = res.data; else M.trips.push(res.data);
  M.month = res.data.trip_date.slice(0, 7);
  M.form = andReturn ? milBlankForm({ trip_date:row.trip_date, start_loc:row.destination, destination:row.start_loc,
      purpose:row.purpose, odo_start:b !== null ? String(b) : '', miles:b !== null ? '' : String(miles) }) : null;
  M.note = andReturn ? '' : 'Trip saved.';
  render();
}

async function milDelete(){
  const M = S.mil, f = M.form;
  if(!f || !f.id || !confirm('Delete this trip?')) return;
  const { error } = await sb.from('mileage_trips').delete().eq('id', f.id);
  if(error){ M.err = 'Could not delete the trip. ' + (error.message || ''); return render(); }
  M.trips = M.trips.filter(t => t.id !== f.id);
  M.form = null; M.note = 'Trip deleted.';
  render();
}

function wireMileage(){
  if(S.page !== 'mileage') return;
  const M = S.mil;
  document.querySelectorAll('[data-mil-month]').forEach(el =>
    el.addEventListener('click', () => { M.month = milShift(M.month, Number(el.dataset.milMonth)); M.note = ''; render(); }));
  const ad = document.getElementById('milAdd');
  if(ad) ad.addEventListener('click', () => { M.err = ''; M.note = ''; M.form = milBlankForm(); render(); });
  document.querySelectorAll('[data-mil-open]').forEach(el =>
    el.addEventListener('click', () => {
      const t = M.trips.find(t => t.id === el.dataset.milOpen);
      if(!t) return;
      M.err = ''; M.note = '';
      M.form = { id:t.id, trip_date:t.trip_date, start_loc:t.start_loc, destination:t.destination, purpose:t.purpose,
        odo_start:t.odo_start == null ? '' : String(t.odo_start), odo_end:t.odo_end == null ? '' : String(t.odo_end), miles:String(t.miles) };
      render();
    }));
  const pr = document.getElementById('milPrint');
  if(pr) pr.addEventListener('click', () => {
    M.err = ''; M.note = '';
    M.print = { from:M.month + '-01', to:milMonthEnd(M.month), name:M.name, url:null, file:'' };
    render();
  });

  if(M.form){
    const f = M.form;
    const sum = () => {
      const a = milNum(f.odo_start), b = milNum(f.odo_end), mi = document.getElementById('milMiles');
      if(mi){ mi.readOnly = a !== null && b !== null;
        if(mi.readOnly && b >= a){ f.miles = String(Math.round((b - a) * 10) / 10); mi.value = f.miles; } }
      const s = document.getElementById('milSum'); if(s) s.textContent = milSumLine(f);
    };
    [['milDate','trip_date'],['milFrom','start_loc'],['milTo','destination'],['milWhy','purpose'],
     ['milOs','odo_start'],['milOe','odo_end'],['milMiles','miles']].forEach(([id, key]) => {
      const el = document.getElementById(id);
      if(el) el.addEventListener('input', () => { f[key] = el.value; sum(); });
    });
    const cl = document.getElementById('milClose');
    if(cl) cl.addEventListener('click', () => { M.form = null; M.err = ''; render(); });
    const sv = document.getElementById('milSave');
    if(sv) sv.addEventListener('click', () => milSave(false));
    const rt = document.getElementById('milReturn');
    if(rt) rt.addEventListener('click', () => milSave(true));
    const dl = document.getElementById('milDel');
    if(dl) dl.addEventListener('click', milDelete);
  }

  if(M.print){
    const p = M.print;
    [['milPA','from'],['milPB','to']].forEach(([id, key]) => {
      const el = document.getElementById(id);
      if(el) el.addEventListener('change', () => { p[key] = el.value; p.url = null; render(); });
    });
    const nm = document.getElementById('milPName');
    if(nm) nm.addEventListener('input', () => { p.name = nm.value; });
    nm && nm.addEventListener('change', () => { p.url = null; render(); });
    const go = document.getElementById('milPGo');
    if(go) go.addEventListener('click', milMakePdf);
    document.querySelectorAll('[data-mil-printed]').forEach(el => el.addEventListener('click', () => milStamp('printed_at')));
    const pd = document.getElementById('milPaid');
    if(pd) pd.addEventListener('click', () => { if(confirm('Mark the trips on this form as reimbursed? They stay locked.')) milStamp('reimbursed_at'); });
    const cl = document.getElementById('milPClose');
    if(cl) cl.addEventListener('click', () => { M.print = null; M.err = ''; render(); });
  }
}

/* ================= mr. workflow ================= */
/* Bulk email by Pipedrive label, sent from Liam's or Pat's Outlook
   (sql/mr_workflow.sql). A campaign picks labels, the AI writes five
   options, one is edited into the email, and starting it fixes the list.
   n8n then sends a few at a time on weekdays (Haggerty Mr. Workflow
   Sender) and records replies, bounces and unsubscribes (Haggerty
   Mr. Workflow Replies). Nothing goes out until someone presses Start. */
const MRW_URL = 'https://haggertybuilds.app.n8n.cloud/webhook/haggerty-mr-workflow';
const MRW_FIELDS = ['first_name','last_name','company','title','city'];
const MRW_STATUS = { draft:'Draft', sending:'Sending', paused:'Paused', done:'Done', cancelled:'Cancelled' };

S.mrw = { list:[], stats:{}, senders:[], counts:{}, open:null, form:null, preview:null,
          recips:[], replies:[], busy:'', err:'', note:'', confirm:false, showEmpty:false };

async function loadBulk(){
  const M = S.mrw;
  const [c, s, n, k] = await Promise.all([
    sb.from('bulk_campaigns').select('*').order('created_at', { ascending:false }),
    sb.from('v_bulk_campaign_stats').select('*'),
    sb.from('bulk_senders').select('key,name,email,footer_line').order('sort'),
    sb.rpc('bulk_label_counts')
  ]);
  if(c.error){ M.err = 'Could not load the campaigns. ' + (c.error.message || ''); S.loaded.bulk = true; return; }
  M.list = c.data || [];
  M.stats = Object.fromEntries((s.data || []).map(r => [r.campaign_id, r]));
  M.senders = n.data || [];
  M.counts = Object.fromEntries((k.data || []).map(r => [r.label_id, r.people]));
  S.loaded.bulk = true;
}

async function bulkRefresh(){
  const M = S.mrw, id = M.open;
  await loadBulk();
  if(id && id !== 'new') await bulkOpen(id, true);
  render();
}

async function bulkOpen(id, keepForm){
  const M = S.mrw, c = M.list.find(x => x.id === id);
  if(!c) return;
  M.open = id; M.confirm = false;
  if(!keepForm){ M.err = ''; M.note = ''; M.preview = null; }
  M.form = { name:c.name, sender:c.sender, include:[...(c.include_labels || [])], exclude:[...(c.exclude_labels || [])],
    match_all:!!c.match_all, cooldown:String(c.cooldown_days), skip_deals:!!c.skip_open_deals, cap:String(c.daily_cap),
    brief:c.brief || '', subject:c.subject || '', body:c.body || '', options:Array.isArray(c.options) ? c.options : [] };
  M.recips = []; M.replies = [];
  if(c.status !== 'draft'){
    const [r, q] = await Promise.all([
      sb.from('bulk_recipients').select('email,status,error,sent_at,bounced_at,unsubscribed_at')
        .eq('campaign_id', id).not('sent_at', 'is', null).order('sent_at', { ascending:false }).limit(50),
      sb.from('bulk_recipients').select('email,replied_at,reply_preview,unsubscribed_at')
        .eq('campaign_id', id).not('replied_at', 'is', null).order('replied_at', { ascending:false }).limit(50)
    ]);
    M.recips = r.data || []; M.replies = q.data || [];
  }
}

function bulkNew(){
  const M = S.mrw;
  M.open = 'new'; M.err = ''; M.note = ''; M.preview = null; M.confirm = false; M.recips = []; M.replies = [];
  M.form = { name:'', sender:S.me === 'pat' ? 'pat' : 'liam', include:[], exclude:[], match_all:false, cooldown:'90',
    skip_deals:true, cap:'100', brief:'', subject:'', body:'', options:[] };
}

/* Saves the draft and returns its id. Counting, writing and testing all
   read the saved campaign, so each of them saves first. */
async function bulkSave(quiet){
  const M = S.mrw, f = M.form;
  const cap = parseInt(f.cap, 10), cool = parseInt(f.cooldown, 10);
  if(!f.name.trim()){ M.err = 'Give the campaign a name.'; return null; }
  if(!(cap >= 10 && cap <= 1500)){ M.err = 'The daily limit has to be between 10 and 1,500.'; return null; }
  if(!(cool >= 14 && cool <= 365)){ M.err = 'The rest period has to be between 14 and 365 days.'; return null; }
  const row = { name:f.name.trim(), sender:f.sender, include_labels:f.include, exclude_labels:f.exclude,
    match_all:f.match_all, cooldown_days:cool, skip_open_deals:f.skip_deals, daily_cap:cap,
    brief:f.brief, subject:f.subject.trim(), body:f.body.replace(/\r/g, '').trim(), updated_at:new Date().toISOString() };
  const res = M.open === 'new'
    ? await sb.from('bulk_campaigns').insert(row).select().single()
    : await sb.from('bulk_campaigns').update(row).eq('id', M.open).eq('status', 'draft').select().single();
  if(res.error){ M.err = 'Could not save. ' + (res.error.message || ''); return null; }
  const i = M.list.findIndex(c => c.id === res.data.id);
  if(i >= 0) M.list[i] = res.data; else M.list.unshift(res.data);
  M.open = res.data.id;
  if(!quiet) M.note = 'Saved.';
  return res.data.id;
}

async function bulkRun(label, fn){
  const M = S.mrw;
  if(M.busy) return;
  M.busy = label; M.err = ''; M.note = ''; render();
  try{ await fn(); }catch(e){ M.err = e.message || String(e); }
  M.busy = ''; render();
}

const bulkCount = () => bulkRun('count', async () => {
  const M = S.mrw;
  if(!M.form.include.length) throw new Error('Pick at least one label first.');
  const id = await bulkSave(true); if(!id) return;
  const { data, error } = await sb.rpc('bulk_preview', { p_campaign:id });
  if(error) throw new Error('Could not count the list. ' + error.message);
  M.preview = data;
});

async function bulkCall(action){
  const r = await fetch(MRW_URL, { method:'POST', headers:await authHeaders(),
    body:JSON.stringify({ action, campaign_id:S.mrw.open }) });
  let j = null; try{ j = await r.json(); }catch(e){}
  if(!r.ok || !j || !j.ok) throw new Error((j && j.error) || `Mr. Workflow did not answer (${r.status}).`);
  return j;
}

const bulkWrite = () => bulkRun('write', async () => {
  const M = S.mrw;
  if(!M.form.include.length) throw new Error('Pick at least one label first, so the writer knows who it is for.');
  if(!await bulkSave(true)) return;
  const j = await bulkCall('write');
  M.form.options = j.options || [];
  const c = M.list.find(x => x.id === M.open); if(c) c.options = M.form.options;
});

const bulkTest = () => bulkRun('test', async () => {
  const M = S.mrw;
  if(!M.form.subject.trim() || !M.form.body.trim()) throw new Error('Write the subject and the email first.');
  if(!await bulkSave(true)) return;
  const j = await bulkCall('test');
  M.note = `Test sent to ${j.sent_to}. It is filled in for one person on the list and the subject starts with [Test].`;
});

const bulkStart = () => bulkRun('start', async () => {
  const M = S.mrw;
  if(!await bulkSave(true)) return;
  const { data, error } = await sb.rpc('bulk_start', { p_campaign:M.open });
  if(error) throw new Error('Could not start. ' + error.message);
  M.confirm = false;
  M.note = data && data.resumed ? 'Sending again.' : `Started. ${num(data && data.total)} people are queued${data && data.to_verify ? `, ${num(data.to_verify)} of them waiting on an Evaboot check` : ''}${data && data.left_out ? `; ${num(data.left_out)} left out for an unchecked or risky address` : ''}. The first emails go out within 5 minutes on a weekday between 7am and 5pm.`;
  await loadBulk(); await bulkOpen(M.open, true);
});

const bulkSetStatus = (status, msg) => bulkRun(status, async () => {
  const M = S.mrw;
  const patch = { status, updated_at:new Date().toISOString() };
  if(status === 'cancelled') patch.finished_at = patch.updated_at;
  if(status === 'paused') patch.paused_reason = 'Paused from the dashboard.';
  const { error } = await sb.from('bulk_campaigns').update(patch).eq('id', M.open);
  if(error) throw new Error('Could not change the campaign. ' + error.message);
  M.note = msg;
  await loadBulk(); await bulkOpen(M.open, true);
});

async function bulkDelete(){
  const M = S.mrw;
  if(M.open === 'new'){ M.open = null; M.form = null; return render(); }
  if(!confirm('Delete this draft campaign?')) return;
  const { error } = await sb.from('bulk_campaigns').delete().eq('id', M.open).eq('status', 'draft');
  if(error){ M.err = 'Could not delete. ' + error.message; return render(); }
  M.list = M.list.filter(c => c.id !== M.open);
  M.open = null; M.form = null; M.note = '';
  render();
}

/* The same fill the n8n sender does, so the preview reads like the real
   email: reversed names fixed, shouting names calmed, blanks defaulted. */
function bulkFill(text, p){
  p = p || {};
  const clean = s => String(s == null ? '' : s).trim();
  const first = clean(p.first_name), last = clean(p.last_name);
  const local = (clean(p.email).toLowerCase().split('@')[0] || '').replace(/[^a-z]/g, '');
  let given = first;
  if(first.length >= 3 && last && local && local === first.toLowerCase() + last.charAt(0).toLowerCase()) given = last;
  if(!given) given = clean(p.name).split(' ')[0] || '';
  if(last && !given.includes('&') && given.toLowerCase().endsWith(' ' + last.toLowerCase())) given = given.slice(0, -last.length).trim();
  given = given.replace(/\s+[A-Za-z]\.?$/, '');
  const tidy = s => (s && (s === s.toUpperCase() || s === s.toLowerCase()))
    ? s.toLowerCase().replace(/(^|[\s'-])([a-z])/g, (m, a, b) => a + b.toUpperCase()) : s;
  const vals = { first_name:tidy(given) || 'there', last_name:tidy(last), company:clean(p.company) || 'your team',
                 title:clean(p.title), city:clean(p.city) || 'your area' };
  return String(text || '').replace(/\{\s*(first_name|last_name|company|title|city)\s*\}/gi, (m, k) => vals[k.toLowerCase()]);
}

const bulkStatusChip = st => `<span class="chip ${st === 'sending' ? 'good' : st === 'paused' ? 'hot' : st === 'cancelled' ? 'bad' : ''}">${esc(MRW_STATUS[st] || st)}</span>`;

/* About ten working hours of runs, twelve people a run. */
const bulkDays = (n, cap) => Math.max(1, Math.ceil(n / Math.min(cap, 1440)));

function wireBulk(){
  if(S.page !== 'bulk') return;
  const M = S.mrw, on = (id, fn) => { const el = document.getElementById(id); if(el) el.addEventListener('click', fn); };
  on('mrwNew', () => { bulkNew(); render(); });
  document.querySelectorAll('[data-mrw-open]').forEach(el =>
    el.addEventListener('click', async () => { await bulkOpen(el.dataset.mrwOpen); render(); }));
  on('mrwBack', () => { M.open = null; M.form = null; M.err = ''; M.note = ''; M.confirm = false; render(); });
  on('mrwReload', () => bulkRun('reload', bulkRefresh));
  on('mrwPause', () => bulkSetStatus('paused', 'Paused. Nobody else gets it until you press Resume.'));
  on('mrwResume', () => bulkRun('start', async () => {
    const { error } = await sb.rpc('bulk_start', { p_campaign:M.open });
    if(error) throw new Error('Could not resume. ' + error.message);
    M.note = 'Sending again.'; await loadBulk(); await bulkOpen(M.open, true);
  }));
  on('mrwCancel', () => { if(confirm('Stop this campaign for good? Anyone not yet emailed will not get it.'))
    bulkSetStatus('cancelled', 'Cancelled. Nobody else gets it.'); });
  if(!M.form) return;
  const f = M.form;
  [['mrwName','name'],['mrwBrief','brief'],['mrwSubject','subject'],['mrwBody','body'],['mrwCap','cap']].forEach(([id, key]) => {
    const el = document.getElementById(id);
    if(el) el.addEventListener('input', () => { f[key] = el.value; });
  });
  /* The preview and the button states follow the subject and the email,
     so those redraw once the typing stops rather than on every key. */
  ['mrwSubject','mrwBody'].forEach(id => { const el = document.getElementById(id);
    if(el) el.addEventListener('change', () => render()); });
  const sel = (id, fn) => { const el = document.getElementById(id); if(el) el.addEventListener('change', () => { fn(el); M.preview = id === 'mrwSender' ? M.preview : null; render(); }); };
  sel('mrwSender', el => { f.sender = el.value; });
  sel('mrwMatch', el => { f.match_all = el.value === 'all'; });
  sel('mrwCool', el => { f.cooldown = el.value; });
  sel('mrwDeals', el => { f.skip_deals = el.checked; });
  document.querySelectorAll('[data-mrw-label]').forEach(el => el.addEventListener('click', () => {
    const id = Number(el.dataset.mrwLabel);
    if(f.include.includes(id)){ f.include = f.include.filter(x => x !== id); f.exclude.push(id); }
    else if(f.exclude.includes(id)) f.exclude = f.exclude.filter(x => x !== id);
    else f.include.push(id);
    M.preview = null; render();
  }));
  on('mrwEmpty', () => { M.showEmpty = !M.showEmpty; render(); });
  document.querySelectorAll('[data-mrw-use]').forEach(el => el.addEventListener('click', () => {
    const o = f.options[Number(el.dataset.mrwUse)]; if(!o) return;
    if((f.subject || f.body) && !confirm('Replace the subject and email you have now?')) return;
    f.subject = o.subject; f.body = o.body; render();
  }));
  on('mrwCount', bulkCount);
  on('mrwWrite', bulkWrite);
  on('mrwTest', bulkTest);
  on('mrwSave', () => bulkRun('save', bulkSave));
  on('mrwGo', async () => { if(!M.preview) await bulkCount(); if(!M.err){ M.confirm = true; render(); } });
  on('mrwNo', () => { M.confirm = false; M.err = ''; render(); });
  on('mrwYes', bulkStart);
  on('mrwDel', bulkDelete);
}

/* ================= photo approvals ================= */
/* Liam uploads one job's photos, sends the PM or superintendent a link,
   and they mark each photo Approve or Not approved, with a reason for a
   no (photos.html). Nobody on the job signs in: the link's token is the
   only key, and the database functions behind it see only that batch
   (sql/photo_review.sql).

   Approved photos are copied by the laptop task to
   M:\Photos\<folder>, the same tree the Social tab's
   generate step picks photos from. The cloud cannot reach the M: drive,
   so this tab only shows how far that copy has got. */
const PHO_ROOT = 'M:\\Photos\\';
const PHO_MAX_MB = 50;
const PHO_TYPES = ['image/jpeg', 'image/png', 'image/webp'];

S.pho = { batches:[], items:[], open:null, form:null, busy:false, prog:0, err:'', note:'', loadErr:'' };

/* Windows will not take these in a folder name. */
const phoFolder = s => String(s || '').replace(/[<>:"/\\|?*\u0000-\u001f]/g, ' ')
  .replace(/\s+/g, ' ').trim().replace(/[. ]+$/, '').slice(0, 120);
const phoLink = b => new URL('photos.html?t=' + encodeURIComponent(b.token), location.href).href;
const phoImg = p => `${SUPABASE_URL}/storage/v1/object/public/photo-review/${p.split('/').map(encodeURIComponent).join('/')}`;
const phoItems = id => S.pho.items.filter(i => i.batch_id === id);

function phoState(b){
  const its = phoItems(b.id);
  const ok = its.filter(i => i.decision === 'approved');
  const copied = ok.filter(i => i.copied_at).length;
  const failed = ok.filter(i => !i.copied_at && i.copy_error).length;
  if(b.status === 'open') return b.opened_at
    ? { cls:'', label:'Opened ' + shortDate(b.opened_at) + ', not sent back' }
    : { cls:'', label:'Waiting on ' + (b.reviewer_name || 'the reviewer').split(' ')[0] };
  if(!ok.length) return { cls:'bad', label:'None approved' };
  if(failed) return { cls:'bad', label:`${failed} could not be copied` };
  if(copied < ok.length) return { cls:'hot', label:`${ok.length - copied} waiting for the M: copy` };
  return { cls:'good', label:'On the M: drive' };
}

async function loadPhotos(){
  const P = S.pho;
  const [b, i] = await Promise.all([
    sb.from('photo_batches').select('*').order('created_at', { ascending:false }).limit(200),
    sb.from('photo_batch_items').select('id,batch_id,file_path,file_name,sort,decision,reason,decided_at,copied_at,copied_to,copy_error')
      .order('sort').limit(5000)
  ]);
  const e = b.error || i.error;
  if(e){
    const m = e.message || String(e);
    P.loadErr = /does not exist|schema cache|PGRST205|42P01/i.test(m + ' ' + (e.code || ''))
      ? 'The photo tables have not been created yet. Run sql/photo_review.sql in the Supabase SQL editor, then reload.'
      : 'Could not load the photo batches. ' + m;
  }else{
    P.loadErr = '';
    P.batches = b.data || [];

async function phoCreate(){
  const P = S.pho, f = P.form;
  const folder = phoFolder(f.folder || f.job_name);
  P.err = '';
  if(!f.job_name.trim()) P.err = 'Add the job name.';
  else if(!f.files.length) P.err = 'Choose at least one photo.';
  else if(!folder) P.err = 'The folder name is empty once the characters Windows refuses are taken out.';
  else if(f.reviewer_email.trim() && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.reviewer_email.trim())) P.err = 'That email does not look right.';
  if(P.err) return render();
  P.busy = true; P.prog = 0; render();
  const ins = await sb.from('photo_batches').insert({
    brand:f.brand, job_name:f.job_name.trim(), job_address:f.job_address.trim(),
    reviewer_name:f.reviewer_name.trim(), reviewer_email:f.reviewer_email.trim().toLowerCase(),
    message:f.message.trim(), folder }).select().single();
  if(ins.error){ P.busy = false; P.err = 'Could not start the batch. ' + (ins.error.message || ''); return render(); }
  const b = ins.data, rows = [], failed = [];
  for(let k = 0; k < f.files.length; k++){
    const file = f.files[k];
    const safe = file.name.replace(/[^A-Za-z0-9._-]/g, '_');
    const path = `${b.id}/${String(k + 1).padStart(3, '0')}-${safe}`;
    const up = await sb.storage.from('photo-review').upload(path, file, { contentType:file.type });
    if(up.error) failed.push(file.name);
    else rows.push({ batch_id:b.id, file_path:path, file_name:file.name, file_type:file.type || '', sort:k });
    P.prog = Math.round(100 * (k + 1) / f.files.length); render();
  }
  const its = rows.length ? await sb.from('photo_batch_items').insert(rows).select() : { data:[] };
  P.busy = false;
  if(its.error){ P.err = 'The photos uploaded but could not be listed. ' + (its.error.message || ''); return render(); }
  f.urls.forEach(u => URL.revokeObjectURL(u));
  P.batches.unshift(b);
  P.items.push(...(its.data || []));
  P.form = null; P.open = b.id;
  P.note = failed.length ? `${rows.length} uploaded. These did not: ${failed.join(', ')}.`
                         : `${rows.length} photo${rows.length === 1 ? '' : 's'} uploaded. Copy the link and send it to ${b.reviewer_name || 'the PM or super'}.`;
  render(); window.scrollTo(0, 0);
}

async function phoUpdate(b, patch, note){
  const P = S.pho;
  const { error } = await sb.from('photo_batches').update(patch).eq('id', b.id);
  if(error){ P.err = 'Could not save. ' + (error.message || ''); return render(); }
  Object.assign(b, patch); P.err = ''; P.note = note; render();
}

async function phoDelete(b){
  const P = S.pho, its = phoItems(b.id);
  if(!confirm(`Delete the ${b.job_name} batch and its ${its.length} photos? The link stops working. Photos already copied to the M: drive stay there.`)) return;
  if(its.length) await sb.storage.from('photo-review').remove(its.map(i => i.file_path));
  const { error } = await sb.from('photo_batches').delete().eq('id', b.id);
  if(error){ P.err = 'Could not delete. ' + (error.message || ''); return render(); }
  P.batches = P.batches.filter(x => x.id !== b.id);
  P.items = P.items.filter(i => i.batch_id !== b.id);
  P.open = null; P.note = 'Batch deleted.'; render();
}

function wirePhotos(){
  if(S.page !== 'photos') return;
  const P = S.pho;
  const on = (id, fn, ev = 'click') => { const el = document.getElementById(id); if(el) el.addEventListener(ev, fn); };
  on('phoNew', () => {
    P.err = ''; P.note = '';
    P.form = { brand:SOC_BRAND, job_name:'', job_address:'', reviewer_name:'', reviewer_email:'',
               message:'', folder:'', files:[], urls:[] };
    render();
  });
  document.querySelectorAll('[data-pho-open]').forEach(el =>
    el.addEventListener('click', () => { P.open = el.dataset.phoOpen; P.note = ''; P.err = ''; render(); window.scrollTo(0, 0); }));
  on('phoBack', async () => { P.open = null; P.note = ''; P.err = ''; await loadPhotos(); render(); });

  const b = P.open && P.batches.find(x => x.id === P.open);
  if(b){
    on('phoCopy', async () => {
      const el = document.getElementById('phoLink');
      try{ await navigator.clipboard.writeText(el.value); }
      catch(e){ el.select(); document.execCommand('copy'); }
      const btn = document.getElementById('phoCopy');
      if(btn){ btn.textContent = 'Copied'; setTimeout(() => { btn.textContent = 'Copy link'; }, 1600); }
    });
    on('phoFolderSave', () => {
      const v = phoFolder(document.getElementById('phoFolder').value);
      if(!v){ P.err = 'The folder name cannot be empty.'; return render(); }
      phoUpdate(b, { folder:v }, 'Folder saved. Photos not yet copied will go to ' + PHO_ROOT + v + '.');
    });
    on('phoReopen', () => {
      if(confirm(`Open this batch again so ${b.reviewed_by || 'they'} can change their picks? Photos already copied to the M: drive stay there.`))
        phoUpdate(b, { status:'open', submitted_at:null }, 'The link is open again. Their earlier picks are kept.');
    });
    on('phoDelete', () => phoDelete(b));
  }

  if(P.form){
    const f = P.form;
    [['phoJob','job_name'],['phoAddr','job_address'],['phoWho','reviewer_name'],['phoMail','reviewer_email'],
     ['phoMsg','message'],['phoDir','folder']].forEach(([id, key]) => on(id, e => {
      f[key] = e.target.value;
      if(key === 'job_name' || key === 'folder'){
        const s = document.getElementById('phoDirShow');
        if(s) s.textContent = PHO_ROOT + (phoFolder(f.folder || f.job_name) || '…');
      }
    }, 'input'));
    on('phoBrand', e => { f.brand = e.target.value; }, 'change');
    const fi = document.getElementById('phoFiles');
    on('phoPick', () => fi.click());
    if(fi) fi.addEventListener('change', () => {
      const bad = [];
      for(const x of Array.from(fi.files || [])){
        if(!PHO_TYPES.includes(x.type)){ bad.push(x.name + ' is not a JPG or PNG'); continue; }
        if(x.size > PHO_MAX_MB * 1048576){ bad.push(x.name + ' is over ' + PHO_MAX_MB + ' MB'); continue; }
        f.files.push(x); f.urls.push(URL.createObjectURL(x));
      }
      P.err = bad.length ? 'Left out: ' + bad.join('; ') + '.' : '';
      fi.value = ''; render();
    });
    on('phoClear', () => { f.urls.forEach(u => URL.revokeObjectURL(u)); f.files = []; f.urls = []; render(); });
    on('phoClose', () => { if(P.busy) return; f.urls.forEach(u => URL.revokeObjectURL(u)); P.form = null; P.err = ''; render(); });
    on('phoGo', phoCreate);
  }
}

/* ================= executive voices ================= */
/* Liam asks Ryan, Hugo, the supers and the rest a question for a blog
   post. Each person gets their own link (voices.html), which Liam texts
   from his phone with the Text it button, and they record a voice note or
   type. The answer comes back here transcribed, with a pull quote and
   drafts (n8n "Haggerty Executive Voices"). One question can go to
   several people; Write the blog post weaves every usable answer into one
   post for WordPress and LinkedIn. Anything quoting someone marked Needs
   their OK (Ryan) goes to them by link before it can be marked published.
   Tables, bucket and link functions: sql/executive_voices.sql. */
const EXV_URL = 'https://haggertybuilds.app.n8n.cloud/webhook/haggerty-voices';
/* Days after the text before the ask shows as overdue with a reminder. */
const EXV_NUDGE_DAYS = 4;
/* Twilio call-in line (n8n "Haggerty Voices Call-In"): they call, hear their
   question, and talk. Blank until the number exists; the texts mention it
   once it is set, e.g. '(209) 555-0100'. */
const EXV_CALL_NUMBER = '';
/* Texts sent by the dashboard through Twilio (same n8n workflow). Off until
   the Twilio number is registered; until then Text it opens your phone. */
const EXV_TEXT_ON = false;
const EXV_TEXT_URL = 'https://haggertybuilds.app.n8n.cloud/webhook/haggerty-voices-text';
/* Until then Send emails them from Liam's Outlook (n8n "Haggerty Voices Email"). */
const EXV_EMAIL_URL = 'https://haggertybuilds.app.n8n.cloud/webhook/haggerty-voices-email';
const exvCanSend = p => !!(p && (EXV_TEXT_ON ? p.phone : p.email));
const exvCallLine = () => EXV_CALL_NUMBER ? ` Or just call ${EXV_CALL_NUMBER} and talk your answer.` : '';

S.exv = { brand:'haggerty', view:'asks', open:null, people:[], prompts:[], asks:[], reqs:[], answers:[], pieces:[],
          audio:{}, form:null, busy:'', err:'', note:'', loadErr:'', show:{}, draftTab:{}, timer:null };

const exvLink = token => new URL('voices.html?t=' + encodeURIComponent(token), location.href).href;
const exvOkLink = token => new URL('voices.html?ok=' + encodeURIComponent(token), location.href).href;
const exvFirst = p => String((p && p.name) || '').trim().split(' ')[0];
const exvPerson = id => S.exv.people.find(p => p.id === id);
const exvReqs = askId => S.exv.reqs.filter(r => r.ask_id === askId)
  .sort((a, b) => ((exvPerson(a.person_id) || {}).sort || 0) - ((exvPerson(b.person_id) || {}).sort || 0));
const exvAnswersFor = reqId => S.exv.answers.filter(a => a.request_id === reqId);
const exvAskAnswers = askId => exvReqs(askId).flatMap(r => exvAnswersFor(r.id));
const exvPieces = askId => S.exv.pieces.filter(p => p.ask_id === askId);
const exvDays = iso => iso ? (Date.now() - new Date(iso).getTime()) / 86400000 : 0;
/* Messages app with the text filled in. The ?& form is the one both
   iPhones and Android phones read. */
const exvSms = (phone, body) => 'sms:' + String(phone || '').replace(/[^\d+]/g, '') + '?&body=' + encodeURIComponent(body);

function exvAskText(p, r){
  return `Hey ${exvFirst(p) || 'there'}, it's Liam. Could you please answer this question for a blog that I'm putting together? ${exvLink(r.token)}${exvCallLine()}`;
}
function exvNudgeText(p, r){
  return `Hey ${exvFirst(p) || 'there'}, just a nudge on the blog question when you get a couple of minutes. You can talk your answer into your phone. ${exvLink(r.token)}${exvCallLine()}`;
}

/* Where one person's link stands. */
function exvReqState(r){
  const n = exvAnswersFor(r.id).length;
  if(n) return { cls:'good', label:n > 1 ? `${n} answers` : 'Answered' };
  if(!r.sent_at) return { cls:'', label:'Not sent yet' };
  const late = exvDays(r.reminded_at || r.sent_at) >= EXV_NUDGE_DAYS;
  if(r.opened_at) return { cls:late ? 'hot' : '', label:'Opened ' + shortDate(r.opened_at) };
  return { cls:late ? 'hot' : '', label:(r.reminded_at ? 'Nudged ' + shortDate(r.reminded_at) : 'Sent ' + shortDate(r.sent_at)) };
}

/* The ask's headline status, for the list. */
function exvAskState(k){
  const ps = exvPieces(k.id), blog = ps.find(p => p.kind === 'blog');
  if(blog){
    if(blog.status === 'published') return { cls:'good', label:'Published' };
    if(blog.status === 'needs_ok') return { cls:'hot', label:`Waiting on ${exvFirst(exvPerson(blog.approver_id)) || 'an OK'}` };
    if(blog.status === 'changes') return { cls:'bad', label:'Changes asked' };
    if(blog.status === 'approved') return { cls:'good', label:'Approved, not posted' };
    return { cls:'', label:'Blog draft' };
  }
  const rs = exvReqs(k.id);
  const answered = rs.filter(r => exvAnswersFor(r.id).length).length;
  if(!rs.length) return { cls:'', label:'Nobody asked' };
  if(!rs.some(r => r.sent_at)) return { cls:'hot', label:'Not sent yet' };
  return { cls:answered ? 'good' : '', label:`${answered} of ${rs.length} answered` };
}

async function loadVoices(){
  const E = S.exv;
  const [pe, pr, ak, rq, an, pc] = await Promise.all([
    sb.from('exv_people').select('*').order('sort').order('name'),
    sb.from('exv_prompts').select('*').order('created_at'),
    sb.from('exv_asks').select('*').order('created_at', { ascending:false }).limit(300),
    sb.from('exv_requests').select('*').limit(3000),
    sb.from('exv_answers').select('*').order('created_at').limit(3000),
    sb.from('exv_pieces').select('*').order('created_at').limit(1000)
  ]);
  const e = pe.error || pr.error || ak.error || rq.error || an.error || pc.error;
  if(e){
    const m = e.message || String(e);
    E.loadErr = /does not exist|schema cache|PGRST205|42P01/i.test(m + ' ' + (e.code || ''))
      ? 'The Executive Voices tables have not been created yet. Run sql/executive_voices.sql in the Supabase SQL editor, then reload.'
      : 'Could not load Executive Voices. ' + m;
  }else{
    E.loadErr = '';
    E.people = pe.data || []; E.prompts = pr.data || []; E.asks = ak.data || [];
    E.reqs = rq.data || []; E.answers = an.data || []; E.pieces = pc.data || [];
  }
  S.loaded.voices = true;
}

/* Recordings are private; the player gets a link good for an hour. */
async function exvLoadAudio(askId){
  const E = S.exv;
  const paths = [];
  exvAskAnswers(askId).forEach(a => {
    [a.audio_path, a.photo_path].forEach(p => { if(p && !E.audio[p]) paths.push(p); });
  });
  if(!paths.length) return;
  const { data } = await sb.storage.from('voices').createSignedUrls(paths, 3600);
  (data || []).forEach(x => { if(x && x.signedUrl && x.path) E.audio[x.path] = x.signedUrl; });
}

/* While an answer is being transcribed, check back every 15 seconds. */
function exvPoll(){
  const E = S.exv;
  clearTimeout(E.timer);
  if(S.page !== 'voices' || !E.open) return;
  if(!exvAskAnswers(E.open).some(a => a.status === 'new' || a.status === 'processing')) return;
  E.timer = setTimeout(async () => {
    if(S.page !== 'voices' || document.querySelector('.exv-edit:focus')) return exvPoll();
    await loadVoices(); await exvLoadAudio(E.open); render();
  }, 15000);
}

function pageVoices(){
  const E = S.exv;
  if(!S.loaded.voices) return loading();
  if(E.loadErr) return `<main class="page"><div class="empty"><h2>Executive Voices is not set up yet</h2>
    <p>${esc(E.loadErr)}</p></div></main>`;
  const k = E.view === 'ask' && E.open && E.asks.find(x => x.id === E.open);
  const body = k ? exvDetail(k) : E.view === 'people' ? exvPeopleView() : E.view === 'bank' ? exvBankView() : exvList();

/* The post as WordPress takes it when pasted into the block editor:
   paragraphs, ## headings and > quotes. */
function exvWpHtml(pc){
  const e = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  return String(pc.body || '').replace(/\r/g, '').split(/\n\s*\n/).map(x => x.trim()).filter(Boolean).map(x => {
    if(/^#{1,3}\s/.test(x)) return `<h2>${e(x.replace(/^#+\s*/, ''))}</h2>`;
    if(x.startsWith('>')){
      const lines = x.split('\n').map(l => l.replace(/^>\s?/, '').trim()).filter(Boolean);
      const cite = lines.length > 1 && /^\(.*\)$/.test(lines[lines.length - 1]) ? lines.pop().slice(1, -1) : '';
      return `<blockquote><p>${lines.map(e).join('<br>')}</p>${cite ? `<cite>${e(cite)}</cite>` : ''}</blockquote>`;
    }
    return `<p>${e(x).replace(/\n/g, '<br>')}</p>`;
  }).join('\n');
}

async function exvCopy(text, html, btn){
  try{
    if(html && window.ClipboardItem){
      await navigator.clipboard.write([new ClipboardItem({
        'text/html':new Blob([html], { type:'text/html' }), 'text/plain':new Blob([text], { type:'text/plain' }) })]);
    }else await navigator.clipboard.writeText(text);
    if(btn){ const t = btn.textContent; btn.textContent = 'Copied'; setTimeout(() => { btn.textContent = t; }, 1600); }
  }catch(e){ S.exv.err = 'Copy did not work in this browser. Select the text and copy it instead.'; render(); }
}

async function exvCall(body){
  const r = await fetch(EXV_URL, { method:'POST', headers:await authHeaders(), body:JSON.stringify(body) });
  let j = null;
  try{ j = await r.json(); }catch(e){}
  if(!r.ok || !j || !j.ok) throw new Error((j && j.error) || ('The workflow answered ' + r.status + '.'));
  return j;
}

            ${on ? `<input type="text" data-exv-fangle="${esc(p.id)}" value="${esc(f.who[p.id])}" placeholder="Angle for ${esc(exvFirst(p))} (optional), e.g. from the field side" />` : ''}
