function wireEvents(){
  document.querySelectorAll('[data-evsend]').forEach(el=>
    el.addEventListener('click',()=>openEvSend(el.dataset.evsend)));
  document.querySelectorAll('[data-evopen]').forEach(el=>
    el.addEventListener('click',()=>{
      const id = el.dataset.evopen; S.evOpen[id] = !S.evOpen[id]; render();
    }));
  const add = document.getElementById('evAdd');
  if(add) add.addEventListener('click', openEvNew);

  /* compose sheet */
  const a = S.evSend;
  if(a){
    const cl = document.getElementById('evClose');
    if(cl) cl.addEventListener('click',()=>{ S.evSend = null; render(); });
    const fr = document.getElementById('evFrom');
    if(fr) fr.addEventListener('change',()=>{
      a.sender = fr.value;
      /* The sign-off follows the sender for as long as the message is
         still the starting draft. Once it has been edited it is left alone. */
      if(!a.touched){
        const v = (S.invites||[]).find(x => x.id === a.inviteId);
        if(v){
          a.message = evDraft(v, a.sender);
          const box = document.getElementById('evMsg');
          if(box) box.value = a.message;
        }
      }
      /* The sender is the organiser, so they cannot also be a guest. */
      a.people = a.people.filter(p => p.email !== EV_SENDERS[a.sender].email);
      evPaint();
    });
    const q = document.getElementById('evQ');
    if(q){
      q.addEventListener('input',()=>{ a.q = q.value; evSearch(); });
      q.addEventListener('keydown',e=>{ if(e.key === 'Enter'){ e.preventDefault(); evAddTyped(); } });
      q.addEventListener('paste',()=> setTimeout(()=>{
        a.q = q.value;
        if(/[,;]|\S@\S+\s+\S+@/.test(a.q)) evAddTyped(); else evSearch();
      }, 0));
    }
    const sj = document.getElementById('evSubj');
    if(sj) sj.addEventListener('input',()=>{ a.subject = sj.value; });
    const mg = document.getElementById('evMsg');
    if(mg) mg.addEventListener('input',()=>{ a.message = mg.value; a.touched = true; });
    const hd = document.getElementById('evHide');
    if(hd) hd.addEventListener('change',()=>{ a.hide = hd.checked; });
    const go = document.getElementById('evGo');
    if(go) go.addEventListener('click', sendEvInvite);
    evPaint();
  }

  /* add-an-event sheet */
  const n = S.evNew;
  if(n){
    const cl = document.getElementById('enClose');
    if(cl) cl.addEventListener('click',()=>{ S.evNew = null; render(); });
    [['enName','name'],['enOrg','org'],['enDate','date'],['enTime','time'],['enLoc','location']].forEach(([id,key])=>{
      const el = document.getElementById(id);
      if(el) el.addEventListener('input',()=>{ n[key] = el.value; });
    });
    const ad = document.getElementById('enAllDay');
    if(ad) ad.addEventListener('change',()=>{ n.allDay = ad.checked; render(); });
    const hr = document.getElementById('enHours');
    if(hr) hr.addEventListener('change',()=>{ n.hours = hr.value; });
    const sv = document.getElementById('enSave');
    if(sv) sv.addEventListener('click', saveEvNew);
  }
}

/* ================= approvals ================= */
/* Each resubmission is a new row pointing at the one it replaces, rather
   than an edit in place. Pat needs to see what he asked for sitting next
   to what he is now looking at, or every round is a fresh review. It also
   means his feedback reaches the next version in his own words instead of
   being summarised by the person acting on it. */

/* ================= inbound requests ================= */
/* Anyone in either company can submit through the public form. These
   land here rather than in their own tab: it is a list that gets checked
   alongside the day's work, not a place to visit. */

async function loadRequests(){
  const [{ data:rows, error }, { data:files }] = await Promise.all([
    sb.from('requests').select('*').order('created_at', { ascending:false }).limit(200),
    sb.from('request_files').select('*')
  ]);
  if(error) throw error;
  S.requests = rows || [];

  S.reqFiles = {};
  for(const f of (files||[])) (S.reqFiles[f.request_id] ||= []).push(f);

  /* Files are signed when a card is opened (signedUrl), not all at once. */
  S.loaded.requests = true;
}

/* Their own date if they gave one, otherwise the Friday of the week the
   request was planned into. Without the fallback everything with no date
   would read as equally urgent, which is the same as no ordering at all. */
function reqDue(r){
  if(r.needed_by) return new Date(r.needed_by + 'T12:00:00');
  if(r.target_week){
    const d = new Date(r.target_week + 'T12:00:00');
    d.setDate(d.getDate() + 4);
    return d;
  }
  return null;
}

function reqDaysLeft(r){
  const due = reqDue(r);
  if(!due) return null;
  const t0 = new Date(); t0.setHours(12,0,0,0);
  return Math.round((due - t0) / 86400000);
}

function reqOpenList(){
  return (S.requests||[]).filter(r => r.status !== 'done' && r.status !== 'dropped')
    .sort((a,b)=>{
      const da = reqDaysLeft(a), db = reqDaysLeft(b);
      if(da === null) return 1;
      if(db === null) return -1;
      return da - db;
    });
}

async function setRequestStatus(id, status){
  if(S.reqBusy) return;
  S.reqBusy = id; S.reqErr = ''; render();
  try{
    const patch = { status };
    patch.completed_at = (status === 'done') ? new Date().toISOString() : null;
    const { error } = await sb.from('requests').update(patch).eq('id', id);
    if(error) throw error;
    S.loaded.requests = false;
    await loadRequests();
  }catch(err){ S.reqErr = err.message || String(err); }
  S.reqBusy = ''; render();
}

/* ---------- signed links ----------
   The storage buckets are private, so every file link is a signed URL
   that lasts an hour. They used to be made for every file the moment a
   tab loaded, and went dead after the hour. Now a link is made the first
   time something is drawn with it, in one batch per bucket, and a timer
   re-signs anything still on screen ten minutes before it expires. */
const SIGN_TTL = 3600, SIGN_EARLY = 10 * 60 * 1000;
const SIGNED = {}, SIGN_Q = {}, SIGN_FAIL = {};
let signTimer = null;
function signedUrl(bucket, path){
  if(!path) return null;
  const m = SIGNED[bucket] ||= new Map();
  const hit = m.get(path), now = Date.now();
  if((!hit || hit.exp - now < SIGN_EARLY) && !(SIGN_FAIL[bucket + '/' + path] > now)){
    (SIGN_Q[bucket] ||= new Set()).add(path);
    if(!signTimer) signTimer = setTimeout(flushSign, 0);
  }
  return hit && hit.exp > now ? hit.url : null;
}
async function flushSign(){
  signTimer = null;
  const jobs = Object.keys(SIGN_Q).map(b => [b, [...SIGN_Q[b]]]).filter(j => j[1].length);
  for(const b of Object.keys(SIGN_Q)) delete SIGN_Q[b];
  let got = false;
  await Promise.all(jobs.map(async ([bucket, paths]) => {
    const exp = Date.now() + SIGN_TTL * 1000;
    try{
      const { data, error } = await sb.storage.from(bucket).createSignedUrls(paths, SIGN_TTL);
      if(error) throw error;
      const ok = new Set();
      for(const u of (data || [])) if(u && u.path && u.signedUrl){ SIGNED[bucket].set(u.path, { url:u.signedUrl, exp }); ok.add(u.path); got = true; }
      for(const p of paths) if(!ok.has(p)) SIGN_FAIL[bucket + '/' + p] = Date.now() + 5 * 60 * 1000;
    }catch(e){
      /* The card falls back to the filename. Wait a minute before asking again. */
      for(const p of paths) SIGN_FAIL[bucket + '/' + p] = Date.now() + 60 * 1000;
    }
  }));
  if(got && app.querySelector('.shell')) render({ bg:true });
}
setInterval(() => {
  const now = Date.now();
  let due = false;
  for(const m of Object.values(SIGNED)) for(const [p, h] of m){
    if(h.exp <= now) m.delete(p);
    else if(h.exp - now < SIGN_EARLY) due = true;
  }
  /* Redrawing re-asks for every link still on screen; the rest lapse. */
  if(due && app.querySelector('.shell')) render({ bg:true });
}, 4 * 60 * 1000);

/* Everything still open, plus whatever was decided in the last
   APV_DAYS. Older decided items wait behind "Show older" (S.apvAll), so
   the tab does not read every approval ever made each time it opens.
   Files are signed only when a card that shows them is drawn
   (signedUrl), not all at once. */
const APV_DAYS = 120;
const APV_COLS = 'id,parent_id,version,title,kind,description,change_note,file_path,file_name,file_type,'
  + 'link_url,requested_by,due_by,status,feedback,decided_by,decided_at,created_at,quantity,unit_cost';
async function loadApprovals(){
  const cut = new Date(Date.now() - APV_DAYS * 864e5).toISOString();
  let q = sb.from('approvals').select(APV_COLS).order('created_at', { ascending:false });
  if(!S.apvAll) q = q.or(`status.in.(pending,changes),created_at.gte.${cut}`).limit(400);
  const [r, older] = await Promise.all([q, S.apvAll ? null
    : sb.from('approvals').select('id', { count:'exact', head:true })
        .lt('created_at', cut).not('status', 'in', '(pending,changes)')]);
  if(r.error) throw r.error;
  S.approvals = r.data || [];
  S.apvOlderN = S.apvAll ? 0 : Number((older && older.count) || 0);
  S.loaded.approvals = true;
}

/* A row is current if nothing else claims it as a parent. Superseded
   versions stay in the table and surface inside the card rather than
   cluttering the list Pat has to work through. */
function apvCurrent(){
  const all = S.approvals || [];
  const parents = new Set(all.map(a => a.parent_id).filter(Boolean));
  return all.filter(a => !parents.has(a.id));
}

function apvChain(row){
  const byId = new Map((S.approvals||[]).map(a => [a.id, a]));
  const chain = [];
  let cur = row ? byId.get(row.parent_id) : null;
  let guard = 0;
  while(cur && guard++ < 40){ chain.push(cur); cur = byId.get(cur.parent_id); }
  return chain;   // newest previous version first
}

/* Nobody signs off their own request. The buttons are hidden on cards
   the signed-in person sent, and decideApproval refuses them too. */
function apvMine(a){
  return !!S.email && String(a.requested_by || '').trim().toLowerCase() === S.email;
}

function apvPendingCount(){
  return apvCurrent().filter(a => a.status === 'pending').length;
}

/* ---- quantity, cost per item, totals ----
   Only quantity and cost per item are stored. The item total and the
   page total are always worked out from them, so there is no total
   anyone can type over and no way for the two to disagree. */
const apvMoney = n => '$' + Number(n||0).toLocaleString('en-US',
  { minimumFractionDigits:2, maximumFractionDigits:2 });

/* What someone typed, as a number. Blank is null, "$1,250.50" is fine,
   anything else (or a negative) is NaN so the caller can refuse it. */
function apvNum(v){
  const s = String(v == null ? '' : v).replace(/[$,\s]/g, '');
  if(s === '') return null;
  const n = Number(s);
  return (isFinite(n) && n >= 0) ? n : NaN;
}

function apvQtyText(a){ return a.quantity == null ? '1' : String(Number(a.quantity)); }
function apvCostText(a){ return a.unit_cost == null ? '' : Number(a.unit_cost).toFixed(2); }

/* null until a cost has been entered, so an unpriced item reads as
   "not priced" rather than as free. */
function apvLine(a){
  if(a.unit_cost == null) return null;
  const q = a.quantity == null ? 1 : Number(a.quantity);
  return Math.round(q * Number(a.unit_cost) * 100) / 100;
}

function apvShown(){
  const cur = apvCurrent();
  if(S.apvFilter === 'all') return cur;
  const want = ['pending','changes','approved'].includes(S.apvFilter) ? S.apvFilter : 'pending';
  return cur.filter(a => a.status === want);
}

/* Declined items are left out: the total is money that is being asked
   for or has been agreed, and a declined item is neither. */
function apvTotals(rows){
  const live = rows.filter(a => a.status !== 'declined');
  let cents = 0, priced = 0;
  for(const a of live){
    const t = apvLine(a);
    if(t === null) continue;
    priced++; cents += Math.round(t * 100);
  }
  return { sum: cents / 100, priced, count: live.length, declined: rows.length - live.length };
}

function apvTotalHint(t){
  const bits = [];
  if(!t.count) bits.push('Nothing to add up in this list.');
  else if(t.priced === t.count) bits.push(`${t.count} item${t.count===1?'':'s'}.`);
  else bits.push(`${t.priced} of ${t.count} items have a cost. The rest are not counted yet.`);
  if(t.declined) bits.push(`${t.declined} declined left out.`);
  return bits.join(' ');
}

/* Repaints the two worked-out figures in place. A full render() here
   would rebuild the inputs and drop the cursor between quantity and
   cost, which is exactly when it is being used. */
function apvPaintTotals(id){
  const row = (S.approvals||[]).find(a => a.id === id);
  const cell = document.querySelector(`[data-apv-line="${id}"]`);
  if(row && cell){
    const t = apvLine(row);
    cell.textContent = t === null ? 'Not priced' : apvMoney(t);
  }
  const tot = apvTotals(apvShown());
  const sum = document.getElementById('apvTotal');
  if(sum) sum.textContent = apvMoney(tot.sum);
  const hint = document.getElementById('apvTotalHint');
  if(hint) hint.textContent = apvTotalHint(tot);
}

async function saveApvCost(id, field, el){
  const row = (S.approvals||[]).find(a => a.id === id);
  if(!row) return;
  const show = () => { el.value = field === 'quantity' ? apvQtyText(row) : apvCostText(row); };

  let n = apvNum(el.value);
  /* A blank cost clears the price. A blank quantity has no meaning, so
     it goes back to what it was, the same as anything unreadable. */
  if(Number.isNaN(n) || (field === 'quantity' && n === null)){
    show(); el.classList.add('bad');
    setTimeout(()=> el.classList.remove('bad'), 1200);
    return;
  }
  if(field === 'unit_cost' && n !== null) n = Math.round(n * 100) / 100;

  const before = row[field];
  const same = (before == null && n === null) || (before != null && n !== null && Number(before) === n);
  el.classList.remove('bad');
  if(same){ show(); return; }

  row[field] = n; show(); apvPaintTotals(id);
  try{
    const { error } = await sb.from('approvals').update({ [field]: n }).eq('id', id);
    if(error) throw error;
  }catch(err){
    row[field] = before;
    S.apvErr = 'That did not save: ' + (err.message || String(err));
    render();
  }
}

async function decideApproval(id, status){
  if(S.apvBusy) return;
  const row = (S.approvals||[]).find(a => a.id === id);
  if(!row || apvMine(row)) return;

  let feedback = null;
  if(status === 'changes'){
    /* Required. "Request changes" with no note gives the next version
       nothing to answer, which is the failure this whole tab exists
       to avoid. */
    feedback = prompt('What needs to change?\n\nThis shows on the next version, so it is worth being specific.');
    if(feedback === null) return;
    if(!String(feedback).trim()){
      S.apvErr = 'Changes need a note saying what to change.';
      return render();
    }
  } else if(status === 'declined'){
    feedback = prompt('Why? Optional, but useful later.') || null;
  }

  S.apvBusy = id; S.apvErr = ''; render();
  let who = null;
  try{ const { data } = await sb.auth.getUser(); who = data && data.user ? data.user.email : null; }
  catch(e){ who = null; }

  try{
    const patch = { status, decided_by: who, decided_at: new Date().toISOString() };
    if(feedback !== null) patch.feedback = String(feedback).trim();
    const { error } = await sb.from('approvals').update(patch).eq('id', id);
    if(error) throw error;
    S.loaded.approvals = false;
    await loadApprovals();
  }catch(err){ S.apvErr = err.message || String(err); }
  S.apvBusy = ''; render();
}

async function submitApproval(){
  if(S.apvSaving) return;
  const f = S.apvForm;
  const parent = S.apvReplyTo
    ? (S.approvals||[]).find(a => a.id === S.apvReplyTo)
    : null;

  if(!parent && !String(f.title||'').trim()){
    S.apvErr = 'It needs a title.'; return render();
  }
  if(parent && !String(S.apvReply||'').trim()){
    S.apvErr = 'Say what you changed, so Pat can check it against what he asked for.';
    return render();
  }
  if(!S.apvFile && !String(f.link_url||'').trim() && !parent){
    S.apvErr = 'Attach a file or paste a link.'; return render();
  }

  /* A new version keeps the quantity and cost of the one it replaces.
     Both stay editable on the card if the price moved with the change. */
  let qty = parent ? (parent.quantity == null ? 1 : Number(parent.quantity)) : apvNum(f.quantity);
  let cost = parent ? (parent.unit_cost == null ? null : Number(parent.unit_cost)) : apvNum(f.unit_cost);
  if(qty === null) qty = 1;
  if(Number.isNaN(qty)){ S.apvErr = 'Quantity needs to be a number.'; return render(); }
  if(Number.isNaN(cost)){ S.apvErr = 'Cost per item needs to be a number, like 125 or 125.50.'; return render(); }
  if(cost !== null) cost = Math.round(cost * 100) / 100;

  S.apvSaving = true; S.apvErr = ''; render();
  let who = '';
  try{ const { data } = await sb.auth.getUser(); who = (data && data.user && data.user.email) || ''; }
  catch(e){ who = ''; }

  try{
    let filePath = null, fileName = null, fileType = null;
    if(S.apvFile){
      const stamp = Date.now().toString(36);
      const safe = S.apvFile.name.replace(/[^A-Za-z0-9._-]/g, '_');
      filePath = `${stamp}-${Math.random().toString(36).slice(2,8)}/${safe}`;
      const { error:upErr } = await sb.storage.from('approvals')
        .upload(filePath, S.apvFile, { upsert:false });
      if(upErr) throw upErr;
      fileName = S.apvFile.name;
      fileType = S.apvFile.type || '';
    }

    const row = {
      title:       parent ? parent.title : String(f.title).trim(),
      kind:        parent ? parent.kind  : f.kind,
      description: parent ? parent.description : (String(f.description||'').trim() || null),
      link_url:    String(f.link_url||'').trim() || null,
      file_path:   filePath, file_name: fileName, file_type: fileType,
      requested_by: who, status:'pending',
      due_by:      String(f.due_by||'').trim() || null,
      quantity:    qty, unit_cost: cost
    };
    if(parent){
      row.parent_id  = parent.id;
      row.version    = Number(parent.version || 1) + 1;
      row.change_note = String(S.apvReply).trim();
    }

    const { error } = await sb.from('approvals').insert(row);
    if(error) throw error;

    S.apvNote = parent
      ? `Version ${row.version} sent to Pat.`
      : `${row.title} sent to Pat.`;
    S.apvOpen = false; S.apvReplyTo = null; S.apvReply = ''; S.apvFile = null;
    S.apvForm = { title:'', kind:'design', description:'', link_url:'', due_by:'', quantity:'1', unit_cost:'' };
    S.loaded.approvals = false;
    await loadApprovals();
  }catch(err){
    S.apvErr = 'That did not go through: ' + (err.message || err);
  }
  S.apvSaving = false; render();
}

/* Marking an undated invite as going used to do nothing visible: the
   decision saved, and the calendar workflow skipped it because it will
   not invent a time. Three invites sat in that state. The decision is
   the moment someone is actually looking at the invitation, so that is
   where to ask for the date. */
async function decideInvite(id, decision){
  if(S.inviteBusy) return;

  if(decision === 'going'){
    const v = (S.invites||[]).find(x => x.id === id);
    if(v && !v.starts_at){
      S.dateAsk = { id, mode:'new', date:'', time:'17:00', hours:'2',
                    allDay:false, endDate:'',
                    location: v.location || '', busy:false, err:'' };
      S.inviteErr = ''; return render();
    }
  }

  S.inviteBusy = id; S.inviteErr=''; render();
  let who = null;
  try{ const { data } = await sb.auth.getUser(); who = data && data.user ? data.user.email : null; }
  catch(e){ who = null; }

  const { error } = await sb.from('event_invites')
    .update({ decision: decision,
              decided_at: new Date().toISOString(),
              decided_by: who })
    .eq('id', id);
  if(error) S.inviteErr = error.message;
  S.loaded.invites = false;
  await loadInvites();

/* show_in_panel, not halted_because. The two differ in one case: a follow-up
   that has been queued but has not gone out yet. That is still a live
   sequence and belongs on screen. halted_because is left alone because the
   n8n generator reads it to decide what to queue. */
async function loadSequences(){
  const { data, error } = await sb.from('v_sequences_live').select('*')
    .eq('show_in_panel', true).order('next_due_on').limit(40);
  // A failed query used to land in the same empty state as a quiet week,
  // which is the exact confusion this panel keeps causing. Say it instead.
  S.seqErr = error ? (error.message || String(error)) : '';
  S.seq = data || [];
  S.loaded.seq = true;
}

/* Today's tasks plus anything older still open. Rollover happens on read
   rather than in a nightly job: nothing extra has to run, no executions
   are spent, and a gap of several days heals itself. The empty state has
   claimed this behaviour since the tab was built, but the old query
   filtered on work_date alone, so unfinished work silently disappeared
   at midnight.

   v_day_status is no longer read. It was scoped to a single work_date,
   which cannot describe a list that spans days, and counting the rows
   already in hand means the Outreach panel and this page can never
   disagree. */
async function loadTasks(owner){
  const t0 = today();
  const { data, error } = await sb.from('tasks').select('*')
    .eq('owner', owner)
    .or(`work_date.eq.${t0},and(work_date.lt.${t0},status.neq.done)`)
    .order('status').order('work_date').order('priority').order('sort_order');
  if(error) throw error;
  S.tasks[owner] = orderTasks(data || []);
  S.loaded.tasks[owner] = true;
}

/* The order on screen is the order you set by dragging. Finished tasks
   sink to the bottom so the list reads top down as what to do next.
   created_at breaks ties, which only happen for rows written outside
   the dashboard before the insert trigger numbers them. */
function orderTasks(rows){
  return rows.slice().sort((a,b) =>
    ((a.status==='done') - (b.status==='done')) ||
    ((a.sort_order||0) - (b.sort_order||0)) ||
    String(a.created_at).localeCompare(String(b.created_at)));
}

function dayStats(owner){
  /* Only top level tasks count. A task with six subtasks would otherwise
     make the day read as seven times the work, and the done percentage
     would swing on whichever task happened to be broken down furthest. */
  const rows = (S.tasks[owner] || []).filter(t => !t.parent_id);
  if(!rows.length) return null;
  const t0 = today();
  const done  = rows.filter(t=>t.status==='done').length;
  const doing = rows.filter(t=>t.status==='doing').length;
  const open  = rows.filter(t=>t.status==='open').length;
  const carried = rows.filter(t=>t.work_date < t0 && t.status!=='done').length;
  const focus = rows.find(t=>t.status==='doing');
  const areas = [...new Set(rows.filter(t=>t.status!=='done').map(t=>t.category))];
  return { total:rows.length, done, doing, open, carried,
           pct_done: rows.length ? Math.round(100*done/rows.length) : null,
           current_focus: focus ? focus.title : null,
           open_areas: areas.join(', ') };
}

let crmTimer = null;
async function crmSearch(q){
  S.crmQ = q;
  const term = String(q||'').trim();
  if(term.length < 2){
    S.crmHits = null; S.crmBusy = false;
    S.crmFocus = true; render(); S.crmFocus = false; return;
  }

  // Every keystroke fires, so a slow early query must not overwrite the
  // results of a later, more specific one.
  const seq = ++S.crmSeq;
  S.crmBusy = true; S.crmFocus = true; render(); S.crmFocus = false;

  const { data, error } = await sb.rpc('crm_search', { q: term, lim: 40 });
  if(seq !== S.crmSeq) return;

  S.crmHits = error ? [] : (data || []);
  S.crmErr  = error ? error.message : '';
  await loadClicks(S.crmHits.filter(h => h.kind !== 'company').map(h => h.id)).catch(() => {});
  if(seq !== S.crmSeq) return;
  S.crmBusy = false;
  S.crmFocus = true; render(); S.crmFocus = false;
}

async function submitManualLead(){
  if(S.addBusy) return;
  const f = S.addForm2;
  if(!String(f.full_name||'').trim()){
    S.addNote = 'A name is needed.'; return render();
  }
  S.addBusy = true; S.addNote=''; render();
  try{
    const { data, error } = await sb.rpc('add_manual_lead', {
      p_full_name: f.full_name.trim(),
      p_first: f.full_name.trim().split(/\s+/)[0] || '',
      p_last:  f.full_name.trim().split(/\s+/).slice(1).join(' '),
      p_title: f.title, p_email: f.email, p_phone: f.phone,
      p_company: f.company, p_domain: '',
      p_vertical_id: f.vertical_id ? Number(f.vertical_id) : null,
      p_relationship: f.relationship,
      p_is_gold: !!f.is_gold
    });
    if(error) throw error;
    const r = Array.isArray(data) ? data[0] : data;
    S.addNote = r && r.outcome === 'added'
      ? `${f.full_name.trim()} added, waiting on the review board.`
      : `${f.full_name.trim()} was already in the database. Filled in what was missing.`;
    S.addForm2 = { full_name:'', title:'', email:'', phone:'', company:'',
                   vertical_id: f.vertical_id, relationship:'', is_gold: f.is_gold };
    S.loaded.leads = false;
    await loadBatches(); await loadLeadRows();
  }catch(err){
    S.addNote = 'That did not go through: ' + (err.message||err);
  }
  S.addBusy = false; render();
}

async function revertApproval(){
  if(S.revertBusy) return;
  S.revertBusy = true; S.revertNote=''; render();
  try{
    const { data, error } = await sb.rpc('revert_last_approval');
    if(error) throw error;
    const r = Array.isArray(data) ? data[0] : data;
    const back = r ? Number(r.reverted||0) : 0;
    const held = r ? Number(r.skipped_sent||0) - back : 0;
    S.revertNote = back
      ? `${back} sent back to the review board.` +
        (held>0 ? ` ${held} stayed approved because they have already been emailed.` : '')
      : 'Nothing to revert.';
    S.loaded.leads = false;
    await loadBatches(); await loadLeadRows();
    await loadLastApproval();
  }catch(err){
    S.revertNote = 'That did not go through: ' + (err.message||err);
  }
  S.revertArm = false; S.revertBusy = false; render();
}

async function loadClassifications(){
  // Ordered by what it costs to be wrong: most contacts first, then
  // least confident. A twenty-contact firm rejected at 60% is the
  // expensive mistake. A one-person venture fund at 95% is not.
  try{
    // With five thousand companies the list is a window, so the search
    // has to hit the database rather than filter the window. Otherwise
    // it reports nothing for a company that is plainly there, which is
    // worse than having no search at all.
    const q = String(S.clsSearch || '').trim();
    let sel = sb.from('v_classify_pending').select('*');
    if(S.clsFilter && S.clsFilter !== 'all') sel = sel.eq('outcome', S.clsFilter);
    if(q.length >= 2){
      const like = '%' + q.replace(/[%,()]/g, ' ') + '%';
      sel = sel.or('company_name.ilike.' + like + ',domain.ilike.' + like
                 + ',reason.ilike.' + like);
    }
    const { data, error } = await sel
      .order('contacts', {ascending:false})
      .order('confidence', {ascending:true})
      .limit(600);
    if(error) throw error;
    S.cls = data || [];
  }catch(err){
    // Patch 26 may not be applied yet, and the lead board must not
    // stop rendering because a secondary view is missing.
    S.cls = [];
    S.clsErr = 'Classifications are unavailable. ' + (err.message || err);
  }
  S.clsPicked = new Set();
  S.loaded.cls = true;
}

async function loadLeadRows(){
  let q = sb.from('v_lead_review').select('*');
  if(S.batchId !== 'all') q = q.eq('lead_batch_id', S.batchId);
  const { data, error } = await q.order('fit',{ascending:false})
    .order('created_at',{ascending:false}).limit(600);

     so everything starts kept. */
  S.picked = new Set(S.leads.map(l=>l.contact_id));
  S.leadOpen = {};
  S.loaded.leads = true;
}

/* "JWT issued at future" comes back when a request reaches the database a
   moment after Supabase has issued a fresh login token, before the
   database's clock has caught up with it. The same token works a second
   later, so the tab waits briefly and tries once more rather than showing
   an error. Loaders only mark themselves loaded on success, so the retry
   re-runs just the reads that failed. */
async function ensure(page){
  try{ await ensureOnce(page); }
  catch(err){
    if(!/issued at future|PGRST303/i.test(String(err && (err.message || err.code) || err))) throw err;
    await new Promise(r => setTimeout(r, 1500));
    await ensureOnce(page);
  }
}

async function ensureOnce(page){
  if(page==='home') await loadHome();
  if(page==='today'){
    // Six independent reads. One after another they were the slowest
    // part of opening the page.
    await Promise.all([
      !S.loaded.board && loadBoard(),
      !S.loaded.tiles && loadTiles(),
      !S.loaded.week && loadWeek(),
      !S.loaded.tasks[S.me] && loadTasks(S.me),
      !S.loaded.seq && loadSequences(),
      !S.loaded.assets && loadAssets(),
      !S.loaded.voice && loadVoice(),
      !S.loaded.health && loadHealth(),
      !S.loaded.mc && loadMailchimp()
    ].filter(Boolean));
  }
  if(page==='calendar' && !S.loaded.week) await loadWeek();
  if(page==='calendar' && !S.loaded.invites) await loadInvites();
  if(page==='approvals' && !S.loaded.approvals) await loadApprovals();
  if(page==='budget' && !S.loaded.budget) await loadBudget();
  if(page==='mileage' && !S.loaded.mileage) await loadMileage();
  if(page==='photos' && !S.loaded.photos) await loadPhotos();
  if(page==='voices' && !S.loaded.voices) await loadVoices();
  if(page==='kpis'){
    /* Independent reads, so they go together rather than one by one. */
    await Promise.all([
      !S.loaded.kpis && loadKpis(),
      S.kpiView !== 'scorecard' && !S.loaded.ret && loadReturn(),
      !S.loaded.metrics && loadMetrics()
    ].filter(Boolean));
  }
  if(OWNERS[page] && !S.loaded.tasks[OWNERS[page]]) await loadTasks(OWNERS[page]);
  if(page === 'myday' && !S.loaded.requests) await loadRequests();
  if(page==='reels' && !S.loaded.reels) await loadReels();
  if(page==='social' && !S.loaded.social) await loadSocial();
  if(page==='permits' && !S.loaded.permits) await loadPermits();
  if(page==='campaigns' && !S.loaded.ec) await loadCampaigns();
  if(page==='bulk') await Promise.all([!S.loaded.bulk && loadBulk(), !S.loaded.labels && loadLabels()].filter(Boolean));
  if(page==='leads'){
    /* Five reads that used to wait on each other in turn. */
    await Promise.all([
      !S.loaded.verticals && loadVerticals(),
      !S.loaded.labels && loadLabels(),
      S.lastApproval === null && loadLastApproval(),
      !S.loaded.leads && loadBatches(),
      !S.loaded.leads && loadLeadRows(),
      !S.loaded.cls && loadClassifications()
    ].filter(Boolean));
    if(S.leads && S.leads.length) await loadClicks(S.leads.map(l => l.contact_id));
  }
}

/* ---------- the address bar ----------
   The tab and its sub-view live in the hash (#kpis/board,
   #calendar/invites, #permits/pat), and every change of either is a new
   history entry, so Back and Forward step between tabs and views the way
   they do on any other site. */
const SUBVIEW = {
  kpis:     { get:() => S.kpiView,    set:v => { if(['scorecard','board','return'].includes(v)) S.kpiView = v; }, def:'scorecard' },
  calendar: { get:() => S.calView,    set:v => { if(['schedule','invites'].includes(v)) S.calView = v; }, def:'schedule' },
  permits:  { get:() => S.permitView, set:v => { if(['open','saved','pat','dismissed'].includes(v)) S.permitView = v; }, def:'open' }
};
function parseHash(h){
  const [p, v] = String(h || '').replace(/^#/, '').split('/');
  try{ return { page:decodeURIComponent(p || ''), view:v ? decodeURIComponent(v) : '' }; }
  catch(e){ return { page:'', view:'' }; }
}
function hashNow(){
  const sv = SUBVIEW[S.page], v = sv && sv.get();
  return '#' + S.page + (v && v !== sv.def ? '/' + v : '');
}
function syncHash(){
  const h = hashNow();
  if(location.hash !== h){
    try{ history[S._hashReady ? 'pushState' : 'replaceState'](null, '', h); }catch(e){}
  }
  S._hashReady = true;
}
const pageVisible = k => visiblePages().some(([p]) => p === k);

/* One way into a tab, used by the sidebar, the phone bar, Home's links
   and Back/Forward. */
async function goPage(page){
  if(!pageVisible(page)) return;
  S.page = page; S.err = ''; S.gen = ''; S.moreOpen = false;
  render();
  try{ await ensure(S.page); }
  catch(err){ S.err = 'Could not load this tab. ' + (err.message || err); }
  render();
}

window.addEventListener('hashchange', () => {
  if(!S.day || !app.querySelector('.shell')) return;      // not signed in yet
  const { page, view } = parseHash(location.hash);
  if(!pageVisible(page)){ try{ history.replaceState(null, '', hashNow()); }catch(e){} return; }
  const sv = SUBVIEW[page];
  const same = page === S.page && (!sv || (view || sv.def) === sv.get());
  if(same) return;
  if(sv) sv.set(view || sv.def);
  goPage(page);
});

  if(el.hasAttribute('data-theme-cycle')) return cycleTheme();

     bar's More button opens the sheet. */

/* Puts the cursor back in a box after a repaint, but only if it is not
   already there: the patcher keeps the focused box in place, and moving
   the caret to the end on every repaint would fight the typist. */
function refocus(el){
  if(!el || document.activeElement === el) return;
  el.focus();
  const n = el.value.length;
  try{ el.setSelectionRange(n, n); }catch(e){}
}

function wireChrome(){
  if(S.crmFocus) refocus(document.getElementById('crmQ'));
}

/* ---------- the patcher ----------
   render() used to replace the whole page with innerHTML and re-attach
   every handler, so each click rebuilt a few thousand nodes, dropped the
   caret and scroll position of anything inside, and closed whatever was
   open. It now builds the new HTML off-screen and patches the live page
   to match: nodes are kept where they line up (by id, data-key, data-tid
   or data-row first, then by position), and only what differs is
   created, removed or edited.

   Form fields: a repaint the person caused writes the rendered value, as
   before. A background repaint (live updates, the periodic refresh)
   leaves alone any field that is focused or has been typed in. A
   <details> the person opened stays open unless the page itself changes
   its rendered state. */
const PATCH = { created:0, removed:0, updated:0, bg:false };
const KEY_ATTRS = ['data-key','data-tid','data-row'];
function morphKey(n){
  if(n.nodeType !== 1) return '';
  if(n.id) return '#' + n.id;
  for(const a of KEY_ATTRS){ const v = n.getAttribute(a); if(v) return a + '=' + v; }
  return '';
}
function prepNew(n){
  if(n.nodeType !== 1){ PATCH.created++; return; }
  PATCH.created += 1 + n.getElementsByTagName('*').length;
  if(n.nodeName === 'DETAILS') n.__ro = n.hasAttribute('open');
  for(const d of n.getElementsByTagName('details')) d.__ro = d.hasAttribute('open');
}
function countOld(n){ PATCH.removed += n.nodeType === 1 ? 1 + n.getElementsByTagName('*').length : 1; }
function syncAttrs(a, b){
  const skip = a.nodeName === 'DETAILS' ? 'open' : '';
  for(const at of Array.from(a.attributes)){
    if(at.name === skip) continue;
    if(!b.hasAttributeNS(at.namespaceURI, at.localName)){ a.removeAttributeNS(at.namespaceURI, at.localName); PATCH.updated++; }
  }
  for(const at of b.attributes){
    if(at.name === skip) continue;
    if(a.getAttributeNS(at.namespaceURI, at.localName) !== at.value){ a.setAttributeNS(at.namespaceURI, at.name, at.value); PATCH.updated++; }
  }
}
function morphNode(a, b){
  if(a.nodeType !== 1){
    if(a.nodeValue !== b.nodeValue){ a.nodeValue = b.nodeValue; PATCH.updated++; }
    return;
  }
  const tag = a.nodeName, keep = PATCH.bg && a === document.activeElement;
  if(tag === 'INPUT'){
    const box = a.type === 'checkbox' || a.type === 'radio';
    const dirty = box ? a.checked !== a.defaultChecked : a.value !== a.defaultValue;
    syncAttrs(a, b);
    if(a.type === 'file' || (PATCH.bg && (dirty || keep))) return;
    if(box){ const c = b.hasAttribute('checked'); if(a.checked !== c) a.checked = c; }
    else { const v = b.getAttribute('value') || ''; if(a.value !== v) a.value = v; }
    return;
  }
  if(tag === 'TEXTAREA'){
    const v = b.textContent, dirty = a.value !== a.defaultValue;
    syncAttrs(a, b);
    if(a.defaultValue !== v) a.defaultValue = v;
    if(PATCH.bg && (dirty || keep)) return;
    if(a.value !== v){ a.value = v; PATCH.updated++; }
    return;
  }
  if(tag === 'SELECT'){
    let idx = -1;
    Array.from(b.options).forEach((o, i) => { if(o.hasAttribute('selected')) idx = i; });
    if(idx < 0 && b.options.length) idx = 0;
    syncAttrs(a, b);
    morphChildren(a, b);
    if(!keep && !a.multiple && a.selectedIndex !== idx) a.selectedIndex = idx;
    return;
  }
  syncAttrs(a, b);
  if(tag === 'DETAILS'){
    const o = b.hasAttribute('open');
    if(a.__ro !== o){ a.open = o; a.__ro = o; }
  }
  morphChildren(a, b);
}
function morphChildren(from, to){
  const keyed = new Map();
  for(let c = from.firstChild; c; c = c.nextSibling){
    const k = morphKey(c);
    if(k && !keyed.has(k)) keyed.set(k, c);
  }
  let cur = from.firstChild, n = to.firstChild;
  while(n){
    const next = n.nextSibling, k = morphKey(n);
    let m = null;
    if(k){
      m = keyed.get(k) || null;
      if(m && m.nodeName === n.nodeName) keyed.delete(k); else m = null;
    }else if(cur && !morphKey(cur) && cur.nodeType === n.nodeType && cur.nodeName === n.nodeName){
      m = cur;
    }
    if(m){
      if(m === cur) cur = cur.nextSibling; else from.insertBefore(m, cur);
      morphNode(m, n);
    }else{
      prepNew(n);
      from.insertBefore(n, cur);
    }
    n = next;
  }
  while(cur){ const nx = cur.nextSibling; countOld(cur); from.removeChild(cur); cur = nx; }
}

/* ---------- wiring, made idempotent ----------
   The wire functions still find their elements with querySelectorAll
   after each repaint, but now that elements survive a repaint, adding a
   listener again would stack a second copy. While a wiring pass runs,
   every listener it adds is recorded on its element; the next pass drops
   the old ones before adding new ones, and anything a pass no longer
   wires is removed. Listeners added outside a pass are untouched. A
   repaint that changed nothing skips the pass entirely. */
const WIRE = { gen:0, on:false, live:new Set() };
{
  const add = EventTarget.prototype.addEventListener;
  EventTarget.prototype.addEventListener = function(type, fn, opts){
    if(WIRE.on && fn){
      let w = this.__wired;
      if(!w || w.gen !== WIRE.gen){
        if(w) for(const x of w.list) this.removeEventListener(x[0], x[1], x[2]);
        w = this.__wired = { gen:WIRE.gen, list:[] };
        WIRE.live.add(this);
      }
      w.list.push([type, fn, opts]);
    }
    return add.call(this, type, fn, opts);
  };
}
function wireAll(){
  WIRE.gen++; WIRE.on = true;
  try{ wireChrome(); wirePage(); }
  finally{ WIRE.on = false; }
  let n = 0;
  for(const el of WIRE.live){
    const w = el.__wired;
    if(w && w.gen === WIRE.gen && el.isConnected !== false){ n += w.list.length; continue; }
    if(w) for(const x of w.list) el.removeEventListener(x[0], x[1], x[2]);
    el.__wired = null; WIRE.live.delete(el);
  }
  return n;
}

/* The last few repaints, for checking speed from the console:
   window.__renders. */
const RSTATS = [];
window.__renders = RSTATS;

function pageHtml(){
  if(S.page==='home')      return pageHome();
  if(S.page==='today')     return pageToday();
  if(S.page==='calendar')  return pageCalendar();
  if(S.page==='kpis')      return pageKpis();
  if(S.page==='approvals') return pageApprovals();
  if(S.page==='budget')    return pageBudget();
  if(S.page==='mileage')   return pageMileage();
  if(S.page==='photos')    return pagePhotos();
  if(S.page==='voices')    return pageVoices();
  if(S.page==='reels')     return pageReels();
  if(S.page==='social')    return pageSocial();
  if(S.page==='campaigns') return pageCampaigns();
  if(OWNERS[S.page])       return pageDay(OWNERS[S.page]);
  if(S.page==='leads')     return pageLeads();
  if(S.page==='permits')   return pagePermits();
  if(S.page==='bulk')      return pageBulk();
  return '';
}

function render(opts){
  const t0 = performance.now();
  const html = shell(pageHtml());
  const pageChanged = S._lastPage !== S.page;
  PATCH.created = PATCH.removed = PATCH.updated = 0;
  PATCH.bg = !!(opts && opts.bg);
  let full = false;
  if(!app.querySelector(':scope > .shell')){
    app.innerHTML = html; full = true;
    PATCH.created = app.getElementsByTagName('*').length;
    for(const d of app.getElementsByTagName('details')) d.__ro = d.hasAttribute('open');
  }else{
    const t = document.createElement('template');
    t.innerHTML = html;
    morphChildren(app, t.content);
  }
  const changed = full || PATCH.created || PATCH.removed || PATCH.updated;
  const listeners = changed || pageChanged ? wireAll() : -1;
  if(listeners === -1){
    /* Nothing changed, so no wiring pass ran, but a handler may still
       have asked for the caret back. */
    if(S.crmFocus) refocus(document.getElementById('crmQ'));
    if(S.taskFocus) refocus(document.getElementById('taskTitle'));
    if(S.subFocus) refocus(document.getElementById('subInput'));
  }
  if(pageChanged && S._lastPage && !full) window.scrollTo(0, 0);
  S._lastPage = S.page;
  syncHash();
  RSTATS.push({ page:S.page, ms:Math.round((performance.now() - t0) * 10) / 10, full,
    created:PATCH.created, removed:PATCH.removed, updated:PATCH.updated, bg:PATCH.bg,
    total:app.getElementsByTagName('*').length, rewired:listeners });
  if(RSTATS.length > 40) RSTATS.shift();
}

function wirePage(){
  document.querySelectorAll('[data-row]').forEach(el=>
    el.addEventListener('click',()=>{
      S.activeId = el.dataset.row; S.open={}; S.err='';

    }));
  document.querySelectorAll('[data-toggle]').forEach(el=>
    el.addEventListener('click',()=>{ const id=el.dataset.toggle; S.open[id]=!S.open[id]; render(); }));
  document.querySelectorAll('[data-dsub]').forEach(el=>
    el.addEventListener('input',()=>{ (S.dEdit[el.dataset.dsub] ||= {}).s = el.value; }));
  document.querySelectorAll('[data-dbody]').forEach(el=>

  const add = document.getElementById('addTask');

       Mirroring into state is how the deal and import forms already work. */
    ti.addEventListener('input', ()=>{ S.taskDraft.title = ti.value; });

    el.addEventListener('click',()=>delTask(el.dataset.taskDel)));
  document.querySelectorAll('[data-grip]').forEach(el=>
    el.addEventListener('pointerdown', startTaskDrag));

  document.querySelectorAll('[data-task-open]').forEach(el=>
    el.addEventListener('click',()=>{

      const shown = S.taskOpen[id] !== undefined
        ? S.taskOpen[id] : (t && t.status === 'doing');
      S.taskOpen[id] = !shown; render();
    }));

  document.querySelectorAll('[data-sub-add]').forEach(el=>
    el.addEventListener('click',()=>{

      S.subFocus = true; render(); S.subFocus = false;
    }));

      if(e.key === 'Enter') addSubtask();
      if(e.key === 'Escape'){ S.subDraft = null; render(); }
    });
    if(S.subFocus) refocus(si);
  }
  const ss = document.getElementById('subSave');
  if(ss) ss.addEventListener('click', addSubtask);

  if(sc) sc.addEventListener('click', ()=>{ S.subDraft = null; render(); });

  if(ex) ex.addEventListener('click', exportCsv);

  if(pr) pr.addEventListener('click', ()=>window.print());

  // Skipped rows leave the count as well as the list. Pat cleared the board
  // if he dealt with everything he meant to deal with.

  const openRows = shownRows.filter(r=>!r.handled);

/* Nothing else shows a sequence between the send and the nudge, so a
   working sequence and a broken one looked identical for four days.

   Worse than that, as it turned out. Queueing a follow-up used to drop the
   row out of this panel, and the queued draft only appeared on the board on
   its own date, so an unclaimed follow-up left the app entirely. Two of them
   did. A queued follow-up now stays here, reading "on the board", until the
   email actually sends. */
function seqPanel(){
  const rows = S.seq || [];
  if(S.seqErr){
    return `<div class="warn"><b>This panel could not load.</b>
      <span class="mono">${esc(S.seqErr)}</span><br>
      Nothing is wrong with the sequences themselves. Send this line to Liam.</div>`;
  }
  if(!rows.length){
    return `<p class="hint">No sequences running. One starts every time an email sends.</p>`;
  }
  const waiting = rows.filter(r => r.follow_up_state === 'queued').length;
  const due = rows.filter(r => r.follow_up_state !== 'queued'
                            && Number(r.days_until) <= 0).length;
  const shown = rows.slice(0, 8);
  return `<div class="panelbox" style="margin-top:0">
      <div style="display:flex;align-items:baseline;gap:10px">
        <span style="font-family:var(--display);font-size:26px;font-weight:700">${num(rows.length)}</span>
        <span class="eyebrow">waiting on a reply</span>
      </div>
      ${due?`<p class="mono" style="color:var(--orange-ink)">${due} due now</p>`:''}
      ${waiting?`<p class="mono" style="color:var(--orange-ink)">${waiting} drafted, not sent</p>`:''}
    </div>
    <div style="border:1px solid var(--rule)">
      ${shown.map(r=>{
        const queued = r.follow_up_state === 'queued';
        // Once Pat picks a variant the draft is in his mailbox, not on the
        // board. Saying "on the board" then sends him looking in the wrong place.
        const inOutlook = queued && r.child_status === 'selected';
        const qd = Number(r.child_queued_days_ago);
        const d = Number(r.days_until);
        const when = inOutlook ? 'waiting to send'
          : queued
          ? (qd === 0 ? 'drafted today' : qd === 1 ? 'drafted yesterday'
             : `drafted ${qd}d ago`)
          : d < 0 ? `${Math.abs(d)}d overdue` : d === 0 ? 'today'
          : d === 1 ? 'tomorrow' : `in ${d}d`;
        const hot = queued || d <= 0;
        return `<div class="ev">
          <span class="t" style="color:${hot?'var(--orange-ink)':'var(--slate)'}">${esc(when)}</span>
          <span class="s">${esc(r.full_name||'')}
            ${r.company_name?`<em>${esc(r.company_name)}</em>`:''}</span>
          <span class="kind">${inOutlook?'In Outlook':queued?'On the board':'Touch '+esc(r.next_touch)}</span>
        </div>`;
      }).join('')}
    </div>
    ${rows.length>8?`<p class="hint">${rows.length-8} more.</p>`:''}`;
}

function rowHtml(r,i){

/* A div, not a button, because the Undo inside it is itself a button and
   nesting the two is invalid markup that Safari renders unpredictably.

   The eligibility date is shown rather than left implied. The queue builder
   locks a contact for 90 days when it queues them, so a skip is a longer
   goodbye than the word "today" suggests, and Pat should be able to see how
   long without asking anyone. */
function skipRowHtml(r){
  const back = r.next_eligible_at ? new Date(r.next_eligible_at) : null;
  const future = back && !isNaN(back) && back > new Date();
  return `<div class="row skipped" data-row="${r.queue_id}">
    <span class="row-top"><span class="name">${esc(r.full_name||r.email)}</span>
      <button class="linkbtn undo" data-unskip="${esc(r.queue_id)}">Undo</button></span>
    <span class="org">${esc(r.company_name||r.vertical)}</span>
    ${future?`<span class="carry back">ELIGIBLE AGAIN ${
      esc(shortDate(r.next_eligible_at)).toUpperCase()}</span>`:''}</div>`;
}

function warnBlock(r){
  const w = [];

  // Ordered by how badly it would land, not by how likely it is.
  if(r.is_internal){
    w.push(`<div class="warn"><b>This is a HAGGERTY address.</b>
      Nobody internal should be on this board. Worth checking the import
      rather than the contact.</div>`);
  }

  if(r.meeting_subject){
    const when = r.meeting_at ? new Date(r.meeting_at) : null;
    const past = when && when < new Date();
    const day = when ? when.toLocaleDateString('en-US',
      {weekday:'long', month:'short', day:'numeric'}) : '';
    w.push(`<div class="warn"><b>Pat ${past?'met':'is meeting'} ${
      r.meeting_is_them ? 'them' : 'someone at this company'} ${past?'on':''} ${esc(day)}.</b>
      <span class="when">${esc(r.meeting_subject)}</span><br>
      A cold introduction ${past?'after that meeting':'before that meeting'} would read badly.</div>`);
  }

  if(r.open_deal_title){
    w.push(`<div class="warn"><b>There is an open deal with this company.</b>
      ${esc(r.open_deal_title)}${r.open_deal_stage?` <span class="when">${esc(r.open_deal_stage)}</span>`:''}<br>
      Asking to be added to their bid list says nobody here talks to anyone.</div>`);
  }

  if(r.colleague_emailed_name){
    const d = Number(r.colleague_emailed_days_ago);
    w.push(`<div class="warn soft"><b>${esc(r.colleague_emailed_name)} at the same company was emailed ${
      d === 0 ? 'today' : d === 1 ? 'yesterday' : d + ' days ago'}.</b><br>
      They forward each other's mail. Two similar notes from Pat read as the mail merge they are.</div>`);
  }

  if(r.maybe_competitor){
    w.push(`<div class="warn soft"><b>Possibly a competing contractor.</b>
      The industry data mentions general contracting. Subcontractors look the same in that field,
      so this is worth a look rather than an assumption.</div>`);
  }

  if(r.follow_up_stopped_at){
    w.push(`<div class="warn info"><b>Follow-ups are stopped for this contact.</b>
      ${r.follow_up_stopped_reason?esc(r.follow_up_stopped_reason)+'. ':''}Sending here is still fine,
      but no automatic nudge will go out.</div>`);
  }

  return w.join('');
}

function prevEmail(r){

async function stopFollowUp(contactId, stop){
  let reason = '';
  if(stop){
    reason = prompt('Why stop following up? Optional, but useful in a month.\n\nFor example: spoke on the phone, or asked not to be contacted.') || '';
    if(reason === null) return;
  }
  S.busy = true; S.err = ''; render();
  try{
    const { error } = await sb.from('contacts').update({
      follow_up_stopped_at: stop ? new Date().toISOString() : null,
      follow_up_stopped_reason: stop ? (reason.trim() || null) : null,
      updated_at: new Date().toISOString()
    }).eq('id', contactId);
    if(error) throw error;
    await loadBoard();
  }catch(err){ S.err = err.message || String(err); }
  finally{ S.busy = false; render(); }
}

/* Off the board. For a first contact this is also where the 90 day
   cooldown is set: sending and skipping are the two decisions that lock a
   contact, and leaving one unworked is not a decision. Undo puts the
   short lock back. Follow-ups are left alone, since their contact is
   already locked by the first send.
   Undo restores the status the row had, inferred from whether drafts exist,
   which avoids carrying a second status column just for this. */
async function skipToday(queueId, skip){
  S.busy = true; S.err = ''; render();
  try{
    const back = (S.drafts[queueId] || []).length ? 'drafted' : 'queued';
    const { error } = await sb.from('email_queue').update({
      status: skip ? 'skipped' : back,
      skipped_reason: null,
      updated_at: new Date().toISOString()
    }).eq('id', queueId);
    if(error) throw error;
    const row = S.board.find(x => x.queue_id === queueId);
    if(row && row.contact_id && Number(row.touch) === 1 && !row.handled){
      const until = new Date(Date.now() + (skip ? 90 : CARRY_DAYS) * 86400000).toISOString();
      const { error:lockErr } = await sb.from('contacts')
        .update({ next_eligible_at: until, updated_at: new Date().toISOString() })
        .eq('id', row.contact_id);
      if(lockErr) throw lockErr;
    }
    if(skip && S.activeId === queueId) S.activeId = null;
    if(!skip) S.activeId = queueId;
    await loadBoard();
  }catch(err){ S.err = err.message || String(err); }
  finally{ S.busy = false; render(); }
}

/* The contact's Pipedrive tags and relationship, minus anything that only
   repeats the sector chip. These are what the draft generator reads to
   pitch the email at this kind of client. */
function tagList(r){
  const seen = new Set([String(r.vertical||'').toLowerCase()]);
  const out = [];
  const all = (r.tag_names || []).concat(String(r.relationship||'').split(','));
  for(const t of all){
    const v = String(t||'').trim(), k = v.toLowerCase();
    if(!v || seen.has(k)) continue;
    seen.add(k); out.push(v);
  }
  return out;
}

     :`<p class="none">No enrichment on file. The drafts below make no claims about this company.</p>`}

function sectorBar(){

      <div class="n">${num(tiles.reduce((a,t)=>a+Number(t.pool||0),0))}<small> ready</small></div>
    </div>
    ${(()=>{
      // Gold is a filter, not a sector. Somebody can be an architect in
      // Healthcare and also on Pat's list, so a gold pull narrows the pool
      // rather than dividing it, and the tile sits alongside the sectors.
      const pool = Number(S.goldPool || 0);
      const onBoard = (S.board||[]).filter(r=>r.is_gold).length;

/* ================= calendar ================= */
function calSwitch(){
  const open = (S.invites||[]).filter(i=>i.decision==='undecided' && !i.is_past).length;
  return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">
    <div class="kswitch">
      <button data-cview="schedule" class="${S.calView==='schedule'?'on':''}">Schedule</button>
      <button data-cview="invites" class="${S.calView==='invites'?'on':''}">Invites${
        open?` <span class="dot">${open}</span>`:''}</button>
    </div>
  </div>`;
}

function pageCalendar(){
  if(S.calView==='invites') return pageInvites();
  if(!S.loaded.week) return loading();
  const w = S.week || [];
  if(S.weekErr){
    return `<main class="page">${calSwitch()}<div class="empty"><h2>Could not load the calendar</h2>
      <p>${esc(S.weekErr)}</p><p class="hint">This is a loading problem, not an empty calendar. Reload to try again.</p>
    </div></main>`;
  }
  if(!w.length){
    return `<main class="page">${calSwitch()}<div class="empty"><h2>No events</h2>
      <p>Nothing on the calendar for the next two weeks. If that looks wrong, run the calendar sync in n8n.</p>
    </div></main>`;
  }
  const counts = {};
  for(const e of w) counts[e.event_type] = (counts[e.event_type]||0)+1;
  const stats = Object.keys(KIND).filter(k=>counts[k]).map(k=>
    `<div class="stat"><div class="k">${KIND[k]}</div><div class="v">${counts[k]}</div></div>`).join('');

  const days = [];
  for(const e of w){
    const k = dayKey(e.starts_at);
    let d = days.find(x=>x.key===k);
    if(!d){ d={key:k,items:[]}; days.push(d); }
    d.items.push(e);
  }
  const tk = dayKey(new Date().toISOString());

  return `<main class="page">
    ${calSwitch()}
    <div class="stat-grid">${stats}</div>
    <div class="block"><h2 class="sec">The next two weeks</h2>
      <div>${days.map(d=>`<div class="day">
        <div class="day-head ${d.key===tk?'today':''}">
          <span class="d">${esc(d.key===tk?'Today':d.key)}</span>
          <span class="n">${d.items.length}</span></div>
        ${d.items.map(evRow).join('')}
      </div>`).join('')}</div>
    </div></main>`;
}

/* ---------- Event invites ---------------------------------------------- */

function inviteRow(v){
  const busy = S.inviteBusy === v.id;

  /* Sorted and coloured by deadline, not by event date. An event four months
     out with an RSVP closing Friday is the one that bites. */
  let badge = '';
  const d = v.days_left;
  if(v.is_past){
    badge = `<span class="ebadge past">Passed</span>`;
  }else if(d !== null && d !== undefined){
    const cls = d < 0 ? 'past' : (d <= 7 ? 'soon' : '');
    const word = d < 0 ? 'Deadline gone'
               : d === 0 ? 'Today'
               : d === 1 ? '1 day left'
               : `${d} days left`;
    badge = `<span class="ebadge ${cls}">${word}</span>`;
  }

  const facts = [];
  if(v.starts_at)  facts.push(fmtDay(v.starts_at));
  if(v.location)   facts.push(esc(String(v.location).slice(0,70)));
  if(v.is_virtual) facts.push('Virtual');
  if(v.cost_text)  facts.push(esc(String(v.cost_text).slice(0,60)));

  const done = v.decision !== 'undecided';

  return `<article class="inv ${v.decision} ${busy?'busy':''}">
    <div class="inv-head">
      <div>
        <h4>${esc(v.event_name || v.subject || 'Untitled')}</h4>
        <div class="inv-org">${esc(v.org_name || v.from_name || v.from_email || '')}</div>
      </div>
      ${badge}
    </div>

    ${facts.length?`<div class="inv-facts">${facts.join(' &middot; ')}</div>`:''}
    ${v.summary?`<p class="inv-sum">${esc(v.summary)}</p>`:''}
    ${v.sponsorship_levels?`<div class="inv-lvl"><b>Sponsorship</b> ${
      esc(String(v.sponsorship_levels).slice(0,220))}</div>`:''}

    ${conflictStrip(v)}
    ${evInvitedStrip(v)}

    <div class="inv-foot">
      <div class="inv-acts">
        ${['going','passed','maybe'].map(k=>
          `<button class="btn small ${v.decision===k?'':'ghost'}"
            data-decide="${v.id}" data-val="${k}" ${busy?'disabled':''}>${
            k==='going'?'Going':k==='passed'?'Passed':'Maybe'}</button>`).join('')}
        ${done?`<button class="btn small ghost" data-decide="${v.id}"
          data-val="undecided" ${busy?'disabled':''}>Clear</button>`:''}
        <button class="btn small ghost" data-editdate="${v.id}" ${busy?'disabled':''}>${
          v.starts_at ? 'Edit date' : 'Add date'}</button>
        ${v.decision === 'going' && !v.is_past && v.starts_at
          ? `<button class="btn small accent" data-evsend="${v.id}" ${busy?'disabled':''}>${
              (S.evx||[]).some(x => x.invite_id === v.id && x.status === 'sent') ? 'Invite more people' : 'Invite people'}</button>`
          : ''}
      </div>
      <div class="inv-links">
        ${v.registration_url?`<a class="chip" href="${esc(v.registration_url)}"
          target="_blank" rel="noopener">Register</a>`:''}
        ${v.web_link?`<a class="chip" href="${esc(v.web_link)}"
          target="_blank" rel="noopener">Email</a>`:''}
        <span class="inv-box" title="Which mailbox it arrived in">${esc(v.mailbox||'')}</span>
      </div>
    </div>
  </article>`;
}

/* Pat only wants things he can drive to. Virtual is the reliable signal:
   event_type and is_virtual agree on all twelve webinars, and those are
   also most of the eighteen rows with no location, so a location filter
   alone would either drop real events or keep every webinar.

   The out-of-area list is deliberately short and names only cities that
   have actually turned up. An unrecognised location stays visible, which
   is the safe direction to fail in: a stray event Pat passes on costs a
   click, one that vanishes silently costs the event. San Francisco stays,
   since it is inside the service area. */
const FAR_AWAY = /\b(detroit|miami|orlando|las vegas|phoenix|denver|chicago|atlanta|new york|boston|dallas|houston|seattle|nashville|washington|honolulu)\b/i;

function isLocal(v){
  if(v.is_virtual === true) return false;
  if(String(v.event_type || '').toLowerCase() === 'webinar') return false;
  if(/\b(online|virtual|webcast|livestream)\b/i.test(String(v.location || ''))) return false;
  if(FAR_AWAY.test(String(v.location || '') + ' ' + String(v.event_name || ''))) return false;
  return true;
}

function pageInvites(){
  if(!S.loaded.invites) return `<main class="page">${calSwitch()}${loading()}</main>`;

  const everything = S.invites || [];
  const all = S.inviteShowAll ? everything : everything.filter(isLocal);
  const hidden = everything.length - everything.filter(isLocal).length;
  const open = all.filter(v=>v.decision==='undecided' && !v.is_past);
  const sets = {
    open: open,
    /* Upcoming first. Events that have already happened stay in the list
       as a record, but underneath the ones that can still be acted on. */
    going: all.filter(v=>v.decision==='going' && !v.is_past)
      .concat(all.filter(v=>v.decision==='going' && v.is_past)),
    all: all.filter(v=>!v.is_past),
    past: all.filter(v=>v.is_past)
  };
  const rows = sets[S.inviteFilter] || open;

  const tabs = [
    ['open','Waiting on you', sets.open.length],
    ['going','Going', sets.going.length],
    ['all','All upcoming', sets.all.length],
    ['past','Past', sets.past.length]
  ].map(([k,label,n])=>
    `<button class="fchip ${S.inviteFilter===k?'on':''}" data-ifilt="${k}">${
      label} <b>${n}</b></button>`).join('')
    + (hidden || S.inviteShowAll
        ? `<button class="fchip ${S.inviteShowAll?'on':''}" id="invShowAll"
             title="Webinars and anything outside the region">${
             S.inviteShowAll ? 'Hide remote' : 'Show remote'} <b>${
             S.inviteShowAll ? '' : hidden}</b></button>`
        : '');

  if(!all.length){
    return `<main class="page">${calSwitch()}
      <div class="empty"><h2>Nothing yet</h2>
        <p>The scanner reads Pat's and Liam's inboxes every fifteen minutes and
           files anything that looks like an event or a sponsorship offer.
           Nothing has come through so far.</p>
        <p><button class="btn small" id="evAdd">Add an event</button></p>
      </div></main>${evNewSheet()}`;
  }

  return `<main class="page">
    ${calSwitch()}
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <div class="fchips" style="flex:1">${tabs}</div>
      <button class="btn small" id="evAdd">Add an event</button>
    </div>
    ${S.evNote?`<div class="done-banner" style="margin-bottom:14px"><p style="margin:0">${esc(S.evNote)}</p></div>`:''}
    ${S.inviteErr?`<div class="warn">${esc(S.inviteErr)}</div>`:''}
    ${rows.length
      ? `<div class="inv-list">${rows.map(inviteRow).join('')}</div>`
      : `<div class="empty"><h2>Nothing here</h2><p>No invitations in this list.</p></div>`}
  </main>${dateAskSheet()}${evSendSheet()}${evNewSheet()}`;
}

function evRow(e){

    : (e.location ? ` <em>${esc(String(e.location).slice(0,60))}</em>` : '');
  return `<div class="ev">

/* ---------- inbound requests, on Liam's day ---------- */

const REQ_TYPES = { post:'Post', edit:'Edit', make:'Make', order:'Order', other:'Other' };
const REQ_CHANS = { website:'Website', instagram:'Instagram', linkedin:'LinkedIn',
                    gbp:'Google Business', facebook:'Facebook',
                    print:'Print or signage', other:'Other' };

/* The countdown is the whole point of putting these here. A request with
   no date still gets one, from the Friday of its planned week, so the
   list sorts by what is actually closest rather than by arrival. */
function reqCountdown(r){
  const d = reqDaysLeft(r);
  if(d === null) return `<span class="ebadge">No date</span>`;
  const soft = !r.needed_by;
  const cls = d < 0 ? 'past' : (d <= 2 ? 'soon' : '');
  const word = d < 0 ? `${Math.abs(d)}d overdue`
             : d === 0 ? 'Due today'
             : d === 1 ? '1 day left'
             : `${d} days left`;
  return `<span class="ebadge ${cls}"${soft?' title="No date given, so this counts down to the end of the week it was planned into"':''}>${
    word}${soft?'*':''}</span>`;
}

function requestCard(r){
  const busy = S.reqBusy === r.id;
  const open = !!S.reqOpen[r.id];
  const files = S.reqFiles[r.id] || [];
  const d = reqDaysLeft(r);

  const meta = [
    REQ_TYPES[r.request_type] || r.request_type,
    REQ_CHANS[r.channel] || r.channel,
    (r.brand === 'rhino' ? 'RHINO' : 'HAGGERTY')
  ].filter(Boolean).join(' &middot; ');

  return `<article class="apv ${d !== null && d < 0 ? 'changes' : ''} ${busy?'busy':''}"
           style="margin-bottom:8px">
    <div class="apv-head">
      <div style="min-width:0">
        <h4>${esc(r.title)}</h4>
        <div class="apv-kind">${meta}</div>
      </div>
      ${reqCountdown(r)}
    </div>

    <div class="inv-facts">
      ${esc(r.requester_name)}
      ${r.needed_by?` &middot; needs it by ${esc(fmtDay(r.needed_by + 'T12:00:00'))}`:''}
      ${files.length?` &middot; ${files.length} file${files.length===1?'':'s'}`:''}
    </div>

    ${open ? `
      ${r.details?`<p class="apv-desc">${esc(r.details)}</p>`:''}
      ${files.length?`<div class="apv-file">${files.map(f=>{
        const url = signedUrl('requests', f.file_path);
        const isImg = /^image\//.test(f.file_type||'') || /\.(png|jpe?g|gif|webp)$/i.test(f.file_name||'');
        return url && isImg
          ? `<a href="${esc(url)}" target="_blank" rel="noopener"><img class="apv-thumb"
               style="max-height:200px" src="${esc(url)}" alt="${esc(f.file_name||'')}" /></a>`
          : `<a class="chip" href="${esc(url||'#')}" target="_blank" rel="noopener">${esc(f.file_name||'File')}</a>`;
      }).join('')}</div>`:''}
      <div class="apv-file"><a class="chip" href="mailto:${esc(r.requester_email)}?subject=${
        encodeURIComponent('Re: ' + r.title)}">Email ${esc(r.requester_name.split(/\s+/)[0])}</a></div>
    ` : ''}

    <div class="apv-foot">
      <div class="apv-acts">
        ${r.status === 'done'
          ? `<button class="btn small ghost" data-req="${r.id}" data-val="new" ${busy?'disabled':''}>Reopen</button>`
          : `<button class="btn small" data-req="${r.id}" data-val="done" ${busy?'disabled':''}>Done</button>
             ${r.status !== 'doing'
               ? `<button class="btn small ghost" data-req="${r.id}" data-val="doing" ${busy?'disabled':''}>Start</button>`
               : `<span class="chip hot">In progress</span>`}
             <button class="btn small ghost" data-req="${r.id}" data-val="dropped" ${busy?'disabled':''}>Drop</button>`}
      </div>
      <button class="linkbtn" data-reqopen="${r.id}">${open?'Less':'Details'}</button>
    </div>
  </article>`;
}

function requestsSection(){
  if(!S.loaded.requests) return '';
  const open = reqOpenList();
  const overdue = open.filter(r => (reqDaysLeft(r) ?? 99) < 0).length;
  const done = (S.requests||[]).filter(r => r.status === 'done');

  return `<div class="block">
    <h2 class="sec">Requests coming in${open.length?` &middot; ${open.length}`:''}</h2>

    ${overdue?`<div class="warn" style="margin-bottom:12px">
      <b>${overdue} past due.</b> Listed first.</div>`:''}
    ${S.reqErr?`<p class="hint err">${esc(S.reqErr)}</p>`:''}

    ${open.length
      ? open.map(requestCard).join('')
      : `<p class="hint">Nothing waiting. Requests arrive through the form at
         <span class="mono">/request.html</span>.</p>`}

    ${done.length?`<p class="hint" style="margin-top:12px">
      <button class="linkbtn" id="reqDone" style="padding-left:0">${
        S.reqShowDone ? 'Hide' : 'Show'} ${done.length} finished</button></p>
      ${S.reqShowDone ? done.slice(0,20).map(requestCard).join('') : ''}`:''}
  </div>`;
}

function wireRequests(){
  document.querySelectorAll('[data-req]').forEach(el=>
    el.addEventListener('click',()=>setRequestStatus(el.dataset.req, el.dataset.val)));
  document.querySelectorAll('[data-reqopen]').forEach(el=>
    el.addEventListener('click',()=>{
      const id = el.dataset.reqopen;
      S.reqOpen[id] = !S.reqOpen[id]; render();
    }));
  const dn = document.getElementById('reqDone');
  if(dn) dn.addEventListener('click',()=>{ S.reqShowDone = !S.reqShowDone; render(); });
}

/* ================= approvals page ================= */

const APV_KINDS = { design:'Design', campaign:'Advertising campaign',
                    approach:'Project approach', copy:'Copy', other:'Other' };

function apvFileBlock(a){
  const url = a.file_path ? signedUrl('approvals', a.file_path) : null;
  const bits = [];
  if(a.file_name){
    const isImg = /^image\//.test(a.file_type||'') || /\.(png|jpe?g|gif|webp|svg)$/i.test(a.file_name);
    if(url && isImg){
      bits.push(`<img class="apv-thumb" src="${esc(url)}" alt="${esc(a.file_name)}" />`);
    }
    bits.push(`<div class="apv-file">
      ${url ? `<a class="chip" href="${esc(url)}" target="_blank" rel="noopener">Open ${esc(a.file_name)}</a>`
            : `<span class="chip">${esc(a.file_name)}</span>`}
      ${(url && !isImg) ? `<span class="hint">Opens in a new tab. The link renews itself while this page is open.</span>` : ''}
    </div>`);
  }
  if(a.link_url){
    bits.push(`<div class="apv-file"><a class="chip" href="${esc(a.link_url)}"
      target="_blank" rel="noopener">Open the link</a></div>`);
  }
  return bits.join('');
}

function approvalCard(a){
  const busy = S.apvBusy === a.id;
  const chain = apvChain(a);
  const prev = chain[0] || null;
  const showHist = !!S.apvHist[a.id];

  const badge = a.status === 'approved' ? `<span class="ebadge" style="border-color:var(--green);color:var(--green)">Approved</span>`
    : a.status === 'changes' ? `<span class="ebadge soon">Changes asked for</span>`
    : a.status === 'declined' ? `<span class="ebadge" style="border-color:var(--red);color:var(--red)">Declined</span>`
    : `<span class="ebadge">Waiting</span>`;

  const facts = [];
  if(Number(a.version) > 1) facts.push('Version ' + a.version);
  if(a.due_by)       facts.push('Needed by ' + esc(fmtDay(a.due_by + 'T12:00:00')));
  if(a.requested_by) facts.push(esc(a.requested_by));
  if(a.decided_at)   facts.push('Decided ' + esc(shortDate(a.decided_at)));

  /* Only the two most recent rounds sit in the card. Once a third
     version exists the second is the baseline, and comparing against
     the original stops being the useful comparison. Older rounds are
     kept and shown behind the toggle rather than deleted, because the
     point of versioning is the record of what changed and why. */
  const older = chain.slice(1);

  return `<article class="apv ${esc(a.status)} ${busy?'busy':''}">

    ${prev && prev.feedback ? `<div class="apv-prev">
      <span class="eyebrow">What Pat asked for on version ${esc(prev.version)}</span>
      <p>${esc(prev.feedback)}</p></div>` : ''}

    ${a.change_note ? `<div class="apv-mine">
      <span class="eyebrow">What changed</span>
      <p>${esc(a.change_note)}</p></div>` : ''}

    ${apvFileBlock(a)}

    ${a.status !== 'pending' && a.feedback ? `<div class="apv-prev">
      <span class="eyebrow">Pat's note</span>
      <p>${esc(a.feedback)}</p></div>` : ''}

    ${older.length ? `<div class="apv-hist">
      <button class="linkbtn" data-apv-hist="${a.id}" style="padding-left:0">${
        showHist ? 'Hide earlier versions' : `Earlier versions (${older.length})`}</button>
      ${showHist ? older.map(v=>`<div class="ver">
        <b>Version ${esc(v.version)}</b> &middot; <span class="muted">${esc(shortDate(v.created_at))}</span>
        ${v.change_note?`<div class="hint">Changed: ${esc(v.change_note)}</div>`:''}
        ${v.feedback?`<div class="hint">Pat: ${esc(v.feedback)}</div>`:''}
        ${v.file_path && signedUrl('approvals', v.file_path)
          ? `<a class="chip" href="${esc(signedUrl('approvals', v.file_path))}" target="_blank" rel="noopener">${esc(v.file_name||'File')}</a>`
          : (v.file_name?`<span class="chip">${esc(v.file_name)}</span>`:'')}
      </div>`).join('') : ''}
    </div>` : ''}

    <div class="apv-cost">
      <label class="q">Quantity
        <input type="text" inputmode="decimal" autocomplete="off" data-apv-qty="${a.id}"
               value="${esc(apvQtyText(a))}" /></label>
      <span class="x">&times;</span>
      <label class="c">Cost per item
        <input type="text" inputmode="decimal" autocomplete="off" data-apv-cost="${a.id}"
               value="${esc(apvCostText(a))}" placeholder="0.00" /></label>
      <div class="apv-line"><span class="eyebrow">Item total</span>
        <b data-apv-line="${a.id}">${line === null ? 'Not priced' : esc(apvMoney(line))}</b></div>
    </div>

    <div class="apv-foot">
      <div class="apv-acts">
        ${apvMine(a) ? (a.status === 'changes'
            ? `<button class="btn small accent" data-apv-reply="${a.id}" ${busy?'disabled':''}>Upload a new version</button>`
            : `<span class="hint">${a.status === 'pending' ? 'You sent this, so it waits for someone else to decide.' : 'You sent this.'}</span>`)
        : a.status === 'pending' ? `
