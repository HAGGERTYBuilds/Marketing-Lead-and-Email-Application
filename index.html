<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HAGGERTY Marketing</title>
<script>
  /* Set the saved theme before anything paints, so a dark-mode user never
     sees a white flash. */
  try{ const t = localStorage.getItem('hg-theme');
       if(t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; }catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C1B1A; --paper:#FAF9F7; --card:#FFFFFF;
    --rule:#DFDBD4; --rule-soft:#EDEAE5; --wash:#F6F4F1;
    --grey:#4D4D4D; --slate:#6E7477;
    --orange:#F68922; --orange-tint:#FEF3E7; --orange-ink:#B85C00;
    --green:#3F7D5C; --red:#A6402C;
    --hover:#FBFAF8; --gold-active:#FBE3C9; --hot-ink:#8A4A05;
    --on-ink:#FFFFFF; --ink-strong:#000000;
    /* The sidebar stays dark in both themes so the white logo reads. */
    --rail:#1E1D1B; --rail-on:#2E2B28; --rail-ink:#D6D1C9; --rail-dim:#8E8980; --rail-rule:#34312D;
    --display:"Barlow Condensed",system-ui,sans-serif;
    --body:"IBM Plex Sans",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
    /* Older blocks below were written against these two names. They were
       never defined, so every border and font that used them silently
       dropped out. Pointing them at the real tokens brings them back. */
    --line:var(--rule); --sans:var(--body);
    /* The review-card border (.ec-review) asked for --accent, which was
       never defined, so the border silently fell back to currentColor. */
    --accent:#F68922;
  }
  /* Dark mode. Follows the computer's setting unless someone picks Light
     or Dark in the sidebar, which sets data-theme on <html>. */
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --ink:#EEEAE4; --paper:#151413; --card:#1E1D1B;
    --rule:#3A3732; --rule-soft:#2C2A27; --wash:#262422;
    --grey:#C4BFB7; --slate:#9D988F;
    --orange-tint:#3A2814; --orange-ink:#F9A75C;
    --green:#6DB08A; --red:#E07A63;
    --hover:#262422; --gold-active:#4A3014; --hot-ink:#F9B572;
    --on-ink:#1C1B1A; --ink-strong:#FFFFFF;
    --rail:#0F0E0D; --rail-on:#24221F; --rail-rule:#2A2825;
    --accent:#F9A75C;
    color-scheme:dark }}
  :root[data-theme="dark"]{
    --ink:#EEEAE4; --paper:#151413; --card:#1E1D1B;
    --rule:#3A3732; --rule-soft:#2C2A27; --wash:#262422;
    --grey:#C4BFB7; --slate:#9D988F;
    --orange-tint:#3A2814; --orange-ink:#F9A75C;
    --green:#6DB08A; --red:#E07A63;
    --hover:#262422; --gold-active:#4A3014; --hot-ink:#F9B572;
    --on-ink:#1C1B1A; --ink-strong:#FFFFFF;
    --rail:#0F0E0D; --rail-on:#24221F; --rail-rule:#2A2825;
    --accent:#F9A75C;
    color-scheme:dark }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--body);
       font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  button{font-family:inherit}
  a{color:var(--grey)}

  .eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.09em;
           font-weight:600;font-size:13px;color:var(--slate)}
  .mono{font-family:var(--mono);font-size:12px}
  .muted{color:var(--slate)}
  .hint{font-size:12.5px;color:var(--slate)}
  .hint.err{color:var(--red)}

  /* ---------- chrome ---------- */
  .topbar{display:flex;align-items:center;gap:16px;padding:12px 22px;
          border-bottom:1px solid var(--rule);background:var(--card);
          position:sticky;top:0;z-index:30;flex-wrap:wrap}
  .wordmark{font-family:var(--display);font-weight:700;font-size:21px;
            letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
  .wordmark span{color:var(--orange)}
  .tabs{display:flex;gap:1px;flex-wrap:wrap}
  .tab{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;
       font-weight:600;font-size:14px;color:var(--slate);
       background:none;border:0;border-bottom:2px solid transparent;
       padding:6px 11px 5px;cursor:pointer;white-space:nowrap}
  .tab:hover{color:var(--ink)}
  .tab.on{color:var(--ink);border-bottom-color:var(--orange)}
  .spacer{flex:1}
  .tally{font-family:var(--mono);font-size:12px;color:var(--slate);white-space:nowrap}
  .tally b{color:var(--ink);font-weight:500}
  .linkbtn{background:none;border:none;color:var(--slate);font-size:13px;
           cursor:pointer;padding:4px 6px;text-decoration:underline}
  .linkbtn:hover{color:var(--ink)}

  .page{padding:24px 26px 90px;max-width:1240px}
  .page.wide{max-width:none}
  h2.sec{font-family:var(--display);text-transform:uppercase;letter-spacing:.09em;
         font-size:15px;font-weight:700;margin:0 0 10px;
         padding-bottom:7px;border-bottom:2px solid var(--ink)}
  .block{margin-bottom:28px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:26px}
  .cols3{display:grid;grid-template-columns:1.4fr 1fr;gap:26px}
  @media (max-width:960px){.cols,.cols3{grid-template-columns:1fr}}

  /* ---------- tables ---------- */
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--rule)}
  th{font-family:var(--display);text-transform:uppercase;letter-spacing:.07em;
     font-size:11.5px;color:var(--slate);font-weight:600;text-align:left;
     padding:8px 12px;border-bottom:1px solid var(--rule)}
  td{padding:9px 12px;font-size:13.5px;border-bottom:1px solid var(--rule-soft)}
  tr:last-child td{border-bottom:0}
  td.num,th.num{text-align:right;font-family:var(--mono);font-size:12.5px}
  .bar{height:6px;background:var(--rule-soft);position:relative;min-width:50px;display:block}
  .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--orange)}

  /* ---------- stats ---------- */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));
             gap:1px;background:var(--rule);border:1px solid var(--rule);margin-bottom:28px}
  .stat{background:var(--card);padding:15px 17px}
  .stat .k{font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;
           font-size:12px;color:var(--slate);font-weight:600}
  .stat .v{font-family:var(--display);font-size:31px;font-weight:700;line-height:1.15;margin-top:2px}
  .stat .v small{font-size:15px;color:var(--slate);font-weight:600}
  .stat.accent .v{color:var(--orange-ink)}
  /* Eight-figure dollar amounts ran past the screen edge on a phone. */
  @media (max-width:480px){ .stat .v{font-size:24px;overflow-wrap:anywhere} }

  /* ---------- board ---------- */
  .split{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 54px)}
  .board{border-right:1px solid var(--rule);background:var(--card)}
  .board-head{padding:13px 17px 9px;border-bottom:1px solid var(--rule-soft)}
  .row{display:block;width:100%;text-align:left;background:none;border:0;
       border-bottom:1px solid var(--rule-soft);padding:12px 17px 12px 15px;
       cursor:pointer;border-left:3px solid transparent}
  .row:hover{background:var(--hover)}
  .row.active{background:var(--orange-tint);border-left-color:var(--orange)}
  .row.done .name{color:var(--slate)}
  /* Pat's Gold: hand-picked, so it has to read differently at a glance from
     a scraped lead. Filled cell rather than a left rule, because the left
     rule already means "this row is open". */
  .row.gold{background:var(--orange-tint)}
  .row.gold .name::after{content:'GOLD';font-family:var(--mono);font-size:9px;
      letter-spacing:.08em;color:var(--orange-ink);margin-left:7px;vertical-align:1px}
  .row.gold.active{background:var(--gold-active)}
  .row-top{display:flex;align-items:baseline;gap:8px}
  .idx{font-family:var(--mono);font-size:11px;color:var(--slate);min-width:18px}
  .name{font-weight:600;font-size:14px}
  .org{font-size:12.5px;color:var(--slate);margin-left:26px;
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tick{margin-left:auto;color:var(--green);font-size:13px}
  /* A follow-up Pat did not clear on the day it was queued. It keeps its
     place on the board until it is dealt with, so the tag has to name the
     day it came from or it reads as new work. */
  .carry{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;
       color:var(--orange-ink);margin-left:26px;display:block;margin-top:3px}
  /* Skipped today. Collapsed by default so a heavily skipped morning does
     not bury the work, but never further away than one click. */
  .skipgroup{border-top:1px solid var(--rule);margin-top:6px}
  .skiphead{display:flex;width:100%;align-items:center;justify-content:space-between;
       gap:8px;background:none;border:0;cursor:pointer;padding:11px 17px;
       font-family:var(--mono);font-size:10px;letter-spacing:.08em;
       text-transform:uppercase;color:var(--slate);text-align:left}
  .skiphead:hover{background:var(--hover);color:var(--ink)}
  .skiphead .caret{font-size:9px}
  .row.skipped{background:var(--wash);opacity:.72}
  .row.skipped .name{font-weight:500;color:var(--slate);text-decoration:line-through}
  .row.skipped:hover{background:var(--wash);opacity:1}
  .row.skipped .undo{margin-left:auto;font-size:11px}
  .carry.back{color:var(--slate)}

  .who h1{font-family:var(--display);font-size:32px;font-weight:700;margin:0 0 2px;line-height:1.1}
  .who .role{color:var(--grey);font-size:15px}
  .who .org-line{margin-top:2px;font-size:14px;color:var(--slate)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:13px 0 0}
  .clicks{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0 0}
  .clicks .eyebrow{font-size:11.5px;color:var(--orange-ink)}
  .chip{font-family:var(--mono);font-size:11px;border:1px solid var(--rule);
        padding:3px 7px;color:var(--slate);background:var(--card);text-decoration:none}
  .chip.hot{border-color:var(--orange);color:var(--hot-ink);background:var(--orange-tint)}
  .chip.good{border-color:var(--green);color:var(--green)}
  .chip.bad{border-color:var(--red);color:var(--red)}
  .panelbox{margin:18px 0 24px;padding:13px 15px;background:var(--card);border:1px solid var(--rule)}
  .panelbox p{margin:6px 0 0;font-size:13.5px;color:var(--grey)}
  .panelbox .none{color:var(--slate);font-style:italic}

  .opt{background:var(--card);border:1px solid var(--rule);
       border-left:3px solid var(--rule);margin-bottom:10px}
  .opt.open{border-left-color:var(--grey)}
  .opt-head{display:flex;align-items:center;gap:10px;width:100%;background:none;
            border:0;padding:11px 13px;cursor:pointer;text-align:left}
  .opt-n{font-family:var(--mono);font-size:11px;color:var(--slate)}
  .opt-label{font-family:var(--display);text-transform:uppercase;
             letter-spacing:.08em;font-weight:600;font-size:13px}
  .opt-subject{flex:1;font-size:13px;color:var(--slate);
               white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .opt-body{padding:0 13px 13px;border-top:1px solid var(--rule-soft)}
  .field{margin-top:12px}
  .field label{display:block;font-family:var(--display);text-transform:uppercase;
               letter-spacing:.08em;font-size:12px;color:var(--slate);
               font-weight:600;margin-bottom:4px}
  input[type=text],input[type=password],input[type=email],textarea,select{
    width:100%;font-family:var(--body);font-size:14px;line-height:1.6;
    color:var(--ink);background:var(--paper);border:1px solid var(--rule);
    border-radius:0;padding:9px 11px;resize:vertical}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--orange);outline-offset:-1px}
  a:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  textarea{min-height:180px}
  .actions{display:flex;align-items:center;gap:12px;margin-top:13px;flex-wrap:wrap}
  .btn{font-family:var(--display);text-transform:uppercase;letter-spacing:.09em;
       font-weight:600;font-size:14px;background:var(--ink);color:var(--on-ink);border:0;
       padding:9px 18px;cursor:pointer}
  .btn:hover{background:var(--ink-strong)}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .btn.small{font-size:12.5px;padding:6px 12px}
  .btn.ghost{background:none;color:var(--grey);border:1px solid var(--rule)}
  .btn.ghost:hover{background:var(--wash);color:var(--ink)}
  .btn.accent{background:var(--orange);color:#fff}
  .btn.accent:hover{background:#DE7A16}
  .previewbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;
              background:var(--orange-tint);border-bottom:1px solid var(--orange);color:var(--hot-ink);font-size:13.5px}
  .previewbar span{flex:1;min-width:0}
  .revtodo{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--orange);
           padding:14px 17px;margin:0 0 14px}
  .revtodo h3{margin:0 0 6px;font-size:15px}
  .revtodo ol{margin:6px 0 0;padding-left:20px;color:var(--grey);font-size:13.5px;line-height:1.55}
  .done-banner{background:var(--card);border:1px solid var(--rule);
               border-left:3px solid var(--green);padding:15px 17px;margin-bottom:18px}
  .done-banner .eyebrow{color:var(--green)}
  .done-banner p{margin:6px 0 0;font-size:14px;color:var(--grey)}

  /* ---------- tiles ---------- */
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .tile{background:var(--card);border:1px solid var(--rule);border-top:3px solid var(--rule);
        padding:14px 15px;display:flex;flex-direction:column;gap:2px}
  .tile.live{border-top-color:var(--orange)}
  .tile h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.07em;
           font-size:16px;font-weight:700;margin:0}
  .tile .pool{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.1}
  .tile .pool small{font-size:13px;color:var(--slate);font-weight:600;letter-spacing:.04em}
  .tile .meta{font-family:var(--mono);font-size:11px;color:var(--slate);margin-top:2px}
  .tile .foot{margin-top:11px;display:flex;align-items:center;gap:8px}
  .tile.empty{opacity:.62}

  /* ---------- calendar ---------- */
  .day{border-top:1px solid var(--rule);background:var(--card)}
  .day:first-child{border-top:0}
  .day-head{display:flex;align-items:baseline;gap:10px;padding:9px 14px 7px;
            background:var(--wash);border-bottom:1px solid var(--rule-soft)}
  .day-head .d{font-family:var(--display);text-transform:uppercase;
               letter-spacing:.08em;font-weight:700;font-size:13px}
  .day-head .n{font-family:var(--mono);font-size:11px;color:var(--slate)}
  .day-head.today .d{color:var(--orange-ink)}
  .ev{display:flex;align-items:baseline;gap:12px;padding:9px 14px;
      border-bottom:1px solid var(--rule-soft)}
  .ev:last-child{border-bottom:0}
  .ev .t{font-family:var(--mono);font-size:12px;color:var(--slate);min-width:62px;flex-shrink:0}
  .ev .s{flex:1;font-size:13.5px}
  .ev .s em{font-style:normal;color:var(--slate);font-size:12.5px}
  .kind{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;
        letter-spacing:.05em;padding:2px 6px;border:1px solid var(--rule);
        color:var(--slate);flex-shrink:0}
  .kind.meeting{border-color:var(--orange);color:var(--hot-ink);background:var(--orange-tint)}
  .kind.networking{border-color:var(--green);color:var(--green)}
  .kind.site_visit{border-color:var(--ink);color:var(--ink)}
  .scroll{max-height:560px;overflow-y:auto;border:1px solid var(--rule)}
  .scroll.short{max-height:330px}

  /* ---------- tasks ---------- */
  .task{display:flex;align-items:flex-start;gap:11px;padding:10px 13px;
        background:var(--card);border:1px solid var(--rule);
        border-left:3px solid var(--rule);margin-bottom:7px}
  .task.doing{border-left-color:var(--orange);background:var(--orange-tint)}
  .task.done{border-left-color:var(--green);opacity:.6}
  .task.done .tt{text-decoration:line-through}
  .box{width:17px;height:17px;border:1.5px solid var(--slate);background:none;
       cursor:pointer;flex-shrink:0;margin-top:2px;padding:0;line-height:1}
  .task.done .box{background:var(--green);border-color:var(--green);color:#fff;font-size:11px}
  .task .mid{flex:1;min-width:0}
  .tt{font-size:14px}
  .tmeta{font-family:var(--mono);font-size:11px;color:var(--slate);margin-top:2px}
  .pri1{color:var(--red);font-weight:500}
  .taskbar{display:grid;grid-template-columns:1fr 130px 96px auto;gap:8px;
           margin-bottom:16px;align-items:end}

  /* ---------- subtasks ---------- */
  .subs{display:block;margin-top:9px;padding-left:2px;
        border-left:2px solid var(--rule-soft)}
  .sub{display:flex;align-items:center;gap:9px;padding:4px 0 4px 10px}
  .sub .st{flex:1;font-size:13px;color:var(--grey);min-width:0}
  .sub.done .st{text-decoration:line-through;color:var(--slate)}
  .box.sm{width:14px;height:14px;margin-top:0;font-size:9px}
  .sub.done .box.sm{background:var(--green);border-color:var(--green);color:#fff}
  .sub .linkbtn{font-size:11.5px;opacity:0}
  .sub:hover .linkbtn{opacity:1}
  .subadd{display:flex;gap:7px;align-items:center;margin-top:9px;
          padding-left:12px;flex-wrap:wrap}
  .subadd input{flex:1;min-width:160px;font-size:13px;padding:6px 9px}
  .subctl{display:flex;gap:12px;margin-top:7px}
  .subctl .linkbtn{font-size:12px;padding-left:0}
  .task .mid .bar{max-width:260px}

  /* ---------- drag to reorder ---------- */
  .grip{flex-shrink:0;width:14px;margin:1px -4px 0 -6px;cursor:grab;
        color:var(--slate);opacity:.45;font-size:14px;line-height:1;
        letter-spacing:-3px;user-select:none;touch-action:none;text-align:center}
  .task:hover .grip{opacity:1}
  .grip:active{cursor:grabbing}
  .task.dragging{opacity:.85;box-shadow:0 6px 18px rgba(0,0,0,.14);
                 position:relative;z-index:5;border-left-color:var(--orange)}
  body.reordering{cursor:grabbing;user-select:none}
  @media (hover:none){.grip{opacity:.8;width:22px;font-size:17px}}
  @media (max-width:700px){.taskbar{grid-template-columns:1fr}}

  /* ---------- warnings ---------- */
  .warn{background:var(--card);border:1px solid var(--rule);
        border-left:3px solid var(--red);padding:10px 13px;margin-bottom:8px;
        font-size:13.5px;color:var(--grey)}
  .warn b{color:var(--red)}
  .warn.soft{border-left-color:var(--orange)}
  .warn.soft b{color:var(--hot-ink)}
  .warn.info{border-left-color:var(--slate)}
  .warn.info b{color:var(--ink)}
  .warn .when{font-family:var(--mono);font-size:11.5px;color:var(--slate)}
  .prev{margin-top:14px;border:1px solid var(--rule);background:var(--card)}
  .prev-head{padding:9px 13px;border-bottom:1px solid var(--rule-soft);
             display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .prev-body{padding:4px 13px 10px;max-height:280px;overflow-y:auto;
             font-size:13px;color:var(--grey)}
  .prev-body p{margin:0 0 10px}

  /* ---------- deal board ---------- */
  .kswitch{display:flex;gap:1px}
  .kswitch button{font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;
                  font-weight:600;font-size:13px;background:none;border:1px solid var(--rule);
                  color:var(--slate);padding:6px 14px;cursor:pointer}
  .kswitch button.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
  .bwrap{display:flex;gap:10px;overflow-x:auto;align-items:flex-start;padding-bottom:16px}
  .bcol{flex:0 0 244px;background:var(--wash);border:1px solid var(--rule)}
  .bcol-head{padding:9px 11px 8px;background:var(--card);border-bottom:1px solid var(--rule)}
  .bcol-head h4{font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;
                font-size:13.5px;font-weight:700;margin:0;white-space:nowrap;
                overflow:hidden;text-overflow:ellipsis}
  .bcol-head .m{font-family:var(--mono);font-size:11px;color:var(--slate);display:block;margin-top:1px}
  .bcol-body{padding:8px;display:flex;flex-direction:column;gap:7px;
             max-height:60vh;overflow-y:auto}
  .bcol-body .none{font-size:12px;color:var(--slate);font-style:italic;padding:6px 2px}
  .dcard{display:block;width:100%;text-align:left;background:var(--card);cursor:grab;
         border:1px solid var(--rule);border-left:3px solid var(--rule);padding:9px 10px}
  .dcard:hover{background:var(--hover)}
  .dcard:active{cursor:grabbing}
  .dcard.dragging{opacity:.35}
  .bcol.over{outline:2px solid var(--orange);outline-offset:-2px;background:var(--orange-tint)}
  .bcol.over .bcol-body{min-height:60px}
  .dcard.mine{border-left-color:var(--orange)}
  .dcard h5{font-size:13.5px;font-weight:600;margin:0 0 2px;line-height:1.3}
  .dcard .who{font-size:12px;color:var(--slate);line-height:1.35}
  .dcard .val{font-family:var(--mono);font-size:12px;margin-top:5px}
  .orghit{display:block;width:100%;text-align:left;background:none;border:0;
          border-bottom:1px solid var(--rule-soft);padding:7px 9px;cursor:pointer;font-size:13px}
  .orghit:hover{background:var(--wash)}

  /* ---------- sector strip ---------- */
  .sectorbar{display:flex;gap:8px;overflow-x:auto;padding:11px 26px;
             background:var(--card);border-bottom:1px solid var(--rule)}
  .sec-tile{flex:0 0 auto;min-width:132px;background:var(--card);
            border:1px solid var(--rule);border-top:3px solid var(--rule);padding:8px 11px 9px}
  .sec-tile.live{border-top-color:var(--orange)}
  .sec-tile.all{border-top-color:var(--ink)}
  .sec-tile.gold{border-top-color:var(--orange);background:var(--orange-tint)}
  .sec-tile.gold.on{background:var(--orange);border-color:var(--orange)}
  .sec-tile.gold.on h4,.sec-tile.gold.on .n{color:#fff}
  .sec-tile.gold.on .n small{color:#FBE3C9}
  .sec-tile h4{font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;
               font-size:12.5px;font-weight:700;margin:0;white-space:nowrap}
  .sec-tile .n{font-family:var(--display);font-size:21px;font-weight:700;line-height:1.15}
  .sec-tile .n small{font-family:var(--mono);font-size:10.5px;color:var(--slate);font-weight:400}
  .sec-tile .btn{margin-top:6px;width:100%}
  @media (max-width:820px){ .sectorbar{padding:10px 16px} }

  /* ---------- leads ---------- */
  .filters{display:flex;gap:4px;flex-wrap:wrap}
  .filt{font-family:var(--mono);font-size:12px;background:none;cursor:pointer;
        border:1px solid var(--rule);padding:5px 10px;color:var(--slate)}
  .filt.on{border-color:var(--orange);color:var(--ink);background:var(--orange-tint)}
  .filt b{font-weight:500;margin-left:6px;opacity:.7}

  .lead{display:grid;grid-template-columns:36px 1fr;background:var(--card);
        border:1px solid var(--rule);border-left:3px solid var(--rule);margin-bottom:9px}
  .lead.keep{border-left-color:var(--orange)}
  .lead.flag{border-left-color:var(--red)}
  .lead.gold{border-left-color:var(--orange);background:var(--orange-tint)}

  /* CRM search */
  .crmbox{position:relative;display:flex;align-items:center;margin-left:16px}
  .crmbox input{width:min(340px,100%);border:1px solid var(--line);background:var(--card);
      padding:6px 26px 6px 10px;font-size:12px;font-family:var(--sans);color:var(--ink)}
  .crmbox input:focus{outline:none;border-color:var(--ink)}
  .crmx{position:absolute;right:4px;border:0;background:none;cursor:pointer;
      color:var(--slate);font-size:16px;line-height:1;padding:0 4px}
  .crmwrap{position:relative;z-index:40}
  .crmres{position:absolute;top:6px;right:16px;width:min(560px,calc(100vw - 32px));
      max-height:70vh;overflow:auto;background:var(--card);border:1px solid var(--ink);
      box-shadow:0 12px 32px rgba(0,0,0,.14);padding:12px 14px}
  .crmres-head{display:flex;justify-content:space-between;align-items:center;
      margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .hit{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
      padding:9px 0;border-bottom:1px solid var(--line)}
  .hit:last-child{border-bottom:0}
  .hit.gold{background:var(--orange-tint);margin:0 -14px;padding-left:14px;padding-right:14px}
  .hit-main{min-width:0}
  .hit-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .hit-kind{font-family:var(--mono);font-size:9px;letter-spacing:.08em;
      color:var(--slate);text-transform:uppercase}
  .hit-sub{font-size:12px;color:var(--slate);margin-top:2px}
  .hit-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:3px;
      font-family:var(--mono);font-size:11px;color:var(--slate)}
  .hit-none{font-family:var(--mono);font-size:10px;color:var(--slate);white-space:nowrap}

  /* Add one lead */
  .addlead{margin:10px;padding:12px;border:1px solid var(--line);background:var(--paper)}
  .addlead.busy{opacity:.55;pointer-events:none}
  .addlead .field{margin-bottom:8px}
  .addlead .field label{display:block;font-family:var(--mono);font-size:10px;
      letter-spacing:.06em;text-transform:uppercase;color:var(--slate);margin-bottom:3px}
  .addlead input[type=text],.addlead input[type=email],.addlead select{
      width:100%;border:1px solid var(--line);background:var(--card);padding:6px 8px;
      font-size:12px;font-family:var(--sans);color:var(--ink)}
  .alcheck{display:flex;align-items:center;gap:7px;margin:10px 0;font-size:12px}
  .alfoot{display:flex;gap:8px;align-items:center;margin-top:8px}

  /* Undo last approval */
  .revert{margin:14px 10px 20px;padding:12px;border:1px solid var(--line);
      background:var(--paper)}
  .revert-n{font-family:var(--mono);font-size:16px;margin:4px 0 8px}
  .revert-n small{font-size:11px;color:var(--slate);font-weight:400}
  .revert-btns{display:flex;gap:8px;align-items:center;margin-top:8px}

  /* Label editor */
  .lbl-row{display:flex;align-items:center;gap:10px;margin-top:10px;
      padding-top:10px;border-top:1px solid var(--line);flex-wrap:wrap}
  .lbl-cur{display:flex;gap:5px;flex-wrap:wrap;flex:1;min-width:0}
  .lbl-cur .none{color:var(--slate);font-size:12px}
  .chip.warnchip{border-color:var(--red);color:var(--red)}
  .lbl-edit{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  .lbl-edit.busy{opacity:.55;pointer-events:none}
  .lbl-grp{margin-bottom:10px}
  .lbl-opts{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
  .lbl-opt{border:1px solid var(--line);background:var(--card);padding:4px 9px;
      font-size:12px;cursor:pointer;color:var(--slate)}
  .lbl-opt.on{border-color:var(--ink);background:var(--ink);color:var(--on-ink)}
  .lbl-opt.ex.on{border-color:var(--red);background:var(--red);color:#fff}
  .lbl-foot{display:flex;justify-content:space-between;align-items:center;
      gap:10px;flex-wrap:wrap;margin-top:4px}

  /* Event invites */
  .kswitch .dot{display:inline-block;min-width:16px;padding:0 4px;margin-left:5px;
      border-radius:8px;background:var(--orange);color:#fff;
      font-family:var(--mono);font-size:10px;line-height:16px;text-align:center}
  .fchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .fchip{border:1px solid var(--line);background:var(--card);padding:5px 11px;
      font-size:12px;cursor:pointer;color:var(--slate)}
  .fchip b{font-family:var(--mono);margin-left:4px;color:var(--ink)}
  .fchip.on{border-color:var(--ink);color:var(--ink)}
  .inv-list{display:flex;flex-direction:column;gap:10px}
  .inv{border:1px solid var(--line);border-left:3px solid var(--line);
      background:var(--card);padding:14px 16px}
  .inv.busy{opacity:.55}
  .inv.going{border-left-color:var(--orange)}
  .inv.passed{opacity:.55}
  .inv-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .inv-head h4{margin:0;font-size:15px}
  .inv-org{color:var(--slate);font-size:12px;margin-top:2px}
  .ebadge{font-family:var(--mono);font-size:10px;letter-spacing:.06em;
      border:1px solid var(--line);padding:3px 7px;white-space:nowrap;color:var(--slate)}
  .ebadge.soon{border-color:var(--orange);color:var(--orange-ink)}
  .ebadge.past{border-color:var(--line);color:var(--slate)}
  .inv-facts{font-family:var(--mono);font-size:11px;color:var(--slate);margin-top:8px}
  .inv-sum{margin:8px 0 0;font-size:13px;line-height:1.5}
  .inv-lvl{margin-top:8px;font-size:12px;color:var(--slate)}
  .inv-lvl b{color:var(--ink)}
  .inv-foot{display:flex;justify-content:space-between;align-items:center;
      gap:10px;margin-top:12px;flex-wrap:wrap}
  .inv-acts{display:flex;gap:5px;flex-wrap:wrap}
  .inv-links{display:flex;gap:6px;align-items:center}
  .inv-box{font-family:var(--mono);font-size:10px;color:var(--slate)}

  /* ---------- approvals ---------- */
  /* Deliberately the same shape as .inv. Pat already reads invite cards,
     so an approval that looks like something else is a thing to learn
     rather than a thing to use. */
  .apv{border:1px solid var(--rule);border-left:3px solid var(--rule);
       background:var(--card);padding:14px 16px;margin-bottom:10px}
  .apv.busy{opacity:.55;pointer-events:none}
  .apv.approved{border-left-color:var(--green)}
  .apv.changes{border-left-color:var(--orange)}
  .apv.declined{border-left-color:var(--red);opacity:.7}
  .apv-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .apv-head h4{margin:0;font-size:15px}
  .apv-kind{color:var(--slate);font-size:12px;margin-top:2px}
  .apv-desc{margin:9px 0 0;font-size:13.5px;line-height:1.5;color:var(--grey)}
  .apv-file{display:flex;align-items:center;gap:9px;margin-top:11px;flex-wrap:wrap}
  .apv-prev{margin-top:12px;padding:10px 12px;background:var(--wash);
            border-left:3px solid var(--orange)}
  .apv-prev .eyebrow{color:var(--hot-ink)}
  .apv-prev p{margin:5px 0 0;font-size:13px;color:var(--grey);white-space:pre-wrap}
  .apv-mine{margin-top:10px;padding:10px 12px;background:var(--wash);
            border-left:3px solid var(--slate)}
  .apv-mine p{margin:5px 0 0;font-size:13px;color:var(--grey);white-space:pre-wrap}
  .apv-foot{display:flex;justify-content:space-between;align-items:center;
            gap:10px;margin-top:13px;flex-wrap:wrap}
  .apv-acts{display:flex;gap:5px;flex-wrap:wrap}
  .apv-hist{margin-top:11px;border-top:1px solid var(--rule-soft);padding-top:10px}
  .apv-hist .ver{padding:7px 0;border-bottom:1px solid var(--rule-soft);font-size:13px}
  .apv-hist .ver:last-child{border-bottom:0}
  /* Quantity and cost sit on the card itself and save as they are
     changed. The item total and the page total are worked out from
     them and are never typed in. */
  .apv-cost{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-top:13px;
            padding-top:11px;border-top:1px solid var(--rule-soft)}
  .apv-cost label{display:block;font-family:var(--display);text-transform:uppercase;
                  letter-spacing:.08em;font-size:11px;color:var(--slate);font-weight:600}
  .apv-cost input[type=text]{display:block;margin-top:3px;padding:6px 9px;font-size:14px;
                  font-variant-numeric:tabular-nums}
  .apv-cost .q input[type=text]{width:84px}
  .apv-cost .c input[type=text]{width:128px}
  .apv-cost input.bad{outline:2px solid var(--red);outline-offset:-1px}
  .apv-cost .x{padding-bottom:8px;color:var(--slate)}
  .apv-line{margin-left:auto;text-align:right}
  .apv-line b{display:block;font-size:16px;font-variant-numeric:tabular-nums;margin-top:3px}
  .apv-total{display:flex;justify-content:space-between;align-items:center;gap:14px;
             flex-wrap:wrap;margin-top:16px;padding:14px 16px;background:var(--wash);
             border:1px solid var(--rule);border-top:3px solid var(--ink)}
  .apv-total b{font-size:22px;font-variant-numeric:tabular-nums}
  .apv-pair{display:flex;gap:12px}
  .apv-pair .field{flex:1}
  .apv-thumb{max-width:100%;max-height:340px;display:block;margin-top:11px;
             border:1px solid var(--rule)}
  .tab .badge{display:inline-block;min-width:16px;padding:0 4px;margin-left:5px;
      border-radius:8px;background:var(--orange);color:#fff;
      font-family:var(--mono);font-size:10px;line-height:16px;text-align:center}
  .chip.gold{border-color:var(--orange);background:var(--orange);color:#fff}
  .lead .pick{display:flex;align-items:flex-start;justify-content:center;
              padding-top:16px;cursor:pointer}
  .lead .pick input{width:16px;height:16px;accent-color:var(--orange);cursor:pointer;margin:0}
  tr.picked td{background:var(--orange-tint)}
  .sorth{font:inherit;background:none;border:0;padding:0;cursor:pointer;
         color:var(--slate);text-transform:inherit;letter-spacing:inherit}
  .sorth:hover{color:var(--ink)}
  .sorth.on{color:var(--ink)}
  th .sorth{font-family:var(--display);text-transform:uppercase;
            letter-spacing:.07em;font-size:11.5px;font-weight:600}
  .lead .lbody{padding:13px 15px 12px 0;min-width:0}
  .lhead{display:flex;align-items:flex-start;gap:10px}
  .lhead h3{font-family:var(--display);font-size:20px;font-weight:700;margin:0;line-height:1.15}
  .lhead .role{font-size:13px;color:var(--slate);margin-top:1px}
  .lhead .headline{font-size:12.5px;color:var(--grey);font-style:italic;margin-top:3px;
                   overflow:hidden;text-overflow:ellipsis;display:-webkit-box;
                   -webkit-line-clamp:2;-webkit-box-orient:vertical}
  .fit{font-family:var(--display);font-size:23px;font-weight:700;color:var(--orange-ink);
       margin-left:auto;line-height:1;flex-shrink:0}
  .facts{display:flex;flex-wrap:wrap;gap:0 22px;margin:11px 0 0}
  .facts dt{font-family:var(--display);text-transform:uppercase;letter-spacing:.07em;
            font-size:11px;color:var(--slate);font-weight:600}
  .facts dd{margin:0;font-size:13.5px}
  .more{margin-top:12px;padding-top:11px;border-top:1px solid var(--rule-soft)}
  .more p{margin:0 0 7px;font-size:13.5px;color:var(--grey)}

  .actionbar{position:sticky;bottom:0;z-index:20;display:flex;align-items:center;
             gap:14px;flex-wrap:wrap;background:var(--card);
             border-top:1px solid var(--rule);padding:11px 26px;
             margin:0 -26px;box-shadow:0 -6px 18px rgba(0,0,0,.06)}
  .actionbar .count{font-family:var(--mono);font-size:12.5px;color:var(--slate)}
  .actionbar .count b{font-family:var(--display);font-size:19px;color:var(--ink)}
  .actionbar .grp{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
  .prog{display:block;height:3px;background:var(--rule-soft);width:100%}
  .prog i{display:block;height:100%;background:var(--orange)}

  .sheet{position:fixed;inset:0;z-index:40;background:rgba(28,27,26,.45);
         display:flex;align-items:flex-start;justify-content:center;
         padding:44px 16px;overflow:auto}
  .sheet-in{width:100%;max-width:450px;background:var(--card);
            border:1px solid var(--rule);padding:24px 26px 26px}
  .sheet-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .sheet-head h2{font-family:var(--display);font-size:23px;font-weight:700;margin:0}
  .sheet-foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--rule)}
  .sheet-foot .btn{width:100%}
  .sheet-in.wide{max-width:580px}

  /* ---------- photo approvals ---------- */
  .pho-list{border-top:1px solid var(--rule)}
  .pho-row{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;
           border-bottom:1px solid var(--rule);padding:10px 4px;cursor:pointer;text-align:left;
           font-family:var(--body);color:var(--ink)}
  .pho-row:hover{background:var(--wash)}
  .pho-cover{width:64px;height:48px;flex:none;background:var(--wash);overflow:hidden}
  .pho-cover img{width:100%;height:100%;object-fit:cover;display:block}
  .pho-main{flex:1;min-width:0;display:flex;flex-direction:column}
  .pho-main b{font-weight:600;font-size:14.5px}
  .pho-meta{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .pho-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
  .pho-tile{margin:0;background:var(--card);border:1px solid var(--rule)}
  .pho-tile.ok{border-color:var(--green)}
  .pho-tile.no{border-color:var(--red)}
  .pho-tile img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--wash)}
  .pho-tile figcaption{padding:8px 10px 10px;font-size:13px}
  .pho-why{margin:6px 0 0;color:var(--grey)}
  .pho-fn{display:block;margin-top:6px;font-size:11.5px;color:var(--slate);
          overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pho-picked{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:4px;margin-top:8px;
              max-height:190px;overflow:auto}
  .pho-picked span{aspect-ratio:1;background:var(--wash);overflow:hidden}
  .pho-picked img{width:100%;height:100%;object-fit:cover;display:block}
  @media (max-width:640px){ .pho-row{flex-wrap:wrap} .pho-meta{width:100%;justify-content:flex-start} }

  /* ---------- executive voices ---------- */
  .exv-seg{display:inline-flex;border:1px solid var(--rule)}
  .exv-seg button{font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-weight:600;
                  font-size:12.5px;background:var(--card);border:0;color:var(--slate);padding:6px 11px;cursor:pointer}
  .exv-seg button + button{border-left:1px solid var(--rule)}
  .exv-seg button.on{background:var(--ink);color:var(--on-ink)}
  .exv-views{margin:-2px 0 16px;border-bottom:1px solid var(--rule)}
  .exv-q{font-family:var(--display);font-size:28px;line-height:1.15;font-weight:700;margin:0 0 10px}
  .exv-people{border-top:1px solid var(--rule)}
  .exv-person{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:11px 2px;border-bottom:1px solid var(--rule)}
  .exv-who{flex:1;min-width:200px;display:flex;flex-direction:column}
  .exv-who b{font-weight:600}
  .exv-angle{font-size:12.5px;color:var(--grey);margin-top:2px}
  .exv-acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .exv-ans,.exv-piece{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--orange);
                      padding:13px 15px;margin-bottom:14px}
  .exv-ans.bad{border-left-color:var(--red)}
  .exv-ans.dim{opacity:.6;border-left-color:var(--rule)}
  .exv-piece{border-left-color:var(--ink)}
  .exv-ans-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .exv-ans audio{width:100%;max-width:520px;margin:4px 0 8px;display:block}
  .exv-photo img{max-width:220px;max-height:160px;display:block;border:1px solid var(--rule);margin:4px 0 8px}
  .exv-quote{margin:6px 0 12px;padding:4px 0 4px 14px;border-left:3px solid var(--orange);
             font-family:var(--display);font-size:20px;line-height:1.3;color:var(--ink)}
  .exv-check{background:var(--orange-tint);padding:9px 12px;margin:0 0 12px;font-size:13px}
  .exv-check ul{margin:4px 0 0;padding-left:18px}
  .exv-check p{margin:4px 0 0}
  .exv-tabs{display:flex;gap:2px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--rule-soft);margin-bottom:8px}
  .exv-tabs button:not(.linkbtn),.exv-use button{font-family:var(--display);text-transform:uppercase;letter-spacing:.07em;font-weight:600;
       font-size:12px;background:none;border:0;border-bottom:2px solid transparent;color:var(--slate);padding:6px 9px;cursor:pointer}
  .exv-tabs button.on{color:var(--ink);border-bottom-color:var(--orange)}
  .exv-use{display:inline-flex;border:1px solid var(--rule)}
  .exv-use button{border:0;padding:4px 9px}
  .exv-use button.on{background:var(--ink);color:var(--on-ink)}
  .exv-text{white-space:pre-wrap;font-size:14px;line-height:1.6;max-height:420px;overflow:auto;color:var(--ink)}
  .exv-ptable{display:grid;gap:12px}
  .exv-prow{background:var(--card);border:1px solid var(--rule);padding:4px 15px 13px}
  .exv-prow.dim{opacity:.6}
  .exv-prow > .eyebrow{display:block;margin-top:10px}
  .exv-check-l{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--grey)}
  .exv-check-l input{width:auto}
  .exv-pick{border:1px solid var(--rule);max-height:340px;overflow:auto}
  .exv-pick-row{padding:8px 10px;border-bottom:1px solid var(--rule-soft)}
  .exv-pick-row:last-child{border-bottom:0}
  .exv-pick-row.on{background:var(--orange-tint)}
  .exv-pick-row label{display:flex;align-items:baseline;gap:7px;cursor:pointer;font-size:14px}
  .exv-pick-row label input{width:auto}
  .exv-pick-row input[type=text]{margin-top:6px;font-size:13px;padding:6px 9px}

  /* ---------- event invitations ---------- */

    color:var(--ink);background:var(--paper);border:1px solid var(--rule);padding:6px 10px}

  /* ---------- social calendar ---------- */
  .soc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .soccard{background:var(--card);border:1px solid var(--rule);border-top:3px solid var(--rule);
           display:flex;flex-direction:column}

  .socmixform .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px 14px;margin:8px 0 10px}
  .socmixform label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--slate)}

            cursor:pointer;display:block;overflow:hidden}

  .socthumb .none{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
                  color:#9AA3A8;font-size:13px}
  .soctag{position:absolute;top:9px;left:9px;display:flex;gap:5px;flex-wrap:wrap}
  .soctag .chip{background:var(--card)}
  .socbody{padding:11px 13px 10px;display:flex;flex-direction:column;gap:6px;flex:1}
  .socbody .d{font-family:var(--display);text-transform:uppercase;letter-spacing:.09em;
              font-weight:600;font-size:13.5px}
  .socbody .t{font-family:var(--mono);font-size:11px;color:var(--slate)}
  .socbody p{margin:0;font-size:13px;color:var(--grey);line-height:1.5;display:-webkit-box;
             -webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .socfoot{display:flex;gap:6px;padding:0 13px 12px}
  .socstrip{margin-bottom:16px}
  .socres{margin:0 13px 12px;padding:8px 10px;background:var(--paper);border:1px solid var(--rule);
          display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--grey);
          font-variant-numeric:tabular-nums}
  .socres > div{display:grid;grid-template-columns:78px minmax(0,1fr);gap:8px;align-items:baseline}

             font-weight:600;color:var(--slate);text-decoration:none}

  .soccard.result{border-top-color:var(--orange)}

           font-size:11px;padding:3px 7px}

  .sheet-in.soc{max-width:1040px;padding:0}

  .socmedia{padding:16px 20px;background:var(--wash);display:flex;flex-direction:column;gap:12px;
            max-height:76vh;overflow:auto}
  .socitem{background:var(--card);border:1px solid var(--rule);flex:0 0 auto}
  .socmedia > .filebtn{flex:0 0 auto}
  .socitem img,.socitem video{width:100%;max-height:320px;object-fit:contain;background:#000;display:block}
  .socitem .socbar{display:flex;gap:6px;align-items:center;padding:8px 10px;flex-wrap:wrap}
  .socitem .socbar .n{font-family:var(--mono);font-size:11px;color:var(--slate);margin-right:auto}
  .socside{padding:16px 20px 20px;border-left:1px solid var(--rule);display:flex;flex-direction:column;
           max-height:76vh;overflow:auto}

  .filebtn{position:relative;overflow:hidden;display:inline-block;cursor:pointer;text-align:center}
  .filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
  .socmonth{font-family:var(--display);font-weight:700;font-size:21px;text-transform:uppercase;
            letter-spacing:.06em;min-width:190px;text-align:center}

    .socside{border-left:0;border-top:1px solid var(--rule);max-height:none}

  /* ---------- permits ---------- */
  .permit-list{display:flex;flex-direction:column;gap:10px}
  .permit{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--rule);
          padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 16px}
  .permit.project{border-left-color:var(--orange)}

  .permit h4{margin:2px 0 0;font-size:14.5px;font-weight:600;line-height:1.35}
  .permit .addr{font-size:13px;color:var(--grey)}
  .permit .desc{font-size:13px;color:var(--grey);line-height:1.5;margin:4px 0 0;
                display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .permit .desc.open{display:block}
  .permit .nums{font-family:var(--mono);font-size:11px;color:var(--slate);margin-top:4px}
  .permit .acts{display:flex;flex-direction:column;gap:6px;align-items:stretch;justify-content:flex-start;
                grid-column:2;grid-row:2/span 8;min-width:118px}

  .permit .addr{margin-top:3px}
  .permit .acts .btn{text-align:center;text-decoration:none}

  .permit .ppro .lbl{font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;
                     font-size:10.5px;color:var(--slate);margin-right:6px}
  .permit .ppro .sub{font-size:12px;color:var(--grey);margin-top:2px}
  .permit .ppro.none{background:none;border:0;padding:0;color:var(--slate);font-size:12px}
  .permit .pnote{font-size:13px;margin-top:6px;color:var(--ink)}
  .permit .psend{margin-top:8px;display:flex;flex-direction:column;gap:6px}
  .permit .psend textarea{width:100%;font:inherit;font-size:13px}
  .permit .psend div{display:flex;gap:10px;align-items:center}
  @media (max-width:640px){
    .permit{grid-template-columns:1fr}
    .permit .acts{grid-column:1;grid-row:auto;flex-direction:row;flex-wrap:wrap;min-width:0;margin-top:8px}
  }

  /* ---------- reel ideas ---------- */
  .reel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:14px}
  .reelcard{background:var(--card);border:1px solid var(--rule);
            border-top:3px solid var(--rule);display:flex;flex-direction:column}
  .reelcard.rhino{border-top-color:var(--orange)}
  .reelcard.both{border-top-color:var(--grey)}
  .reelcard.archived{opacity:.62}
  .reelthumb{position:relative;width:100%;aspect-ratio:3/4;background:var(--wash);
             border:0;padding:0;display:block;cursor:pointer;overflow:hidden;
             border-bottom:1px solid var(--rule-soft)}
  .reelthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .reelph{position:absolute;inset:0;display:flex;flex-direction:column;
          align-items:center;justify-content:center;gap:10px;padding:14px;background:var(--wash)}

               padding:40px 14px 14px;gap:8px}

             display:flex;align-items:center;justify-content:center;
             color:var(--slate);font-size:14px;padding-left:3px}
  .reelph .p{font-family:var(--display);text-transform:uppercase;letter-spacing:.09em;
             font-size:11.5px;color:var(--slate);font-weight:600}
  .reelph .x{font-size:13px;color:var(--grey);line-height:1.5;
             display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden}
  .reeltag{position:absolute;top:9px;left:9px;display:flex;gap:5px;flex-wrap:wrap}
  .reeltag .chip{background:var(--card)}
  .reelbody{padding:11px 13px 12px;display:flex;flex-direction:column;gap:5px;flex:1}
  .reelbody h4{margin:0;font-size:13.5px;font-weight:600;line-height:1.4}
  .reelbody .m{font-family:var(--mono);font-size:11px;color:var(--slate);margin-top:auto}
  .reelfoot{display:flex;gap:6px;padding:0 13px 12px}
  .reelfoot .btn{flex:1}
  .sheet-in.reel{max-width:920px;padding:0}
  .reel-head{display:flex;align-items:flex-start;justify-content:space-between;
             gap:12px;padding:16px 20px;border-bottom:1px solid var(--rule)}
  .reel-head h2{font-family:var(--display);font-size:23px;font-weight:700;margin:0;line-height:1.15}
  .reelgrid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
  .reelgrid2.solo{grid-template-columns:1fr}
  .reelgrid2.solo .reelplay{display:none}

  .reelplay iframe{width:100%;height:560px;border:0;display:block}
  .reelplay .none{color:#9AA3A8;font-size:13px;padding:40px 22px;text-align:center}
  .reelside{padding:16px 20px 20px;border-left:1px solid var(--rule);
            display:flex;flex-direction:column;gap:12px}

  /* ---------- states ---------- */
  .center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .loginbox{width:100%;max-width:360px;background:var(--card);
            border:1px solid var(--rule);padding:30px 28px}

  /* ---------- email campaigns ---------- */
  .ec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
  .ec-list{border:1px solid var(--rule);background:var(--card)}

  .ec-item:first-child{border-top:0}

  .ec-open b{font-size:15px}
  .ec-open:hover b{text-decoration:underline}

          border:1px solid var(--rule)}

const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const num = n => (n===null||n===undefined) ? '0' : Number(n).toLocaleString('en-US');
const money = n => '$' + Math.round(Number(n||0)).toLocaleString('en-US');
/* $18.3M rather than $18,250,000, for a figure that has to fit a small tile. */
const moneyShort = n => '$' + Number(n||0).toLocaleString('en-US',
  { notation:'compact', maximumFractionDigits:1 });
const today = () => { const d=new Date();
  return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'); };
const prettyDate = () => new Date().toLocaleDateString('en-US',
  {weekday:'long',month:'long',day:'numeric'});
const fmtTime = iso => new Date(iso).toLocaleTimeString('en-US',
  {hour:'numeric',minute:'2-digit',timeZone:'America/Los_Angeles'});
const dayKey = iso => new Date(iso).toLocaleDateString('en-US',
  {weekday:'short',month:'short',day:'numeric',timeZone:'America/Los_Angeles'});
const fmtDay = iso => {
  if(!iso) return '';
  const d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleDateString('en-US',
    {weekday:'short',month:'short',day:'numeric',year:'numeric',
     timeZone:'America/Los_Angeles'});
};
const shortDate = iso => {
  if(!iso) return '';
  const d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
};
/* A bare YYYY-MM-DD parses as UTC midnight, which reads as the day before
   in Pacific. Anchoring at noon keeps a queue_date on its own date. */
const dateOnly = ymd => {
  if(!ymd) return '';
  const d = new Date(String(ymd).slice(0,10) + 'T12:00:00Z');
  return isNaN(d) ? '' : d.toLocaleDateString('en-US',
    {month:'short',day:'numeric',timeZone:'UTC'});
};
const daysAgoFrom = ymd => {
  if(!ymd) return null;
  const d = new Date(String(ymd).slice(0,10) + 'T12:00:00Z');
  const n = new Date(today() + 'T12:00:00Z');
  return isNaN(d) ? null : Math.round((n - d) / 86400000);
};

function toPlain(html){
  if(!html) return '';
  let s = String(html);
  const cut = s.indexOf('<table');
  if(cut>-1) s = s.slice(0,cut);
  return s.replace(/<\/p>/gi,'\n\n').replace(/<br\s*\/?>/gi,'\n')
    .replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ')
    .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>')
    .replace(/\n{3,}/g,'\n\n').trim();
}
function toHtml(plain){
  return String(plain||'').split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean)
    .map(p=>'<p style="font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#222;line-height:22px;margin:0 0 14px 0;">'
      + esc(p).replace(/\n/g,'<br>') + '</p>').join('');
}

/* Today's queue, plus any follow-up still sitting unhandled from an earlier
   day. A follow-up used to appear for exactly one day and then fall off the
   board for good, which is how two of them went quiet in August. Carrying
   them forward on read costs nothing extra and heals a gap of any length. */
async function loadBoard(){
  const t = today();
  /* A first contact Pat did not get to used to leave the board at midnight
     while its contact stayed locked for 90 days: 376 people were drafted
     for and never written to. Drafted, unsent first contacts now stay for
     CARRY_DAYS, the same way follow-ups already did. */
  const fd = new Date(t + 'T12:00:00Z'); fd.setUTCDate(fd.getUTCDate() - CARRY_DAYS);
  const from = fd.toISOString().slice(0,10);
  const { data, error } = await sb.from('v_today_board').select('*')
    .or(`queue_date.eq.${t},and(queue_date.lt.${t},touch.gt.1,handled.is.false,status.neq.skipped),and(queue_date.lt.${t},queue_date.gte.${from},touch.eq.1,status.eq.drafted,handled.is.false)`)
    .order('vertical_order').order('slot');
  if(error) throw error;
  const rows = data || [];
  for(const r of rows){
    r.carried = r.queue_date !== t;
    r.carriedFirst = r.carried && Number(r.touch) === 1;
  }
  // Overdue follow-ups lead, then today, then first contacts still open
  // from earlier in the week, oldest last.
  const rank = r => !r.carried ? 1 : (r.carriedFirst ? 2 : 0);
  rows.sort((a,b)=> (rank(a)-rank(b)) ||
    (rank(a)===2 ? String(b.queue_date).localeCompare(String(a.queue_date)) : 0));
  S.board = rows;
  S.drafts = {};
  if(S.board.length){
    const { data:d } = await sb.from('email_drafts').select('*')
      .in('queue_id', S.board.map(r=>r.queue_id)).order('variant_number');
    for(const x of (d||[])) (S.drafts[x.queue_id] ||= []).push(x);
  }
  if(!S.activeId || !S.board.some(r=>r.queue_id===S.activeId)){
    const next = S.board.find(r=>!r.handled && r.status!=='skipped')
      || S.board.find(r=>r.status!=='skipped')
      || S.board.find(r=>!/^board reset/i.test(r.skipped_reason || '')) || null;
    S.activeId = next ? next.queue_id : null;
    S.open = {};
    const f = S.activeId && S.drafts[S.activeId]?.[0];
    if(f) S.open[f.id] = true;
  }
  /* Fresh click history for the people on the board. */
  for(const r of S.board) delete S.clicks[r.contact_id];
  await loadClicks(S.board.map(r => r.contact_id)).catch(() => {});
  S.loaded.board = true;
}

/* Email health. The numbers already existed in v_dash_headline but only
   reached the CSV export, so 15 bounces out of 54 sends in a month went
   unseen. A mailbox that bounces that often gets filtered by Microsoft
   and Google, which hurts every email Pat sends, not just outreach.
   Never throws: a missing strip is not a reason to hold up the board. */
const BOUNCE_WARN = 2, BOUNCE_BAD = 5;   // percent of sends
async function loadHealth(){
  try{
    const { data } = await sb.from('v_dash_headline')
      .select('sent_30d,replied_30d,bounced_30d,reply_rate_30d').single();
    S.health = data || null;
  }catch(e){ S.health = null; }
  S.loaded.health = true;

function healthPanel(){
  const h = S.health;
  if(!h) return `<p class="hint">Email health could not load.</p>`;
  const sent = Number(h.sent_30d || 0), bounced = Number(h.bounced_30d || 0);
  const replied = Number(h.replied_30d || 0);
  if(!sent) return `<p class="hint">Nothing sent in the last 30 days.</p>`;
  const pct = n => Math.round(1000 * n / sent) / 10;
  const br = pct(bounced), rr = pct(replied);
  const cls = br >= BOUNCE_BAD ? 'bad' : (br >= BOUNCE_WARN ? 'warnv' : '');
  return `<div class="health">
      <div><div class="k">Sent</div><div class="v">${num(sent)}</div></div>
      <div><div class="k">Replied</div><div class="v">${num(replied)} <small>${rr}%</small></div></div>
      <div class="${cls}"><div class="k">Bounced</div><div class="v">${num(bounced)} <small>${br}%</small></div></div>
    </div>
    ${br >= BOUNCE_BAD ? `<div class="warn" style="margin-top:8px"><b>Bounce rate is too high.</b>
      Healthy is under ${BOUNCE_WARN}%. Above ${BOUNCE_BAD}%, mail providers start filtering
      the whole mailbox. Bounced addresses are already kept off the board; the rest of the
      pool has not been verified yet.</div>`
    : br >= BOUNCE_WARN ? `<p class="hint">Bounces are above ${BOUNCE_WARN}%. Keep an eye on this.</p>`
    : `<p class="hint">Last 30 days. Healthy is under ${BOUNCE_WARN}% bounced.</p>`}`;
}

/* Sector match first, then everything else. Filtering the rest out would
   hide the general capability sheet, which suits every contact. */
function assetsFor(r){
  const all = S.assets || [];
  const vid = r && r.vertical_id;
  return all.slice().sort((a,b)=>{
    const am = (a.vertical_id && a.vertical_id === vid) ? 0 : 1;
    const bm = (b.vertical_id && b.vertical_id === vid) ? 0 : 1;
    if(am !== bm) return am - bm;
    return String(a.title).localeCompare(String(b.title));
  });
}

/* Inserted at the cursor as a plain sentence rather than a button. In a
   first contact a styled button reads as a mailshot, and descriptive
   wording gets clicked more often than "view case study". The link is
   built from the slug so tracking works without Pat thinking about it. */
function insertAsset(draftId, slug){
  const a = (S.assets||[]).find(x => x.slug === slug);
  const el = document.getElementById('b-' + draftId);
  if(!a || !el) return;

  const r = S.board.find(x => x.queue_id === S.activeId);
  const cid = r ? r.contact_id : '';
  const url = 'https://haggertybuilds.com/go/' + encodeURIComponent(a.slug)
            + (cid ? '?c=' + encodeURIComponent(cid) : '');
  const phrase = 'I put together ' + a.anchor_text + ' here: ' + url;

  const start = el.selectionStart == null ? el.value.length : el.selectionStart;
  const end   = el.selectionEnd   == null ? el.value.length : el.selectionEnd;
  const before = el.value.slice(0, start).replace(/\s+$/, '');
  const after  = el.value.slice(end).replace(/^\s+/, '');
  el.value = (before ? before + '\n\n' : '') + phrase + (after ? '\n\n' + after : '');
  (S.dEdit[draftId] ||= {}).b = el.value;

  const pos = (before ? before.length + 2 : 0) + phrase.length;
  el.focus();
  try{ el.setSelectionRange(pos, pos); }catch(e){}
}

/* The browser runs in Pacific, so building a Date from the parts and
   letting it convert gives the right instant without hardcoding an
   offset that breaks when daylight saving ends. */
async function saveInviteDate(){
  const a = S.dateAsk;
  if(!a || a.busy) return;
  if(!a.date){ a.err = 'A date is needed. Cancel if the email does not say.'; return render(); }

  /* A date with no time is stored at midnight Pacific and flagged
     is_all_day. It used to be stored at midnight UTC, which is the
     afternoon before, and every such event showed a day early. */
  const [y,m,d] = a.date.split('-').map(Number);
  let start, end;
  if(a.allDay){
    start = new Date(y, m-1, d, 0, 0, 0, 0);
    end = null;
    if(a.endDate && a.endDate > a.date){
      const [ey,em,ed] = a.endDate.split('-').map(Number);
      end = new Date(ey, em-1, ed, 0, 0, 0, 0);
    }
  }else{
    const [hh,mm] = String(a.time || '17:00').split(':').map(Number);
    start = new Date(y, m-1, d, hh||0, mm||0, 0, 0);
    end = new Date(start.getTime() + Number(a.hours || 2)*3600*1000);
  }
  if(isNaN(start) || (end && isNaN(end))){ a.err = 'That date did not parse.'; return render(); }

  a.busy = true; a.err = ''; render();
  let who = null;
  try{ const { data } = await sb.auth.getUser(); who = data && data.user ? data.user.email : null; }
  catch(e){ who = null; }

  try{
    const patch = {
      starts_at:  start.toISOString(),
      ends_at:    end ? end.toISOString() : null,
      is_all_day: !!a.allDay
    };
    /* Correcting a date is not a decision. Only the first-time prompt,
       reached by pressing Going on an undated invite, records one. */
    if(a.mode !== 'edit'){
      patch.decision   = 'going';
      patch.decided_at = new Date().toISOString();
      patch.decided_by = who;
    }
    if(String(a.location||'').trim()) patch.location = a.location.trim();
    const { error } = await sb.from('event_invites').update(patch).eq('id', a.id);
    if(error) throw error;
    S.dateAsk = null;
    S.loaded.invites = false;
    await loadInvites();
  }catch(err){
    a.err = err.message || String(err); a.busy = false;
  }
  render();
}

/* Going without a date is still allowed. Pat often knows he is attending

/* The scanner reads dates out of email previews and gets some wrong.
   Any invite can have its date corrected here. Saving flags the row, and
   the calendar workflow moves the Outlook entry on its next hourly pass. */
function editInviteDate(id){
  const v = (S.invites||[]).find(x => x.id === id);
  if(!v) return;
  const p2 = n => String(n).padStart(2,'0');
  const ymd = dt => dt.getFullYear() + '-' + p2(dt.getMonth()+1) + '-' + p2(dt.getDate());
  const a = { id, mode:'edit', date:'', time:'17:00', hours:'2', allDay:false,
              endDate:'', location: v.location || '', busy:false, err:'' };
  const st = v.starts_at ? new Date(v.starts_at) : null;
  if(st && !isNaN(st)){
    a.date = ymd(st);
    a.allDay = !!v.is_all_day;
    if(!a.allDay) a.time = p2(st.getHours()) + ':' + p2(st.getMinutes());
    const en = v.ends_at ? new Date(v.ends_at) : null;
    if(en && !isNaN(en) && en > st){
      if(a.allDay){ a.endDate = ymd(en); }
      else{
        const h = Math.round((en - st)/3600000);
        a.hours = ['1','2','3','4','8'].includes(String(h)) ? String(h) : '2';
      }
    }
  }
  S.dateAsk = a; S.inviteErr = ''; render();
}

function conflictStrip(v){
  const c = S.conflicts && S.conflicts[v.id];
  if(!c || v.is_past) return '';

  /* Past the sync horizon, silence would read as "the day is free" when
     it actually means "nothing has been synced that far out". Those are
     different answers and only one of them is safe to act on. */
  if(!c.in_window){
    return `<div class="warn info" style="margin-top:10px">
      <b>Calendar not synced this far out.</b>
      Pat's calendar only reaches ${esc(String(c.synced_through))}, so nothing here
      can say whether that day is clear.</div>`;
  }

  const n = Number(c.same_day_events || 0);
  const ov = Number(c.overlapping || 0);
  if(!n) return '';

  const list = String(c.same_day_list || '').split(' | ').filter(Boolean);
  const shown = list.slice(0, 4).join(' &middot; ');
  const more = list.length > 4 ? ` and ${list.length - 4} more` : '';

  return `<div class="warn ${ov ? '' : 'soft'}" style="margin-top:10px">
    <b>${ov ? `Clashes with ${ov} thing${ov===1?'':'s'} already booked.`
            : `Pat already has ${n} thing${n===1?'':'s'} that day.`}</b>
    <span class="when">${esc(shown)}${more}</span></div>`;
}

/* ================= event invitations ================= */
/* Inviting people to an event we are going to. The dashboard writes the
   invitation to event_invitations, then Haggerty Event Invite Sender
   creates an Outlook calendar event with those people on it from Pat's or
   Liam's mailbox. Outlook sends the invite, so everyone gets Accept and
   Decline, and the workflow reads the answers back every hour. */

const EV_SENDERS = { pat:{ label:'Pat Dobson', first:'Pat', email:'p.dobson@haggertybuilds.com' },
                     liam:{ label:'Liam McGinn', first:'Liam', email:'liam@haggertybuilds.com' } };
/* The Outlook node in the workflow has 50 attendee slots. */
const EV_MAX = 50;
const EV_EMAIL = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
const EV_INSIDE = /@(haggertybuilds|rhinorestores)\.com$/i;

function evWhen(v){
  if(!v || !v.starts_at) return '';
  const bits = [fmtDay(v.starts_at)];
  if(!v.is_all_day) bits.push(fmtTime(v.starts_at));
  return bits.join(' at ');
}

function evWhere(v){ return v.is_virtual ? 'Virtual' : String(v.location || '').trim(); }

/* A starting point, not a template to send as is. Kept plain so it is
   quick to rewrite. */
function evDraft(v, sender){
  const who = EV_SENDERS[sender] || EV_SENDERS.pat;
  const host = v.org_name ? `, hosted by ${v.org_name},` : '';
  const where = evWhere(v);
  const place = !where ? '' : (v.is_virtual ? ' (virtual)' : ` at ${where}`);
  const when = v.is_all_day ? `on ${fmtDay(v.starts_at)}` : `on ${fmtDay(v.starts_at)} at ${fmtTime(v.starts_at)}`;
  return `Hi,\n\nHAGGERTY has seats at ${v.event_name || 'this event'}${host} ${when}${place}. We would like you to join us.\n\n` +
    `Accept this invite to hold your spot. If you can't make it, decline so we can offer the seat to someone else.\n\n${who.first}`;
}

function openEvSend(id){
  const v = (S.invites||[]).find(x => x.id === id);
  if(!v || !v.starts_at) return;
  const sender = S.me === 'liam' ? 'liam' : 'pat';
  S.evSend = { inviteId:id, sender, subject: v.event_name || v.subject || '',
               message: evDraft(v, sender), touched:false,
               people:[], q:'', crm:[], seq:0, hide:null, busy:false, err:'' };
  S.evNote = ''; render();
}

/* Guests only see themselves by default as soon as anyone outside the two
   companies is on the list, so one client's address is never shown to
   another. Ticking or unticking the box overrides it either way. */
function evHide(){
  const a = S.evSend;
  if(!a) return false;
  if(a.hide !== null) return a.hide;
  return a.people.some(p => !EV_INSIDE.test(p.email));
}

function evAddPerson(p){
  const a = S.evSend;
  if(!a) return false;
  const email = String(p.email || '').trim().toLowerCase();
  if(!EV_EMAIL.test(email)) return false;
  if(a.people.some(x => x.email === email)) return false;
  /* The sender is the organiser, so they are on it already. */
  if(email === EV_SENDERS[a.sender].email) return false;
  if(a.people.length >= EV_MAX){ a.err = `One invite holds ${EV_MAX} people. Send a second one for the rest.`; return false; }
  a.people.push({ email, name: String(p.name || '').trim(), kind: p.kind || 'typed',
                  contact_id: p.contact_id || null });
  a.err = '';
  return true;
}

function evHits(){
  const a = S.evSend;
  const q = String(a && a.q || '').trim().toLowerCase();
  if(!a || q.length < 2) return [];
  const have = new Set(a.people.map(p => p.email));
  const out = [];
  for(const s of (S.staff||[])){
    if(out.length >= 6) break;
    if(have.has(s.email) || s.email === EV_SENDERS[a.sender].email) continue;
    if(String(s.name).toLowerCase().includes(q) || s.email.includes(q)){
      out.push({ email:s.email, name:s.name, kind:'staff', sub: s.brand === 'rhino' ? 'RHINO' : 'HAGGERTY' });
    }
  }
  for(const c of (a.crm||[])){
    const email = String(c.email || '').toLowerCase();
    if(!email || have.has(email) || out.some(o => o.email === email)) continue;
    out.push({ email, name:c.label || email, kind:'contact', contact_id:c.id, sub:c.sub || 'Contact' });
    if(out.length >= 14) break;
  }
  if(EV_EMAIL.test(q) && !have.has(q) && !out.some(o => o.email === q)){
    out.push({ email:q, name:'', kind:'typed', sub:'Add this address' });
  }
  return out;
}

function evPeopleHtml(){
  const a = S.evSend;
  return a.people.map((p,i)=>`<span class="p ${EV_INSIDE.test(p.email)?'':'out'}" title="${esc(p.email)}">${
    esc(p.name || p.email)}<button type="button" data-evrm="${i}" aria-label="Remove ${esc(p.name || p.email)}">&times;</button></span>`).join('');
}

function evHitsHtml(){
  const a = S.evSend;
  const hits = evHits();
  if(hits.length){
    return hits.map((h,i)=>`<button type="button" data-evhit="${i}">
      <span>${h.name ? esc(h.name) + ' <span class="muted">' + esc(h.email) + '</span>' : esc(h.email)}</span>
      <span class="k">${esc(h.sub)}</span></button>`).join('');
  }
  return String(a.q||'').trim().length >= 2
    ? `<div class="none">Nobody by that name yet. Type a full email address to add someone new.</div>` : '';
}

function evSendLabel(){
  const a = S.evSend;
  const n = a.people.length;
  if(a.busy) return 'Sending&hellip;';
  return n ? `Send to ${n} ${n===1?'person':'people'} from ${EV_SENDERS[a.sender].first}'s Outlook`
           : 'Add someone to send';
}

/* The people list, the search results and the button are repainted in
   place. A full render() would rebuild the search box on every keystroke
   and drop the cursor. */
function evPaint(){
  const a = S.evSend;
  if(!a) return;
  const pe = document.getElementById('evPeople');
  if(pe) pe.innerHTML = evPeopleHtml();
  const hi = document.getElementById('evHits');
  if(hi) hi.innerHTML = evHitsHtml();
  const bt = document.getElementById('evGo');
  if(bt){ bt.innerHTML = evSendLabel(); bt.disabled = a.busy || !a.people.length; }
  const hd = document.getElementById('evHide');
  if(hd) hd.checked = evHide();
  const er = document.getElementById('evErr');
  if(er){ er.textContent = a.err || ''; er.style.display = a.err ? '' : 'none'; }
  const ct = document.getElementById('evCount');
  if(ct) ct.textContent = a.people.length ? `${a.people.length} of ${EV_MAX}` : '';

  document.querySelectorAll('[data-evrm]').forEach(el=>
    el.addEventListener('click',()=>{ a.people.splice(Number(el.dataset.evrm), 1); a.err=''; evPaint(); }));
  document.querySelectorAll('[data-evhit]').forEach(el=>
    el.addEventListener('click',()=>{
      const h = evHits()[Number(el.dataset.evhit)];
      if(h && evAddPerson(h)){
        a.q = ''; a.crm = [];
        const box = document.getElementById('evQ');
        if(box){ box.value = ''; box.focus(); }
      }
      evPaint();
    }));
}

let evTimer = null;
function evSearch(){
  const a = S.evSend;
  if(!a) return;
  evPaint();
  clearTimeout(evTimer);
  const term = String(a.q||'').trim();
  if(term.length < 2){ a.crm = []; return; }
  const seq = ++a.seq;
  evTimer = setTimeout(async ()=>{
    try{
      const { data } = await sb.rpc('crm_search', { q: term, lim: 20 });
      if(!S.evSend || S.evSend.seq !== seq) return;
      S.evSend.crm = (data||[]).filter(r => r.kind === 'contact' && r.email);
      evPaint();
    }catch(e){ /* staff matches still show */ }
  }, 220);
}

/* Enter adds everything typed or pasted: one address, or several split
   by commas, semicolons or spaces, the way they come out of an email. */
function evAddTyped(){
  const a = S.evSend;
  if(!a) return;
  const raw = String(a.q||'');
  const parts = raw.split(/[,;\s<>]+/).map(x => x.trim()).filter(x => EV_EMAIL.test(x));
  if(!parts.length){
    const hits = evHits();
    if(hits.length === 1) evAddPerson(hits[0]);
    else return;
  }else{
    for(const email of parts){
      const st = (S.staff||[]).find(x => x.email === email.toLowerCase());
      evAddPerson(st ? { email:st.email, name:st.name, kind:'staff' } : { email, kind:'typed' });
    }
  }
  a.q = ''; a.crm = [];
  const box = document.getElementById('evQ');
  if(box) box.value = '';
  evPaint();
}

async function sendEvInvite(){
  const a = S.evSend;
  if(!a || a.busy) return;
  const v = (S.invites||[]).find(x => x.id === a.inviteId);
  if(!v || !v.starts_at){ a.err = 'This event needs a date before anyone can be invited.'; return evPaint(); }
  if(!a.people.length){ a.err = 'Add at least one person.'; return evPaint(); }
  if(!String(a.subject).trim()){ a.err = 'It needs a subject.'; return evPaint(); }
  if(!String(a.message).trim()){ a.err = 'Write a short message so people know what they are being invited to.'; return evPaint(); }

  a.busy = true; a.err = ''; evPaint();
  let who = null;
  try{ const { data } = await sb.auth.getUser(); who = data && data.user ? data.user.email : null; }
  catch(e){ who = null; }

  const n = a.people.length;
  let saved = false;
  try{
    const { data:row, error } = await sb.from('event_invitations').insert({
      invite_id:  v.id,
      event_name: v.event_name || v.subject || 'Event',
      org_name:   v.org_name || null,
      starts_at:  v.starts_at,
      ends_at:    v.ends_at || null,
      is_all_day: !!v.is_all_day,
      location:   evWhere(v) || null,
      subject:    String(a.subject).trim(),
      message:    String(a.message).trim(),
      sender:     a.sender,
      hide_guests: evHide(),
      recipients: a.people,
      created_by: who
    }).select('id').single();
    if(error) throw error;
    saved = true;

    const res = await fetch(EVINVITE_URL, { method:'POST', headers: await authHeaders(),
      body: JSON.stringify({ invitation_id: row.id }) });
    const out = await res.json().catch(()=>({}));
    if(!res.ok || !out.ok) throw new Error(out.error || ('The request came back ' + res.status));

    S.evSend = null;
    S.evNote = `Invite sent to ${n} ${n===1?'person':'people'} from ${EV_SENDERS[a.sender].first}'s Outlook. Replies show on the event within the hour.`;
    S.evOpen[v.id] = true;
    S.loaded.invites = false;
    await loadInvites();
    return render();
  }catch(err){
    a.busy = false;
    a.err = (saved ? 'It was saved but Outlook did not send it: ' : 'That did not go through: ')
          + (err.message || String(err));
    if(saved){ S.loaded.invites = false; try{ await loadInvites(); }catch(e){} }
    evPaint();
  }
}

const EV_REPLY = { accepted:'Accepted', tentativelyAccepted:'Maybe', declined:'Declined' };

/* Each person on an invitation with what Outlook says they answered.
   Anything Outlook has not reported yet reads as no reply. */
function evGuests(x){
  const by = {};
  for(const r of (Array.isArray(x.responses) ? x.responses : [])) by[String(r.email||'').toLowerCase()] = r.response;
  return (Array.isArray(x.recipients) ? x.recipients : []).map(p=>{
    const r = by[String(p.email||'').toLowerCase()];
    const key = r === 'accepted' ? 'accepted' : r === 'declined' ? 'declined'
              : r === 'tentativelyAccepted' ? 'maybe' : 'none';
    return { name:p.name || p.email, email:p.email, key, word: EV_REPLY[r] || 'No reply' };
  });
}

function evInvitedStrip(v){
  const list = (S.evx||[]).filter(x => x.invite_id === v.id);
  if(!list.length) return '';
  const open = !!S.evOpen[v.id];

  return list.map(x=>{
    const who = (EV_SENDERS[x.sender] || {}).first || x.sender;
    const n = Array.isArray(x.recipients) ? x.recipients.length : 0;

    if(x.status !== 'sent'){
      /* A row still marked queued or sending a few minutes on never
         reached Outlook. Say so instead of showing it as in flight. */
      const stale = (Date.now() - new Date(x.created_at).getTime()) > 3*60*1000;
      const failed = x.status === 'failed' || stale;
      return `<div class="evx ${failed?'failed':''}">
        <span class="eyebrow">${failed ? 'Invite did not send' : 'Sending invite'}</span>
        ${n} ${n===1?'person':'people'} from ${esc(who)} &middot; ${esc(shortDate(x.created_at))}
        ${failed ? `<div class="hint err" style="margin-top:4px">${esc(x.error || 'It never reached Outlook. Nobody was invited, so it is safe to send again.')}</div>` : ''}
      </div>`;
    }

    const g = evGuests(x);
    const count = k => g.filter(p => p.key === k).length;
    const tally = [[count('accepted'),'accepted'],[count('maybe'),'maybe'],
                   [count('declined'),'declined'],[count('none'),'no reply']]
      .filter(([c])=>c).map(([c,w])=>`${c} ${w}`).join(' &middot; ');

    return `<div class="evx">
      <span class="eyebrow">Invited by ${esc(who)} &middot; ${esc(shortDate(x.sent_at || x.created_at))}</span>
      ${n} ${n===1?'person':'people'}${tally ? ' &middot; ' + tally : ''}
      ${x.responses_checked_at ? '' : ' <span class="muted">(replies not checked yet)</span>'}
      ${open ? `<ul class="evx-list">${g.map(p=>`<li><span>${esc(p.name)}${
        p.name !== p.email ? ` <span class="muted">${esc(p.email)}</span>` : ''}</span>
        <span class="r ${p.key}">${p.word}</span></li>`).join('')}</ul>
        <div class="hint" style="margin-top:6px">${esc(x.subject)}${
          x.web_link ? ` &middot; <a href="${esc(x.web_link)}" target="_blank" rel="noopener">Open in Outlook</a>` : ''}</div>` : ''}
    </div>`;
  }).join('') + `<button class="linkbtn" data-evopen="${v.id}" style="padding-left:0;margin-top:4px">${
    open ? 'Hide who was invited' : 'Show who was invited'}</button>`;
}

      <div class="field"><label for="evQ">Who to invite <span id="evCount" class="muted" style="font-weight:400;letter-spacing:0"></span></label>

/* ---- an event that never came in by email ----
   Saved to the same list as scanned invitations and marked going, so it
   reaches Pat's calendar like any other and can have people invited. */
function openEvNew(){
  S.evNew = { name:'', org:'', date:'', time:'17:00', hours:'2', allDay:false,
              location:'', busy:false, err:'' };
  S.evNote = ''; render();
}

async function saveEvNew(){
  const a = S.evNew;
  if(!a || a.busy) return;
  if(!String(a.name).trim()){ a.err = 'It needs a name.'; return render(); }
  if(!a.date){ a.err = 'It needs a date.'; return render(); }

  const [y,m,d] = a.date.split('-').map(Number);
  let start, end = null;
  if(a.allDay){ start = new Date(y, m-1, d, 0, 0, 0, 0); }
  else{
    const [hh,mm] = String(a.time || '17:00').split(':').map(Number);
    start = new Date(y, m-1, d, hh||0, mm||0, 0, 0);
    end = new Date(start.getTime() + Number(a.hours || 2)*3600*1000);
  }
  if(isNaN(start)){ a.err = 'That date did not parse.'; return render(); }

  a.busy = true; a.err = ''; render();
  let who = null;
  try{ const { data } = await sb.auth.getUser(); who = data && data.user ? data.user.email : null; }
  catch(e){ who = null; }

  try{
    const name = String(a.name).trim();
    const { error } = await sb.from('event_invites').insert({
      mailbox: 'dashboard', subject: name, event_name: name,
      org_name: String(a.org).trim() || null,
      starts_at: start.toISOString(), ends_at: end ? end.toISOString() : null,
      is_all_day: !!a.allDay,
      location: String(a.location).trim() || null,
      decision: 'going', decided_at: new Date().toISOString(), decided_by: who,
      from_name: who, confidence: 100, reason: 'Added by hand on the dashboard'
    });
    if(error) throw error;
    S.evNew = null;
    S.inviteFilter = 'going';
    S.evNote = `${name} added and marked going. It reaches Pat's calendar within the hour.`;
    S.loaded.invites = false;
    await loadInvites();
  }catch(err){
    a.busy = false;
    a.err = /event_key|duplicate/i.test(err.message || '')
      ? 'An event with that name, host and date is already on the list.'
      : (err.message || String(err));
  }
  render();
}
