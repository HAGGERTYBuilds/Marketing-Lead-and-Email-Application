async function exvCreate(){
  const E = S.exv, f = E.form;
  const who = Object.keys(f.who);
  E.err = '';
  if(f.question.trim().length < 8) E.err = 'Write the question.';
  else if(!who.length) E.err = 'Pick at least one person.';
  if(E.err) return render();
  E.busy = 'create'; render();
  const ins = await sb.from('exv_asks').insert({ brand:f.brand, question:f.question.trim(), help:f.help.trim(),
    prompt_id:f.prompt_id || null }).select().single();
  if(ins.error){ E.busy = ''; E.err = 'Could not save the question. ' + (ins.error.message || ''); return render(); }
  const rq = await sb.from('exv_requests').insert(who.map(id => ({ ask_id:ins.data.id, person_id:id, angle:(f.who[id] || '').trim() }))).select();
  E.busy = '';
  if(rq.error){ E.err = 'The question saved but the links did not. ' + (rq.error.message || ''); return render(); }
  E.asks.unshift(ins.data); E.reqs.push(...(rq.data || []));
  E.form = null; E.view = 'ask'; E.open = ins.data.id;
  E.note = `Links ready for ${who.length} ${who.length === 1 ? 'person' : 'people'}. Tap Text it on your phone to send each one.`;
  render(); window.scrollTo(0, 0);
}

async function exvUpdate(table, id, patch, note){
  const E = S.exv;
  const { data, error } = await sb.from(table).update(patch).eq('id', id).select().single();
  if(error){ E.err = 'Could not save. ' + (error.message || ''); render(); return null; }
  const list = { exv_people:E.people, exv_prompts:E.prompts, exv_asks:E.asks, exv_requests:E.reqs, exv_answers:E.answers, exv_pieces:E.pieces }[table];
  const i = list.findIndex(x => x.id === id);
  if(i >= 0) list[i] = data;
  E.err = ''; if(note !== undefined) E.note = note;
  render();
  return data;
}

function wireVoices(){
  if(S.page !== 'voices') return;
  const E = S.exv;
  const on = (id, fn, ev = 'click') => { const el = document.getElementById(id); if(el) el.addEventListener(ev, fn); };
  const each = (sel, fn, ev = 'click') => document.querySelectorAll(sel).forEach(el => el.addEventListener(ev, e => fn(el, e)));

  each('[data-exv-brand]', el => { E.brand = el.dataset.exvBrand; E.open = null; if(E.view === 'ask') E.view = 'asks'; E.note = ''; E.err = ''; render(); });
  each('[data-exv-view]', el => { E.view = el.dataset.exvView; E.open = null; E.note = ''; E.err = ''; render(); window.scrollTo(0, 0); });
  each('[data-exv-open]', async el => {
    E.open = el.dataset.exvOpen; E.view = 'ask'; E.note = ''; E.err = '';
    render(); window.scrollTo(0, 0);
    await exvLoadAudio(E.open); render();
  });
  on('exvBack', async () => { E.view = 'asks'; E.open = null; E.note = ''; E.err = ''; await loadVoices(); render(); });
  on('exvNew', () => { E.err = ''; E.note = ''; E.form = { brand:E.brand, prompt_id:'', question:'', help:'', who:{} }; render(); });
  each('[data-exv-askq]', el => {
    const q = E.prompts.find(x => x.id === el.dataset.exvAskq);
    E.err = ''; E.form = { brand:E.brand, prompt_id:q.id, question:q.question, help:'', who:{} }; render();
  });
  each('[data-exv-copy]', (el, e) => { e.preventDefault(); exvCopy(el.dataset.exvCopy, null, el); });

  /* Tapping Text it or Email opens the phone's app and marks the link sent. */
  each('[data-exv-sent]', el => {
    const r = E.reqs.find(x => x.id === el.dataset.exvSent);
    if(!r) return;
    const patch = el.dataset.exvKind === 'nudge' ? { reminded_at:new Date().toISOString() }
      : r.sent_at ? {} : { sent_at:new Date().toISOString() };
    if(Object.keys(patch).length) setTimeout(() => exvUpdate('exv_requests', r.id, patch), 400);
  });
  /* Sent by n8n: a text through Twilio, or for now an email from Liam's
     Outlook. The number or address comes from People on the server. */
  const exvSendOne = async r => {
    const p = exvPerson(r.person_id);
    const late = r.sent_at && exvDays(r.reminded_at || r.sent_at) >= EXV_NUDGE_DAYS;
    const body = { request_id:r.id, kind:late ? 'nudge' : 'ask' };
    if(EXV_TEXT_ON) body.message = late ? exvNudgeText(p, r) : exvAskText(p, r);
    else body.link = exvLink(r.token);
    const res = await fetch(EXV_TEXT_ON ? EXV_TEXT_URL : EXV_EMAIL_URL, { method:'POST', headers:await authHeaders(), body:JSON.stringify(body) });
    let j = null;
    try{ j = await res.json(); }catch(e){}
    if(!res.ok || !j || !j.ok) throw new Error((j && j.error) || ('The send service answered ' + res.status + '.'));
    Object.assign(r, j.request || {});
    return p;
  };
  const sentWord = () => EXV_TEXT_ON ? 'Texted' : 'Emailed';
  each('[data-exv-send]', async el => {
    const r = E.reqs.find(x => x.id === el.dataset.exvSend);
    if(!r || E.busy) return;
    E.busy = 'send:' + r.id; E.err = ''; E.note = ''; render();
    try{ const p = await exvSendOne(r); E.note = `${sentWord()} ${exvFirst(p)}.`; }
    catch(e){ E.err = 'It did not go out. ' + e.message; }
    E.busy = ''; render();
  });
  on('exvSendAll', async () => {
    if(E.busy) return;
    const todo = exvReqs(E.open).filter(r => !r.sent_at && !exvAnswersFor(r.id).length && exvCanSend(exvPerson(r.person_id)));
    if(!todo.length || !confirm(`${EXV_TEXT_ON ? 'Text' : 'Email'} ${todo.map(r => exvFirst(exvPerson(r.person_id))).join(', ')}?`)) return;
    E.busy = 'sendall'; E.err = ''; E.note = ''; render();
    const ok = [], bad = [];
    for(const r of todo){
      try{ ok.push(exvFirst(await exvSendOne(r))); }
      catch(e){ bad.push(exvFirst(exvPerson(r.person_id)) + ' (' + e.message + ')'); }
    }
    E.busy = '';
    if(ok.length) E.note = sentWord() + ' ' + ok.join(', ') + '.';
    if(bad.length) E.err = 'Not sent: ' + bad.join('; ');
    render();
  });
  each('[data-exv-mark]', el => exvUpdate('exv_requests', el.dataset.exvMark, { sent_at:new Date().toISOString() }));
  each('[data-exv-unask]', async el => {
    const r = E.reqs.find(x => x.id === el.dataset.exvUnask), p = r && exvPerson(r.person_id);
    if(!r || !confirm(`Take ${p ? p.name : 'them'} off this question? Their link stops working.`)) return;
    const { error } = await sb.from('exv_requests').delete().eq('id', r.id);
    if(error){ E.err = 'Could not remove. ' + (error.message || ''); return render(); }
    E.reqs = E.reqs.filter(x => x.id !== r.id); render();
  });
  on('exvAddGo', async () => {
    const id = document.getElementById('exvAddWho').value;
    if(!id) return;
    const { data, error } = await sb.from('exv_requests').insert({ ask_id:E.open, person_id:id }).select().single();
    if(error){ E.err = 'Could not add. ' + (error.message || ''); return render(); }
    E.reqs.push(data); E.note = `${exvPerson(id).name} added. Text them their link.`; render();
  });
  on('exvClose', () => exvUpdate('exv_asks', E.open, { status:'closed' }, 'Closed. The links no longer take answers.'));
  on('exvReopen', () => exvUpdate('exv_asks', E.open, { status:'open' }, 'Open again. The same links work.'));
  on('exvDelete', async () => {
    const k = E.asks.find(x => x.id === E.open);
    const n = exvAskAnswers(E.open).length;
    if(!confirm(`Delete this question${n ? ` and its ${n} answer${n === 1 ? '' : 's'}` : ''}? The links stop working. This cannot be undone.`)) return;
    const paths = exvAskAnswers(E.open).flatMap(a => [a.audio_path, a.photo_path]).filter(Boolean);
    if(paths.length) await sb.storage.from('voices').remove(paths);
    const { error } = await sb.from('exv_asks').delete().eq('id', k.id);
    if(error){ E.err = 'Could not delete. ' + (error.message || ''); return render(); }
    E.asks = E.asks.filter(x => x.id !== k.id); E.view = 'asks'; E.open = null; E.note = 'Question deleted.'; render();
  });

  each('[data-exv-tab]', el => { E.draftTab[el.dataset.exvTab] = el.dataset.v; render(); });
  each('[data-exv-copytext]', el => {
    const a = E.answers.find(x => x.id === el.dataset.exvCopytext), v = el.dataset.v;
    const t = v === 'answer' ? a.answer_clean : v === 'transcript' ? a.transcript : (a.drafts || {})[v];
    exvCopy(t || '', null, el);
  });
  each('[data-exv-use]', el => exvUpdate('exv_answers', el.dataset.exvUse, { use_status:el.dataset.v }));
  each('[data-exv-retry]', async el => {
    E.busy = 'retry'; E.err = ''; render();
    try{
      await exvCall({ action:'process', answer_id:el.dataset.exvRetry });
      const a = E.answers.find(x => x.id === el.dataset.exvRetry); if(a){ a.status = 'new'; a.error = null; }
    }catch(e){ E.err = 'Could not start it again. ' + e.message; }
    E.busy = ''; render();
  });
  on('exvCombine', async () => {
    E.busy = 'combine'; E.err = ''; E.note = ''; render();
    try{
      const j = await exvCall({ action:'combine', ask_id:E.open });
      await loadVoices();
      E.note = 'Blog post written' + (j.title ? ': ' + j.title : '') + '. Read it over below.' +
        ((j.check || []).length ? ' Check before posting: ' + j.check.join('; ') : '');
    }catch(e){ E.err = 'The blog post was not written. ' + e.message; }
    E.busy = ''; render();
  });

  /* Pieces */
  const pieceOf = el => E.pieces.find(x => x.id === (el.dataset.exvSave || el.dataset.exvWp || el.dataset.exvPlain || el.dataset.exvPub || el.dataset.exvAskok));
  const readPiece = pc => {
    const v = id => { const el = document.getElementById(id + pc.id); return el ? el.value : undefined; };
    return { title:v('exvT-') ?? pc.title, excerpt:v('exvX-') ?? pc.excerpt, body:v('exvB-') ?? pc.body };
  };
  each('[data-exv-save]', el => {
    const pc = pieceOf(el), n = readPiece(pc);
    const changed = n.title !== pc.title || n.excerpt !== pc.excerpt || n.body !== pc.body;
    if(!changed){ E.note = 'Nothing changed.'; return render(); }
    const patch = { ...n, updated_at:new Date().toISOString() };
    if(pc.approver_id && ['approved','changes','needs_ok'].includes(pc.status)) Object.assign(patch, { status:'draft', approved_at:null });
    exvUpdate('exv_pieces', pc.id, patch, 'Saved.');
  });
  each('[data-exv-wp]', el => { const pc = pieceOf(el), n = readPiece(pc); exvCopy(n.body, exvWpHtml({ body:n.body }), el); });
  each('[data-exv-plain]', el => { const pc = pieceOf(el), n = readPiece(pc); exvCopy((pc.kind === 'blog' && n.title ? n.title + '\n\n' : '') + n.body, null, el); });
  each('[data-exv-askok]', el => {
    const pc = pieceOf(el);
    setTimeout(() => exvUpdate('exv_pieces', pc.id, { status:'needs_ok', approve_note:null }), 400);
  });
  each('[data-exv-pub]', el => {
    const pc = pieceOf(el), u = (document.getElementById('exvU-' + pc.id) || {}).value || '';
    exvUpdate('exv_pieces', pc.id, { status:'published', published_at:new Date().toISOString(), published_url:u.trim() || null },
      pc.kind === 'blog' ? 'Marked published.' : 'LinkedIn post marked published.');
    exvAskAnswers(pc.ask_id).filter(a => a.status === 'ready' && a.use_status === 'new')
      .forEach(a => sb.from('exv_answers').update({ use_status:'used' }).eq('id', a.id).then(() => { a.use_status = 'used'; }));
  });

  /* People */
  each('[data-exv-psave]', async el => {
    const id = el.dataset.exvPsave, row = document.querySelector(`[data-exv-prow="${id}"]`);
    const v = {};
    row.querySelectorAll('[data-k]').forEach(i => { v[i.dataset.k] = i.type === 'checkbox' ? i.checked : i.value.trim(); });
    if(!v.name){ E.err = 'Add a name.'; return render(); }
    if(id === 'new'){
      const { data, error } = await sb.from('exv_people').insert({ ...v, brand:E.brand, sort:100 + E.people.length }).select().single();
      if(error){ E.err = 'Could not add. ' + (error.message || ''); return render(); }
      E.people.push(data); E.err = ''; E.note = data.name + ' added.'; render();
    }else exvUpdate('exv_people', id, v, 'Saved ' + v.name + '.');
  });

  /* Question bank */
  each('[data-exv-retire]', el => exvUpdate('exv_prompts', el.dataset.exvRetire, { active:false }, 'Retired. It no longer shows in the bank.'));
  on('exvQAdd', async () => {
    const q = document.getElementById('exvQNew').value.trim();
    if(q.length < 8){ E.err = 'Write the question first.'; return render(); }
    const { data, error } = await sb.from('exv_prompts').insert({ brand:E.brand, question:q,
      for_who:document.getElementById('exvQFor').value, theme:document.getElementById('exvQTheme').value.trim() }).select().single();
    if(error){ E.err = 'Could not add. ' + (error.message || ''); return render(); }
    E.prompts.push(data); E.err = ''; E.note = 'Added to the bank.'; render();
  });

  /* The ask form */
  if(E.form){
    const f = E.form;
    on('exvFClose', () => { E.form = null; E.err = ''; render(); });
    on('exvFBank', e => {
      const q = E.prompts.find(x => x.id === e.target.value);
      f.prompt_id = q ? q.id : ''; if(q) f.question = q.question; render();
    }, 'change');
    on('exvFQ', e => { f.question = e.target.value; }, 'input');
    on('exvFHelp', e => { f.help = e.target.value; }, 'input');
    each('[data-exv-fwho]', el => {
      const id = el.dataset.exvFwho;
      if(el.checked) f.who[id] = f.who[id] || ''; else delete f.who[id];
      render();
    }, 'change');
    each('[data-exv-fangle]', el => { f.who[el.dataset.exvFangle] = el.value; }, 'input');
    on('exvFGo', exvCreate);
  }
  exvPoll();
}

/* ================= marketing return ================= */
/* What the marketing spend brought in. Pipedrive has no source on a deal,
   so it lives in deal_sources (sql/deal_sources.sql). The nightly deal sync
   fills a source for every untagged deal from what the data says
   (deal_sources_autofill, sql/deal_sources_auto.sql), with set_by 'auto'
   and a note saying why. Those show as "auto" until Liam or Pat confirm or
   change them; a source picked by hand always wins and is never replaced. */
const RET_SOURCES = { outreach:'Outreach email', event:'Event', website:'Website or inbound',
                      social:'Social', referral:'Referral', repeat:'Repeat client', other:'Other' };
/* The sources marketing can take credit for. Referrals and repeat
   clients are won by the relationship, not the spend. */
const RET_MARKETING = ['outreach','event','website','social'];

S.ret = { rows:null, events:[], busy:'', err:'', note:'' };

async function loadReturn(){
  const [r, e] = await Promise.all([
    sb.from('v_deal_sources').select('*'),
    sb.from('event_invites').select('id,event_name,subject,org_name,starts_at,amount_spent')
      .eq('decision','going').order('starts_at', { ascending:false })
  ]);
  if(r.error){
    S.ret.err = /does not exist|schema cache|PGRST205|42P01/i.test(r.error.message + ' ' + (r.error.code||''))
      ? 'Deal sources are not set up in the database yet (sql/deal_sources.sql).'
      : 'Could not load deal sources. ' + r.error.message;
    S.ret.rows = [];
  } else { S.ret.err = ''; S.ret.rows = r.data || []; }
  S.ret.events = e.data || [];
  if(BUDGET_USERS.includes(S.me) && !S.loaded.budget){
    try{ await loadBudget(); }catch(err){ /* spend shows as unavailable */ }
  }
  S.loaded.ret = true;
}

const retYear = d => d ? Number(String(d).slice(0,4)) : null;
const retCanEdit = () => BUDGET_USERS.includes(S.me);

function retEventLabel(ev){
  return (ev.event_name || ev.subject || 'Event') + (ev.starts_at ? ' (' + shortDate(ev.starts_at) + ')' : '');
}

function retSourceSelect(row, id){
  /* An auto source sits in the blank first option, so picking any real
     option (the same one included) saves it as a person's choice. */
  const cur = row.source_auto ? '' : (row.source || '');
  const opts = `<option value="">${row.source_auto ? esc(RET_SOURCES[row.source] || row.source) + ' (auto)' : 'Not set'}</option>` +
    Object.entries(RET_SOURCES).map(([k,l]) =>
      `<option value="${k}" ${k===cur?'selected':''}>${esc(l)}</option>`).join('');
  const busy = S.ret.busy === row.deal_id;
  let html = `<select id="${id}" data-ret-src="${esc(row.deal_id)}" ${busy || !retCanEdit() ? 'disabled' : ''}
    aria-label="Where ${esc(row.title || 'this deal')} came from">${opts}</select>`;
  if(row.source_auto){
    html += `<div style="display:flex;gap:8px;align-items:center;margin-top:4px;flex-wrap:wrap">
      <span class="chip">auto</span>
      ${retCanEdit() ? `<button class="btn small ghost" data-ret-ok="${esc(row.deal_id)}" ${busy ? 'disabled' : ''}>Confirm</button>` : ''}
    </div>${row.source_note ? `<p class="hint" style="margin:3px 0 0">${esc(String(row.source_note).replace(/^Auto:\s*/, ''))}</p>` : ''}`;
  }
  if(row.source === 'event' && !row.source_auto){
    html += `<select data-ret-ev="${esc(row.deal_id)}" ${busy || !retCanEdit() ? 'disabled' : ''}
      aria-label="Which event" style="margin-top:4px">
      <option value="">Which event?</option>
      ${(S.ret.events||[]).map(ev => `<option value="${esc(ev.id)}" ${ev.id===row.event_invite_id?'selected':''}>${
        esc(retEventLabel(ev))}</option>`).join('')}</select>`;
  }
  return html;
}

async function saveDealSource(dealId, source, eventId){
  if(S.ret.busy) return;
  const row = (S.ret.rows||[]).find(r => r.deal_id === dealId);
  if(!row) return;
  S.ret.busy = dealId; S.ret.err = ''; render();
  try{
    if(!source){
      const { error } = await sb.from('deal_sources').delete().eq('deal_id', dealId);
      if(error) throw error;
    } else {
      const who = await socWho();
      const { error } = await sb.from('deal_sources').upsert({
        deal_id: dealId, source,
        event_invite_id: source === 'event' ? (eventId || null) : null,
        set_by: who, set_at: new Date().toISOString()
      });
      if(error) throw error;
    }
    S.loaded.ret = false;
    await loadReturn();
  }catch(err){ S.ret.err = 'Could not save the source. ' + (err.message || err); }
  S.ret.busy = ''; render();
}

/* ================= home ================= */
/* One screen each for Liam and Pat that says what is waiting on them and
   sends them to the tab where it gets done. Everything here is read from
   loaders the other tabs already use, so a number on Home and the same
   number on its tab cannot disagree. Iyanna keeps landing on her list. */
const HOME_USERS = ['liam','pat'];
const HOME_NAMES = { liam:'Liam', pat:'Pat' };
/* Hot leads are the last 30 days of replies, sheet clicks and accepted
   event invites (sql/hot_leads.sql). Marking one done hides that signal;
   a new reply or click from the same person brings them back. */
const HOT_KINDS = { reply:'Replied', click:'Opened', accepted:'Accepted' };
/* Social drafts dated within this many days are close enough to need a look. */
const HOME_SOCIAL_DAYS = 14;

S.home = { hot:null, hotBusy:'', hotErr:'', hotAll:false, pipe:null, socDrafts:null,
           stages:null, daily:null, monthly:null, reach:null, sys:null };

/* Home's own reads, one function each, so a live update or an action can
   refresh just the part it touched (refreshKeys('home.daily')) instead
   of the whole screen. A part that fails leaves null, and its card says
   it could not load. */
const HOME_PARTS = {
  hot: () => loadHotLeads(),
  /* v_kpi_open is Pat's pipeline, the same figure the KPI tab shows.
     v_dash_headline counts every owner's deals. */
  pipe: () => sb.from('v_kpi_open').select('*').single()
    .then(r => { S.home.pipe = r.data || null; }),
  /* For the charts and trend lines on Home. */
  stages: () => sb.from('v_kpi_stages').select('*').order('order_nr')
    .then(r => { S.home.stages = r.error ? null : (r.data || []); }),
  daily: () => sb.from('v_dash_daily').select('day,sent,replied,bounced').gte('day', daysAgo(13)).order('day')
    .then(r => { S.home.daily = r.error ? null : (r.data || []); }),
  monthly: () => sb.from('v_kpi_monthly').select('month,added').order('month')
    .then(r => { S.home.monthly = r.error ? null : (r.data || []).slice(-12); }),
  reach: () => sb.from('social_results').select('post_date,reach').eq('brand', 'haggerty').gte('post_date', daysAgo(55))
    .then(r => { S.home.reach = r.error ? null : (r.data || []); }),
  /* Stale refreshes, stuck jobs and failed workflows, the same rows the
     Haggerty Freshness Check emails about (sql/system_health.sql). */
  sys: () => sb.from('v_system_health').select('*').order('kind').order('title')
    .then(r => { S.home.sys = r.error ? null : (r.data || []); }),
  socDrafts: () => {
    const soon = new Date(); soon.setDate(soon.getDate() + HOME_SOCIAL_DAYS);
    return sb.from('social_posts').select('id,post_date')
      .eq('status','draft').gte('post_date', today()).lte('post_date', ymdOf(soon))
      .order('post_date')
      .then(r => { S.home.socDrafts = r.error ? null : (r.data || []); });
  }
};
const homeParts = () => S.me === 'pat' ? ['hot','pipe','stages','daily','monthly']
  : ['hot','pipe','stages','daily','monthly','reach','sys','socDrafts'];
/* The other tabs' loaders Home reads from. */
const homeDeps = () => S.me === 'pat'
  ? ['board','health','approvals','week','seq','invites','permits']
  : ['board','health','approvals','tasks.liam','requests','budget'];

async function loadHome(){
  /* A tab that fails to load should not blank the whole screen, so each
     read is caught on its own and its card says it could not load. */
  const safe = p => p && Promise.resolve(p).catch(() => {});
  await Promise.all([
    ...homeParts().map(k => HOME_PARTS[k]()),
    ...homeDeps().filter(k => !keyLoaded(k)).map(k => LOADERS[k]())
  ].map(safe));
  S.loaded.home = true;
}

const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + 's')}`;
const ymdOf = d => [d.getFullYear(), String(d.getMonth()+1).padStart(2,'0'),
                    String(d.getDate()).padStart(2,'0')].join('-');
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return ymdOf(d); };

/* ---------- needs you ---------- */
/* One strip of what is late (red) or waiting (orange). Each item is
   [tone, count, title, detail, go]; only items with something in them
   are passed in, so an empty strip means nothing needs doing. */
function homeQueue(items){
  if(!items.length) return `<p class="queue-clear">Nothing needs you right now.</p>`;
  items.sort((a, b) => (a[0] === 'bad' ? 0 : 1) - (b[0] === 'bad' ? 0 : 1));
  return `<div class="queue">${items.map(([tone, n, t, d, go]) => `
    <button class="qitem ${tone}" data-home-go="${esc(go)}">
      <span class="big">${n}</span><span class="t">${esc(t)}</span><span class="d">${d}</span>
    </button>`).join('')}</div>`;
}

function homeSummary(items){
  if(!items.length) return '';
  const late = items.filter(i => i[0] === 'bad').length;
  return `<b>${plural(items.length, 'thing')}</b> ${items.length === 1 ? 'needs' : 'need'} you today${
    late ? `, ${late} of them late` : ''}.`;
}

/* ---------- numbers with a trend ---------- */
/* A small line with a soft fill and the latest point marked. Shape only:
   the number above it is the value, the caption says what each point is. */
function spark(vals, label){
  const v = (vals || []).map(Number).filter(x => isFinite(x));
  if(v.length < 2) return '';
  const w = 200, h = 38, pad = 3;
  const mn = Math.min(...v), mx = Math.max(...v), r = (mx - mn) || 1;
  const pts = v.map((y, i) => [pad + i * (w - 2 * pad) / (v.length - 1),
                               h - pad - (y - mn) / r * (h - 2 * pad - 2)]);
  const line = pts.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ');
  const last = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="${esc(label)}">
    <title>${esc(label)}</title>
    <path d="${line} L${last[0].toFixed(1)} ${h} L${pad} ${h} Z" fill="var(--orange)" opacity=".13"/>
    <path d="${line}" fill="none" stroke="var(--orange)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
  </svg>`;
}

function kpiTile(k){

    <span class="k">${esc(k.label)}</span>

    <span class="d">${k.detail}</span>
    ${k.spark ? spark(k.spark, k.label + ', ' + k.cap) + `<span class="cap">${esc(k.cap)}</span>` : ''}
  </button>`;
}

/* The last 14 days from v_dash_daily, one entry per day even when a day
   has no row. */
function homeDays(){
  const by = new Map((S.home.daily || []).map(r => [String(r.day).slice(0, 10), r]));
  const out = [];
  for(let i = 13; i >= 0; i--){
    const k = daysAgo(i), r = by.get(k) || {};
    out.push({ day:k, sent:Number(r.sent || 0), replied:Number(r.replied || 0), bounced:Number(r.bounced || 0) });
  }
  return out;
}

function kpiSent(days){
  const sent = days.reduce((s, d) => s + d.sent, 0), bounced = days.reduce((s, d) => s + d.bounced, 0);
  const br = sent ? Math.round(1000 * bounced / sent) / 10 : 0;
  return { label:'Emails sent, 14 days', go:'today', value: S.home.daily ? num(sent) : '&ndash;',
    detail: !S.home.daily ? 'Could not load' : sent ? `${num(bounced)} bounced, ${br}%` : 'Nothing sent',
    tone: br >= BOUNCE_BAD ? 'bad' : '', spark: days.map(d => d.sent), cap:'Per day' };
}

function kpiReplies(days){
  const sent = days.reduce((s, d) => s + d.sent, 0), rep = days.reduce((s, d) => s + d.replied, 0);

function kpiReach(){
  const rows = S.home.reach;
  if(!rows) return { label:'Social reach, 30 days', go:'social', value:'&ndash;', detail:'Could not load' };
  const since = daysAgo(29);
  const recent = rows.filter(r => String(r.post_date) >= since);
  const reach = recent.reduce((s, r) => s + Number(r.reach || 0), 0);
  /* Eight weekly totals, oldest first. */
  const weeks = [];
  for(let w = 7; w >= 0; w--){
    const lo = daysAgo(w * 7 + 6), hi = daysAgo(w * 7);
    weeks.push(rows.filter(r => String(r.post_date) >= lo && String(r.post_date) <= hi)
      .reduce((s, r) => s + Number(r.reach || 0), 0));
  }
  return { label:'Social reach, 30 days', go:'social',
    value: Number(reach).toLocaleString('en-US', { notation:'compact', maximumFractionDigits:1 }),
    detail: recent.length ? `From ${plural(recent.length, 'post')}` : 'No posts measured yet',
    spark: weeks, cap:'Per week, last 8' };
}

/* Emails per day for 14 days. Each column is the day's sends; the red
   part at the bottom is how many of them bounced. */
function homeEmailChart(days){
  if(!S.home.daily) return `<p class="hint">Daily email numbers could not load.</p>`;
  const W = 560, H = 170, L = 30, R = 6, T = 10, B = 24, iw = W - L - R, ih = H - T - B;
  const top = Math.max(4, ...days.map(d => d.sent));
  const step = top <= 8 ? 2 : top <= 20 ? 5 : top <= 50 ? 10 : 20;
  const ymax = Math.ceil(top / step) * step;
  const y = v => T + ih - v / ymax * ih;
  const slot = iw / days.length, bw = Math.min(26, slot * .62);
  const grid = [];
  for(let v = 0; v <= ymax; v += step)
    grid.push(`<line class="${v ? 'grid' : 'base'}" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/>
      <text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`);
  const cols = days.map((d, i) => {
    const x = L + slot * i + (slot - bw) / 2;
    const label = new Date(d.day + 'T12:00:00').toLocaleDateString('en-US', { month:'short', day:'numeric' });
    const tip = `${label}: ${plural(d.sent, 'email')} sent, ${d.bounced} bounced, ${plural(d.replied, 'reply', 'replies')}`;
    const good = Math.max(0, d.sent - d.bounced);
    const bars = [];
    if(d.bounced) bars.push(`<rect x="${x.toFixed(1)}" y="${y(d.bounced).toFixed(1)}" width="${bw.toFixed(1)}" height="${(T + ih - y(d.bounced)).toFixed(1)}" fill="var(--red)"/>`);
    if(good) bars.push(`<rect x="${x.toFixed(1)}" y="${y(d.sent).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0, y(d.bounced) - y(d.sent) - (d.bounced ? 2 : 0)).toFixed(1)}" rx="3" fill="var(--orange)"/>`);
    const tick = (days.length - 1 - i) % 3 === 0
      ? `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(label)}</text>` : '';
    return `<g><title>${esc(tip)}</title>
      <rect x="${(L + slot * i).toFixed(1)}" y="${T}" width="${slot.toFixed(1)}" height="${ih}" fill="transparent"/>
      ${bars.join('')}</g>${tick}`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Emails sent and bounced each day, last 14 days">
      ${grid.join('')}${cols}</svg>
    <div class="legend"><span><i style="background:var(--orange)"></i>Delivered</span><span><i style="background:var(--red)"></i>Bounced</span><span>Hover a day for its numbers.</span></div>`;
}

/* This year's spend, added up month by month, against an even pace to
   the full budget. Paid and committed both count, as on the Budget tab. */
function homeBudgetChart(){
  if(!S.loaded.budget || S.bud.loadErr) return `<p class="hint">The budget could not load.</p>`;
  const yr = new Date().getFullYear(), mo = new Date().getMonth();
  const items = budItems(yr);
  const planned = budSummary(yr, items).t.planned;
  const monthly = Array(12).fill(0);
  for(const it of items){ const m = Number(String(it.spent_on).slice(5, 7)) - 1; if(m >= 0 && m < 12) monthly[m] += it.amount; }
  const cum = []; monthly.slice(0, mo + 1).reduce((s, v) => (cum.push(s + v), s + v), 0);
  const spent = cum[cum.length - 1] || 0;
  if(!spent && !planned) return `<p class="hint">Nothing spent or planned for ${yr} yet.</p>`;
  const W = 420, H = 160, L = 40, R = 12, T = 12, B = 24, iw = W - L - R, ih = H - T - B;
  const top = Math.max(planned, spent) * 1.05 || 1;
  const mag = Math.pow(10, Math.floor(Math.log10(top))), step = top / mag > 5 ? mag * 2 : top / mag > 2 ? mag : mag / 2;
  const x = i => L + iw * i / 11, y = v => T + ih - v / top * ih;
  const grid = [];
  for(let v = 0; v <= top; v += step)
    grid.push(`<line class="${v ? 'grid' : 'base'}" x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/>
      <text x="${L - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${v >= 1000 ? Math.round(v / 1000) + 'k' : v}</text>`);
  const line = cum.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  const li = cum.length - 1;
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const ticks = months.map((m, i) => i % 3 === 0 || i === 11 ? `<text x="${x(i).toFixed(1)}" y="${H - 6}" text-anchor="middle">${m}</text>` : '').join('');
  const dots = cum.map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="9" fill="transparent"><title>${months[i]}: ${money(v)} so far</title></circle>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Budget spent so far this year${planned ? ' against an even pace' : ''}">
      ${grid.join('')}
      ${planned ? `<path d="M${x(0)} ${y(planned / 12).toFixed(1)} L${x(11)} ${y(planned).toFixed(1)}" stroke="var(--slate)" stroke-dasharray="4 3" fill="none"/>` : ''}
      ${li > 0 ? `<path d="${line} L${x(li).toFixed(1)} ${T + ih} L${x(0)} ${T + ih} Z" fill="var(--orange)" opacity=".13"/>
      <path d="${line}" stroke="var(--orange)" stroke-width="2" fill="none" stroke-linejoin="round"/>` : ''}
      <circle cx="${x(li).toFixed(1)}" cy="${y(spent).toFixed(1)}" r="4" fill="var(--orange)" stroke="var(--card)" stroke-width="2"/>
      <text class="val" x="${(x(li) - 8).toFixed(1)}" y="${(y(spent) - 9).toFixed(1)}" text-anchor="end">${money(spent)}</text>
      ${ticks}${dots}
    </svg>
    <div class="legend"><span><i style="background:var(--orange)"></i>Spent and committed</span>${
      planned ? `<span><i style="background:var(--slate)"></i>Even pace to ${money(planned)}</span>` : `<span>No ${yr} amounts set yet, so there is no pace line.</span>`}</div>`;
}

/* Every tracked flyer link (haggertybuilds.com/go/<slug>?c=<contact>)
   writes a row to asset_clicks. Hot leads already lists the last 30
   days; this puts the full history on the contact wherever the contact
   is shown: the Outreach detail, a lead card and a CRM search hit. */
S.clicks = {};
async function loadClicks(ids){
  const need = [...new Set((ids || []).filter(Boolean))].filter(id => !(id in S.clicks));
  if(!need.length) return;
  const rows = [];
  for(let i = 0; i < need.length; i += 150){
    const { data, error } = await sb.from('asset_clicks').select('contact_id,slug,clicked_at')
      .in('contact_id', need.slice(i, i + 150)).order('clicked_at', { ascending:false }).limit(1000);
    if(error) return;            // the contact simply shows no clicks
    rows.push(...(data || []));
  }
  for(const id of need) S.clicks[id] = [];
  for(const r of rows) S.clicks[r.contact_id].push(r);
  if(!S.loaded.assets) await loadAssets().catch(() => {});
}
function clicksHtml(cid){
  const c = cid && S.clicks[cid];
  if(!c || !c.length) return '';
  const title = slug => ((S.assets || []).find(a => a.slug === slug) || {}).title || slug;
  return `<div class="clicks"><span class="eyebrow">Opened ${c.length === 1 ? 'a sheet' : plural(c.length, 'sheet link')}</span>
    ${c.slice(0, 4).map(x => `<span class="chip hot" title="${esc(new Date(x.clicked_at).toLocaleString('en-US'))}">${
      esc(title(x.slug))} &middot; ${esc(shortDate(x.clicked_at))}</span>`).join('')}${
    c.length > 4 ? `<span class="hint">and ${c.length - 4} more</span>` : ''}</div>`;

/* ================= keeping the screen current ================= */
/* A change made on another device (Pat sends, Liam approves, a request
   comes in) used to appear only after a reload. Three things keep the
   screen current now:

   1. Supabase Realtime. One channel listens to the tables below; a change
      marks the loaders that read that table as stale.
   2. A light poll, for tables Realtime is not publishing yet: on window
      focus, and every few minutes while the tab is visible.
   3. Actions that change other tabs' numbers (Send, Generate) mark those
      loaders stale too (staleAfter).

   Stale loaders that the current screen shows are re-read together,
   after a short pause so a burst of changes costs one read each, and the
   page is patched in the background without disturbing what is being
   typed. Stale loaders the screen does not show are just marked unloaded,
   so the next visit reads them fresh. */
const LOADERS = {
  board:loadBoard, tiles:loadTiles, week:loadWeek, seq:loadSequences, assets:loadAssets,
  voice:loadVoice, health:loadHealth, mc:loadMailchimp, invites:loadInvites,
  approvals:loadApprovals, budget:loadBudget, mileage:loadMileage, requests:loadRequests,
  reels:loadReels, social:loadSocial, permits:loadPermits, ec:loadCampaigns, bulk:loadBulk,
  photos:loadPhotos, voices:loadVoices, kpis:loadKpis, metrics:loadMetrics, ret:loadReturn,
  'tasks.liam':() => loadTasks('liam'), 'tasks.iyanna':() => loadTasks('iyanna'),
  clicks:() => { const ids = Object.keys(S.clicks); S.clicks = {}; return loadClicks(ids); }
};
for(const k of Object.keys(HOME_PARTS)) LOADERS['home.' + k] = HOME_PARTS[k];

function keyLoaded(k){
  if(k.startsWith('home.')) return !!S.loaded.home;
  if(k.startsWith('tasks.')) return !!S.loaded.tasks[k.slice(6)];
  if(k === 'clicks') return Object.keys(S.clicks).length > 0;
  return !!S.loaded[k];
}
function unloadKey(k){
  if(k.startsWith('home.')) return;          // Home re-reads its parts on every visit
  if(k.startsWith('tasks.')){ S.loaded.tasks[k.slice(6)] = false; return; }
  if(k === 'clicks'){ S.clicks = {}; return; }
  S.loaded[k] = false;
}

/* What the current screen is drawn from. */
function pageKeys(page){
  const P = {
    home: () => homeParts().map(k => 'home.' + k).concat(homeDeps()),
    today: () => ['board','tiles','week','tasks.' + S.me,'seq','assets','voice','health','mc','clicks'],
    calendar: () => ['week','invites'], approvals: () => ['approvals'], budget: () => ['budget'],
    mileage: () => ['mileage'], photos: () => ['photos'], voices: () => ['voices'],
    kpis: () => ['kpis','metrics'].concat(S.kpiView === 'scorecard' ? [] : ['ret']),
    myday: () => ['tasks.liam','requests'], iyanna: () => ['tasks.iyanna'],
    reels: () => ['reels'], social: () => ['social'], permits: () => ['permits'],
    campaigns: () => ['ec'], bulk: () => ['bulk'], leads: () => ['clicks']
  };
  return P[page] ? P[page]() : [];
}
/* The sidebar counts read these whatever the page. */
function chromeKeys(){
  return [S.loaded.approvals && 'approvals', S.me === 'pat' && 'board', S.loaded.voices && 'voices'].filter(Boolean);
}
const onScreen = () => new Set(pageKeys(S.page).concat(chromeKeys()));

/* Which loaders read each table. A function gets the changed row. */
const LIVE_TABLES = {
  approvals:['approvals'],
  tasks: row => row && row.owner ? ['tasks.' + row.owner] : ['tasks.liam','tasks.iyanna'],
  requests:['requests'], request_files:['requests'],
  social_posts:['social','home.socDrafts'], social_post_media:['social'], social_jobs:['social'],
  social_results:['home.reach'],
  email_queue:['board','tiles'], email_drafts:['board'],
  email_sends:['board','seq','health','metrics','home.daily','home.hot'],
  email_events:['health','metrics','home.daily'],
  asset_clicks:['home.hot','clicks'], hot_lead_done:['home.hot'],
  event_invites:['invites','ret'], event_invitations:['invites','home.hot'],
  calendar_events:['week'],
  deals:['kpis','home.pipe','home.stages','home.monthly','ret'], deal_sources:['ret'],
  kpi_targets:['kpis'], kpi_manual:['kpis'],
  expenses:['budget'], budget_plan:['budget'],
  mileage_trips:['mileage'], reel_ideas:['reels'], permit_marks:['permits'],
  email_campaigns:['ec'], bulk_campaigns:['bulk'],
  photo_batches:['photos'], exv_answers:['voices']
};
const liveKeys = (t, row) => { const m = LIVE_TABLES[t]; return typeof m === 'function' ? m(row) : m; };

const STALE = new Set();
let liveTimer = null, liveCh = null, lastPoll = Date.now();
const LIVE_SEEN = new Set();     // tables that have delivered an event

function markStale(keys, delay){
  for(const k of keys || []) if(LOADERS[k]) STALE.add(k);
  if(!STALE.size) return;
  clearTimeout(liveTimer);
  liveTimer = setTimeout(liveRefresh, delay == null ? 800 : delay);
}

/* What an action changes besides the screen it was taken on. */
const AFTER = {
  send:     ['health','seq','metrics','tiles','home.daily','home.hot','home.pipe'],
  generate: ['metrics','home.daily']
};
function staleAfter(kind){ markStale(AFTER[kind] || []); }

async function liveRefresh(){
  liveTimer = null;
  if(!S.day || !app.querySelector('.shell')) return;
  if(document.hidden) return;                       // picked up again on focus
  /* Never repaint under someone mid-drag or mid-send. */
  if(S.busy || document.body.classList.contains('reordering') || app.querySelector('.dragging')){
    liveTimer = setTimeout(liveRefresh, 2000); return;
  }
  const show = onScreen(), now = [];
  for(const k of [...STALE]){
    STALE.delete(k);
    if(show.has(k) && keyLoaded(k)) now.push(k); else unloadKey(k);
  }
  if(!now.length) return;
  const page = S.page;
  await Promise.all(now.map(k => Promise.resolve().then(LOADERS[k]).catch(() => {})));
  if(S.page === page || onScreen().size) render({ bg:true });
}

function onLive(table, payload){
  LIVE_SEEN.add(table);
  const row = payload && (payload.new && Object.keys(payload.new).length ? payload.new : payload.old);
  markStale(liveKeys(table, row));
}

function liveStart(){
  if(liveCh) return;
  try{
    const tables = S.me === 'reviewer' ? ['social_posts','social_post_media','social_jobs','email_campaigns']
                                       : Object.keys(LIVE_TABLES);
    liveCh = sb.channel('dash-' + S.me + '-' + Math.random().toString(36).slice(2, 8));
    for(const t of tables)
      liveCh.on('postgres_changes', { event:'*', schema:'public', table:t }, p => onLive(t, p));
    liveCh.subscribe(status => { S.liveStatus = status; });
  }catch(e){ liveCh = null; /* the poll below still keeps things fresh */ }
}
function liveStop(){
  clearTimeout(liveTimer); liveTimer = null; STALE.clear();
  if(liveCh){ try{ sb.removeChannel(liveCh); }catch(e){} liveCh = null; }
}

/* The fallback. Tables that have proved they publish (an event arrived)
   are left to Realtime; everything else on screen is re-read. The timed
   poll skips the heavy or slow-moving reads; a return to the window
   re-reads those as well. */
const POLL_MS = 3 * 60 * 1000;
const POLL_LIGHT_SKIP = new Set(['assets','voice','mc','permits','kpis','ret','metrics','clicks']);
function poll(full){
  lastPoll = Date.now();
  const covered = new Set();
  for(const t of LIVE_SEEN) for(const k of liveKeys(t, null)) covered.add(k);
  const keys = [...onScreen()].filter(k => LOADERS[k] && keyLoaded(k) && !covered.has(k)
    && k !== 'assets' && k !== 'voice' && (full || !POLL_LIGHT_SKIP.has(k)));
  markStale(keys, 0);
}
setInterval(() => { if(S.day && !document.hidden) poll(false); }, POLL_MS);
window.addEventListener('focus', () => { if(S.day && Date.now() - lastPoll > 30 * 1000) poll(true); });
document.addEventListener('visibilitychange', () => {
  if(!document.hidden && S.day && S.day === today()){
    if(Date.now() - lastPoll > 30 * 1000) poll(true); else if(STALE.size) markStale([], 0);
  }
});

/* ================= boot ================= */
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session) return renderLogin();
  /* An address that is not on the list used to be treated as Liam, which
     showed it Liam's tabs, Budget included. The database still guards the
     data, but the screen should not offer what the account cannot have. */
  const email = (session.user && session.user.email || '').toLowerCase();
  S.me = WHOAMI[email];
  S.email = email;
  if(!S.me){
    /* Not on the team list: maybe a social reviewer. The database only
       lets a reviewer see their own row. */
    const rv = await sb.from('social_reviewers').select('brand,name').eq('email', email).maybeSingle();
    if(rv.error || !rv.data || !SOC_BRANDS[rv.data.brand]) return renderNoAccess(email);
    S.me = 'reviewer'; S.revName = rv.data.name || email.split('@')[0];
    SOC_BRAND = rv.data.brand; SOC_FOCUS = SOC_FOCUS_BY[SOC_BRAND];
  }else if(S.me === 'liam'){
    /* View as the reviewer, switched on from the Social tab. Kept per
       browser tab (sessionStorage), so other tabs stay Liam's own. */
    let as = null;
    try{ as = sessionStorage.getItem(PREVIEW_KEY); }catch(e){}
    if(as){
      const rv = await sb.from('social_reviewers').select('email,brand,name').eq('email', as).maybeSingle();
      if(!rv.error && rv.data && SOC_BRANDS[rv.data.brand]){
        PREVIEW_ON = true;
        S.preview = { email: rv.data.email };
        S.me = 'reviewer'; S.revName = rv.data.name || as.split('@')[0];
        SOC_BRAND = rv.data.brand; SOC_FOCUS = SOC_FOCUS_BY[SOC_BRAND];
      }else{ try{ sessionStorage.removeItem(PREVIEW_KEY); }catch(e){} }
    }
  }
  S.dayOwner = S.me;
  S.day = today();
  /* A tab named in the address wins. Otherwise Liam and Pat start on
     Home, and Iyanna on her own list. */
  const { page:want, view } = parseHash(location.hash);
  S.page = visiblePages().some(([k]) => k === want) ? want
         : (S.me === 'iyanna' ? 'iyanna' : S.me === 'reviewer' ? 'social' : 'home');
  if(S.page === want && view && SUBVIEW[want]) SUBVIEW[want].set(view);
  S._hashReady = false;
  try{
    await ensure(S.page);
    render();
    liveStart();
  }catch(e){
    app.innerHTML = shell(`<div class="empty"><h2>Could not load</h2>
      <p>${esc(e.message||e)}</p>
      <p class="hint" style="margin-top:12px">If this mentions permissions, your account may not have access yet.</p></div>`);
    wireChrome();
  }
}
/* The board is loaded once per session, so a tab left open overnight kept
   showing yesterday. Coming back to it on a new date reloads everything. */
document.addEventListener('visibilitychange', async ()=>{
  if(document.hidden || !S.day || S.day === today() || S.busy) return;
  S.day = today();
  S.loaded = { tasks:{} };
  S.activeId = null; S.lastApproval = null;
  try{ await ensure(S.page); }
  catch(err){ S.err = 'Could not refresh for the new day. Reload the page. ' + (err.message || err); }
  render();
});

boot();
</script>
