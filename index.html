function wireApprovals(){
  document.querySelectorAll('[data-apvfilt]').forEach(el=>
    el.addEventListener('click',()=>{ S.apvFilter = el.dataset.apvfilt; S.apvNote=''; render(); }));

  document.querySelectorAll('[data-apv-do]').forEach(el=>
    el.addEventListener('click',()=>decideApproval(el.dataset.apvDo, el.dataset.val)));

  document.querySelectorAll('[data-apv-hist]').forEach(el=>
    el.addEventListener('click',()=>{
      const id = el.dataset.apvHist;
      S.apvHist[id] = !S.apvHist[id]; render();
    }));

  document.querySelectorAll('[data-apv-reply]').forEach(el=>
    el.addEventListener('click',()=>{
      S.apvReplyTo = el.dataset.apvReply; S.apvReply=''; S.apvFile=null;
      S.apvErr=''; S.apvForm.link_url=''; render();
    }));

  const nw = document.getElementById('apvNew');
  if(nw) nw.addEventListener('click',()=>{
    S.apvOpen = true; S.apvErr=''; S.apvNote=''; S.apvFile=null; render();
  });

  const cl = document.getElementById('apvClose');
  if(cl) cl.addEventListener('click',()=>{
    S.apvOpen=false; S.apvReplyTo=null; S.apvErr=''; render();
  });

  /* Mirrored into state on input, because render() rebuilds the DOM and
     an unbound field loses whatever was half-typed. */
  [['apvTitle','title'],['apvDesc','description'],
   ['apvLink','link_url'],['apvDue','due_by'],
   ['apvQty','quantity'],['apvCost','unit_cost']].forEach(([id,key])=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('input',()=>{ S.apvForm[key] = el.value; });
  });
  const kd = document.getElementById('apvKind');
  if(kd) kd.addEventListener('change',()=>{ S.apvForm.kind = kd.value; });
  const rp = document.getElementById('apvReply');
  if(rp) rp.addEventListener('input',()=>{ S.apvReply = rp.value; });

  const fl = document.getElementById('apvFile');
  if(fl) fl.addEventListener('change',()=>{
    S.apvFile = (fl.files && fl.files[0]) || null; S.apvErr=''; render();
  });

  /* Saved when the field is left or Enter is pressed, not on every
     keystroke: "12" should not be saved as 1 and then as 12. */
  [['data-apv-qty','apvQty','quantity'],['data-apv-cost','apvCost','unit_cost']].forEach(([attr,key,field])=>{
    document.querySelectorAll(`[${attr}]`).forEach(el=>{
      el.addEventListener('change',()=> saveApvCost(el.dataset[key], field, el));
      el.addEventListener('keydown',e=>{ if(e.key === 'Enter'){ e.preventDefault(); el.blur(); } });
    });
  });

  const sv = document.getElementById('apvSave');
  if(sv) sv.addEventListener('click', submitApproval);

  const ol = document.getElementById('apvOlder');
  if(ol) ol.addEventListener('click', async ()=>{
    S.apvAll = true; S.apvBusy = 'older'; render();
    try{ await loadApprovals(); }catch(err){ S.apvErr = 'Could not load older items. ' + (err.message || err); }
    S.apvBusy = ''; render();
  });
}

/* ================= pipeline and kpis ================= */
/* Pat's scorecard, mirroring the quarterly tracker he keeps by hand.
   The spreadsheet reports YTD against the annual target and nothing
   else, so 40 percent in April reads like failure when it is 160
   percent of pace. Both numbers appear here, and pace leads. */

function paceWord(p){
  if(p==null) return '';
  if(p >= 110) return 'ahead';
  if(p >= 90)  return 'on pace';
  return 'behind';
}
function paceColor(p){
  if(p==null) return 'var(--slate)';
  if(p >= 110) return 'var(--green)';
  if(p >= 90)  return 'var(--ink)';
  return 'var(--red)';
}
function kpiVal(row){
  return row.unit==='currency' ? money(row.ytd_actual) : num(row.ytd_actual);
}
function kpiTarget(row){
  return row.unit==='currency' ? money(row.year_target) : num(row.year_target);
}

/* ---------- headline charts ----------
   The tab opened on tables, so the shape of the year (is pipeline being
   added, are we winning, is outreach landing) took reading four of
   them. These four charts lead; the tables stay below for the detail.
   They use Home's chart styles (.chart, .legend, .stages) and the same
   axis rule as Home's budget chart, so a chart reads the same on both. */
function niceStep(top){
  const mag = Math.pow(10, Math.floor(Math.log10(top || 1)));
  return top / mag > 5 ? mag * 2 : top / mag > 2 ? mag : Math.max(mag / 2, top < 5 ? 1 : 0);
}
/* rows: [{ tick, tip, v, v2 }]. v is the orange bar; v2, when given, a
   narrower green bar in front of it (replies against sends). */
function barChart(rows, o){
  const W = 560, H = 170, L = o.left || 34, R = 6, T = 10, B = 24, iw = W - L - R, ih = H - T - B;
  const top = Math.max(o.min || 4, ...rows.map(r => Number(r.v) || 0));
  const step = niceStep(top) || 1, ymax = Math.ceil(top / step) * step;
  const y = v => T + ih - v / ymax * ih;
  const slot = iw / Math.max(1, rows.length), bw = Math.min(30, slot * .64);
  const grid = [];
  for(let v = 0; v <= ymax + 1e-9; v += step)
    grid.push(`<line class="${v ? 'grid' : 'base'}" x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/>
      <text x="${L - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${esc(o.fmt ? o.fmt(v) : String(v))}</text>`);
  const cols = rows.map((r, i) => {
    const x = L + slot * i + (slot - bw) / 2, v = Number(r.v) || 0, v2 = Number(r.v2) || 0;
    const bars = [];
    if(v) bars.push(`<rect x="${x.toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(T + ih - y(v)).toFixed(1)}" rx="3" fill="var(--orange)"/>`);
    if(v2){ const w2 = bw * .5;
      bars.push(`<rect x="${(x + (bw - w2) / 2).toFixed(1)}" y="${y(v2).toFixed(1)}" width="${w2.toFixed(1)}" height="${(T + ih - y(v2)).toFixed(1)}" rx="2" fill="var(--green)"/>`); }
    const tick = (rows.length - 1 - i) % (o.every || 1) === 0
      ? `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(r.tick)}</text>` : '';
    return `<g><title>${esc(r.tip)}</title>
      <rect x="${(L + slot * i).toFixed(1)}" y="${T}" width="${slot.toFixed(1)}" height="${ih}" fill="transparent"/>
      ${bars.join('')}</g>${tick}`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria)}">${grid.join('')}${cols}</svg>`;
}

/* Horizontal bars in Home's "Pipeline by stage" style. */
function hBars(rows){
  const max = Math.max(...rows.map(r => Number(r.v) || 0)) || 1;
  return `<div class="stages">${rows.map(r => `<div class="stage" title="${esc(r.tip || '')}">
      <span class="stage-n">${esc(r.label)}</span>
      <span class="stage-bar"><i style="width:${Math.max(1.5, 100 * (Number(r.v) || 0) / (r.of || max)).toFixed(1)}%;background:${r.color || 'var(--orange)'}"></i></span>
      <span class="stage-v">${r.text}</span></div>`).join('')}</div>`;
}

function kpiCharts(k, m){
  const o = k.outcomes || {};
  const monthly = (k.monthly || []).slice(-12).map(x => {
    const lab = new Date(x.month + 'T00:00:00').toLocaleDateString('en-US', { month:'short' });
    const full = new Date(x.month + 'T00:00:00').toLocaleDateString('en-US', { month:'long', year:'numeric' });
    return { tick:lab, v:Number(x.added || 0), tip:`${full}: ${money(x.added)} added across ${plural(Number(x.deals || 0), 'deal')}` };
  });
  const rolling = monthly.reduce((a, x) => a + x.v, 0);
  const added = monthly.length
    ? barChart(monthly, { aria:'Pipeline added each month, last twelve months', fmt:v => v ? moneyShort(v) : '0', left:44, every:2, min:1 })
      + `<div class="legend"><span><i style="background:var(--orange)"></i>Added that month</span><span>Hover a month for its deals.</span></div>`
    : `<p class="hint">No pipeline added in the last twelve months.</p>`;

  const decided = Number(o.decided_deals || 0);
  const won = decided ? hBars([
      { label:'Won', v:o.won_value, color:'var(--green)', text:`${moneyShort(o.won_value)} <em>${num(o.won_deals)}</em>`,
        tip:`Won ${money(o.won_value)} across ${plural(Number(o.won_deals || 0), 'deal')}` },
      { label:'Lost', v:o.lost_value, color:'var(--red)', text:`${moneyShort(o.lost_value)} <em>${num(o.lost_deals)}</em>`,
        tip:`Lost ${money(o.lost_value)} across ${plural(Number(o.lost_deals || 0), 'deal')}` }])
      + `<div class="legend"><span>Value decided in the rolling twelve months. The small number is how many deals.</span></div>`
    : `<p class="hint">No deals won or lost in the last twelve months.</p>`;

  const rate = decided ? hBars([
      { label:'By count', v:o.win_rate_count, of:100, text:`${o.win_rate_count != null ? o.win_rate_count + '%' : '&ndash;'}`,
        tip:`${num(o.won_deals)} of ${num(decided)} decided deals won` },
      { label:'By value', v:o.win_rate_value, of:100, text:`${o.win_rate_value != null ? o.win_rate_value + '%' : '&ndash;'}`,
        tip:`${money(o.won_value)} won of ${money(Number(o.won_value || 0) + Number(o.lost_value || 0))} decided` }])
      + `<div class="legend"><span>Share of decided deals won, against the whole bar.</span></div>`
    : `<p class="hint">Nothing decided yet, so there is no win rate.</p>`;

  let sends = `<p class="hint">Email numbers could not load.</p>`, sentN = 0, repN = 0;
  if(m){
    const by = new Map((m.daily || []).map(r => [String(r.day).slice(0, 10), r]));
    const days = [];
    for(let i = 13; i >= 0; i--){
      const key = daysAgo(i), r = by.get(key) || {};
      const lab = new Date(key + 'T12:00:00').toLocaleDateString('en-US', { month:'short', day:'numeric' });
      const s = Number(r.sent || 0), rp = Number(r.replied || 0);
      sentN += s; repN += rp;
      days.push({ tick:lab, v:s, v2:rp, tip:`${lab}: ${plural(s, 'email')} sent, ${plural(rp, 'reply', 'replies')}` });
    }
    sends = barChart(days, { aria:'Emails sent and replies each day, last 14 days', every:3 })
      + `<div class="legend"><span><i style="background:var(--orange)"></i>Sent</span><span><i style="background:var(--green)"></i>Replied</span><span>Hover a day for its numbers.</span></div>`;
  }
  const head = (t, sub) => `<div class="panel-head"><h2>${t}</h2>${sub ? `<span class="hint">${sub}</span>` : ''}</div>`;
  return `<div class="kpi-charts">
    <section class="panel">${head('Pipeline added', `${moneyShort(rolling)} in 12 months`)}${added}</section>
    <section class="panel">${head('Won value', decided ? `${moneyShort(o.won_value)} won` : '')}${won}</section>
    <section class="panel">${head('Win rate', decided ? `${num(o.won_deals)} of ${num(decided)} decided` : '')}${rate}</section>
    <section class="panel">${head('Sends and replies, 14 days', m ? `${num(sentN)} sent, ${num(repN)} replied` : '')}${sends}</section>
  </div>`;
}

/* Whose numbers these are. kpi_config.deal_owner is the Pipedrive owner
   name the KPI views filter on; it is matched to the Pipedrive user and
   then to the team's full name, and shown as stored if there is no match. */
function kpiOwnerName(){
  const k = S.kpi || {}, owner = String((k.config || {}).deal_owner || '').trim();
  if(!owner) return 'No owner set';
  const u = (k.users || []).find(x => String(x.name || '').trim().toLowerCase() === owner.toLowerCase());
  const team = u && Object.values(EV_SENDERS).find(e => e.email === String(u.email || '').toLowerCase());
  return team ? team.label : owner;
}

function pageKpis(){
  if(!S.loaded.kpis) return loading();
  const k = S.kpi, m = S.metrics;
  const o = k.outcomes || {}, op = k.open || {};
  const qtr = Math.floor(new Date().getMonth()/3) + 1;
  if(S.kpiView === 'board') return pageBoard();
  if(S.kpiView === 'return') return pageReturn();

  /* ---- scorecard ---- */
  const score = k.score.map(r=>{
    const pct = r.pct_of_year!=null ? Math.min(100, Number(r.pct_of_year)) : 0;
    return `<tr>
      <td><b>${esc(r.label)}</b>${r.source==='manual'?' <span class="chip">entered by hand</span>':''}
        ${r.mapped?'':' <span class="chip bad">not mapped</span>'}</td>
      <td class="num">${esc(kpiTarget(r))}</td>
      <td class="num"><b>${esc(kpiVal(r))}</b></td>
      <td class="num" style="color:${paceColor(r.pct_of_pace)}">
        ${r.pct_of_pace!=null?r.pct_of_pace+'%':'&ndash;'}
        <small style="display:block;font-family:var(--body);font-size:10.5px">${paceWord(r.pct_of_pace)}</small></td>
      <td><span class="bar"><i style="width:${pct}%"></i></span>
        <small class="mono" style="color:var(--slate)">${r.pct_of_year!=null?r.pct_of_year+'% of year':''}</small></td>
    </tr>`;
  }).join('');

  /* ---- quarters ---- */
  const qPeak = Math.max(1, ...k.quarters.map(q=>Number(q.added)||0), Number(k.quarters[0]?.goal)||0);
  const quarters = k.quarters.map(q=>`<tr>
    <td>Q${q.quarter}${q.quarter===qtr?' <span class="chip hot">now</span>':''}</td>
    <td class="num">${money(q.goal)}</td>
    <td class="num"><b>${money(q.added)}</b></td>
    <td class="num">${num(q.deals)}</td>
    <td><span class="bar"><i style="width:${Math.round(100*(Number(q.added)||0)/qPeak)}%"></i></span></td>
  </tr>`).join('');

  /* ---- funnel ---- */
  const fPeak = Math.max(1, ...k.stages.map(x=>Number(x.deals)||0));
  const funnel = k.stages.map(x=>`<tr>
    <td class="mono muted">${x.order_nr}</td>
    <td>${esc(x.stage)}</td>
    <td class="num">${num(x.deals)}</td>
    <td class="num">${money(x.value)}</td>
    <td><span class="bar"><i style="width:${Math.round(100*(Number(x.deals)||0)/fPeak)}%"></i></span></td>
  </tr>`).join('');

  /* ---- twelve months ---- */
  const mPeak = Math.max(1, ...k.monthly.map(x=>Number(x.added)||0));
  const months = k.monthly.map(x=>{
    const d = new Date(x.month + 'T00:00:00');
    const lab = d.toLocaleDateString('en-US',{month:'short',year:'2-digit'});
    return `<tr><td class="mono">${esc(lab)}</td>
      <td class="num">${money(x.added)}</td>
      <td class="num muted">${num(x.deals)}</td>
      <td><span class="bar"><i style="width:${Math.round(100*(Number(x.added)||0)/mPeak)}%"></i></span></td>
    </tr>`;
  }).join('');
  const rolling = k.monthly.reduce((a,x)=>a+Number(x.added||0),0);

  /* ---- targets editor ---- */
  const editor = S.kpiEdit ? `<div class="block">
    <h2 class="sec">Targets</h2>
    <p class="hint" style="margin-top:0">Quarterly. The annual target is always four times this, matching the spreadsheet.</p>
    <table><thead><tr><th>Metric</th><th class="num" style="width:190px">Quarter target</th></tr></thead><tbody>
      ${k.targets.map(t=>`<tr><td>${esc(t.label)}</td>
        <td class="num"><input type="text" data-tgt="${esc(t.metric_key)}"
          value="${esc(t.quarter_target)}" style="text-align:right"/></td></tr>`).join('')}
    </tbody></table>

async function moveDeal(stageId, status){
  if(S.dealBusy) return;
  S.dealBusy=true; S.dealErr='';
  S.kpiNote = status ? 'Marking ' + status + ' in Pipedrive\u2026' : 'Moving in Pipedrive\u2026';
  render();
  try{
    const body = { pipedrive_deal_id: Number(S.dealId) };
    if(stageId) body.stage_id = Number(stageId);
    if(status)  body.status = status;
    const res = await fetch(MOVE_URL, { method:'POST',
      headers:await authHeaders(), body: JSON.stringify(body) });
    const out = await res.json().catch(()=>({}));
    if(!res.ok || out.ok===false) throw new Error(out.message || out.error || 'Pipedrive returned ' + res.status);
    S.kpiNote = status
      ? `${out.title||'Deal'} marked ${status}.`
      : `${out.title||'Deal'} moved to ${out.stage_name||'the new stage'}.`;
    S.dealId=null;
    S.loaded.kpis=false; await loadKpis();
  }catch(err){ S.dealErr = err.message||String(err); }
  finally{ S.dealBusy=false; render(); }
}

async function createDeal(){
  if(S.dealBusy) return;
  const f = S.addForm || {};
  if(!String(f.title||'').trim()){ S.dealErr='A deal needs a title.'; return render(); }
  if(!f.stage_id){ S.dealErr='Pick a stage.'; return render(); }
  S.dealBusy=true; S.dealErr=''; S.kpiNote=''; render();
  try{
    const res = await fetch(ADDDEAL_URL, { method:'POST',
      headers:await authHeaders(),
      body: JSON.stringify({
        title: String(f.title).trim(),
        stage_id: Number(f.stage_id),
        value: f.value || null,
        org_id: f.org_id || null,
        user_id: f.user_id || null
      }) });
    const out = await res.json().catch(()=>({}));
    if(!res.ok || out.ok===false) throw new Error(out.message || out.error || 'Pipedrive returned ' + res.status);
    S.kpiNote = `${out.title||'Deal'} created in ${out.stage_name||'the pipeline'}.`;
    S.addOpen=false; S.addForm={}; S.orgHits=[];
    S.loaded.kpis=false; await loadKpis();
  }catch(err){ S.dealErr = err.message||String(err); }
  finally{ S.dealBusy=false; render(); }
}

let dragDealId = null;

function wireDrag(){
  document.querySelectorAll('[data-deal]').forEach(el=>{
    el.addEventListener('dragstart', e=>{
      dragDealId = el.dataset.deal;
      el.classList.add('dragging');
      if(e.dataTransfer){
        e.dataTransfer.effectAllowed = 'move';
        // Firefox refuses to start a drag unless something is set.
        e.dataTransfer.setData('text/plain', dragDealId);
      }
    });
    el.addEventListener('dragend', ()=>{ el.classList.remove('dragging'); dragDealId = null; });
  });

  document.querySelectorAll('[data-drop]').forEach(col=>{
    col.addEventListener('dragover', e=>{
      e.preventDefault();
      if(e.dataTransfer) e.dataTransfer.dropEffect = 'move';
      col.classList.add('over');
    });
    // dragleave fires when crossing onto a child, so only clear the
    // highlight when the pointer has actually left the column.
    col.addEventListener('dragleave', e=>{
      if(!col.contains(e.relatedTarget)) col.classList.remove('over');
    });
    col.addEventListener('drop', e=>{
      e.preventDefault();
      col.classList.remove('over');
      const id = dragDealId || (e.dataTransfer ? e.dataTransfer.getData('text/plain') : '');
      const stage = col.dataset.drop;
      if(!id || !stage) return;
      const card = document.querySelector('[data-deal="'+id+'"]');
      // Dropping a card back where it started is not a change, and
      // sending it would write a pointless update to Pipedrive.
      if(card && String(card.dataset.stage) === String(stage)) return;
      S.dealId = id;
      moveDeal(stage, null);
    });
  });
}

      const row = (S.leads||[]).find(l=>l.contact_id===cid);
      if(!row) return;
      const cur = Array.isArray(row.label_ids) ? row.label_ids.map(Number) : [];
      // Writing label_ids replaces the array rather than adding to it, which
      // is how the re-engagement flow used to strip labels off people. Build
      // the full set here and send all of it.
      const next = cur.includes(id) ? cur.filter(x=>x!==id) : cur.concat([id]);
      saveLeadLabels(cid, next);
    }));

  const bp = document.getElementById('bPipe');
  if(bp) bp.addEventListener('change',()=>{ S.boardPipe = bp.value; render(); });

  document.querySelectorAll('[data-deal]').forEach(el=>
    el.addEventListener('click',()=>{ S.dealId = el.dataset.deal; S.dealErr=''; render(); }));

  const dc = document.querySelector('[data-dclose]');
  if(dc) dc.addEventListener('click',()=>{ S.dealId=null; S.dealErr=''; render(); });

  const dm = document.getElementById('dMove');
  if(dm) dm.addEventListener('click',()=>{
    const sel = document.getElementById('dStage');
    moveDeal(sel ? sel.value : null, null);
  });
  const dw = document.getElementById('dWon');
  if(dw) dw.addEventListener('click',()=>{ if(confirm('Mark this deal won in Pipedrive?')) moveDeal(null,'won'); });
  const dl = document.getElementById('dLost');
  if(dl) dl.addEventListener('click',()=>{ if(confirm('Mark this deal lost in Pipedrive?')) moveDeal(null,'lost'); });

  const ba = document.getElementById('bAdd');
  if(ba) ba.addEventListener('click',()=>{
    const cols = (S.kpi.cols||[]).filter(c=>c.pipeline_name===S.boardPipe);
    const me = (S.kpi.users||[]).find(u=>u.name===(S.kpi.targets[0]||{}).owner) || null;
    S.addForm = { stage_id: (cols[0]||{}).stage_id, user_id: me?me.user_id:((S.kpi.users||[])[0]||{}).user_id };
    S.addOpen=true; S.dealErr=''; S.orgHits=[]; render();
  });
  const ac = document.querySelector('[data-aclose]');
  if(ac) ac.addEventListener('click',()=>{ S.addOpen=false; S.dealErr=''; render(); });

  const at = document.getElementById('aTitle');
  if(at) at.addEventListener('input',()=>{ S.addForm.title = at.value; });
  const av = document.getElementById('aValue');
  if(av) av.addEventListener('input',()=>{ S.addForm.value = av.value; });
  const as_ = document.getElementById('aStage');
  if(as_) as_.addEventListener('change',()=>{ S.addForm.stage_id = as_.value; });
  const ao = document.getElementById('aOwner');
  if(ao) ao.addEventListener('change',()=>{ S.addForm.user_id = ao.value; });

  const org = document.getElementById('aOrg');
  if(org) org.addEventListener('input',()=>{
    S.addForm.org_name = org.value; S.addForm.org_id = null; searchOrgs(org.value);
  });
  document.querySelectorAll('[data-org]').forEach(el=>
    el.addEventListener('click',()=>{
      S.addForm.org_id = el.dataset.org;
      S.addForm.org_name = el.dataset.orgname;
      S.orgHits=[]; render();
    }));
  const oc = document.getElementById('aOrgClear');
  if(oc) oc.addEventListener('click',()=>{ S.addForm.org_id=null; S.addForm.org_name=''; S.orgHits=[]; render(); });

  const asv = document.getElementById('aSave');
  if(asv) asv.addEventListener('click', createDeal);
}

async function saveKpiTargets(){
  if(S.kpiBusy) return;
  S.kpiBusy=true; S.kpiErr=''; render();
  try{
    const tgts = [...document.querySelectorAll('[data-tgt]')].map(el=>({
      metric_key: el.dataset.tgt,
      quarter_target: Number(String(el.value).replace(/[^0-9.\-]/g,'')) || 0
    }));
    for(const t of tgts){
      const { error } = await sb.from('kpi_targets')
        .update({ quarter_target: t.quarter_target, updated_at: new Date().toISOString() })
        .eq('metric_key', t.metric_key);
      if(error) throw error;
    }
    const mans = [...document.querySelectorAll('[data-man]')].map(el=>({
      quarter: Number(el.dataset.man),
      value: Number(String(el.value).replace(/[^0-9.\-]/g,'')) || 0
    }));
    for(const mv of mans){
      const { error } = await sb.from('kpi_manual')
        .update({ value: mv.value, updated_at: new Date().toISOString() })
        .eq('metric_key','competitive_bid').eq('year', S.kpi.year).eq('quarter', mv.quarter);
      if(error) throw error;
    }
    S.kpiEdit=false;
    S.kpiNote='Targets saved.';
    S.loaded.kpis=false;
    await loadKpis();
  }catch(err){ S.kpiErr = err.message||String(err); }
  finally{ S.kpiBusy=false; render(); }
}

function subsOf(t){
  return (S.tasks[S.dayOwner || S.me] || [])
    .filter(x => x.parent_id === t.id)
    .sort((a,b) => (a.sort_order||0) - (b.sort_order||0));
}

function subHtml(s){
  const done = s.status === 'done';
  return `<div class="sub ${done?'done':''}">
    <button class="box sm" data-task-toggle="${s.id}"
      title="${done?'Click to reopen':'Click to tick off'}">${done?'&#10003;':''}</button>
    <span class="st">${esc(s.title)}</span>
    <button class="linkbtn" data-task-del="${s.id}">remove</button>
  </div>`;
}

function taskHtml(t){
  if(t.parent_id) return '';   // rendered under its parent, not on its own
  const cls = t.status==='done' ? 'done' : (t.status==='doing' ? 'doing' : '');
  /* Age is the useful signal on a carried task. A thing sitting for six
     days is a different problem from a thing sitting since yesterday. */
  const carried = t.work_date < today() && t.status !== 'done';
  const days = carried
    ? Math.max(1, Math.round((new Date(today()) - new Date(t.work_date)) / 86400000))
    : 0;
  const subs = subsOf(t);
  const sdone = subs.filter(x => x.status === 'done').length;
  const pct = subs.length ? Math.round(100 * sdone / subs.length) : 0;
  /* Expanded while the task is in progress, since that is when the
     detail is actually being worked through. The bar carries enough at
     a glance the rest of the time. */
  const open = S.taskOpen[t.id] !== undefined
    ? S.taskOpen[t.id]
    : (t.status === 'doing' && subs.length > 0);
  const adding = S.subDraft && S.subDraft.parentId === t.id;

  return `<div class="task ${cls}" data-tid="${t.id}">
    ${t.status!=='done' ? `<span class="grip" data-grip="${t.id}" title="Drag to reorder">&#8942;&#8942;</span>` : ''}
    <button class="box" data-task-toggle="${t.id}" title="Click to advance">${t.status==='done'?'&#10003;':''}</button>
    <span class="mid">
      <span class="tt">${esc(t.title)}</span>
      <span class="tmeta">
        ${esc(t.category)}
        ${t.priority==1?' &middot; <span class="pri1">high</span>':''}
        ${t.status==='doing'?' &middot; in progress':''}
        ${carried?` &middot; <span style="color:var(--orange-ink)">carried ${days}d</span>`:''}
        ${subs.length?` &middot; ${sdone} of ${subs.length}`:''}
      </span>
      ${subs.length?`<span class="bar" style="margin-top:6px"><i style="width:${pct}%"></i></span>`:''}

      ${open && subs.length ? `<span class="subs">${subs.map(subHtml).join('')}</span>` : ''}

      ${adding ? `<span class="subadd">
        <input type="text" id="subInput" value="${esc(S.subDraft.title)}"
               placeholder="What needs doing" autocomplete="off" />
        <button class="btn small" id="subSave">Add</button>
        <button class="linkbtn" id="subCancel">Cancel</button>
      </span>` : ''}

      <span class="subctl">
        ${subs.length ? `<button class="linkbtn" data-task-open="${t.id}">${
          open ? 'Hide steps' : `Show ${subs.length} step${subs.length===1?'':'s'}`}</button>` : ''}
        ${adding ? '' : `<button class="linkbtn" data-sub-add="${t.id}">Add a step</button>`}
      </span>
    </span>
    <button class="linkbtn" data-task-del="${t.id}">remove</button>
  </div>`;
}

function clsVisible(){
  let rows = S.cls || [];

  if(S.clsFilter !== 'all') rows = rows.filter(x => x.outcome === S.clsFilter);

  const dir = S.clsDir === 'asc' ? 1 : -1;
  const key = S.clsSort;
  rows = rows.slice().sort((a,b)=>{
    if(key === 'company_name'){
      return String(a.company_name||'').localeCompare(String(b.company_name||'')) * dir;
    }
    const av = Number(a[key]||0), bv = Number(b[key]||0);
    // Contacts descending breaks ties, since that is what the whole
    // ordering is for: read the expensive ones first.
    if(av === bv) return Number(b.contacts||0) - Number(a.contacts||0);
    return (av - bv) * dir;
  });

  return rows;
}

async function applyClassifications(dismiss){
  const ids = clsVisible().filter(x => S.clsPicked.has(x.company_id)).map(x => x.company_id);
  if(!ids.length) return;

  const affected = clsVisible().filter(x => S.clsPicked.has(x.company_id))
    .reduce((a,x) => a + Number(x.contacts||0), 0);
  if(!dismiss && !confirm(`Apply ${ids.length} classifications?\n\nThis changes ${affected} contacts. Anything marked not a fit stops receiving outreach.`)) return;

  S.clsBusy = true; S.clsErr = ''; S.clsNote = ''; render();
  try{
    if(dismiss){
      const { data, error } = await sb.rpc('dismiss_classifications', { p_ids: ids });
      if(error) throw error;
      S.clsNote = `${data} dismissed. No contacts were changed.`;
    } else {
      const { data, error } = await sb.rpc('apply_classifications', { p_ids: ids });
      if(error) throw error;
      const r = Array.isArray(data) ? data[0] : data;
      // Skipped contacts are the ones whose email says they work
      // somewhere else. Worth naming rather than burying, since that
      // is the number that says how messy the company records are.
      S.clsNote = `${r.companies_applied} companies applied, ${r.contacts_changed} contacts changed.`
        + (r.contacts_skipped ? ` ${r.contacts_skipped} left alone, on a different email domain from their company.` : '');
    }
    S.loaded.cls = false; S.loaded.leads = false;
    await loadClassifications(); await loadBatches(); await loadLeadRows();
  }catch(err){ S.clsErr = err.message || String(err); }
  finally{ S.clsBusy = false; render(); }
}

function clsRepaint(){
  const vis = clsVisible();
  const body = document.getElementById('clsBody');
  const table = document.getElementById('clsTable');
  const empty = document.getElementById('clsEmpty');
  if(body) body.innerHTML = vis.map(clsRow).join('');
  if(table) table.style.display = vis.length ? '' : 'none';
  if(empty) empty.style.display = vis.length ? 'none' : '';

  // The message has to change with the reason, or a search that found
  // nothing reads as a database that is empty.
  const eh = document.getElementById('clsEmptyH');
  const ep = document.getElementById('clsEmptyP');
  if(eh) eh.textContent = S.clsSearch ? 'Nothing matches' : 'Nothing to review';
  if(ep) ep.textContent = S.clsSearch
    ? 'No company matches that search in this filter. Try a shorter word, or switch the filter to All.'
    : 'Run the Company Classifier in n8n to populate this.';

  const picked = vis.filter(x => S.clsPicked.has(x.company_id)).length;
  const c = document.querySelector('.actionbar .count b');
  if(c) c.textContent = String(picked);
  ['clsApply','clsDismiss'].forEach(id=>{
    const b = document.getElementById(id);
    if(b) b.disabled = !picked;
  });
  // Checkboxes were just rebuilt, so their handlers went with them.
  document.querySelectorAll('[data-cpick]').forEach(el=>
    el.addEventListener('change', onClsPick));
}

function onClsPick(e){
  const el = e.target;
  const id = el.dataset.cpick;
  if(el.checked) S.clsPicked.add(id); else S.clsPicked.delete(id);
  const row = el.closest('tr');
  if(row) row.classList.toggle('picked', el.checked);
  const vis = clsVisible();
  const picked = vis.filter(x => S.clsPicked.has(x.company_id)).length;
  const c = document.querySelector('.actionbar .count b');
  if(c) c.textContent = String(picked);
  ['clsApply','clsDismiss'].forEach(bid=>{
    const b = document.getElementById(bid);
    if(b) b.disabled = !picked;
  });
}

function wireClassify(){
  document.querySelectorAll('[data-lview]').forEach(el=>
    el.addEventListener('click',()=>{ S.leadView = el.dataset.lview; S.clsNote=''; S.clsErr=''; render(); }));
  document.querySelectorAll('[data-cfilter]').forEach(el=>
    el.addEventListener('click', async ()=>{
      S.clsFilter = el.dataset.cfilter;
      S.clsPicked = new Set();
      await loadClassifications();
      render();
    }));
  document.querySelectorAll('[data-cpick]').forEach(el=>
    el.addEventListener('change', onClsPick));

  // Typing repaints the rows rather than the page, so the cursor and
  // the selection stay where they were.
  const cs = document.getElementById('clsSearch');
  if(cs) cs.addEventListener('input',()=>{
    S.clsSearch = cs.value;
    clearTimeout(clsTimer);
    clsTimer = setTimeout(async ()=>{
      await loadClassifications();
      render();
      // The patcher keeps the box and its caret where they were.
    }, 400);
  });

  document.querySelectorAll('[data-csort]').forEach(el=>
    el.addEventListener('click',()=>{
      const k = el.dataset.csort;
      if(S.clsSort === k){
        S.clsDir = S.clsDir === 'asc' ? 'desc' : 'asc';
      } else {
        S.clsSort = k;
        // Names read best A to Z, numbers best highest first.
        S.clsDir = k === 'company_name' ? 'asc' : 'desc';
      }
      render();
    }));
  // The tail of the list: few contacts and high confidence. Being
  // wrong about one of these costs one contact, which is the whole
  // reason the list is ordered the way it is.
  const csafe = document.getElementById('clsSafe');
  if(csafe) csafe.addEventListener('click',()=>{
    clsVisible().forEach(x=>{
      if(x.outcome !== 'unsure' && Number(x.contacts) <= 2 && Number(x.confidence) >= 90){
        S.clsPicked.add(x.company_id);
      }
    });
    render();
  });

  const ca = document.getElementById('clsAll');
  if(ca) ca.addEventListener('click',()=>{
    clsVisible().filter(x=>x.outcome!=='unsure').forEach(x=>S.clsPicked.add(x.company_id)); render(); });
  const cn = document.getElementById('clsNone');
  if(cn) cn.addEventListener('click',()=>{
    clsVisible().forEach(x=>S.clsPicked.delete(x.company_id)); render(); });
  const cap = document.getElementById('clsApply');
  if(cap) cap.addEventListener('click',()=>applyClassifications(false));
  const cd = document.getElementById('clsDismiss');
  if(cd) cd.addEventListener('click',()=>applyClassifications(true));
  const cr = document.getElementById('clsRefresh');
  if(cr) cr.addEventListener('click', async ()=>{
    S.clsNote=''; S.clsErr=''; S.loaded.cls=false; render();
    await loadClassifications(); render(); });
}

/* Evaboot gives tenure in months; read it the way LinkedIn shows it. */
function tenure(m){
  m = Number(m||0);
  if(!m) return '';
  const y = Math.floor(m/12), r = m%12;
  if(!y) return `${r} mo`;
  return r ? `${y} yr ${r} mo` : `${y} yr`;
}

  const la = S.lastApproval;
  if(!la || !la.n) return '';

  const when = la.when ? new Date(la.when) : null;

    ? (() => {
        const mins = Math.round((Date.now() - when.getTime()) / 60000);
        if(mins < 1)  return 'just now';
        if(mins < 60) return mins + (mins===1?' minute ago':' minutes ago');
        const hrs = Math.round(mins/60);
        if(hrs < 24)  return hrs + (hrs===1?' hour ago':' hours ago');
        const days = Math.round(hrs/24);
        return days + (days===1?' day ago':' days ago');
      })()
    : '';

  return `<div class="revert">

/* ---------- Find on LinkedIn ----------
   Builds a Sales Navigator people search from presets, sends Liam to look
   at it on LinkedIn, and only then lets him start an Evaboot scrape.
   Evaboot's API has no result limit: a run scrapes, and charges a credit
   for, every person the search returns. The count typed in after looking
   is what n8n checks against its ceiling and the credit reserve. */

/* LinkedIn's own filter ids, resolved against the Sales Navigator catalog
   in October 2026. They do not change; new territories need new ids. */
const SN_TERRITORIES = {
  'san-joaquin':    { label:'San Joaquin County', regions:[101831129,101412965,106503158,106070069,100762562] },
  'central-valley': { label:'Central Valley (SJ, Stanislaus, Merced)',
                      regions:[101831129,102641906,105763016,101412965,101671045,106503158,106070069,100762562,104337712,100338711] },
  'sacramento':     { label:'Sacramento region', regions:[101103472,101391088,107169071,101955072,90000082] },
  'bay-area':       { label:'Bay Area', regions:[102839053,102476922,105416315,104739033,100901743] }
};
const SN_SIZES = { B:'1-10', C:'11-50', D:'51-200', E:'201-500', F:'501-1000', G:'1001-5000', H:'5001-10000', I:'10001+' };
const SN_LEVELS = {
  directors: { label:'Directors and up',
    terms:['Director','"Senior Director"','"Sr. Director"','VP','"Vice President"','SVP','EVP','Head','"Head of"','Chief'] },
  managers:  { label:'Managers and up',
    terms:['Director','"Senior Director"','"Sr. Director"','VP','"Vice President"','SVP','EVP','Head','"Head of"','Chief',
           'Manager','"Senior Manager"','"Sr. Manager"','Superintendent'] }
};
const SN_EXCLUDE = ['Assistant','Coordinator','Analyst','Intern','Junior','Trainee','Apprentice','Student',
  '"Executive Assistant"','Freelance','Freelancer','"Business Development"','Sales'];
/* Per sector: LinkedIn industries, the role words a buyer's title carries,
   and titles that are buyers on their own whatever the level. */
const SN_SECTORS = {
  'healthcare':       { ind:[14], roles:['Facilities','Facility','"Plant Operations"','Engineering','Construction','"Capital Projects"'], direct:[],
                        not:['"Medical Director"','Hospitalist','Physician','Nurse','Nursing','Clinical','Culinary','Nutrition','Financing'] },
  'senior-living':    { ind:[2091], roles:['Facilities','Maintenance','Operations','Construction'], direct:['Administrator','"Executive Director"'] },
  'education':        { ind:[67,68,69], roles:['Facilities','Maintenance','"Maintenance and Operations"','"M&O"','"Plant Operations"','"Capital Projects"','Construction'], direct:[] },
  'industrial':       { ind:[25,23,93,92], roles:['Facilities','Facility','Plant','Engineering','Maintenance','Construction'], direct:['"Plant Manager"'] },
  'auto':             { ind:[1292,53], roles:['"Fixed Operations"','Facilities','Operations'], direct:['"Dealer Principal"','"Dealer Operator"','"General Manager"'],
                        not:['"Service Manager"','"Parts Manager"','Finance','"F&I"'] },
  'qsr-petroleum':    { ind:[32,34,57,27], roles:['Construction','"Real Estate"','"Site Development"','"Store Development"','Facilities'], direct:['Franchisee','"Franchise Owner"'] },
  'qsr':              { ind:[32,34], roles:['Construction','"Real Estate"','"Site Development"','"Store Development"','Facilities'], direct:['Franchisee','"Franchise Owner"'] },
  'petroleum':        { ind:[57], roles:['Construction','"Real Estate"','"Site Development"','"Store Development"','Facilities'], direct:[] },
  'retail':           { ind:[27], roles:['Construction','"Store Development"','"Store Planning"','"Real Estate"','Facilities'], direct:[] },
  'multi-family':     { ind:[1759,44], roles:['Development','Construction','"Asset Management"','"Capital Projects"'], direct:['"Asset Manager"'] },
  'property-manager': { ind:[44,128,1759], roles:['Property','"Property Management"','Facilities','"Asset Management"','Portfolio'], direct:['"Property Manager"','"Asset Manager"'] },
  'municipal':        { ind:[75], roles:['"Public Works"','Facilities','"Capital Projects"','"Capital Improvement"','Engineering'], direct:['"City Engineer"','"City Manager"'] },
  'office':           { ind:[], roles:['Facilities','Workplace','"Real Estate"','"Building Operations"'], direct:[] },
  'mixed-commercial': { ind:[44,128], roles:['Development','Construction','"Asset Management"','"Real Estate"'], direct:[] }
};

/* LinkedIn double-encodes the title boolean, and its inner pass escapes
   parentheses too, which encodeURIComponent leaves alone. */
function snEnc(t){
  return encodeURIComponent(t).replace(/[()!'*]/g, c => '%' + c.charCodeAt(0).toString(16).toUpperCase());
}
function snExtraTerms(){
  return String(S.snExtra||'').split(',')
    .map(x => x.replace(/["()]/g,'').trim()).filter(Boolean)
    .map(x => /\s/.test(x) ? `"${x}"` : x);
}
function snTitle(){
  const sec = SN_SECTORS[S.snSector]; if(!sec) return '';
  const lvl = SN_LEVELS[S.snLevel] || SN_LEVELS.directors;
  const roles = [...new Set(sec.roles.concat(snExtraTerms()))];
  let core = `(${lvl.terms.join(' OR ')}) AND (${roles.join(' OR ')})`;
  if(sec.direct.length) core = `((${core}) OR (${sec.direct.join(' OR ')}))`;
  return `${core} NOT (${SN_EXCLUDE.concat(sec.not || []).join(' OR ')})`;
}
function snUrl(){
  const sec = SN_SECTORS[S.snSector];
  const regions = [...new Set(S.snTerr.flatMap(k => (SN_TERRITORIES[k]||{}).regions || []))];
  if(!sec || !regions.length) return '';
  const inc = id => `(id:${id},selectionType:INCLUDED)`;
  const parts = [];
  if(S.snSizes.length)
    parts.push(`(type:COMPANY_HEADCOUNT,values:List(${S.snSizes.map(k=>`(id:${k},text:${SN_SIZES[k]},selectionType:INCLUDED)`).join(',')}))`);
  parts.push(`(type:REGION,values:List(${regions.map(inc).join(',')}))`);
  if(sec.ind.length) parts.push(`(type:INDUSTRY,values:List(${sec.ind.map(inc).join(',')}))`);
  parts.push(`(type:CURRENT_TITLE,values:List((text:${snEnc(snTitle())},selectionType:INCLUDED)))`);
  return 'https://www.linkedin.com/sales/search/people?query=' + encodeURIComponent(`(filters:List(${parts.join(',')}))`);
}

function snRunState(){
  const url = snUrl();
  const n = parseInt(S.snCount, 10) || 0;
  const L = snLimits();
  if(!url) return { ok:false, label:'Scrape leads', hint:'Pick a sector and at least one territory.' };
  if(S.snOpened !== url) return { ok:false, label:'Scrape leads', hint:'Open the search in Sales Navigator first. Changing a filter means looking again.' };
  if(n < 1) return { ok:false, label:'Scrape leads', hint:'Enter the result count Sales Navigator shows above its list.' };
  if(n > L.max) return { ok:false, label:`Scrape ${n} leads`,
    hint:`That is over the ${L.max} lead limit per run. Narrow it: Directors and up, a company size, or fewer territories.` };
  if(L.credits != null && L.credits - n < L.floor) return { ok:false, label:`Scrape ${n} leads`,
    hint:`About ${n} credits needed and ${L.credits} left, with ${L.floor} kept in reserve. Top up Evaboot or narrow the search.` };
  return { ok:true, label:`Scrape ${n} leads (about ${n} credits)`,
    hint:'Evaboot charges one credit per person found, email included. Leads land here as a new batch in a few minutes.' };
}

/* ---------- CSV ---------- */
/* Evaboot profile summaries carry commas, quotes and line breaks, so
   splitting on commas mangles roughly one row in three. This is a real
   RFC 4180 reader: quoted fields, doubled quotes, embedded newlines. */
function parseDelimited(text, delim){
  const rows=[]; let row=[], field='', i=0, inQ=false;
  while(i < text.length){
    const ch = text[i];
    if(inQ){
      if(ch === '"'){
        if(text[i+1] === '"'){ field+='"'; i+=2; continue; }
        inQ=false; i++; continue;
      }
      field+=ch; i++; continue;
    }
    if(ch === '"'){ inQ=true; i++; continue; }
    if(ch === delim){ row.push(field); field=''; i++; continue; }
    if(ch === '\r'){ i++; continue; }
    if(ch === '\n'){ row.push(field); rows.push(row); row=[]; field=''; i++; continue; }
    field+=ch; i++;
  }
  if(field !== '' || row.length){ row.push(field); rows.push(row); }
  return rows;
}

function sniffDelimiter(text){
  const line = text.split(/\r?\n/,1)[0] || '';
  const c=(line.match(/,/g)||[]).length, s=(line.match(/;/g)||[]).length, t=(line.match(/\t/g)||[]).length;
  if(t>c && t>s) return '\t';
  if(s>c) return ';';
  return ',';
}

/* Headers stay exactly as Evaboot wrote them. The import workflow reads
   "First Name", "Current Job", "Linkedin URL Public" and the rest by
   literal string, so renaming anything here silently empties the field. */
function csvToRows(text){
  const clean = text.replace(/^\uFEFF/,'');
  const rows = parseDelimited(clean, sniffDelimiter(clean))
    .filter(r=>r.some(c=>String(c).trim()!==''));
  if(rows.length < 2) return { rows:[], headers:[] };
  const headers = rows[0].map(h=>String(h).trim());
  const out = rows.slice(1).map(r=>{
    const o={}; headers.forEach((h,idx)=>{ if(h) o[h] = r[idx]==null ? '' : r[idx]; });
    return o;
  });
  return { rows: out, headers };
}

function readCsvFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  S.impFile = file.name; S.impErr='';
  if(!S.impName) S.impName = file.name.replace(/\.csv$/i,'');
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const { rows, headers } = csvToRows(String(reader.result||''));
      S.impRows = rows;
      if(!rows.length){
        S.impErr = 'No data rows found. Export from Evaboot as CSV rather than XLSX.';
      } else if(!headers.includes('First Name') && !headers.includes('Full Name')){
        S.impErr = 'This does not look like an Evaboot export. The importer needs the original column headers, so upload the file exactly as Evaboot produced it.';
      }
    }catch(err){
      S.impRows = null;
      S.impErr = 'That file could not be read. ' + (err.message||'');
    }
    render();
  };
  reader.onerror = ()=>{ S.impErr='That file could not be read.'; render(); };
  reader.readAsText(file);
}

/* ---------- lead actions ---------- */
async function postIds(url, ids){
  const res = await fetch(url,{method:'POST',
    headers:await authHeaders(),
    body:JSON.stringify({contact_ids:ids})});
  if(!res.ok) throw new Error('The request came back ' + res.status);
  return res.json().catch(()=>({}));
}

async function approveLeads(){
  const ids = visibleLeads().filter(l=>S.picked.has(l.contact_id)).map(l=>l.contact_id);
  if(!ids.length) return;
  S.leadErr=''; S.leadNote='';
  S.leadProg = { verb:'Approving', done:0, total:ids.length, failed:0 };
  render();

  let failed = 0;
  for(let i=0; i<ids.length; i+=APPROVE_CHUNK){
    const slice = ids.slice(i, i+APPROVE_CHUNK);
    try{ await postIds(APPROVE_URL, slice); }
    catch{ failed += slice.length; }
    S.leadProg.done = Math.min(i+slice.length, ids.length);
    S.leadProg.failed = failed;
    render();
  }

  const cleared = ids.length - failed;
  S.leadProg = null;
  S.leadNote = failed
    ? `${cleared} approved and pushed to Pipedrive. ${failed} did not go through, and they are still here to retry.`
    : `${cleared} approved and pushed to Pipedrive.`;
  S.loaded.leads=false; S.loaded.tiles=false; S.loaded.metrics=false;
  await loadBatches(); await loadLeadRows(); render();
}

async function rejectLeads(){
  const ids = visibleLeads().filter(l=>S.picked.has(l.contact_id)).map(l=>l.contact_id);
  if(!ids.length) return;
  S.leadErr=''; S.leadNote='';
  S.leadProg = { verb:'Rejecting', done:0, total:ids.length, failed:0 };
  render();
  try{
    /* One SQL update, so this does not need chunking. */
    const out = await postIds(REJECT_URL, ids);
    const n = out.rejected!=null ? out.rejected : ids.length;
    S.leadNote = `${n} rejected. The records stay in the database, so the same people turning up in a later scrape are recognised rather than reviewed twice.`;
  }catch(err){ S.leadErr = err.message||String(err); }
  S.leadProg = null;
  S.loaded.leads=false;
  await loadBatches(); await loadLeadRows(); render();
}

async function runImport(){
  if(!S.impRows || !S.impRows.length) return;
  S.impBusy=true; S.impErr=''; S.leadNote=''; render();

  let requestedBy = '';
  try{
    const { data } = await sb.auth.getUser();
    requestedBy = (data && data.user && data.user.email) || '';
  }catch{ /* not fatal */ }

  try{
    const res = await fetch(IMPORT_URL,{method:'POST',
      headers:await authHeaders(),
      body:JSON.stringify({
        name: S.impName.trim() || S.impFile.replace(/\.csv$/i,'') || 'Evaboot import',
        vertical_slug: S.impVert,
        requested_by: requestedBy,
        leads: S.impRows
      })});
    const out = await res.json().catch(()=>({}));
    if(!res.ok || out.ok===false) throw new Error(out.error || 'The import came back ' + res.status);

    const bits = [`${out.inserted} new leads from ${S.impRows.length} rows`];
    if(out.matched!=null)    bits.push(`${out.matched} matched in Apollo`);
    if(out.new_companies)    bits.push(`${out.new_companies} new companies`);
    if(out.with_email!=null) bits.push(`${out.with_email} with an email`);
    if(out.skipped)          bits.push(`${out.skipped} skipped for failing your Sales Navigator filters`);
    if(out.no_vertical)      bits.push(`${out.no_vertical} with no sector`);
    S.leadNote = bits.join('. ') + '.';

    S.impOpen=false; S.impRows=null; S.impFile=''; S.impName='';
    if(out.batch_id) S.batchId = out.batch_id;
    S.loaded.leads=false;
    await loadBatches(); await loadLeadRows();
  }catch(err){
    S.impErr = (err.message||String(err)) +
      '. Large files take a while, since every ten leads is one Apollo call. If it timed out, check the batch list before uploading again so you do not import twice.';
  }finally{
    S.impBusy=false; render();
  }
}

async function useDraft(draftId){
  if(S.busy) return;
  const r = S.board.find(x=>x.queue_id===S.activeId);
  const d = (S.drafts[r.queue_id]||[]).find(x=>x.id===draftId);
  if(!r||!d) return;
  const subject = document.getElementById('s-'+draftId).value.trim();
  const bodyText = document.getElementById('b-'+draftId).value.trim();
  if(!subject||!bodyText){ S.err='Add a subject and a message before sending.'; return render(); }

  // This sends for real and cannot be recalled, so it asks first.
  if(!confirm('Send this to ' + (r.email||'this contact') + ' now?\n\nIt goes out from Pat\u2019s mailbox immediately and cannot be recalled.')) return;

  S.busy=true; S.err=''; render();
  try{
    // The generated body already opens with a greeting and closes with
    // Pat, and the generator picks the greeting name properly: it reads
    // the email local part to catch Pipedrive records with first and last
    // reversed. This page used to prepend its own naive version on top,
    // which is why every email went out saying "Hi Liam, Hi Liam". Take
    // the editor text as written and only reattach the signature.
    const sigStart = (d.body_html||'').indexOf('<table');
    const signature = sigStart>-1 ? d.body_html.slice(sigStart) : '';

    const { error:upErr } = await sb.from('email_drafts')
      .update({ edited_subject:subject, edited_body:toHtml(bodyText)+signature })
      .eq('id', draftId);
    if(upErr) throw upErr;

    const res = await fetch(ACTION_URL,{method:'POST',
      headers:await authHeaders(),
      body:JSON.stringify({queue_id:r.queue_id, draft_id:draftId})});
    const out = await res.json().catch(()=>({}));
    if(res.status === 409) throw new Error('This one was already handled. Reload the page to refresh the board.');
    if(!res.ok||!out.ok) throw new Error(out.error
      || `Nothing was sent. The mail connection returned an error (${res.status}). Liam gets an alert when this happens; try again in a few minutes.`);

    // Clearing the selection lets loadBoard move to the next open contact.
    S.activeId = null;
    delete S.dEdit[draftId];
    await loadBoard();
    /* Email health, the follow-up panel, Home's charts and the KPI
       numbers all move when something sends. */
    staleAfter('send');
    if(out.sent === false) S.err = 'Saved to Pat\u2019s Outlook drafts but not sent'
      + (out.error ? ': ' + out.error : '.') + ' Send it from Outlook.';
  }catch(err){ S.err = err.message||String(err); }
  finally{ S.busy=false; render(); }
}

async function generate(verticalId, count, gold){
  if(S.busy) return;
  S.busy=true; S.gen='Pulling contacts and writing drafts, this takes about a minute…'; render();
  try{
    const body = gold ? {gold:true, count:count} : {vertical_id:verticalId, count:count};
    const res = await fetch(GENERATE_URL,{method:'POST',
      headers:await authHeaders(),
      body:JSON.stringify(body)});
    const out = await res.json().catch(()=>null);
    /* A failed call (a timeout, a 500, an auth refusal) used to read as
       "Nothing eligible", which sent Pat looking at the sector rather
       than at the workflow. Only a clean ok:false is "nothing eligible". */
    if(!res.ok) throw new Error((out && out.error) || `the draft workflow returned ${res.status}${res.statusText ? ' ' + res.statusText : ''}`);
    if(!out) throw new Error('the draft workflow sent back something that is not JSON');
    /* removed is how many picks failed the Evaboot address check and were
       left off before any draft was written. */
    const dropped = Number(out.removed || 0);
    S.gen = out.ok ? `${out.queued} added to the list with drafts ready.` +
                     (dropped ? ` ${dropped} left off because the address failed the check.` : '')
                   : (out.error || 'Nothing eligible in that sector right now.');
  }catch(err){ S.gen = 'That did not go through: ' + (err.message||err) + '. Nothing was added.'; }
  finally{
    /* Whatever happened, the pools and the board may have moved. */
    staleAfter('generate');
    try{ await Promise.all([loadTiles(), loadBoard()]); }catch(e){}
    S.busy=false; render();
  }
}

async function cycleTask(id){
  if(!canEditTasks(S.dayOwner || S.me)) return;
  const owner = S.dayOwner || S.me;
  const rows = S.tasks[owner] || [];
  const t = rows.find(x=>x.id===id);
  if(!t) return;

  /* A step is done or not done. Cycling it through "in progress" would
     make the progress bar lie, since a half-finished step still fills
     none of it. */
  const next = t.parent_id
    ? (t.status === 'done' ? 'open' : 'done')
    : (t.status==='open' ? 'doing' : (t.status==='doing' ? 'done' : 'open'));

  try{
    /* work_date moves to today whenever the status changes. Without it a
       carried task marked done keeps its old date, which satisfies
       neither half of the rollover query, and it disappears from the
       screen the instant it is ticked. */
    await sb.from('tasks').update({ status: next, work_date: today() }).eq('id', id);

    /* The parent follows its steps. Ticking the last one finishes the
       task; un-ticking any of them reopens it, which is what makes a
       mistake recoverable without a separate undo. */
    if(t.parent_id){
      const sibs = rows.filter(x => x.parent_id === t.parent_id)
        .map(x => x.id === id ? { ...x, status: next } : x);
      const allDone = sibs.length > 0 && sibs.every(x => x.status === 'done');
      const parent = rows.find(x => x.id === t.parent_id);
      if(parent){
        if(allDone && parent.status !== 'done'){
          await sb.from('tasks').update({ status:'done', work_date: today() })
            .eq('id', parent.id);
        } else if(!allDone && parent.status === 'done'){
          await sb.from('tasks').update({ status:'doing', work_date: today() })
            .eq('id', parent.id);
        }
      }
    }

    await loadTasks(owner); render();
  }catch(err){ S.err = err.message||String(err); render(); }
}

}

/* ---------- drag to reorder ----------
   Pointer events cover mouse, pen and touch with one code path. The row
   moves in the DOM while dragging, and nothing is written until release,
   so a drag that ends where it began costs no requests. Only unfinished
   rows take part: done rows have no handle and stay parked below. */
function startTaskDrag(e){
  if(!canEditTasks(S.dayOwner || S.me)) return;
  if(e.button !== undefined && e.button !== 0) return;
  const list = document.getElementById('taskList');
  const row = e.currentTarget.closest('.task');
  if(!list || !row) return;
  e.preventDefault();
  /* Listeners sit on window rather than the handle: moving the row in
     the DOM drops pointer capture, and the drag would die mid-gesture. */
  const pid = e.pointerId;
  const before = [...list.querySelectorAll('.task[data-tid]')].map(r=>r.dataset.tid);
  row.classList.add('dragging');
  document.body.classList.add('reordering');

  const move = ev => {
    if(ev.pointerId !== pid) return;
    ev.preventDefault();
    const y = ev.clientY;
    const others = [...list.querySelectorAll('.task[data-tid]')]
      .filter(r => r !== row && !r.classList.contains('done'));
    let placed = false;
    for(const r of others){
      const b = r.getBoundingClientRect();
      if(y < b.top + b.height/2){
        if(row.nextElementSibling !== r) list.insertBefore(row, r);
        placed = true; break;
      }
    }
    if(!placed && others.length){
      const last = others[others.length-1];
      if(last.nextElementSibling !== row) last.after(row);
    }
    // Keep the dragged row in view on long lists.
    if(y < 60) window.scrollBy(0, -12);
    else if(y > window.innerHeight - 60) window.scrollBy(0, 12);
  };
  const end = ev => {
    if(ev.pointerId !== pid) return;
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', end);
    window.removeEventListener('pointercancel', end);
    row.classList.remove('dragging');
    document.body.classList.remove('reordering');
    const after = [...list.querySelectorAll('.task[data-tid]')].map(r=>r.dataset.tid);
    if(after.join() !== before.join()) saveTaskOrder(after);
  };
  window.addEventListener('pointermove', move, { passive:false });
  window.addEventListener('pointerup', end);
  window.addEventListener('pointercancel', end);
}

async function saveTaskOrder(ids){
  if(!canEditTasks(S.dayOwner || S.me)) return;
  const owner = S.dayOwner || S.me;
  const rows = S.tasks[owner] || [];
  const byId = Object.fromEntries(rows.map(r=>[r.id, r]));
  /* Numbered from 1 so an insert that arrives with the column default of
     0 is easy to spot, and only rows whose number changed are written. */
  const changes = [];
  ids.forEach((id, i) => {
    const r = byId[id];
    if(r && r.sort_order !== i + 1){ changes.push({ id, sort_order: i + 1 }); r.sort_order = i + 1; }
  });
  S.tasks[owner] = orderTasks(rows);
  render();
  if(!changes.length) return;
  try{
    const results = await Promise.all(changes.map(c =>
      sb.from('tasks').update({ sort_order: c.sort_order }).eq('id', c.id)));
    const bad = results.find(r => r.error);
    if(bad) throw bad.error;
  }catch(err){
    // Reload so the screen shows what actually saved.
    S.err = 'Order not saved: ' + (err.message||String(err));
    await loadTasks(owner); render();
  }
}

/* ================= reel ideas ================= */
/* Ideas arrive two ways and both end up in the same table: posted in the
   Teams channel, which the Reel Ideas Inbox workflow parses and inserts,
   or typed straight in here. A link becomes a playable card, plain text
   becomes a written one. Complete moves it to the archive rather than
   deleting it, because the archive is the record of what has been shot. */

const REEL_PLAT = { instagram:'Instagram', tiktok:'TikTok', youtube:'YouTube',
                    facebook:'Facebook', vimeo:'Vimeo', other:'Link' };
const REEL_BRAND = { haggerty:'HAGGERTY', rhino:'RHINO', both:'Both' };

async function loadReels(){
  const { data, error } = await sb.from('reel_ideas').select('*')
    .order('created_at', { ascending:false }).limit(400);
  if(error) throw error;
  S.reels = data || [];
  S.loaded.reels = true;
}

/* Same rules as the Parse Reel Idea node in n8n, so a link typed here and
   the same link posted in Teams produce identical cards. Instagram gives
   no thumbnail without a Graph token, so those cards stay as a platform
   tile until opened. The embed itself plays. */
function parseReelLink(url){
  const out = { platform:'other', video_id:'', embed_url:'', thumbnail_url:'' };
  if(!url) return out;
  const low = String(url).toLowerCase();
  let m;
  if(low.indexOf('instagram.com') > -1){
    out.platform = 'instagram';
    m = url.match(/instagram\.com\/(?:[^\/]+\/)?(?:reels|reel|p|tv)\/([A-Za-z0-9_-]+)/);
    out.video_id = m ? m[1] : '';
    out.embed_url = out.video_id ? 'https://www.instagram.com/reel/' + out.video_id + '/embed/' : '';
  } else if(low.indexOf('tiktok.com') > -1){
    out.platform = 'tiktok';
    m = url.match(/video\/(\d+)/);
    out.video_id = m ? m[1] : '';
    out.embed_url = out.video_id ? 'https://www.tiktok.com/embed/v2/' + out.video_id : '';
  } else if(low.indexOf('youtube.com') > -1 || low.indexOf('youtu.be') > -1){
    out.platform = 'youtube';
    m = url.match(/(?:shorts\/|watch\?v=|youtu\.be\/|embed\/)([A-Za-z0-9_-]{6,})/);
    out.video_id = m ? m[1] : '';
    out.embed_url = out.video_id ? 'https://www.youtube.com/embed/' + out.video_id : '';
    out.thumbnail_url = out.video_id ? 'https://i.ytimg.com/vi/' + out.video_id + '/hqdefault.jpg' : '';
  } else if(low.indexOf('facebook.com') > -1 || low.indexOf('fb.watch') > -1){
    out.platform = 'facebook';
    out.embed_url = 'https://www.facebook.com/plugins/video.php?show_text=false&href=' + encodeURIComponent(url);
  } else if(low.indexOf('vimeo.com') > -1){
    out.platform = 'vimeo';
    m = url.match(/vimeo\.com\/(\d+)/);
    out.video_id = m ? m[1] : '';
    out.embed_url = out.video_id ? 'https://player.vimeo.com/video/' + out.video_id : '';
  }
  return out;
}

async function setReelStatus(id, status){
  if(S.reelBusy) return;
  S.reelBusy = id; S.reelErr = ''; render();
  let who = null;
  try{ const { data } = await sb.auth.getUser(); who = data && data.user ? data.user.email : null; }
  catch(e){ who = null; }
  try{
    const patch = { status };
    if(status === 'complete') patch.completed_by = who;
    const { error } = await sb.from('reel_ideas').update(patch).eq('id', id);
    if(error) throw error;
    S.reelNote = status === 'complete' ? 'Moved to the archive.'
               : status === 'dismissed' ? 'Skipped.' : 'Back on the board.';
    S.reelOpenId = null;
    S.loaded.reels = false;
    await loadReels();
  }catch(err){ S.reelErr = err.message || String(err); }
  S.reelBusy = ''; render();
}

async function saveReelNotes(){
  const id = S.reelOpenId;
  if(!id || S.reelBusy) return;
  const el = document.getElementById('reelNotes');
  if(el) S.reelNotes = el.value;
  S.reelBusy = id; S.reelErr = ''; render();
  try{
    const { error } = await sb.from('reel_ideas')
      .update({ notes: String(S.reelNotes||'').trim() || null }).eq('id', id);
    if(error) throw error;
    const row = (S.reels||[]).find(r => r.id === id);
    if(row) row.notes = String(S.reelNotes||'').trim() || null;
    S.reelNote = 'Notes saved.';
  }catch(err){ S.reelErr = err.message || String(err); }
  S.reelBusy = ''; render();
}

async function submitReel(){
  if(S.reelSaving) return;
  const f = S.reelForm;
  const url = String(f.url||'').trim();
  const text = String(f.text||'').trim();
  if(!url && !text){ S.reelErr = 'Add a link or some text.'; return render(); }

  S.reelSaving = true; S.reelErr = ''; render();
  let who = '';
  try{ const { data } = await sb.auth.getUser(); who = (data && data.user && data.user.email) || ''; }
  catch(e){ who = ''; }

  try{
    const p = parseReelLink(url);
    let title = (text.split('\n')[0] || '').trim();
    if(title.length > 120) title = title.slice(0,117) + '...';
    if(!title) title = (REEL_PLAT[p.platform] || 'Link') + ' idea';

    const { error } = await sb.from('reel_ideas').insert({
      kind: url ? 'link' : 'text',
      title, idea_text: text || title, url: url || null,
      platform: p.platform, video_id: p.video_id || null,
      embed_url: p.embed_url || null, thumbnail_url: p.thumbnail_url || null,
      brand: f.brand, priority: Number(f.priority),
      source: 'dashboard', posted_by: who, posted_by_email: who
    });
    if(error) throw error;

    S.reelNote = 'Added to the board.';
    S.reelAddOpen = false;
    S.reelForm = { url:'', text:'', brand:f.brand, priority:'2' };
    S.loaded.reels = false;
    await loadReels();
  }catch(err){ S.reelErr = 'That did not go through: ' + (err.message || err); }
  S.reelSaving = false; render();
}

/* ================= permits ================= */
/* City of Sacramento building and planning records, from the public
   AgencyCounter site. The n8n workflow "Haggerty Sacramento Permits
   Refresh" saves new ones every morning at 6:15. Which records show here,
   and the sector guess, are decided in Supabase (permit_fit and
   permit_vertical in sql/permits.sql), so v_permits already holds only
   the ones worth a look. AgencyCounter names no applicant or contractor.
   The n8n workflow "Haggerty Permit Contractor Lookup" (6:40 every
   morning) reads each building record on the city's Accela portal for
   its job value and, once one is on file, its licensed professional
   (usually the contractor). Owner and applicant names stay hidden there.
   Send to Pat puts a permit on Pat's Home with a note; Pat marks it
   contacted once she has called. */
const PERMIT_FIT = {
  project:  ['Project',  'Commercial new building, addition, remodel or tenant improvement'],
  planning: ['Planning', 'Zoning or design review, before a contractor is picked'],
  small:    ['Smaller',  'Commercial repair or site work'],
  rhino:    ['RHINO',    'Fire, water, dry rot, mold or impact damage repair']
};
const PERMIT_DAYS = 60;

async function loadPermits(){
  if(!S.loaded.verticals) await loadVerticals();
  const from = new Date(Date.now() - PERMIT_DAYS * 86400000).toISOString().slice(0, 10);
  const [rows, last, older] = await Promise.all([
    sb.from('v_permits').select('*').gte('record_date', from)
      .order('record_date', { ascending:false }).order('agency_reference', { ascending:false }).limit(2000),
    sb.from('permits').select('last_seen').order('last_seen', { ascending:false }).limit(1),
    /* Sent to Pat stays on her list however old the permit gets. */
    sb.from('v_permits').select('*').eq('mark', 'pat').lt('record_date', from)
  ]);
  if(rows.error) throw rows.error;
  S.permits = (rows.data || []).concat(older.data || []);
  S.permitsAt = last.data && last.data[0] ? last.data[0].last_seen : null;
  S.loaded.permits = true;
}

const permitSent = p => p.mark === 'pat' || p.mark === 'contacted';

function permitInView(p){
  if(S.permitView === 'saved') return p.mark === 'saved';
  if(S.permitView === 'pat') return permitSent(p);
  if(S.permitView === 'dismissed') return p.mark === 'dismissed';
  return p.mark !== 'dismissed';
}

function permitVisible(){
  const q = String(S.permitQ||'').trim().toLowerCase();
  return (S.permits||[]).filter(p=>{
    if(!permitInView(p)) return false;
    if(S.permitFit !== 'all' && p.fit !== S.permitFit) return false;
    if(S.permitVert && (p.vertical || 'none') !== S.permitVert) return false;
    if(q){
      const hay = [p.name, p.description, p.address, p.agency_reference, p.record_type, p.status,
                   p.pro_company, p.pro_name, p.note]
        .filter(Boolean).join(' ').toLowerCase();
      if(hay.indexOf(q) === -1) return false;
    }
    return true;
  });
}

const permitDate = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month:'short', day:'numeric' }) : '';

function permitCard(p){
  const fit = PERMIT_FIT[p.fit] || [p.fit, ''];
  const vert = (S.verticals||[]).find(v => v.slug === p.vertical);
  const canMark = BUDGET_USERS.includes(S.me);
  const busy = S.permitBusy === p.guid;
  const nums = [
    Number(p.job_value) > 0 ? money(p.job_value) + ' job value' : '',
    Number(p.total_fee) > 0 ? money(p.total_fee) + ' in city fees' : '',
    Number(p.improved_value) > 0 ? 'buildings on parcel ' + moneyShort(p.improved_value) : '',
    p.plan_check_target ? 'plan check due ' + permitDate(p.plan_check_target) : ''
  ].filter(Boolean).join(' · ');
  return `<article class="permit ${esc(p.fit)} ${p.mark==='dismissed'?'dismissed':''}">
    <div class="ptop">
      <span class="chip ${p.fit==='project'?'hot':p.fit==='rhino'?'bad':''}" title="${esc(fit[1])}">${esc(fit[0])}</span>
      ${vert ? `<span class="chip">${esc(vert.name)}</span>` : ''}
      ${p.mark==='saved' ? '<span class="chip good">Saved</span>' : ''}
      ${p.mark==='pat' ? '<span class="chip hot">Sent to Pat</span>' : ''}
      ${p.mark==='contacted' ? '<span class="chip good">Pat contacted</span>' : ''}
      <span class="m">${esc(p.agency_reference)} · ${esc(p.record_type||'')} · ${esc(p.status||'')} · ${esc(permitDate(p.record_date))}</span>
    </div>
    <h4>${esc(p.name || p.record_type || p.agency_reference)}</h4>
    <div class="addr">${esc(p.address || 'No address on record')}</div>
    ${p.description ? `<p class="desc ${S.permitOpen && S.permitOpen[p.guid] ? 'open' : ''}" data-permit-more="${esc(p.guid)}">${esc(p.description)}</p>` : ''}
    ${nums ? `<div class="nums">${nums}</div>` : ''}
    ${permitPro(p)}
    ${permitSent(p) && p.note ? `<div class="pnote"><b>Note for Pat:</b> ${esc(p.note)}</div>` : ''}
    ${S.permitSend === p.guid ? `<div class="psend">
        <textarea id="permitNote" rows="2" placeholder="Note for Pat (optional): why this one, who to ask for">${esc(S.permitNote||'')}</textarea>
        <div><button class="btn small" data-permit-send-go="${esc(p.guid)}" ${busy?'disabled':''}>${busy?'Sending&hellip;':'Send to Pat'}</button>
        <button class="linkbtn" data-permit-send-cancel>Cancel</button></div>
      </div>` : ''}
    <div class="acts">
      <a class="btn small ghost" href="${esc(p.url)}" target="_blank" rel="noopener">Open record</a>
      ${canMark ? (permitSent(p)
        ? `<button class="btn small ${p.mark==='contacted'?'':'ghost'}" data-permit-contacted="${esc(p.guid)}" data-val="${p.mark==='contacted'?'0':'1'}" ${busy?'disabled':''}>${p.mark==='contacted'?'Contacted':'Mark contacted'}</button>
        <button class="btn small ghost" data-permit-unsend="${esc(p.guid)}" ${busy?'disabled':''}>Take back</button>`
        : `<button class="btn small" data-permit-send="${esc(p.guid)}" ${busy?'disabled':''}>Send to Pat</button>
        <button class="btn small ${p.mark==='saved'?'':'ghost'}" data-permit-mark="${esc(p.guid)}" data-val="saved" ${busy?'disabled':''}>${p.mark==='saved'?'Saved':'Save'}</button>
        <button class="btn small ghost" data-permit-mark="${esc(p.guid)}" data-val="dismissed" ${busy?'disabled':''}>${p.mark==='dismissed'?'Bring back':'Not a fit'}</button>`) : ''}
    </div>
  </article>`;
}

/* Who to call. The contractor on file, from the city's Accela portal, with
   a license check on CSLB and a company search on Apollo (a search only,
   no credits). A building record checked with nobody on file usually
   means no contractor has been named yet. */
function permitPro(p){
  if(p.pro_company || p.pro_name){
    const co = p.pro_company || p.pro_name;
    const tel = p.pro_phone ? String(p.pro_phone).replace(/[^0-9+]/g, '') : '';
    const telTxt = tel.length === 10 ? `(${tel.slice(0,3)}) ${tel.slice(3,6)}-${tel.slice(6)}` : p.pro_phone;
    return `<div class="ppro">
      <span class="lbl">Contractor on file</span>
      <b>${esc(co)}</b>${p.pro_name && p.pro_company ? ` · ${esc(p.pro_name)}` : ''}
      ${tel ? ` · <a href="tel:${esc(tel)}" class="mono">${esc(telTxt)}</a>` : ''}
      ${p.pro_address ? `<div class="sub">${esc(p.pro_address)}</div>` : ''}
      <div class="sub">
        ${p.pro_license ? `<a href="https://www.cslb.ca.gov/OnlineServices/CheckLicenseII/LicenseDetail.aspx?LicNum=${encodeURIComponent(p.pro_license)}" target="_blank" rel="noopener">License ${esc(p.pro_license)}</a> · ` : ''}
        <a href="https://app.apollo.io/#/companies?qKeywords=${encodeURIComponent(co)}" target="_blank" rel="noopener">Find on Apollo</a>
      </div>
    </div>`;
  }
  if(p.module === 'building' && p.aca_checked_at)
    return `<div class="ppro none">No contractor on file with the city yet.</div>`;
  return '';
}

function pagePermits(){
  if(!S.loaded.permits) return loading();
  const all = S.permits || [];
  const inView = all.filter(permitInView);
  const rows = permitVisible();

  const views = [['open','To review', all.filter(p=>p.mark!=='dismissed').length],
                 ['saved','Saved', all.filter(p=>p.mark==='saved').length],
                 ['pat','Sent to Pat', all.filter(permitSent).length],
                 ['dismissed','Not a fit', all.filter(p=>p.mark==='dismissed').length]]
    .map(([k,label,n])=>`<button class="fchip ${S.permitView===k?'on':''}" data-permitview="${k}">${label} <b>${n}</b></button>`).join('');
  const fits = [['all','All', inView.length]].concat(Object.keys(PERMIT_FIT)
      .map(k => [k, PERMIT_FIT[k][0], inView.filter(p=>p.fit===k).length]))
    .map(([k,label,n])=>`<button class="filt ${S.permitFit===k?'on':''}" data-permitfit="${k}" title="${esc(PERMIT_FIT[k] ? PERMIT_FIT[k][1] : '')}">${label}<b>${n}</b></button>`).join('');
  const slugs = Array.from(new Set(inView.map(p => p.vertical || 'none')));
  const vopts = (S.verticals||[]).filter(v => slugs.includes(v.slug))
    .map(v => `<option value="${esc(v.slug)}" ${S.permitVert===v.slug?'selected':''}>${esc(v.name)}</option>`).join('')
    + (slugs.includes('none') ? `<option value="none" ${S.permitVert==='none'?'selected':''}>No sector guess</option>` : '');

  const newest = all.length ? all[0].record_date : null;
  const fresh = S.permitsAt
    ? `Checked ${new Date(S.permitsAt).toLocaleString('en-US', { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' })}`
    : 'Not checked yet';

  return `<main class="page wide">
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px">
      <div class="fchips" style="margin:0">${views}</div>
      <div class="filters">${fits}</div>
      <select id="permitVert" style="width:auto">
        <option value="">Every sector</option>${vopts}
      </select>
      <input type="text" id="permitSearch" value="${esc(S.permitQ)}"
             placeholder="Search name, address, work"
             style="flex:1;min-width:200px;width:auto" />
    </div>
    <p class="hint" style="margin:0 0 14px">City of Sacramento permits from the last ${PERMIT_DAYS} days.
      ${esc(fresh)}${newest ? `, newest filed ${esc(permitDate(newest))}` : ''}. Refreshes every morning at 6:15.</p>

    ${S.permitErr?`<p class="hint err" style="margin-bottom:14px">${esc(S.permitErr)}</p>`:''}

    ${rows.length
      ? `<div class="permit-list">${rows.map(permitCard).join('')}</div>`
      : `<div class="empty" style="padding:44px 0">
           <h2>${all.length ? 'Nothing matches' : 'No permits yet'}</h2>
           <p>${all.length
             ? 'Try another filter or clear the search.'
             : 'The first pull from the city runs at 6:15 tomorrow morning.'}</p>
         </div>`}

    <p class="hint" style="margin-top:18px">Shown: commercial projects, zoning and design review files,
      smaller commercial repairs, and any repair that mentions fire, water, dry rot, mold or impact damage (RHINO).
      Residential work, HVAC and water heater swaps, signs, reroofs and fire alarm work are left out.
      The contractor on file and job value come from the city's permit portal, checked every morning at 6:40.
      The city does not publish the owner or applicant, so for those Open record is the next step.</p>
  </main>`;
}

async function markPermit(guid, state){
  if(S.permitBusy) return;
  const p = (S.permits||[]).find(x => x.guid === guid);
  if(!p) return;
  S.permitBusy = guid; S.permitErr = ''; render();
  try{
    if(p.mark === state){
      const { error } = await sb.from('permit_marks').delete().eq('guid', guid);
      if(error) throw error;
      p.mark = null;
    } else {
      const { error } = await sb.from('permit_marks')
        .upsert({ guid, state, marked_by:S.me, marked_at:new Date().toISOString() });
      if(error) throw error;
      p.mark = state;
    }
  }catch(e){
    S.permitErr = 'Could not save that: ' + (e.message || e);
  }
  S.permitBusy = ''; render();
}

async function sendPermit(guid){
  if(S.permitBusy) return;
  const p = (S.permits||[]).find(x => x.guid === guid);
  if(!p) return;
  const note = String(S.permitNote || '').trim() || null;
  S.permitBusy = guid; S.permitErr = ''; render();
  try{
    const now = new Date().toISOString();
    const { error } = await sb.from('permit_marks')
      .upsert({ guid, state:'pat', marked_by:S.me, marked_at:now, note, sent_by:S.me, sent_at:now });
    if(error) throw error;
    Object.assign(p, { mark:'pat', marked_by:S.me, marked_at:now, note, sent_by:S.me, sent_at:now });
    S.permitSend = ''; S.permitNote = '';
  }catch(e){
    S.permitErr = 'Could not send that to Pat: ' + (e.message || e);
  }
  S.permitBusy = ''; render();
}

async function unsendPermit(guid){
  if(S.permitBusy) return;
  const p = (S.permits||[]).find(x => x.guid === guid);
  if(!p) return;
  S.permitBusy = guid; S.permitErr = ''; render();
  try{
    const { error } = await sb.from('permit_marks').delete().eq('guid', guid);
    if(error) throw error;
    Object.assign(p, { mark:null, note:null, sent_by:null, sent_at:null });
  }catch(e){
    S.permitErr = 'Could not take that back: ' + (e.message || e);
  }
  S.permitBusy = ''; render();
}

/* Pat, once she has reached out. Contacted moves it off her Home; Undo
   puts it back. The note and who sent it stay. */
async function contactPermit(guid, done){
  if(S.permitBusy) return;
  const p = (S.permits||[]).find(x => x.guid === guid);
  if(!p) return;
  S.permitBusy = guid; S.permitErr = ''; render();
  try{
    const now = new Date().toISOString();
    const state = done ? 'contacted' : 'pat';
    const { error } = await sb.from('permit_marks')
      .update({ state, marked_by:S.me, marked_at:now }).eq('guid', guid);
    if(error) throw error;
    Object.assign(p, { mark:state, marked_by:S.me, marked_at:now });
  }catch(e){
    S.permitErr = 'Could not save that: ' + (e.message || e);
  }
  S.permitBusy = ''; render();
}

let permitTimer = null;

function wirePermits(){
  document.querySelectorAll('[data-permitview]').forEach(el=>
    el.addEventListener('click',()=>{ S.permitView = el.dataset.permitview; render(); }));
  document.querySelectorAll('[data-permitfit]').forEach(el=>
    el.addEventListener('click',()=>{ S.permitFit = el.dataset.permitfit; render(); }));

    el.addEventListener('click',()=>markPermit(el.dataset.permitMark, el.dataset.val)));
  document.querySelectorAll('[data-permit-send]').forEach(el=>
    el.addEventListener('click',()=>{ S.permitSend = el.dataset.permitSend; S.permitNote = ''; render();
      const t = document.getElementById('permitNote'); if(t) t.focus(); }));
  document.querySelectorAll('[data-permit-send-cancel]').forEach(el=>
    el.addEventListener('click',()=>{ S.permitSend = ''; S.permitNote = ''; render(); }));
  document.querySelectorAll('[data-permit-send-go]').forEach(el=>
    el.addEventListener('click',()=>sendPermit(el.dataset.permitSendGo)));

  if(pn) pn.addEventListener('input',()=>{ S.permitNote = pn.value; });
  document.querySelectorAll('[data-permit-more]').forEach(el=>
    el.addEventListener('click',()=>{
