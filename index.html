    }));
  const pv = document.getElementById('permitVert');
  if(pv) pv.addEventListener('change',()=>{ S.permitVert = pv.value; render(); });
  const ps = document.getElementById('permitSearch');
  if(ps){
    ps.addEventListener('input',()=>{
      S.permitQ = ps.value;
      clearTimeout(permitTimer);
      permitTimer = setTimeout(()=>{
        render();

      }, 250);
    });
  }
}

/* ================= social calendar ================= */
/* A month of posts is built outside the dashboard (media picked from the
   J: archive, captions written, files saved to a month folder with a
   plan.json). Import brings that folder in: media goes to the public
   social-media bucket and each post becomes a row here. From then on
   everything is editable. Generate and extras only queue a row in
   social_jobs; they need the J: archive, so the scheduled Claude task on
   the laptop picks those up. There is no Send button: approving a post
   (plus the reviewer's OK, for a brand with one) makes the database queue
   it and add a 'send_cloud' job (sql/social_auto_send.sql), which a cloud
   routine picks up (sql/social_send.sql); the laptop task ignores that kind.
   Two brands share all of this: HAGGERTY and RHINO Restores. Every row
   carries brand, the switch at the top of the tab picks which one shows,
   and each brand has its own focus list, target mix and Metricool brand
   (sql/social_rhino.sql). */
const SOC_BUCKET = 'social-media';
const SOC_BRANDS = { haggerty:'HAGGERTY', rhino:'RHINO Restores' };
let SOC_BRAND = 'haggerty';
try{ const b = localStorage.getItem('socBrand'); if(SOC_BRANDS[b]) SOC_BRAND = b; }catch(e){}
const SOC_STATUS = { draft:'Draft', approved:'Approved', queued:'Sending',
                     sent:'In Metricool', skipped:'Cleared', extra:'Extra option' };
const SOC_FORMAT = { photo:'Photo', carousel:'Carousel', video:'Video' };
/* What a post is about. Generate month and Get more options are asked
   for a target mix of these (social_settings.focus_mix, sent on the job
   as options.mix); see sql/social_focus.sql. */
const SOC_FOCUS_BY = {
  haggerty: { projects:'Projects', people:'People', events:'Events', holidays:'Holidays',
              services:'Services', company:'Company', throwbacks:'Throwbacks' },
  rhino:    { fire:'Fire', water:'Water', mold:'Mold', storm:'Storm', contents:'Contents',
              tips:'Tips', people:'People', events:'Events', holidays:'Holidays', company:'Company' }
};
let SOC_FOCUS = SOC_FOCUS_BY[SOC_BRAND];
const SOC_OK  = ['image/jpeg','image/png','image/webp','video/mp4','video/quicktime'];
const SOC_MAX = 50 * 1024 * 1024;

function socUrl(path){
  return SUPABASE_URL + '/storage/v1/object/public/' + SOC_BUCKET + '/' +
    String(path).split('/').map(encodeURIComponent).join('/');
}
function socDay(d){
  const t = new Date(String(d).slice(0,10) + 'T12:00:00');
  return t.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
}
function socMonthLabel(m){
  const [y,mo] = String(m).split('-').map(Number);
  return new Date(y, mo-1, 1).toLocaleDateString('en-US', { month:'long', year:'numeric' });
}
function socShift(m, n){
  const [y,mo] = String(m).split('-').map(Number);
  const d = new Date(y, mo-1+n, 1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function socThisMonth(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
/* A slot is a weekday of the month. It is open when no live post sits on
   it: cleared posts and extras do not hold a date. */
function socLive(p){ return p.status !== 'skipped' && p.status !== 'extra'; }
function socOpenDates(){
  const [y,mo] = String(S.socMonth).split('-').map(Number);
  const taken = new Set((S.social||[]).filter(socLive).map(p => String(p.post_date).slice(0,10)));
  const out = [];
  for(let d = new Date(y, mo-1, 1); d.getMonth() === mo-1; d.setDate(d.getDate()+1)){
    const wd = d.getDay();
    if(wd === 0 || wd === 6) continue;
    const iso = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    if(!taken.has(iso)) out.push(iso);
  }
  return out;
}
function socMedia(p){
  return ((p && p.social_post_media) || []).slice().sort((a,b)=> a.position - b.position);
}
function socFormat(list){
  if(list.some(m => m.kind === 'video')) return 'video';
  return list.length > 1 ? 'carousel' : 'photo';
}
function socPrefix(){ return SOC_BRAND === 'haggerty' ? '' : SOC_BRAND + '/'; }
function socSafe(name){
  return String(name||'file').replace(/[^A-Za-z0-9._-]+/g,'-').replace(/^-+/,'').slice(-80) || 'file';
}
async function socWho(){
  try{ const { data } = await sb.auth.getUser(); return (data && data.user && data.user.email) || null; }
  catch(e){ return null; }
}

async function loadSocial(){
  if(!S.socMonth) S.socMonth = socThisMonth();
  const { data, error } = await sb.from('social_posts')
    .select('*, social_post_media(*)')
    .eq('brand', SOC_BRAND).eq('month', S.socMonth)
    .order('post_date', { ascending:true }).order('seq', { ascending:true });
  if(error) throw error;
  S.social = data || [];
  const j = await sb.from('social_jobs').select('*')
    .eq('brand', SOC_BRAND).eq('month', S.socMonth)
    .order('created_at', { ascending:false }).limit(8);
  if(j.error) throw j.error;
  S.socJobs = j.data || [];
  /* Results come from Metricool through the daily refresh. A failed read
     leaves the calendar working without them. */
  const since = new Date(Date.now() - 90*864e5).toISOString().slice(0,10);
  const r = await sb.from('social_results').select('*')
    .eq('brand', SOC_BRAND).gte('post_date', since)
    .order('post_date', { ascending:false });
  S.socResults = r.error ? [] : (r.data || []);
  const st = await sb.from('social_settings').select('focus_mix').eq('brand', SOC_BRAND).maybeSingle();
  S.socMix = (!st.error && st.data && st.data.focus_mix) || {};
  /* A brand with a reviewer needs their OK before Send takes a post. */
  const rv = await sb.from('social_reviewers').select('email,name').eq('brand', SOC_BRAND);
  S.socReviewers = rv.error ? [] : (rv.data || []);
  S.loaded.social = true;
}
async function reloadSocial(){ S.loaded.social = false; await loadSocial(); }

function socMediaTag(m, controls){
  const u = esc(socUrl(m.storage_path));
  return m.kind === 'video'
    ? `<video src="${u}#t=0.5" preload="metadata" muted playsinline ${controls?'controls':''}></video>`
    : `<img src="${u}" alt="" ${controls?"":"loading=\"lazy\""} />`;
}

/* ---- results from Metricool ----
   One row per published post per network. The refresh pairs the
   Instagram and LinkedIn posts on one subject with a shared group_key, and
   links a row to the dashboard's own post when it came from here. */
function socResultGroups(){
  const by = new Map();
  for(const r of S.socResults || []){
    const k = r.group_key || (r.network + ':' + r.post_id);
    if(!by.has(k)) by.set(k, { key:k, ig:null, li:null });
    const g = by.get(k);
    if(r.network === 'instagram' && !g.ig) g.ig = r;
    if(r.network === 'linkedin' && !g.li) g.li = r;
  }
  return [...by.values()].map(g => {
    const rows = [g.ig, g.li].filter(Boolean);
    g.date = rows.map(r => String(r.post_date).slice(0,10)).sort()[0];
    g.postId = (rows.find(r => r.social_post_id) || {}).social_post_id || null;
    g.score = ((g.ig && g.ig.interactions) || 0) + ((g.li && g.li.clicks) || 0) + ((g.li && g.li.reactions) || 0);
    return g;
  }).sort((a,b) => b.date.localeCompare(a.date));
}
function socRecent(days){
  const cut = new Date(Date.now() - days*864e5).toISOString().slice(0,10);
  return socResultGroups().filter(g => g.date >= cut);
}
function socBestKey(groups){
  const best = groups.slice().sort((a,b) => b.score - a.score)[0];
  return best && best.score > 0 ? best.key : null;
}
function socSnippet(r, n){
  const first = String((r && r.content) || '').split(/\n|(?<=[.!?])\s/)[0].trim();
  return first.length > n ? first.slice(0, n - 1).trim() + '…' : first;
}
function socResLines(ig, li){
  const b = v => `<b>${num(v)}</b>`;
  const line = (label, r, parts) => `<div><a class="n" href="${esc(r.permalink || '#')}" target="_blank" rel="noopener">${label}</a>
      <span>${parts.filter(Boolean).join(' &middot; ')}</span></div>`;
  return `<div class="socres">
    ${ig ? line('Instagram', ig, [b(ig.reach) + ' reach', b(ig.interactions) + ' interactions']) : ''}
    ${li ? line('LinkedIn', li, [b(li.impressions) + ' impressions',
          li.clicks !== null && li.clicks !== undefined ? b(li.clicks) + ' clicks' : '',
          b(li.reactions) + ' reactions']) : ''}
  </div>`;
}
function socResultsStrip(){
  const g = socRecent(30);
  const ig = g.map(x => x.ig).filter(Boolean), li = g.map(x => x.li).filter(Boolean);
  if(!ig.length && !li.length) return '';
  const sum = (a, k) => a.reduce((t, r) => t + (r[k] || 0), 0);
  const avg = (a, k) => a.length ? Math.round(sum(a, k) / a.length) : 0;
  const top = li.slice().sort((a,b) => (b.clicks||0) - (a.clicks||0))[0];
  const topName = top ? 'the ' + socDay(top.post_date).replace(/^\w+, /, '') + ' post' : '';
  return `<div class="stat-grid ret-stats socstrip">
    <div class="stat"><div class="k">Instagram reach</div><div class="v">${num(sum(ig,'reach'))}</div>
      <p class="hint" style="margin:4px 0 0">${ig.length} post${ig.length===1?'':'s'}, last 30 days &middot; ${num(avg(ig,'reach'))} a post</p></div>
    <div class="stat"><div class="k">Instagram interactions</div><div class="v">${num(sum(ig,'interactions'))}</div>
      <p class="hint" style="margin:4px 0 0">Likes, comments, saves, shares</p></div>
    <div class="stat"><div class="k">LinkedIn impressions</div><div class="v">${num(sum(li,'impressions'))}</div>
      <p class="hint" style="margin:4px 0 0">${li.length} post${li.length===1?'':'s'} &middot; ${num(avg(li,'impressions'))} a post</p></div>
    <div class="stat accent"><div class="k">LinkedIn clicks</div><div class="v">${num(sum(li,'clicks'))}</div>
      <p class="hint" style="margin:4px 0 0">${top && top.clicks ? 'Best: ' + esc(topName) + ', ' + num(top.clicks) + ' clicks' : 'Clicks on links and photos'}</p></div>
  </div>`;
}
function socResultCard(g, bestKey){
  const own = g.postId && (S.social || []).find(p => p.id === g.postId);
  const media = own ? socMedia(own) : [];
  const main = g.ig || g.li;
  const img = media.length ? socMediaTag(media[0], false)
    : (g.ig && g.ig.image_url ? `<img src="${esc(g.ig.image_url)}" alt="" loading="lazy" onerror="this.parentNode.remove()" />` : '');
  /* Instagram's image links expire after a few weeks; a card whose image
     is gone, or never had one, drops the picture rather than show an
     empty box. */
  const best = g.key === bestKey ? `<span class="socbest">Best in 30 days</span>` : '';
  return `<article class="soccard result ${img ? '' : 'noimg'}">
    ${img ? `<div class="socthumb static">${img}${best}</div>` : best}
    <div class="socbody">
      <span class="d">${esc(socDay(g.date))}</span>
      ${own && own.topic ? `<span class="t">${esc(own.topic)}</span>` : ''}
      <p>${esc(String(main.content || '').trim())}</p>
    </div>
    ${socResLines(g.ig, g.li)}
  </article>`;
}
function socResultsView(){
  const groups = socResultGroups();
  if(!groups.length) return `<div class="empty" style="padding:44px 0">
      <h2>No results yet</h2>
      <p>Post results come from Metricool every morning. Check back after the next refresh.</p></div>`;
  const last = (S.socResults || []).map(r => r.fetched_at).sort().pop();
  const bestKey = socBestKey(socRecent(30));
  return `<div class="soc-grid">${groups.map(g => socResultCard(g, bestKey)).join('')}</div>
    <p class="hint" style="margin-top:14px">Published posts from the last 90 days, from Metricool.
      ${last ? 'Numbers last refreshed ' + esc(new Date(last).toLocaleString('en-US', { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' })) + '.' : ''}
      Instagram and LinkedIn posts on the same subject share a card.</p>`;
}

/* Review by the brand's reviewer (sql/social_review.sql): OK to post or
   Needs changes, with a note. Only drafts and approved posts wait on it. */
function socIsReviewer(){ return S.me === 'reviewer'; }
function socNeedsReview(){ return (S.socReviewers || []).length > 0; }
/* What the reviewer has to do this month, at the top of their Social tab. */
function socReviewerTodo(all){
  const open = p => p.status === 'draft' || p.status === 'approved';
  const todo = all.filter(p => open(p) && !p.review_status).length;
  const back = all.filter(p => open(p) && p.review_status === 'changes').length;
  const ok = all.filter(p => p.review_status === 'ok').length;
  const ec = S.ec && S.ec.list ? S.ec.list.filter(c => c.review_status === 'pending').length : 0;
  const first = String(S.revName || '').split(' ')[0];
  const head = todo ? `${todo} post${todo===1?'':'s'} waiting on you this month`
             : `Nothing waiting on you this month${first ? ', ' + esc(first) : ''}`;
  return `<div class="revtodo"><h3>${head}</h3>
    <p class="hint" style="margin:0">${ok} OK to post${back ? ', ' + back + ' sent back for changes' : ''}.
      ${ec ? `${ec} email${ec===1?'':'s'} also waiting on the <a href="#campaigns" data-page="campaigns">Email tab</a>.` : 'Use the arrows to check next month.'}</p>
    ${todo ? `<ol>
      <li>Find the posts marked <b>Waiting on review</b>. Tap the photo to see it full size.</li>
      <li>Check the photo and the words: safety gear, client names, addresses, anything that should not go public.</li>
      <li>All good? Tap <b>OK to post</b>. Only posts you OK get sent.</li>
      <li>Something to fix? Tap <b>Edit or flag</b>, fix the words or say what needs to change, and save.</li></ol>` : ''}
  </div>`;
}
function socReviewerName(email){
  const r = (S.socReviewers || []).find(x => x.email === email);
  return (r && r.name) || (email ? String(email).split('@')[0] : 'Reviewer');
}
/* Approved posts go to Metricool on their own: the database queues a post
   once it is approved, dated today or later and, for a brand with a
   reviewer, marked OK to post (sql/social_auto_send.sql). These say why an
   approved post is still sitting here. */
function socPast(p){ return String(p.post_date).slice(0,10) < socTodayISO(); }
function socTodayISO(){ return new Date().toLocaleDateString('en-CA', { timeZone:'America/Los_Angeles' }); }
function socAwaitingReview(p){
  return p.status === 'approved' && !socPast(p) && socNeedsReview() && p.review_status !== 'ok';
}
/* Not yet in Metricool: still free to change its mind. */
function socUnsent(p){ return p.status === 'queued' && !p.metricool; }
function socReviewChip(p){
  if(!socNeedsReview()) return '';
  if(p.review_status === 'ok') return `<span class="chip good">OK to post</span>`;
  if(p.review_status === 'changes') return `<span class="chip bad">Needs changes</span>`;
  return p.status === 'draft' || p.status === 'approved' ? `<span class="chip">Waiting on review</span>` : '';
}
function socReviewLine(p){
  if(!p.review_note || !socNeedsReview()) return '';
  return `<span class="why">${esc(socReviewerName(p.reviewed_by))}: ${esc(p.review_note)}</span>`;
}

function socCard(p){
  const media = socMedia(p);
  const busy = S.socBusy === p.id;
  const open = p.status === 'draft' || p.status === 'approved' || socUnsent(p);
  return `<article class="soccard ${esc(p.status)}">
    <button class="socthumb" data-soc-open="${esc(p.id)}" aria-label="Edit ${p.status==='extra'?'this extra option':'the post for ' + esc(socDay(p.post_date))}">
      ${media.length ? socMediaTag(media[0], false) : `<span class="none">No media yet</span>`}
      <span class="soctag">
        <span class="chip">${esc(SOC_FORMAT[p.format] || p.format)}${media.length>1?` &middot; ${media.length}`:''}</span>
        ${p.focus && SOC_FOCUS[p.focus] ? `<span class="chip">${esc(SOC_FOCUS[p.focus])}</span>` : ''}
        <span class="chip ${p.status==='approved'||p.status==='sent'||p.status==='queued'?'hot':''}">${esc(SOC_STATUS[p.status] || p.status)}</span>
        ${socReviewChip(p)}
      </span>
    </button>
    <div class="socbody">
      <span class="d">${p.status==='extra' ? 'Not scheduled' : esc(socDay(p.post_date))}</span>
      ${p.topic?`<span class="t">${esc(p.topic)}</span>`:''}
      <p>${esc(p.caption)}</p>

      ${socReviewLine(p)}
    </div>
    ${(() => { const r = (S.socResults || []).filter(x => x.social_post_id === p.id);
       return r.length ? socResLines(r.find(x => x.network === 'instagram'), r.find(x => x.network === 'linkedin')) : ''; })()}
    ${socIsReviewer() ? `<div class="socfoot">
      ${open ? `<button class="btn small" data-soc-review="${esc(p.id)}" ${busy||p.review_status==='ok'?'disabled':''}>${p.review_status==='ok'?'OK given':'OK to post'}</button>
        <button class="btn small ghost" data-soc-open="${esc(p.id)}">Edit or flag</button>`
        : `<button class="btn small ghost" data-soc-open="${esc(p.id)}">Open</button>`}
    </div>` : `<div class="socfoot">
      ${p.status === 'draft'
        ? `<button class="btn small" data-soc-set="${esc(p.id)}" data-val="approved" ${busy?'disabled':''}>Approve</button>`
        : p.status === 'approved' || socUnsent(p)
          ? `<button class="btn small ghost" data-soc-set="${esc(p.id)}" data-val="draft" ${busy?'disabled':''}>Back to draft</button>`
        : p.status === 'skipped'
          ? `<button class="btn small ghost" data-soc-set="${esc(p.id)}" data-val="draft" ${busy?'disabled':''}>Bring back</button>`
        : p.status === 'extra'
          ? (socOpenDates().length
              ? `<select data-soc-use="${esc(p.id)}" ${busy?'disabled':''} aria-label="Use this option on a date">
                   <option value="">Use on&hellip;</option>
                   ${socOpenDates().map(d=>`<option value="${d}">${esc(socDay(d))}</option>`).join('')}
                 </select>`
              : `<span class="hint" style="margin:0">No open dates</span>`)
          : ''}
      <button class="btn small ghost" data-soc-open="${esc(p.id)}">Edit</button>
      ${p.status==='draft'||p.status==='approved'||p.status==='extra'
        ? `<button class="linkbtn" data-soc-clear="${esc(p.id)}" ${busy?'disabled':''}>Clear</button>` : ''}
    </div>`}
  </article>`;
}

function socJobNote(){
  const jobs = S.socJobs || [];
  const out = [];
  const g = jobs.find(j => j.kind === 'generate');
  if(g && g.status !== 'done'){
    out.push(g.status === 'pending' ? 'Generate requested. It gets picked up within the hour on weekdays while the laptop is on.'
      : g.status === 'running' ? 'The month is being built now.'
      : g.status === 'ready' ? 'The month folder is ready' + (g.note ? ': ' + g.note : '') + '. Click Import folder and pick it.'
      : 'Generate did not finish' + (g.note ? ': ' + g.note : '.'));
  }
  const x = jobs.find(j => j.kind === 'extras');
  if(x && x.status !== 'done'){
    out.push(x.status === 'pending' ? 'More options requested. They get built within the hour on weekdays while the laptop is on.'
      : x.status === 'running' ? 'More options are being built now.'
      : x.status === 'ready' ? 'More options are ready' + (x.note ? ': ' + x.note : '') + '. Click Import folder and pick that folder.'
      : 'More options did not finish' + (x.note ? ': ' + x.note : '.'));
  }
  const s = jobs.find(j => j.kind === 'send' || j.kind === 'send_cloud');
  const fresh = s && s.finished_at && (Date.now() - new Date(s.finished_at)) < 864e5;
  if(s && (s.status !== 'done' || fresh)){
    out.push(s.status === 'pending'
        ? (s.kind === 'send_cloud'
            ? 'Send requested. Approved posts go to Metricool as drafts within the hour, between 7 AM and 7 PM.'
            : 'Send requested. Approved posts go to Metricool as drafts within the hour on weekdays while the laptop is on.')
      : s.status === 'running' ? 'Posts are going to Metricool now.'
      : s.status === 'failed' ? 'Sending did not finish' + (s.note ? ': ' + s.note : '.')
      : s.status === 'done' && s.note ? 'Sent: ' + s.note
      : '');
  }
  return out.filter(Boolean);
}

/* ---- focus: what a post is about ---- */
function socFocusLabel(k){ return k === 'none' ? 'untagged' : (SOC_FOCUS[k] || k); }
function socFocusMatch(p, k){
  return k === 'all' || (k === 'none' ? !SOC_FOCUS[p.focus] : p.focus === k);
}
function socMixTargets(){
  const out = {};
  for(const k of Object.keys(SOC_FOCUS)){
    const n = Math.round(Number((S.socMix || {})[k]) || 0);
    if(n > 0) out[k] = n;
  }
  return out;
}
function socFocusChips(list){
  const n = k => list.filter(p => socFocusMatch(p, k)).length;
  const keys = ['all', ...Object.keys(SOC_FOCUS), ...(n('none') ? ['none'] : [])];
  return `<div class="fchips focus" style="margin:0 0 12px">${keys
    .filter(k => k === 'all' || k === S.socFocus || n(k))
    .map(k => `<button class="fchip ${S.socFocus===k?'on':''}" data-socfocus="${k}">${
      k === 'all' ? 'All topics' : k === 'none' ? 'Untagged' : esc(SOC_FOCUS[k])} <b>${n(k)}</b></button>`).join('')}</div>`;
}
/* The month's mix counts the posts on the calendar (not cleared posts or
   extras) and flags any focus that is under its target. */
function socMixLine(live){
  const want = socMixTargets();
  const parts = Object.keys(SOC_FOCUS).map(k => {
    const have = live.filter(p => p.focus === k).length;
    const goal = want[k] || 0;
    if(!have && !goal) return '';
    const short = goal && have < goal;
    return `<span class="${short?'short':''}"><b>${have}</b> ${esc(SOC_FOCUS[k])}${goal ? ` of ${goal}` : ''}</span>`;
  }).filter(Boolean);
  const form = S.socMixOpen ? `<div class="socmixform">
      <b style="font-size:13px">Target mix</b>
      <p class="hint" style="margin:4px 0 0">The least number of posts of each kind a month should have. Generate month and
        Get more options follow it; leave a box empty for no target.</p>
      <div class="grid">${Object.entries(SOC_FOCUS).map(([k,l]) => `<label>${esc(l)}
        <input type="number" min="0" max="23" step="1" data-socmix="${k}" value="${esc((S.socMixForm||{})[k] || '')}" /></label>`).join('')}</div>
      <div class="actions"><button class="btn small" id="socMixSave" ${S.socBusy?'disabled':''}>Save target mix</button>
        <button class="linkbtn" id="socMixClose">Cancel</button></div>
    </div>` : '';
  return `<p class="socmix"><span>${esc(socMonthLabel(S.socMonth).split(' ')[0])} mix:</span>
      ${parts.join('') || '<span>No posts tagged yet</span>'}
      ${socIsReviewer() ? '' : `<button class="linkbtn" id="socMixOpen">${Object.keys(want).length ? 'Change target mix' : 'Set a target mix'}</button>`}</p>${form}`;
}
async function saveSocialMix(){
  if(S.socBusy) return;
  const mix = {};
  for(const [k,v] of Object.entries(S.socMixForm || {})){
    const n = Math.round(Number(v) || 0);
    if(SOC_FOCUS[k] && n > 0) mix[k] = n;
  }
  S.socBusy = 'mix'; S.socErr = ''; render();
  try{
    const { error } = await sb.from('social_settings').upsert({
      brand: SOC_BRAND, focus_mix: mix, updated_at: new Date().toISOString(), updated_by: await socWho() });
    if(error) throw error;
    S.socMix = mix; S.socMixOpen = false;
    S.socNote = Object.keys(mix).length
      ? 'Target mix saved. Generate month and Get more options will follow it.' : 'Target mix cleared.';
  }catch(err){ S.socErr = 'The target mix did not save: ' + (err.message || err); }
  S.socBusy = ''; render();
}

  S.socForm = { post_date: String(p.post_date||'').slice(0,10), use_date: '', topic: p.topic || '', focus: p.focus || '',
                caption: p.caption || '', hashtags: p.hashtags || '', hashtags_li: p.hashtags_li || '',
                review_note: p.review_note || '' };
  render();
}

async function saveSocial(status, review){
  const id = S.socOpenId;
  if(!id || S.socBusy) return;
  const f = S.socForm;
  const cur = (S.social||[]).find(x => x.id === id);
  const isExtra = cur && cur.status === 'extra';
  const rev = socIsReviewer();
  if(!rev && !isExtra && !f.post_date){ S.socErr = 'Pick a post date.'; return render(); }
  if(review === 'changes' && !String(f.review_note||'').trim()){
    S.socErr = 'Say what needs to change, so it can be fixed.'; return render(); }
  S.socBusy = id; S.socErr = ''; render();
  try{
    /* An extra keeps its placeholder date until it is given a slot. Picking
       a date in the editor schedules it as a draft. */
    const when = isExtra ? (f.use_date || '') : f.post_date;
    const patch = { topic: String(f.topic||'').trim() || null,
                    focus: SOC_FOCUS[f.focus] ? f.focus : null,
                    caption: String(f.caption||'').trim(),
                    hashtags: String(f.hashtags||'').trim() || null,
                    hashtags_li: String(f.hashtags_li||'').trim() || null };
    if(!rev){
      if(when){ patch.post_date = when; patch.month = when.slice(0,7); }
      if(isExtra && when) patch.status = 'draft';
      if(status) patch.status = status;
    }
    if(review){ patch.review_status = review; patch.review_note = String(f.review_note||'').trim() || null; }
    const { error } = await sb.from('social_posts').update(patch).eq('id', id);
    if(error) throw error;
    S.socNote = review === 'ok' ? 'Marked OK to post.' : review === 'changes' ? 'Marked Needs changes.'
      : !rev && isExtra && when ? 'Scheduled for ' + socDay(when) + '.'
      : status === 'approved' ? 'Saved and approved. ' + socAfterApprove() : 'Saved.';
    S.socOpenId = null;
    await reloadSocial();
  }catch(err){ S.socErr = 'That did not save: ' + (err.message || err); }
  S.socBusy = ''; render();
}

function socAfterApprove(many){
  return socNeedsReview()
    ? (many ? 'Each one goes' : 'It goes') + ' to Metricool as a draft once it is marked OK to post.'
    : (many ? 'They go to Metricool as drafts' : 'It goes to Metricool as a draft') + ' within the hour, between 7 AM and 7 PM.';
}

/* Bringing a cleared post back only works while its date is still free.
   If an extra took the slot, it returns as an extra instead. */
async function socBringBack(id){
  const p = (S.social||[]).find(x => x.id === id);
  if(!p || S.socBusy) return;
  const day = String(p.post_date).slice(0,10);
  const taken = (S.social||[]).some(x => x.id !== id && socLive(x) && String(x.post_date).slice(0,10) === day);
  S.socBusy = id; S.socErr = ''; render();
  try{
    const { error } = await sb.from('social_posts').update({ status: taken ? 'extra' : 'draft' }).eq('id', id);
    if(error) throw error;
    S.socNote = taken ? 'Its date is taken now, so it came back as an extra option.' : 'Back to draft.';
    S.socOpenId = null;
    await reloadSocial();
  }catch(err){ S.socErr = err.message || String(err); }
  S.socBusy = ''; render();
}

function socCheckFile(file){
  if(!SOC_OK.includes(file.type)) return file.name + ' is not a JPG, PNG, WebP, MP4 or MOV.';
  if(file.size > SOC_MAX) return file.name + ' is over 50 MB.';
  return '';
}
async function socPut(path, file, upsert){
  const { error } = await sb.storage.from(SOC_BUCKET)
    .upload(path, file, { contentType: file.type, upsert: !!upsert, cacheControl: '3600' });
  if(error) throw error;
  return path;
}
async function socSyncFormat(postId){
  const { data, error } = await sb.from('social_post_media').select('kind').eq('post_id', postId);
  if(error) throw error;
  const r = await sb.from('social_posts').update({ format: socFormat(data || []) }).eq('id', postId);
  if(r.error) throw r.error;
}

async function socReplace(mediaId, file){
  const p = (S.social||[]).find(x => x.id === S.socOpenId);
  const m = socMedia(p).find(x => x.id === mediaId);
  if(!p || !m || !file || S.socBusy) return;
  const bad = socCheckFile(file);
  if(bad){ S.socErr = bad; return render(); }
  S.socBusy = p.id; S.socErr = ''; S.socProg = 'Uploading ' + file.name; render();
  try{
    const path = socPrefix() + p.month + '/' + (p.source_key || p.id) + '/' + Date.now() + '-' + socSafe(file.name);
    await socPut(path, file, false);
    const { error } = await sb.from('social_post_media').update({
      storage_path: path, kind: file.type.startsWith('video') ? 'video' : 'image',
      file_name: file.name, bytes: file.size, source_path: null }).eq('id', mediaId);
    if(error) throw error;
    /* The old file is no longer referenced. Removing it is tidy-up, so a
       failure here is not worth stopping for. */
    try{ await sb.storage.from(SOC_BUCKET).remove([m.storage_path]); }catch(e){}
    await socSyncFormat(p.id);
    await reloadSocial();
  }catch(err){ S.socErr = 'The swap did not go through: ' + (err.message || err); }
  S.socBusy = ''; S.socProg = ''; render();
}

async function socAddMedia(files){
  const p = (S.social||[]).find(x => x.id === S.socOpenId);
  const list = Array.from(files || []);
  if(!p || !list.length || S.socBusy) return;
  const bad = list.map(socCheckFile).find(Boolean);
  if(bad){ S.socErr = bad; return render(); }
  S.socBusy = p.id; S.socErr = ''; render();
  try{
    let pos = socMedia(p).reduce((n,m)=> Math.max(n, m.position), 0);
    for(const file of list){
      S.socProg = 'Uploading ' + file.name; render();
      const path = socPrefix() + p.month + '/' + (p.source_key || p.id) + '/' + Date.now() + '-' + socSafe(file.name);
      await socPut(path, file, false);
      pos += 1;
      const { error } = await sb.from('social_post_media').insert({
        post_id: p.id, position: pos, kind: file.type.startsWith('video') ? 'video' : 'image',
        storage_path: path, file_name: file.name, bytes: file.size });
      if(error) throw error;
    }
    await socSyncFormat(p.id);
    await reloadSocial();
  }catch(err){ S.socErr = 'The upload did not go through: ' + (err.message || err); }
  S.socBusy = ''; S.socProg = ''; render();
}

async function socRemoveMedia(mediaId){
  const p = (S.social||[]).find(x => x.id === S.socOpenId);
  const media = socMedia(p);
  const m = media.find(x => x.id === mediaId);
  if(!p || !m || media.length < 2 || S.socBusy) return;
  S.socBusy = p.id; S.socErr = ''; render();
  try{
    const { error } = await sb.from('social_post_media').delete().eq('id', mediaId);
    if(error) throw error;
    try{ await sb.storage.from(SOC_BUCKET).remove([m.storage_path]); }catch(e){}
    await socSyncFormat(p.id);
    await reloadSocial();
  }catch(err){ S.socErr = err.message || String(err); }
  S.socBusy = ''; render();
}

async function socMoveMedia(mediaId, dir){
  const p = (S.social||[]).find(x => x.id === S.socOpenId);
  const media = socMedia(p);
  const i = media.findIndex(x => x.id === mediaId);
  const j = i + dir;
  if(!p || i < 0 || j < 0 || j >= media.length || S.socBusy) return;
  S.socBusy = p.id; S.socErr = ''; render();
  try{
    /* Renumber the whole strip rather than swapping two values, so a
       pair of rows that somehow share a position sorts itself out. */
    const order = media.slice();
    order.splice(j, 0, order.splice(i, 1)[0]);
    for(let k = 0; k < order.length; k++){
      if(order[k].position === k + 1) continue;
      const { error } = await sb.from('social_post_media').update({ position: k + 1 }).eq('id', order[k].id);
      if(error) throw error;
    }
    await reloadSocial();
  }catch(err){ S.socErr = err.message || String(err); }
  S.socBusy = ''; render();
}

async function requestSocialJob(kind){
  if(S.socBusy) return;
  S.socBusy = 'job'; S.socErr = ''; S.socNote = ''; render();
  try{

  S.socBusy = ''; render();
}

/* Reads plan.json from the picked folder, then for each post it does not
   already have: creates the row, uploads its files, records the media.
   A post that fails part way is removed again, so a second import picks
   it up cleanly instead of leaving half a carousel behind. */
async function importSocialFolder(fileList){
  const files = Array.from(fileList || []);
  if(!files.length || S.socBusy) return;
  const planFiles = files.filter(f => f.name === 'plan.json');
  if(!planFiles.length){ S.socErr = 'That folder has no plan.json. Pick the month folder itself, for example 2026-10.'; return render(); }
  S.socBusy = 'import'; S.socErr = ''; S.socNote = ''; S.socProg = 'Reading the plan'; render();
  let made = 0, skipped = 0, month = '';
  try{
    /* A month folder can hold extras folders, each with its own plan.json.
       Picking the month folder brings in all of them; picking one extras
       folder brings in just that batch. */
    let plan = [];
    for(const pf of planFiles){
      const part = JSON.parse(await pf.text());
      if(Array.isArray(part)) plan = plan.concat(part);
    }
    if(!plan.length) throw new Error('plan.json is empty.');
    const pMonth = p => p.extra ? String(p.month) : String(p.date).slice(0,7);
    const byRel = {};
    files.forEach(f => {
      const parts = String(f.webkitRelativePath || f.name).split('/');
      byRel[parts.slice(-2).join('/')] = f;
    });
    const months = Array.from(new Set(plan.map(pMonth)));
    if(months.some(m => !/^\d{4}-\d{2}$/.test(m))) throw new Error('A post in plan.json has no date or month.');
    month = months[0];
    const have = await sb.from('social_posts').select('month, source_key')
      .eq('brand', SOC_BRAND).in('month', months);
    if(have.error) throw have.error;
    const seen = new Set((have.data||[]).map(r => r.month + '|' + r.source_key));

    for(let i = 0; i < plan.length; i++){
      const p = plan[i];
      const m = pMonth(p);
      if(seen.has(m + '|' + p.folder)){ skipped++; continue; }
      const picks = (p.files || []).map(name => ({ name, file: byRel[p.folder + '/' + name] }));
      const missing = picks.find(x => !x.file);
      if(missing) throw new Error('Missing ' + p.folder + '/' + missing.name + ' in the folder.');
      const bad = picks.map(x => socCheckFile(x.file)).find(Boolean);
      if(bad) throw new Error(bad);

      const kinds = picks.map(x => ({ kind: x.file.type.startsWith('video') ? 'video' : 'image' }));
      const ins = await sb.from('social_posts').insert({
        brand: SOC_BRAND, month: m, post_date: p.extra ? m + '-01' : p.date, seq: Number(p.n) || i + 1,
        format: socFormat(kinds), topic: p.topic || null, caption: p.caption || '',
        focus: SOC_FOCUS[p.focus] ? p.focus : null,
        hashtags: p.tags_ig_fb || null, hashtags_li: p.tags_li || null,
        status: p.extra ? 'extra' : 'draft', source_key: p.folder }).select('id').single();
      if(ins.error) throw ins.error;
      const postId = ins.data.id;
      try{
        for(let k = 0; k < picks.length; k++){
          S.socProg = `Post ${i+1} of ${plan.length}: uploading ${picks[k].name}`; render();
          const path = socPrefix() + m + '/' + p.folder + '/' + picks[k].name;
          await socPut(path, picks[k].file, true);
          const r = await sb.from('social_post_media').insert({
            post_id: postId, position: k + 1, kind: kinds[k].kind, storage_path: path,
            file_name: picks[k].name, bytes: picks[k].file.size,
            source_path: p.folder + '/' + picks[k].name });
          if(r.error) throw r.error;
        }
      }catch(inner){
        await sb.from('social_posts').delete().eq('id', postId);
        throw inner;
      }
      made++;
    }
    const kindsIn = [];
    if(plan.some(p => !p.extra)) kindsIn.push('generate');
    if(plan.some(p => p.extra)) kindsIn.push('extras');
    await sb.from('social_jobs').update({ status:'done', finished_at: new Date().toISOString() })
      .eq('brand', SOC_BRAND).in('month', months).in('kind', kindsIn).eq('status', 'ready');
    if(plan.every(p => p.extra) && made) S.socFilter = 'extra';
    S.socNote = `Imported ${made} post${made===1?'':'s'}` + (skipped ? `, ${skipped} already here.` : '.');
  }catch(err){
    S.socErr = 'The import stopped: ' + (err.message || err) +
      (made ? ` ${made} post${made===1?'':'s'} came in before that. Import the same folder again to finish.` : '');
  }
  if(month) S.socMonth = month;
  try{ await reloadSocial(); }catch(e){}
  S.socBusy = ''; S.socProg = ''; render();
}

/* ================= budget ================= */
/* Liam and Pat only. The tables refuse anyone else too (sql/budget.sql),
   so hiding the tab is a convenience, not the lock.

   Approved items with a cost, and events marked going with an amount
   spent, are written into expenses by database triggers as committed.
   The amount follows the approval or event until the row is marked paid,
   and an approval sent back takes its committed row with it. */
const BUDGET_USERS = ['liam','pat'];
const BUD_SRC = { approval:'From approvals', event:'From events' };
const BUD_PAY = { card:'Company card', ach:'ACH', check:'Check', invoice:'Invoice',
                  reimb:'Reimbursement', other:'Other' };

S.bud = { year:new Date().getFullYear(), cats:[], lines:[], exps:[], urls:{},
          filter:'all', cat:'', edit:false, plan:{}, gl:{}, form:null, file:null,
          saving:false, busy:'', err:'', note:'', loadErr:'' };

function budBlankForm(over){
  return Object.assign({ id:null, source:'manual', spent_on:today(), vendor:'',
    description:'', category:'', amount:'', status:'paid', paid_on:today(),
    payment_method:'card', reference:'', notes:'', receipt_name:null }, over || {});
}

async function loadBudget(){
  const B = S.bud;
  const [c, l, e] = await Promise.all([
    sb.from('budget_categories').select('*').order('sort_order'),
    sb.from('budget_plan').select('*'),
    sb.from('expenses').select('*')
      .order('spent_on', { ascending:false }).order('created_at', { ascending:false })
  ]);
  const bad = [c, l, e].find(r => r.error);
  if(bad){
    const m = bad.error.message || String(bad.error);
    /* Before sql/budget.sql has been run the tables simply are not there.
       Say that, rather than a raw PostgREST message. */
    B.loadErr = /does not exist|schema cache|PGRST205|42P01/i.test(m + ' ' + (bad.error.code||''))
      ? 'The budget tables have not been created yet. Run sql/budget.sql in the Supabase SQL editor, then reload.'
      : 'Could not load the budget. ' + m;
    S.loaded.budget = true;
    return;
  }
  B.loadErr = '';
  /* Categories are keyed by id everywhere below, as strings, because
     that is what a <select> hands back. */
  B.cats = (c.data || []).map(r => Object.assign({}, r, { key:String(r.id), label:r.name }));
  B.lines = (l.data || []).map(r => ({ year:r.year, category:String(r.category_id), planned:r.amount }));
  B.exps = (e.data || []).map(r => Object.assign({}, r, {
    category:r.category_id == null ? null : String(r.category_id), reference:r.invoice_ref }));

  /* Receipts are signed as their rows are drawn (signedUrl). */
  S.loaded.budget = true;
}

const budYearOf = d => d ? Number(String(d).slice(0, 4)) : null;
const budCatLabel = k => { const c = S.bud.cats.find(c => c.key === k); return c ? c.label : (k || ''); };

/* Everything that counts against one year, newest first. */
function budItems(year){
  return S.bud.exps.filter(x => budYearOf(x.spent_on) === year)
    .map(x => Object.assign({}, x, { src:'exp', amount:Number(x.amount || 0) }))
    .sort((a, b) => String(b.spent_on).localeCompare(String(a.spent_on)));
}

function budSummary(year, items){
  const B = S.bud;
  const blank = (key, label) => ({ key, label, planned:0, paid:0, committed:0 });
  const rows = B.cats.filter(c => c.active !== false).map(c => blank(c.key, c.label));
  const by = new Map(rows.map(r => [r.key, r]));
  for(const l of B.lines){
    if(l.year === year && by.has(l.category)) by.get(l.category).planned = Number(l.planned || 0);
  }
  const none = blank('', 'Needs a category');
  for(const it of items){
    let r = it.category ? by.get(it.category) : none;
    if(!r){ r = blank(it.category, budCatLabel(it.category)); by.set(r.key, r); rows.push(r); }
    r[it.status === 'paid' ? 'paid' : 'committed'] += it.amount;
  }
  if(none.paid || none.committed) rows.push(none);
  const t = rows.reduce((s, r) => ({ planned:s.planned + r.planned, paid:s.paid + r.paid,
    committed:s.committed + r.committed }), { planned:0, paid:0, committed:0 });
  return { rows, t };
}

/* How far through the year we are. A past year is all gone, a future one
   has not started. */
function budPace(year){
  const now = new Date(), y = now.getFullYear();
  if(year < y) return 1;
  if(year > y) return 0;
  return (now - new Date(y, 0, 1)) / (new Date(y + 1, 0, 1) - new Date(y, 0, 1));
}

/* Solid is paid, pale is committed. Orange from 85% of the line, red
   once it is over. */
function budBar(r){
  const used = r.paid + r.committed;
  if(!r.planned) return used ? `<span class="hint err">No budget set</span>` : '';
  const p = used / r.planned;
  const cls = p > 1 ? 'over' : p >= .85 ? 'near' : '';
  const paidW = Math.min(100, r.paid / r.planned * 100);
  const comW = Math.min(100 - paidW, r.committed / r.planned * 100);
  return `<span class="bud-bar ${cls}" title="${Math.round(p * 100)}% used"><i style="width:${
    paidW.toFixed(1)}%"></i><u style="left:${paidW.toFixed(1)}%;width:${comW.toFixed(1)}%"></u></span>`;
}

function budCatOptions(sel, blankLabel){
  return `<option value="">${esc(blankLabel)}</option>` + S.bud.cats
    .filter(c => c.active !== false || c.key === sel)
    .map(c => `<option value="${esc(c.key)}" ${c.key === sel ? 'selected' : ''}>${esc(c.label)}</option>`).join('');
}

/* ================= email campaigns ================= */
/* Emails for Mailchimp, built here from blocks and pushed across as a
   draft. The dashboard keeps the campaign in email_campaigns
   (sql/email_builder.sql) and renders it to email HTML itself; the n8n
   workflow "Haggerty Mailchimp Push" creates or updates the Mailchimp draft
   from that row and can send a test to whoever clicked. Sending to the list
   still happens in Mailchimp, so nothing reaches 16,000 people from here. */

function ecState(){
  if(!S.ec) S.ec = { list:[], cur:null, busy:'', note:'', err:'', view: window.innerWidth < 760 ? 'phone' : 'desktop', tests:'', saved:null, dirty:false };
  return S.ec;
}

async function loadCampaigns(){
  const E = ecState();
  try{
    const [c] = await Promise.all([
      sb.from('email_campaigns').select('id,brand,title,subject,status,mc_web_id,pushed_at,updated_at,last_error,review_status,send_at,scheduled_for')
        .order('updated_at', { ascending:false }).limit(100),
      S.loaded.mc || ecIsRev() ? null : loadMailchimp(),
      sb.from('social_reviewers').select('email,name,brand').then(r => { E.reviewers = r.data || []; })
    ]);
    if(c.error) throw c.error;
    E.list = c.data || [];
    /* The database narrows a real reviewer to their brand's emails that
       were sent for review; Liam's account sees all, so narrow it here. */
    if(S.preview) E.list = E.list.filter(x => x.brand === SOC_BRAND && x.review_status != null);
    E.loadErr = '';
    // Pasted RHINO emails link the IICRC logo here, so make sure it is hosted.
    if(!ecIsRev()) ecBadgeUrl('rhino').catch(() => {});
  }catch(e){ E.loadErr = e.message || String(e); }
  S.loaded.ec = true;
}

/* ---------- blocks ---------- */
function ecBlock(type, brand){
  const b = EC_BRANDS[brand] || EC_BRANDS.haggerty;
  if(type === 'header')    return { type, logo:'', bg:'#1E1D1B' };
  if(type === 'heading')   return { type, text:'Your headline here', align:'left' };
  if(type === 'text')      return { type, text:'Hi *|FNAME|*,\n\nWrite the body of the email here. Use **bold** for emphasis and [link text](https://example.com) for a link.' };
  if(type === 'image')     return { type, src:'', alt:'', href:'', width:'full' };
  if(type === 'button')    return { type, label:'See the project', href:b.site, align:'left' };
  if(type === 'spotlight') return { type, src:'', title:'Project name', text:'A sentence or two about the job: what it was, where, and what made it hard.', href:b.site, link:'Read more' };
  if(type === 'divider')   return { type };
  if(type === 'spacer')    return { type, size:'24' };
  if(type === 'footer')    return { type, text:b.footer, badge:'' };
  if(type === 'html')      return { type, code:'' };
  const o = b.bold;
  if(type === 'callbar')   return { type, label:o.callLabel || 'Call us', phone:o.phone };
  if(type === 'hero')      return { type, src:'', alt:'', eyebrow:'News from ' + b.name, title:'Your headline here',
                                    text:'One line under the headline that says what this email is about.', label:o.phone ? 'Call ' + o.phone : 'See our work',
                                    href:o.phone ? 'tel:' + o.phone : b.site };
  if(type === 'card')      return { type, eyebrow:'Point 1', title:'A short, plain headline.',
                                    text:'Two or three sentences about the problem.\n\n**What we do:** How you handle it.' };
  if(type === 'pair')      return { type, src:'', label:'Before', src2:'', label2:'After', caption:'One line about the job.' };
  if(type === 'checklist') return { type, title:'Before the first big storm', items:'Save our contact card to your phone.\nShare our number with your on-site staff.\nAdd us to your vendor list.' };
  if(type === 'buttons')   return { type, label:o.phone ? 'Call ' + o.phone : 'Get in touch', href:o.phone ? 'tel:' + o.phone : b.site,
                                    label2:'See our work', href2:b.site };
  if(type === 'signoff')   return { type, closing:'Talk soon,', name:'Your name', role:'Your title, ' + b.name, phone:o.phone };
  if(type === 'brandfooter') return { type, badge:'', name1:o.name1, name2:o.name2, tagline:o.tagline, links:'', phone:o.phone, site:b.site, small:o.area };
  return { type };
}
function ecStarter(brand){
  return ['header','heading','text','button','footer'].map(t => ecBlock(t, brand));
}
/* The bold layout: the RHINO property manager emails' design (dark hero,
   callout boxes, before and after, dark footer), built from blocks so the
   words and photos are plain fields. */
function ecBoldStarter(brand){
  const o = (EC_BRANDS[brand] || EC_BRANDS.haggerty).bold;
  const head = ecBlock('header', brand);
  if(o.logo){ head.logo = o.logo; head.bg = '#FFFFFF'; }
  const cards = [1, 2, 3].map(n => Object.assign(ecBlock('card', brand), { eyebrow:'Point ' + n }));
  const intro = ecBlock('text', brand);
  intro.text = 'Hi *|FNAME|*,\n\nA short opening that sets up the three points below.';
  return [o.phone ? ecBlock('callbar', brand) : null, head, ecBlock('hero', brand), intro, ...cards,
    ecBlock('pair', brand), ecBlock('buttons', brand), ecBlock('signoff', brand), ecBlock('brandfooter', brand)].filter(Boolean);
}

/* ---------- email HTML ---------- */
/* Built the way email has to be: tables, inline styles, web-safe fonts,
   600px wide, with a media query that stacks the spotlight on phones.
   The preview swaps Mailchimp's merge tags for sample text; the pushed
   copy keeps them so Mailchimp fills them in per person. */
function ecUrl(u){
  u = String(u || '').trim();
  if(/^\*\|[A-Z_:]+\|\*$/.test(u)) return u;
  if(/^(https?:|mailto:|tel:)/i.test(u)) return u;
  if(/^[\w.-]+\.[a-z]{2,}(\/|$)/i.test(u)) return 'https://' + u;
  return '';
}
function ecInline(s, accent){
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, label, href) => {
      const u = ecUrl(href.replace(/&amp;/g, '&'));
      return u ? `<a href="${esc(u)}" style="color:${accent};text-decoration:underline">${label}</a>` : label;
    })
    .replace(/\n/g, '<br>');
}
function ecParas(s, accent, style){
  return String(s || '').split(/\n\s*\n/).filter(p => p.trim())
    .map(p => `<p style="${style}">${ecInline(p.trim(), accent)}</p>`).join('');
}
function ecColor(c, fallback){ return /^#[0-9a-f]{6}$/i.test(c || '') ? c : fallback; }

function ecRow(b, c, accent){
  const F = 'font-family:Arial,Helvetica,sans-serif;';
  const pad = (c.blocks || []).some(x => x.type === 'hero' || x.type === 'brandfooter') ? 'padding:0 40px;' : 'padding:0 32px;';
  const al = b.align === 'center' ? 'center' : 'left';
  const brand = EC_BRANDS[c.brand] || EC_BRANDS.haggerty;
  if(b.type === 'header'){
    const inner = b.logo
      ? `<img src="${esc(b.logo)}" width="180" alt="${esc(brand.name)}" style="display:block;margin:0 auto;width:180px;max-width:60%;height:auto;border:0">`
      : `<div style="${F}font-size:24px;font-weight:bold;letter-spacing:3px;color:#FFFFFF;text-align:center">${esc(brand.name)}</div>`;
    return `<tr><td style="background:${ecColor(b.bg, '#1E1D1B')};padding:26px 32px">${inner}</td></tr>`;
  }
  if(b.type === 'heading')
    return `<tr><td style="${pad}padding-top:30px;padding-bottom:6px"><h1 style="margin:0;${F}font-size:28px;line-height:1.2;font-weight:bold;color:#1E1D1B;text-align:${al}">${ecInline(b.text, accent)}</h1></td></tr>`;
  if(b.type === 'text')
    return `<tr><td class="ec-px" style="${pad}padding-top:14px">${ecParas(b.text, accent, `margin:0 0 14px;${F}font-size:16px;line-height:1.6;color:#3A3836`)}</td></tr>`;
  if(b.type === 'image'){
    if(!b.src) return '';
    const full = b.width !== 'inset';
    const w = full ? 600 : 536;
    let img = `<img src="${esc(b.src)}" width="${w}" alt="${esc(b.alt || '')}" style="display:block;width:100%;max-width:${w}px;height:auto;border:0">`;
    const u = ecUrl(b.href);
    if(u) img = `<a href="${esc(u)}">${img}</a>`;
    return `<tr><td style="${full ? 'padding:14px 0' : pad + 'padding-top:14px;padding-bottom:14px'}">${img}</td></tr>`;
  }
  if(b.type === 'button'){
    const u = ecUrl(b.href) || '#';
    return `<tr><td style="${pad}padding-top:12px;padding-bottom:18px" align="${al}">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="${al}"><tr>
        <td style="background:${accent};border-radius:3px"><a href="${esc(u)}" style="display:inline-block;padding:13px 26px;${F}font-size:15px;font-weight:bold;letter-spacing:1px;text-transform:uppercase;color:#FFFFFF;text-decoration:none">${esc(b.label || 'Learn more')}</a></td>
      </tr></table></td></tr>`;
  }
  if(b.type === 'spotlight'){
    const u = ecUrl(b.href);
    const img = b.src ? `<img src="${esc(b.src)}" width="250" alt="${esc(b.title || '')}" style="display:block;width:100%;max-width:250px;height:auto;border:0">` : '';
    return `<tr><td style="${pad}padding-top:16px;padding-bottom:16px">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
        ${img ? `<td class="ec-col" width="250" valign="top" style="width:250px;padding-right:20px">${u ? `<a href="${esc(u)}">${img}</a>` : img}</td>` : ''}
        <td class="ec-col" valign="top">
          <h2 style="margin:0 0 8px;${F}font-size:20px;line-height:1.25;font-weight:bold;color:#1E1D1B">${esc(b.title || '')}</h2>
          ${ecParas(b.text, accent, `margin:0 0 10px;${F}font-size:15px;line-height:1.55;color:#3A3836`)}
          ${u ? `<a href="${esc(u)}" style="${F}font-size:14px;font-weight:bold;color:${accent};text-decoration:none">${esc(b.link || 'Read more')} &rarr;</a>` : ''}

  if(b.type === 'divider')

  if(b.type === 'spacer'){

  if(b.type === 'html')
    return b.code && b.code.trim() ? `<tr><td>${b.code}</td></tr>` : '';
  const BP = 'padding-left:40px;padding-right:40px;';
  const tel = p => 'tel:+1' + String(p || '').replace(/\D/g, '').replace(/^1(?=\d{10}$)/, '');
  const btn = (label, href, solid) => {

  const badge = b.badge ? `<tr><td class="ec-px" align="center" style="padding:8px 40px 28px;background:#FFFFFF"><img src="${esc(b.badge)}" width="160" alt="${esc((brand.badge && brand.badge.alt) || 'Certification')}" style="display:block;margin:0 auto;width:160px;max-width:160px;height:auto;border:0"></td></tr>` : '';
  const eyebrow = (t, color, mb) => t ? `<p style="margin:0 0 ${mb || 6}px;${F}font-size:12px;letter-spacing:2px;text-transform:uppercase;color:${color};font-weight:bold">${esc(t)}</p>` : '';
  if(b.type === 'callbar'){

      ${b.label ? `<table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>${btn(b.label, b.href, true)}</tr></table>` : ''}</td></tr>
      ${strip}<tr><td style="height:28px;line-height:28px;font-size:0">&nbsp;</td></tr>`;
  }
  if(b.type === 'card')
    return `<tr><td class="ec-px" style="${BP}padding-bottom:16px"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F6F3EE"><tr>
      <td width="6" style="width:6px;background:${accent};font-size:0;line-height:0">&nbsp;</td>
      <td style="padding:18px 20px">${eyebrow(b.eyebrow, accent, 4)}
        ${b.title ? `<p style="margin:0 0 8px;${F}font-size:18px;line-height:1.3;color:#1A1A1A;font-weight:800">${esc(b.title)}</p>` : ''}
        ${ecParas(b.text, accent, `margin:0 0 10px;${F}font-size:15px;line-height:1.55;color:#2B2B2B`)}</td></tr></table></td></tr>`;
  if(b.type === 'pair'){
    const one = (src, label, color) => `<td class="ec-stack" width="50%" valign="top" style="padding:0 6px">${eyebrow(label, color)}${src ? `<img class="ec-ba" src="${esc(src)}" width="254" alt="${esc(label || '')}" style="display:block;width:100%;max-width:254px;height:auto;border:0;margin:0 0 12px">` : ''}</td>`;
    if(!b.src && !b.src2) return '';
    return `<tr><td class="ec-px" style="padding:0 34px 6px"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
      ${one(b.src, b.label, '#666666')}${one(b.src2, b.label2, accent)}</tr></table></td></tr>
      ${b.caption ? `<tr><td class="ec-px" style="${BP}"><p style="margin:0 0 22px;${F}font-size:13px;line-height:1.5;color:#666666">${ecInline(b.caption, accent)}</p></td></tr>` : ''}`;
  }
  if(b.type === 'checklist'){
    const items = String(b.items || '').split('\n').map(x => x.trim()).filter(Boolean);

      ${items.map((t, n) => `<p style="margin:0 0 8px;${F}font-size:15px;line-height:1.5;color:#FFFFFF"><strong style="color:${accent}">${n + 1}.</strong> ${ecInline(t, '#FFFFFF')}</p>`).join('')}
      </td></tr></table></td></tr>`;

  if(b.type === 'buttons'){

      ${b.closing ? `<p style="margin:0 0 2px;${F}font-size:16px;color:#2B2B2B">${esc(b.closing)}</p>` : ''}
      <p style="margin:0;${F}font-size:16px;font-weight:bold;color:#1A1A1A">${esc(b.name || '')}</p>
      ${b.role || b.phone ? `<p style="margin:0;${F}font-size:14px;color:#666666">${esc(b.role || '')}${b.role && b.phone ? ' &nbsp;|&nbsp; ' : ''}${b.phone ? `<a href="${tel(b.phone)}" style="color:#1A1A1A;font-weight:bold;text-decoration:none;white-space:nowrap">${esc(b.phone)}</a>` : ''}</p>` : ''}
      </td></tr></table></td></tr>`;
  if(b.type === 'brandfooter'){
    const links = String(b.links || '').split('\n').map(l => l.split('|')).filter(x => x[0] && x[0].trim() && ecUrl((x[1] || '').trim()))
      .map(([t, u]) => `<a href="${esc(ecUrl(u.trim()))}" style="color:#FFFFFF;text-decoration:none">${esc(t.trim())}</a>`).join(' &nbsp;&middot;&nbsp; ');
    const site = ecUrl(b.site);
    return `${badge}${strip}<tr><td class="ec-px" style="padding:30px 40px;background:#000000;text-align:center">
      <p style="margin:0 0 6px;${F}font-size:20px;font-weight:900;letter-spacing:1px;color:#FFFFFF">${esc(b.name1 || brand.name)}${b.name2 ? ` <span style="color:${accent}">${esc(b.name2)}</span>` : ''}</p>
      ${b.tagline ? `<p style="margin:0 0 16px;${F}font-size:13px;letter-spacing:2px;text-transform:uppercase;color:${accent};font-weight:bold">${esc(b.tagline)}</p>` : ''}
      ${links ? `<p style="margin:0 0 16px;${F}font-size:14px;color:#FFFFFF">${links}</p>` : ''}
      ${b.phone ? `<p style="margin:0 0 4px;${F}font-size:22px;font-weight:800"><a href="${tel(b.phone)}" style="color:#FFFFFF;text-decoration:none">${esc(b.phone)}</a></p>` : ''}
      ${site ? `<p style="margin:0 0 18px;${F}font-size:13px;color:#BBBBBB"><a href="${esc(site)}" style="color:#BBBBBB">${esc(site.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, ''))}</a></p>` : ''}
      ${b.small ? `<p style="margin:0 0 18px;${F}font-size:12px;line-height:1.6;color:#999999">${esc(b.small).replace(/\n/g, '<br>')}</p>` : ''}
      <div style="${F}font-size:11px;line-height:1.6;color:#999999"><p style="margin:0 0 8px">*|HTML:LIST_ADDRESS_HTML|*</p>
        <p style="margin:0"><a href="*|UPDATE_PROFILE|*" style="color:#999999">Update preferences</a> &nbsp;|&nbsp; <a href="*|UNSUB|*" style="color:#999999">Unsubscribe</a></p></div>
    </td></tr>`;
  }
  if(b.type === 'footer')
    return badge + `<tr><td style="background:#F4F2EE;padding:24px 32px;${F}font-size:12px;line-height:1.6;color:#6E7477;text-align:center">
      ${b.text ? `<div style="margin-bottom:8px">${ecInline(b.text, '#6E7477')}</div>` : ''}
      <div>*|HTML:LIST_ADDRESS_HTML|*</div>
      <div style="margin-top:8px"><a href="*|UPDATE_PROFILE|*" style="color:#6E7477">Update your preferences</a> &middot; <a href="*|UNSUB|*" style="color:#6E7477">Unsubscribe</a></div>
    </td></tr>`;
  return '';
}

/* An HTML block holding a whole email (one that has its own <html> or
   <body>, say from another builder) is used as the email as-is, since it
   cannot sit inside this layout. Everything else goes into the layout. */
function ecFullPaste(c){
  return (c.blocks || []).find(b => b.type === 'html' && /<(html|body)[\s>]/i.test(b.code || ''));
}
function ecHtml(c, preview){
  const brand = EC_BRANDS[c.brand] || EC_BRANDS.haggerty;
  const accent = ecColor(c.accent, brand.accent);
  const full = ecFullPaste(c);
  const rows = (c.blocks || []).map(b => ecRow(b, c, accent)).join('\n');
  let html = full ? full.code : `<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="x-apple-disable-message-reformatting"><title>${esc(c.subject || c.title || '')}</title>
<style>
  body{margin:0;padding:0;background:#F4F2EE}
  img{-ms-interpolation-mode:bicubic}
  @media only screen and (max-width:620px){
    .ec-wrap{width:100%!important}
    .ec-col{display:block!important;width:100%!important;padding-right:0!important;padding-bottom:12px}
    .ec-col img{max-width:100%!important}
    .ec-px{padding-left:20px!important;padding-right:20px!important}
    .ec-stack{display:block!important;width:100%!important;box-sizing:border-box;padding-left:0!important;padding-right:0!important}
    img.ec-ba{max-width:100%!important;width:100%!important}
    .ec-h1{font-size:26px!important}
    .ec-btn{display:block!important;width:100%!important;box-sizing:border-box}
    .ec-btn a{display:block!important}
    .ec-gap{display:block!important;width:100%!important;height:10px!important;line-height:10px!important}
  }
</style></head>
<body style="margin:0;padding:0;background:#F4F2EE">
<div style="display:none;max-height:0;overflow:hidden;opacity:0">${esc(c.preview_text || '')}&#8203;</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F4F2EE"><tr><td align="center" style="padding:24px 10px">
<table role="presentation" class="ec-wrap" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:600px;background:#FFFFFF">
${rows}
</table></td></tr></table></body></html>`;
  if(preview){
    html = html
      .replace(/\*\|FNAME\|\*/g, 'Sam').replace(/\*\|LNAME\|\*/g, 'Rivera')
      .replace(/\*\|HTML:LIST_ADDRESS_HTML\|\*/g, 'Your mailing address from Mailchimp goes here')
      .replace(/\*\|[A-Z_:]+\|\*/g, '#');
  }
  return html;
}

/* ---------- review (sql/email_review.sql) ----------
   A brand with a reviewer (Freddie for RHINO) gets their OK before an
   email goes out. Marketing sets the send date and sends it for review;
   the reviewer edits the words, then approves or asks for changes.
   Approving schedules it in Mailchimp for the send date. */
const ecIsRev = () => S.me === 'reviewer';
function ecReviewer(brand){ return (ecState().reviewers || []).find(r => r.brand === brand); }
function ecRevName(brand){
  const r = ecReviewer(brand);
  return r ? (r.name || r.email.split('@')[0]).split(' ')[0] : 'the reviewer';
}
function ecLocked(c){ return c.status === 'scheduled' || (ecIsRev() && c.review_status !== 'pending'); }
const ecWhen = iso => new Date(iso).toLocaleString('en-US', { weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
function ecLocalInput(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
}
function ecReviewChip(c){
  if(c.status === 'scheduled') return `<span class="chip good">Scheduled ${esc(c.scheduled_for ? ecWhen(c.scheduled_for) : '')}</span>`;
  if(c.review_status === 'pending') return `<span class="chip hot">${ecIsRev() ? 'Waiting on you' : 'With ' + esc(ecRevName(c.brand))}</span>`;
  if(c.review_status === 'changes') return `<span class="chip bad">Needs changes</span>`;
  if(c.review_status === 'ok') return `<span class="chip good">Approved</span>`;
  return '';
}
/* Checks before anything is handed to the reviewer, so an approval does
   not fail on something marketing could have fixed. */
function ecReadyProblem(c){
  const t = c.send_at ? new Date(c.send_at) : null;
  if(!t) return 'Set a send date first.';
  if(t.getTime() < Date.now() + 30 * 60000) return 'Pick a send date at least 30 minutes from now.';
  if(t.getMinutes() % 15) return 'Mailchimp schedules on the quarter hour. Pick a time ending in :00, :15, :30 or :45.';
  const missing = [];
  if(!c.list_id) missing.push('an audience');
  if(!c.subject) missing.push('a subject line');
  if(!c.from_name) missing.push('a from name');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c.reply_to || '')) missing.push('a reply-to address');
  return missing.length ? 'Add ' + missing.join(', ') + ' first.' : '';
}
async function ecSetReview(fields, note){
  const E = ecState();
  const c = E.cur;
  const { error } = await sb.from('email_campaigns').update(fields).eq('id', c.id);
  if(error){ E.err = 'Could not save: ' + error.message; render(); return false; }
  Object.assign(c, fields);
  const li = E.list.find(x => x.id === c.id);
  if(li) Object.assign(li, fields);
  E.err = ''; E.note = note || ''; render();
  return true;
}
async function ecSendReview(){
  const E = ecState();
  const c = E.cur;
  const problem = ecReadyProblem(c);
  if(problem){ E.err = problem; render(); return; }
  if(!(await ecSave(true))) return render();
  await ecSetReview({ review_status:'pending', review_note:null, review_requested_at:new Date().toISOString() },
    'Sent to ' + ecRevName(c.brand) + '. It is in the Email Campaigns tab when they sign in.');
}
async function ecVerdict(verdict){
  const E = ecState();
  const c = E.cur;
  if(E.busy) return;
  const note = (E.revNote || '').trim();
  if(verdict === 'changes' && !note){ E.err = 'Add a note saying what to change.'; render(); return; }
  if(E.dirty && !(await ecSave(true))) return render();
  if(!(await ecSetReview({ review_status:verdict, review_note:note || null },
    verdict === 'changes' ? 'Sent back with your note.' : ''))) return;
  E.revNote = '';
  if(verdict === 'ok') await ecPush('approve');
}

/* ---------- saving ---------- */
const EC_FIELDS = ['brand','title','subject','preview_text','from_name','reply_to','list_id','tag_id','tag_name','accent','blocks','send_at'];
const EC_REV_FIELDS = ['subject','preview_text','blocks'];
let ecTimer = null;
function ecTouch(){
  const E = ecState();
  if(E.cur && ecLocked(E.cur)) return;
  E.dirty = true; E.saved = null;
  clearTimeout(ecTimer);
  ecTimer = setTimeout(() => ecSave(true), 1500);
  ecStatusLine();
}
async function ecSave(quiet){
  const E = ecState();
  const c = E.cur;
  if(!c) return true;
  clearTimeout(ecTimer);
  if(ecLocked(c)){ E.dirty = false; return true; }
  const row = {};
  (ecIsRev() ? EC_REV_FIELDS : EC_FIELDS).forEach(k => { row[k] = c[k] === '' ? null : c[k]; });
  row.html = ecHtml(c, false);
  row.updated_at = new Date().toISOString();
  E.saving = true; ecStatusLine();
  const { error } = await sb.from('email_campaigns').update(row).eq('id', c.id);
  E.saving = false;
  if(error){ E.err = 'Could not save: ' + error.message; if(!quiet) render(); else ecStatusLine(); return false; }
  E.dirty = false; E.saved = new Date();
  const li = E.list.find(x => x.id === c.id);
  if(li) Object.assign(li, { title:c.title, subject:c.subject, updated_at:row.updated_at });
  ecStatusLine();
  return true;
}
function ecStatusLine(){
  const el = document.getElementById('ecSaved');
  if(!el) return;
  const E = ecState();
  el.textContent = E.saving ? 'Saving…' : E.dirty ? 'Unsaved changes' : E.saved ? 'Saved ' + fmtTime(E.saved.toISOString()) : '';
}

   public link, so the first campaign puts a copy in the email-images bucket
   and every later one reuses it. */
/* Brand images ship inside this page; email needs a public link, so the
   first use uploads them to the email-images bucket. */
function ecLogoUrl(){ return ecAssetUrl('brand/haggerty-logo-white.png', LOGO); }
function ecBadgeUrl(brand){
  const g = (EC_BRANDS[brand] || {}).badge;
  return g ? ecAssetUrl(g.path, g.data) : Promise.resolve('');
}
async function ecAssetUrl(path, data){
  const url = sb.storage.from(EC_BUCKET).getPublicUrl(path).data.publicUrl;
  const head = await fetch(url, { method:'HEAD' }).catch(() => null);
  if(head && head.ok) return url;
  const blob = await (await fetch(data)).blob();
  const { error } = await sb.storage.from(EC_BUCKET).upload(path, blob, { contentType:'image/png', upsert:false, cacheControl:'31536000' });
  if(error && !/exists|duplicate/i.test(error.message || '')) throw error;
  return url;
}
async function ecUpload(i, file, key){
  const E = ecState();
  const c = E.cur;
  if(!file) return;
  if(!/^image\/(jpeg|png|gif|webp)$/.test(file.type)){ E.err = file.name + ' is not a JPG, PNG, GIF or WebP.'; render(); return; }
  if(file.size > 5 * 1024 * 1024){ E.err = file.name + ' is over 5 MB. Email images should be well under 1 MB.'; render(); return; }
  const safe = file.name.toLowerCase().replace(/[^a-z0-9.]+/g, '-').slice(-60);
  const path = `${c.brand}/${c.id}/${Date.now()}-${safe}`;
  E.busy = 'up' + i + (key || ''); E.err = ''; render();
  const { error } = await sb.storage.from(EC_BUCKET).upload(path, file, { contentType:file.type, upsert:false, cacheControl:'31536000' });
  E.busy = '';
  if(error){ E.err = 'Upload failed: ' + error.message; render(); return; }
  const b = c.blocks[i];
  const url = sb.storage.from(EC_BUCKET).getPublicUrl(path).data.publicUrl;
  b[key || (b.type === 'header' ? 'logo' : 'src')] = url;
  ecTouch(); render();
}

/* ---------- push ---------- */
async function ecPush(action){
  const E = ecState();
  const c = E.cur;
  if(E.busy) return;
  E.busy = action; E.err = ''; E.note = ''; render();
  try{
    // A reviewer's words were saved with the verdict; once approved they
    // can no longer write, and an unschedule changes nothing on the page.
    if(!ecIsRev() && action !== 'unschedule' && !(await ecSave(true))) throw new Error(E.err.replace(/^Could not save: /, ''));
    const res = await fetch(MCPUSH_URL, { method:'POST', headers: await authHeaders(),
      body: JSON.stringify({ id:c.id, action, test_emails: action === 'test' ? E.tests : '' }) });
    const out = await res.json().catch(() => ({}));
    if(!out.ok) throw new Error(out.error || 'The push did not go through.');
    c.mc_campaign_id = out.mc_campaign_id; c.mc_web_id = out.mc_web_id;
    c.status = out.status || (c.status === 'sent' ? 'sent' : 'pushed');
    c.scheduled_for = action === 'unschedule' ? null : (out.scheduled_for || c.scheduled_for);
    if(action === 'unschedule') c.review_status = null;
    c.pushed_at = new Date().toISOString(); c.last_error = null;
    const li = E.list.find(x => x.id === c.id);
    if(li) Object.assign(li, { status:c.status, mc_web_id:c.mc_web_id, pushed_at:c.pushed_at, last_error:null,
      scheduled_for:c.scheduled_for, review_status:c.review_status });
    E.note = action === 'test' ? 'Draft updated in Mailchimp and a test sent to ' + (out.tested || []).join(', ') + '.'
      : action === 'approve' ? 'Approved and scheduled in Mailchimp for ' + ecWhen(c.scheduled_for || c.send_at) + '.'
      : action === 'unschedule' ? 'Unscheduled. You can edit it again.' + (ecReviewer(c.brand) ? ' It needs ' + ecRevName(c.brand) + '\'s OK again before it goes out.' : '')
      : 'Draft is in Mailchimp. Check it there, then send or schedule it from Mailchimp.';
  }catch(e){
    E.err = e.message || String(e);
    // A draft can exist even when a later step (say the test) failed.
    const r = await sb.from('email_campaigns').select('mc_campaign_id,mc_web_id,status,review_status,scheduled_for').eq('id', c.id).maybeSingle();
    if(r.data) Object.assign(c, r.data);
  }
  E.busy = ''; render();
}

              <div class="hint" style="margin-top:3px">${ecReviewer(c.brand) ? esc(rvName) + '\'s approval schedules it for this time.' : 'Schedule in Mailchimp uses this time.'}</div></div>

        <div class="hint"><span class="chip ${st[1]}">${st[0]}</span> <span id="ecSaved"></span>

      ${rev ? '' : `<div class="actions" style="margin:0">
        ${locked ? '' : `<button class="btn small accent" data-ec-push ${busy ? 'disabled' : ''}>${E.busy === 'push' ? 'Pushing&hellip;' : c.mc_campaign_id ? 'Update Mailchimp draft' : 'Push to Mailchimp'}</button>`}
        <button class="btn small ghost" data-ec-copy ${busy ? 'disabled' : ''}>Copy</button>
        ${locked ? '' : `<button class="linkbtn" data-ec-remove ${busy ? 'disabled' : ''}>Delete</button>`}
      </div>`}
    </div>
    ${E.note ? `<div class="done-banner" style="margin:12px 0"><p style="margin:0">${esc(E.note)}${c.mc_web_id ? ` <a href="${esc(mcEditUrl(c.mc_web_id))}" target="_blank" rel="noopener">Open in Mailchimp</a>` : ''}</p></div>` : ''}
    ${E.err ? `<p class="hint err">${esc(E.err)}</p>` : ''}
    <div class="ec-grid">
      <fieldset class="ec-edit" ${locked ? 'disabled' : ''}>
        <div class="panelbox" style="margin-top:0">
          <h3 class="ec-h3">${rev ? 'Subject' : 'Settings'}</h3>
          ${settings}
        </div>
        <h3 class="ec-h3">Content</h3>
        ${blocks}
        ${rev ? '<div style="height:30px"></div>' : `<div class="ec-add"><span class="hint">Add</span>${EC_ADD.map(t =>
          `<button class="fchip" data-ec-add="${t}">${esc(EC_TYPES[t])}</button>`).join('')}</div>`}
      </fieldset>
      <div class="ec-side">
        <div class="ec-sticky">
          <div class="ec-viewbar">
            <button class="fchip ${E.view === 'desktop' ? 'on' : ''}" data-ec-view="desktop">Desktop</button>
            <button class="fchip ${E.view === 'phone' ? 'on' : ''}" data-ec-view="phone">Phone</button>

          </div>

            <h3 class="ec-h3">Send a test</h3>
            <p class="hint" style="margin:0 0 6px">Updates the Mailchimp draft and sends a test to you. Add up to four more addresses if you like.</p>
            <input type="text" id="ecTests" value="${esc(E.tests)}" placeholder="pat@haggertybuilds.com, …" autocomplete="off" />
            <div class="actions"><button class="btn small" data-ec-test ${busy ? 'disabled' : ''}>${E.busy === 'test' ? 'Sending&hellip;' : 'Send test'}</button></div>
          </div>`}
        </div>
      </div>
    </div>
  </main>`;
}

function ecReviewPanel(c){
  const E = ecState();
  const busy = !!E.busy;
  const rv = ecReviewer(c.brand);
  const name = esc(ecRevName(c.brand));
  const when = c.send_at ? esc(ecWhen(c.send_at)) : '';
  const box = (title, body) => `<div class="panelbox ec-review"><h3 class="ec-h3">${title}</h3>${body}</div>`;
  const note = c.review_note ? `<p class="ec-note"><b>${esc(ecRevName(c.brand))}:</b> ${esc(c.review_note)}</p>` : '';
  if(c.status === 'scheduled'){
    const at = esc(ecWhen(c.scheduled_for || c.send_at));
    return box('Scheduled', ecIsRev()
      ? `<p class="hint" style="margin:0">Approved. It goes out ${at}.</p>`
      : `<p class="hint" style="margin:0 0 6px">Scheduled in Mailchimp for ${at}${c.reviewed_by ? ', approved by ' + name : ''}. To change it, unschedule it first${rv ? '; it then needs ' + name + '\'s OK again' : ''}.</p>
         <div class="actions"><button class="btn small ghost" data-ec-act="unschedule" ${busy ? 'disabled' : ''}>${E.busy === 'unschedule' ? 'Unscheduling&hellip;' : 'Unschedule'}</button></div>`);
  }
  if(ecIsRev()){
    if(c.review_status === 'pending') return box('Your review', `
      <p class="hint" style="margin:0 0 6px">Fix any wording on the left; it saves as you type. Approving schedules it for ${when || 'its send date'}.</p>
      <textarea id="ecRevNote" rows="3" placeholder="Note for marketing (needed if you send it back)" style="min-height:0">${esc(E.revNote || '')}</textarea>
      <div class="actions">
        <button class="btn small accent" data-ec-verdict="ok" ${busy ? 'disabled' : ''}>${E.busy === 'approve' ? 'Scheduling&hellip;' : 'Approve and schedule'}</button>
        <button class="btn small ghost" data-ec-verdict="changes" ${busy ? 'disabled' : ''}>Needs changes</button>
      </div>`);
    if(c.review_status === 'changes') return box('Your review', `<p class="hint" style="margin:0">You sent it back. It returns here once marketing has made the changes.</p>${note}`);
    if(c.review_status === 'ok') return box('Your review', `<p class="hint" style="margin:0">You approved it, but scheduling did not go through. Marketing can see the reason and will fix it.</p>`);
    return '';
  }
  if(!rv) return box('Schedule', `<p class="hint" style="margin:0 0 6px">${when ? 'Push the latest version to Mailchimp and schedule it for ' + when + '.' : 'Set a send date in Settings to schedule it.'}</p>
      <div class="actions"><button class="btn small" data-ec-act="approve" ${busy || !when ? 'disabled' : ''}>${E.busy === 'approve' ? 'Scheduling&hellip;' : 'Schedule in Mailchimp'}</button></div>`);
  const since = c.review_requested_at ? ' since ' + esc(ecWhen(c.review_requested_at)) : '';
  if(c.review_status === 'pending') return box('Review', `<p class="hint" style="margin:0 0 6px">Waiting on ${name}${since}. Once they approve it, it is scheduled for ${when || 'the send date'}.</p>
      <div class="actions"><button class="linkbtn" data-ec-takeback ${busy ? 'disabled' : ''}>Take it back</button></div>`);
  if(c.review_status === 'changes') return box('Review', `<p class="hint" style="margin:0 0 6px">${name} asked for changes.</p>${note}
      <div class="actions"><button class="btn small accent" data-ec-sendreview ${busy ? 'disabled' : ''}>Send to ${name} again</button></div>`);
  if(c.review_status === 'ok') return box('Review', `<p class="hint" style="margin:0 0 6px">${name} approved it, but scheduling did not go through.</p>
      <div class="actions"><button class="btn small accent" data-ec-act="approve" ${busy ? 'disabled' : ''}>${E.busy === 'approve' ? 'Scheduling&hellip;' : 'Try scheduling again'}</button></div>`);
  return box('Review', `<p class="hint" style="margin:0 0 6px">${name} reviews ${esc((EC_BRANDS[c.brand] || {}).name || '')} emails before they go out. Set the send date, then send it over. Their approval schedules it in Mailchimp.</p>
      <div class="actions"><button class="btn small accent" data-ec-sendreview ${busy ? 'disabled' : ''}>Send to ${name} for review</button></div>`);
}
