<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<meta name="referrer" content="no-referrer" />
<title>Unsubscribe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C1B1A; --paper:#FAF9F7; --card:#FFFFFF;
    --rule:#DFDBD4; --wash:#F6F4F1;
    --grey:#4D4D4D; --slate:#6E7477;
    --orange:#F68922; --green:#3F7D5C; --red:#A6402C;
    --display:"Barlow Condensed",system-ui,sans-serif;
    --body:"IBM Plex Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--body);
       font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
       padding-bottom:env(safe-area-inset-bottom)}
  .top{background:var(--card);border-bottom:1px solid var(--rule);padding:16px 20px}
  .wordmark{font-family:var(--display);font-weight:700;font-size:21px;
            letter-spacing:.14em;text-transform:uppercase}
  .wordmark span{color:var(--orange)}
  .sub{font-family:var(--display);text-transform:uppercase;letter-spacing:.09em;
       font-weight:600;font-size:13px;color:var(--slate);display:block;margin-top:2px}
  .wrap{max-width:560px;margin:0 auto;padding:28px 18px 60px}
  h1{font-family:var(--display);font-size:30px;line-height:1.1;margin:0 0 10px;font-weight:700}
  .lead{color:var(--grey);font-size:15.5px;margin:0 0 6px}
  .addr{font-weight:600;color:var(--ink)}
  .hint{font-size:13.5px;color:var(--slate);margin:12px 0 0}
  .hint.err{color:var(--red)}
  .btn{font-family:var(--display);text-transform:uppercase;letter-spacing:.09em;
       font-weight:600;font-size:17px;background:var(--ink);color:#fff;border:0;
       padding:16px 20px;cursor:pointer;width:100%;margin-top:18px}
  .btn:active{background:#000}
  .btn[disabled]{opacity:.45}
  .done{background:var(--card);border:1px solid var(--rule);
        border-left:3px solid var(--green);padding:20px 18px}
  .done h2{font-family:var(--display);font-size:26px;margin:0 0 6px;font-weight:700}
  .done p{margin:0;color:var(--grey);font-size:15px}
  .empty{padding:20px 0}
  .empty h2{font-family:var(--display);font-size:26px;margin:0 0 8px}
  .empty p{color:var(--grey)}
</style>
</head>
<body>
<header class="top">
  <span class="wordmark">HAGGERT<span>Y</span></span>
  <span class="sub">Email preferences</span>
</header>
<div class="wrap" id="app"><div class="empty"><h2>One moment</h2></div></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';

/* The unsubscribe link at the bottom of every Mr. Workflow email lands
   here with ?t=<that person's token>. Nobody signs in: the token is the
   only key, and the two database functions it calls
   (sql/mr_workflow.sql, bulk_unsubscribe_get and bulk_unsubscribe) see
   only that one person.

   One button rather than unsubscribing as the page opens: mail scanners
   (Outlook Safe Links, Mimecast) open every link in an email before the
   person does, and would otherwise unsubscribe people who never asked. */
const SUPABASE_URL = 'https://ekatzukprjpisdiwubjq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_bdyRB7Mx0BKzNj1EcYlRCg_8JLDXEIL';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY, { auth:{ persistSession:false } });
const app = document.getElementById('app');
const TOKEN = new URLSearchParams(location.search).get('t') || '';

const U = { data:null, busy:false, err:'', done:false };
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function render(){
  const d = U.data;
  if(!d){
    app.innerHTML = `<div class="empty"><h2>This link does not work</h2>
      <p>It may have been copied only partly. Reply to the email with "unsubscribe" and you will be taken off the list by hand.</p></div>`;
    return;
  }
  if(U.done || d.done){
    app.innerHTML = `<div class="done"><h2>You are unsubscribed</h2>
      <p><span class="addr">${esc(d.email)}</span> will not get these emails from HAGGERTY again.</p></div>
      <p class="hint">Changed your mind, or wanted someone else off the list instead? Reply to the email and ${esc(d.sender)} will sort it out.</p>`;
    return;
  }
  app.innerHTML = `
    <h1>Unsubscribe</h1>
    <p class="lead">Stop emails from ${esc(d.sender)} at HAGGERTY to <span class="addr">${esc(d.email)}</span>.</p>
    <button class="btn" id="go" ${U.busy ? 'disabled' : ''}>${U.busy ? 'One moment&hellip;' : 'Unsubscribe me'}</button>
    ${U.err ? `<p class="hint err">${esc(U.err)}</p>` : ''}`;
  document.getElementById('go').addEventListener('click', go);
}

async function go(){
  if(U.busy) return;
  U.busy = true; U.err = ''; render();
  const { error } = await sb.rpc('bulk_unsubscribe', { p_token:TOKEN });
  U.busy = false;
  if(error){ U.err = 'That did not go through: ' + (error.message || error) + ' Try again, or reply to the email with "unsubscribe".'; return render(); }
  U.done = true; render();
}

async function boot(){
  if(TOKEN){
    const { data, error } = await sb.rpc('bulk_unsubscribe_get', { p_token:TOKEN });
    if(error){
      app.innerHTML = `<div class="empty"><h2>Could not load this page</h2>
        <p>${esc(error.message || error)}</p><p>Check the connection and reload, or reply to the email with "unsubscribe".</p></div>`;
      return;
    }
    U.data = data;
  }
  render();
}
boot();
</script>
</body>
</html>
